<section class="view" id="view-mines" hidden>
  <div class="mines-layout">
    <section class="mines-settings" aria-label="{{t:mines.view.19}}">
      <div class="field">
        <label for="mines-difficulty">{{t:mines.view.01}}</label>
        <select id="mines-difficulty">
          <option value="low">{{t:mines.view.02}}</option>
          <option value="medium">{{t:mines.view.03}}</option>
          <option value="high">{{t:mines.view.04}}</option>
          <option value="custom">{{t:mines.view.05}}</option>
        </select>
      </div>
      <div id="mines-custom" hidden>
        <div class="field"><label for="mines-size">{{t:mines.view.06}}</label><input id="mines-size" type="number" min="2" max="10" step="1" value="5" inputmode="numeric"></div>
        <div class="field"><label for="mines-bombs" id="mines-bomb-limit">{{t:mines.view.07}}</label><input id="mines-bombs" type="number" min="1" max="24" step="1" value="3" inputmode="numeric"></div>
      </div>
    </section>
    <div class="mines-actions" role="group" aria-label="{{t:mines.view.20}}">
      <dl class="mines-stats">
        <div><dt>{{t:mines.view.08}}</dt><dd id="mines-left">22</dd></div>
        <div><dt>{{t:mines.view.09}}</dt><dd id="mines-flags">0 / 3</dd></div>
      </dl>
      <button id="mines-mode" type="button" aria-pressed="false">{{t:mines.view.10}}</button>
      <button class="go" id="mines-go" type="button" data-mode="start">{{t:mines.view.11}}</button>
    </div>
    <div class="mines-stage">
      <div class="board-wrap"><div class="board" id="board" role="group" aria-label="{{t:mines.view.21}}"></div></div>
    </div>
    <div class="mines-feedback">
      <p class="msg" id="mines-msg" aria-live="polite"></p>
      <p id="mines-rank-status" role="status" hidden></p>
      <button type="button" id="mines-rank-retry" hidden>{{t:mines.view.12}}</button>
    </div>
  </div>
  <details class="rules"><summary>{{t:mines.view.13}}</summary><p>{{t:mines.view.14}}</p><p>{{t:mines.view.15}}</p><p>{{t:mines.view.16}}</p><p>{{t:mines.view.17}}</p><p>{{t:mines.view.18}}</p></details>
</section>
