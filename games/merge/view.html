  <section class="view" id="view-merge" hidden>
    <div class="console">
      <div class="board-wrap">
        <div class="mg idle" id="mg" role="group" aria-label="4 乘 4 養珠盤"></div>
      </div>
      <div class="side">
        <section class="panel" aria-label="養珠">
          <dl class="stats">
            <div><dt>分數</dt><dd id="mg-score">0</dd></div>
            <div><dt>最大珍珠</dt><dd id="mg-max">—</dd></div>
            <div><dt>最佳分數</dt><dd id="mg-best">0</dd></div>
          </dl>
          <div class="field">
            <label id="mg-dir-label">滑動方向</label>
            <div class="input-row dpad" role="group" aria-labelledby="mg-dir-label">
              <button class="chip" type="button" data-dir="left" aria-label="向左滑">←</button>
              <button class="chip" type="button" data-dir="up" aria-label="向上滑">↑</button>
              <button class="chip" type="button" data-dir="down" aria-label="向下滑">↓</button>
              <button class="chip" type="button" data-dir="right" aria-label="向右滑">→</button>
            </div>
          </div>
          <button class="go" id="mg-go" type="button" data-mode="bet">開始一局</button>
          <p class="msg" id="mg-msg" aria-live="polite">每玩一局扣 10 點。把相同數字的珍珠滑在一起，合併成更大的珍珠。</p>
          <p class="hint">可以用 <kbd>方向鍵</kbd>、<kbd>WASD</kbd>，或在盤面上滑動。</p>
        </section>
      </div>
    </div>
    <details class="rules">
      <summary>玩法</summary>
      <p>按「開始一局」會從餘額扣 10 點。每次滑動，盤上所有珍珠都往同一個方向靠攏，兩顆相同數字的珍珠相撞就合併成兩倍大，並把合併後的數字加進分數。每滑一步會多長出一顆 2（九成）或 4（一成）。</p>
      <p>盤面塞滿、而且沒有任何相鄰的相同珍珠時，這一局就結束。這個遊戲只扣入場點數，不會退點；中途放棄重開會再扣一次。</p>
      <p>最佳分數只存在你的瀏覽器裡。</p>
    </details>
  </section>
