/* Granular spheres with a height axis, viewed from above. Fixed 120 Hz, spatial hashing, contact friction,
   finite glue sites; grains only bind after surface contact and residence.
   No region fill, color blending, timed deletion, or automatic loose-sand clearing. */
(function(root){
'use strict';
const W=360,H=400,R=1.08,CELL=R*2.5,MAX=14000;
const paths=[
 ['background','M 20 20 H 340 V 380 H 20 Z'],
 ['tail','M 242 263 C 312 224 336 288 298 318 C 277 335 239 324 235 305 C 244 298 253 307 273 303 C 295 297 288 276 267 282 Z'],
 ['body','M 132 227 C 105 243 99 300 114 330 Q 170 360 239 331 C 255 300 248 250 226 228 Z'],
 ['bib','M 151 242 Q 177 230 208 243 L 219 312 Q 181 335 141 311 Z'],
 ['head','M 104 158 L 100 87 Q 103 76 115 84 L 153 109 Q 180 101 207 109 L 245 83 Q 257 77 258 91 L 254 162 C 268 213 232 253 180 254 C 124 254 89 219 104 158 Z'],
 ['earLeft','M 112 100 L 118 144 L 145 120 Z'],
 ['earRight','M 246 100 L 239 145 L 215 120 Z'],
 ['muzzle','M 143 209 C 143 191 163 189 180 200 C 197 188 217 193 217 209 C 216 235 144 236 143 209 Z'],
 ['pawLeft','M 119 310 Q 146 298 160 316 L 162 338 Q 136 347 113 333 Z'],
 ['pawRight','M 205 316 Q 226 298 244 314 L 247 334 Q 226 346 201 337 Z'],
 ['star','M 70 251 L 77 267 L 94 270 L 81 282 L 83 299 L 68 290 L 53 299 L 56 281 L 43 270 L 61 267 Z'],
 ['moon','M 286 134 C 314 156 304 195 277 197 C 293 184 296 158 286 134 Z']
];
// Region IDs are geometry, never antialiased RGB values: edge blending can
// otherwise invent the ID of an unrelated peeled region (ghost glue lines).
function rasterizeRegions(ctx,shapes,width,height){
 const ids=new Int8Array(width*height);ids.fill(-1);
 for(let y=0;y<height;y++)for(let x=0;x<width;x++)for(let i=shapes.length-1;i>=0;i--){
  if(ctx.isPointInPath(shapes[i],x+.5,y+.5)){ids[y*width+x]=i;break}
 }
 return ids;
}
class SandWorld{
 constructor(regionAt,random=Math.random){this.regionAt=regionAt;this.random=random;this.reset()}
 reset(){this.grains=[];this.peeled=new Set();this.sites=new Map();this.gx=0;this.gy=0;this.emitted=0;this.exited=0;this.full=false;this.time=0;this.head=new Int32Array(192*224);this.next=new Int32Array(MAX)}
 peel(id){if(id>=0&&id<paths.length){const changed=!this.peeled.has(id);this.peeled.add(id);return changed}return false}
 emit(x,y,color,count=1,spread=9){let made=0;for(let i=0;i<count;i++){if(this.grains.length>=MAX){this.full=true;break}const a=this.random()*Math.PI*2,d=Math.sqrt(this.random())*spread;const px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;if(px<20||px>340||py<20||py>380)continue;this.grains.push({x:px,y:py,vx:(this.random()-.5)*18,vy:(this.random()-.5)*18,z:10+this.random()*8,vz:0,color,bound:false,contact:0,shade:this.random(),r:R*(.82+this.random()*.32)});made++;this.emitted++}return made}

 shake(strength=90){for(let pi=0;pi<this.grains.length;pi++){const p=this.grains[pi];if(!p.bound){p.vx+=(this.random()-.5)*strength;p.vy+=(this.random()-.5)*strength;p.vz+=15+this.random()*strength*.2;p.contact*=.3}}}
 tap(){for(const p of this.grains){if(!p.bound){const n=Math.hypot(this.gx,this.gy),x=n>.1?this.gx/n:0,y=n>.1?this.gy/n:1;p.vx+=x*(35+this.random()*25)+(this.random()-.5)*12;p.vz+=20+this.random()*12;p.vy+=y*(35+this.random()*25)}}}
 step(dt){this.time+=dt;const bins=this.head,next=this.next;bins.fill(-1);const key=(x,y)=>(Math.floor(x/CELL)+32)+(Math.floor(y/CELL)+32)*192;
 for(let pi=0;pi<this.grains.length;pi++){const p=this.grains[pi];if(!p.bound){p.vx+=this.gx*210*dt;p.vy+=this.gy*210*dt;const speed=Math.hypot(p.vx,p.vy);p.vz-=300*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;p.vz=0}const friction= Math.max(0,1-(p.z<.35?(8+speed*2.8):speed*.35)*dt/(speed||1));p.vx*=friction;p.vy*=friction;const limit=230/Math.max(230,Math.hypot(p.vx,p.vy));p.vx*=limit;p.vy*=limit;p.x+=p.vx*dt;p.y+=p.vy*dt}const k=key(p.x,p.y);next[pi]=bins[k];bins[k]=pi}
 // Sequential contact solver lets neighboring disks heap and transfer momentum.
 for(let pass=0;pass<2;pass++)for(const p of this.grains){if(p.bound)continue;const bx=Math.floor(p.x/CELL),by=Math.floor(p.y/CELL);for(let iy=-1;iy<=1;iy++)for(let ix=-1;ix<=1;ix++){let qi=bins[(bx+ix+32)+(by+iy+32)*192];for(;qi>=0;qi=next[qi]){const q=this.grains[qi];if(q===p)continue;let dx=p.x-q.x,dy=p.y-q.y,dz=p.z-q.z;// Fixed grains form an interlocking adhesive monolayer, with a smaller
// exclusion footprint than free spherical grains; this lets new sand reach gaps.
const min=(p.r+q.r)*(q.bound?.65:.94),d2=dx*dx+dy*dy+dz*dz;if(d2>=min*min)continue;let d=Math.sqrt(d2);if(d<.001){dx=.01;dy=0;d=.01}const nx=dx/d,ny=dy/d,nz=dz/d,share=q.bound?1:.5,overlap=Math.min(min-d,.8)*share;p.x+=nx*overlap;p.y+=ny*overlap;p.z=Math.max(0,p.z+nz*overlap);if(!q.bound){q.x-=nx*overlap;q.y-=ny*overlap;q.z=Math.max(0,q.z-nz*overlap)}const rel=(p.vx-q.vx)*nx+(p.vy-q.vy)*ny+(p.vz-q.vz)*nz;if(rel<0){const j=-rel*.64;p.vx+=nx*j;p.vy+=ny*j;p.vz+=nz*j;if(!q.bound){q.vx-=nx*j;q.vy-=ny*j;q.vz-=nz*j}const tx=-ny,ty=nx,t=((p.vx-q.vx)*tx+(p.vy-q.vy)*ty)*.08;p.vx-=tx*t;p.vy-=ty*t;if(!q.bound){q.vx+=tx*t;q.vy+=ty*t}}}}}
 for(let i=this.grains.length-1;i>=0;i--){const p=this.grains[i];if(p.bound)continue;
 // A grain remains visible on the catch apron until it crosses the outer view.
 if(p.x < -28||p.x>W+28||p.y < -28||p.y>H+28){this.grains.splice(i,1);this.exited++;continue}
 const id=this.regionAt(p.x,p.y);const s=Math.floor(p.x/.7)+Math.floor(p.y/.7)*1024;const occupied=this.sites.get(s)||0;
 const edge=p.r*.75;const glue=this.peeled.has(id)&&this.peeled.has(this.regionAt(p.x+edge,p.y))&&this.peeled.has(this.regionAt(p.x-edge,p.y))&&this.peeled.has(this.regionAt(p.x,p.y+edge))&&this.peeled.has(this.regionAt(p.x,p.y-edge));
 if(p.z<.35&&glue&&occupied<1&&Math.hypot(p.vx,p.vy)<105){p.contact+=dt;if(p.contact>.07&&this.random()<1-Math.exp(-9*dt)){p.bound=true;p.vx=0;p.vy=0;p.z=0;p.vz=0;this.sites.set(s,occupied+1)}}else p.contact=0;
 }
 this.full=this.grains.length>=MAX;
 }
 stats(){let bound=0;const boundByRegion={};for(const p of this.grains)if(p.bound){bound++;const id=this.regionAt(p.x,p.y);boundByRegion[id]=(boundByRegion[id]||0)+1}return {loose:this.grains.length-bound,bound,boundByRegion,emitted:this.emitted,exited:this.exited,regions:this.peeled.size,full:this.full}}
}
root.SandEngine={SandWorld,paths,W,H,MAX,rasterizeRegions};
})(typeof window==='undefined'?globalThis:window);
</script>
