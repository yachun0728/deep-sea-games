  for (let i = 0; i < 4; i++) {
    const pts = drizzle((i - 1.5) * 0.32, 0.9, 0.075, rand() * TAU, ang + (rand() - 0.5) * 0.12);
    line(pts, sw * 1.2, 'rgba(50,10,0,0.45)', 0.01, 0.035);
    line(pts, sw * 1.12, '#5c1208');
    line(pts, sw, '#a8220f');
    line(pts, sw * 0.55, '#c93a1e', -0.004, -0.01);
    // 斷斷續續的亮光
    for (let s = 0; s < pts.length - 4; s += 6 + (rand() * 6 | 0)) line(pts.slice(s, s + 4), sw * 0.18, 'rgba(255,170,140,0.9)', -0.008, -0.02);
  }
  const mw = lw(0.075);
  for (let i = 0; i < 4; i++) {
    const pts = drizzle((i - 1.5) * 0.32 + 0.16, 0.93, 0.065, rand() * TAU, ang + 0.05 + (rand() - 0.5) * 0.12);
    const ends = [pts[0], pts[pts.length - 1]];
    const bulbs = (col, k, du = 0, dv = 0) => ends.forEach(e => dot(e[0] + du, e[1] + dv, mw * k, col));
    line(pts, mw * 1.2, 'rgba(30,40,60,0.35)', 0.01, 0.035); bulbs('rgba(30,40,60,0.35)', 0.85, 0.01, 0.035);
    line(pts, mw * 1.12, '#8f9bb0'); bulbs('#8f9bb0', 0.8);
    line(pts, mw, '#f6f7f4'); bulbs('#f6f7f4', 0.72);
    line(pts, mw * 0.45, '#d7dde8', 0.004, 0.014); bulbs('#d7dde8', 0.35, 0.006, 0.02);
    line(pts, mw * 0.25, '#ffffff', -0.006, -0.016); bulbs('#ffffff', 0.25, -0.008, -0.02);
  }

  // ---------- 蔥花 ----------
  for (let i = 0; i < 20; i++) {
    const a = rand() * TAU, rr = Math.pow(rand(), 0.8) * 0.45;
    const u = Math.cos(a) * rr * 1.1, v = Math.sin(a) * rr * 0.9, q = P(u, v);
    const rad = r * (0.035 + rand() * 0.02), k = 0.55 + rand() * 0.35, ro = rand() * Math.PI, h = rad * (0.45 + rand() * 0.3);
    // 側面（圓柱）
    c.fillStyle = 'rgba(20,50,0,0.4)'; c.beginPath(); c.ellipse(q[0] + 1.5, q[1] + h + 2, rad, rad * k, ro, 0, TAU); c.fill();
    c.fillStyle = '#3f9a1a'; c.beginPath(); c.ellipse(q[0], q[1] + h, rad, rad * k, ro, 0, TAU); c.fill();
    c.fillRect(q[0] - rad * 0.98, q[1], rad * 1.96, h);
    c.fillStyle = '#7ccf3c'; c.beginPath(); c.ellipse(q[0], q[1], rad, rad * k, ro, 0, TAU); c.fill();
    c.strokeStyle = '#2b7010'; c.lineWidth = lw(0.008); c.stroke();
    c.fillStyle = '#dcf7ae'; c.beginPath(); c.ellipse(q[0], q[1], rad * 0.6, rad * k * 0.6, ro, 0, TAU); c.fill();
    c.fillStyle = '#a3dd6a'; c.beginPath(); c.ellipse(q[0], q[1] + rad * k * 0.1, rad * 0.32, rad * k * 0.3, ro, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.8)'; c.beginPath(); c.ellipse(q[0] - rad * 0.4, q[1] - rad * k * 0.45, rad * 0.22, rad * k * 0.12, ro, 0, TAU); c.fill();
  }
  c.restore();
}

/* ---------- 開始畫面的主視覺（畫一次存起來，之後只浮動） ---------- */
let heroCtx = null, heroCache = null, HW = 340, HH = 260;
function setupHero() {
  const hc = $('hero'); const rc = hc.getBoundingClientRect();
  HW = rc.width || 320; HH = rc.height || 240;
  hc.width = Math.round(HW * DPR); hc.height = Math.round(HH * DPR);
  heroCtx = hc.getContext('2d');
  heroCache = document.createElement('canvas');
  heroCache.width = hc.width; heroCache.height = hc.height;
  const cc = heroCache.getContext('2d'); cc.setTransform(DPR, 0, 0, DPR, 0, 0);
  const r = Math.min(HW * 0.42, HH * 0.56);
  drawOkonomiyaki(cc, HW / 2, HH * 0.47, r, { sy: 0.72, thick: 0.17, seed: 11 });
  heroCache.r = r;
}
function drawHero(t) {
  if (!heroCtx) setupHero();
  const c = heroCtx; c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, heroCtx.canvas.width, heroCtx.canvas.height);
  const bob = Math.sin(t * 2.2) * 3 * DPR;
  c.drawImage(heroCache, 0, bob);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const r = heroCache.r, cx = HW / 2, cy = HH * 0.47 + bob / DPR;
  // 熱氣
  c.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const p = (t * 0.45 + i / 3) % 1, bx = cx + (i - 1) * r * 0.42;
    c.strokeStyle = `rgba(255,255,255,${0.3 * Math.sin(p * Math.PI)})`; c.lineWidth = 4;
    c.beginPath();
    for (let k = 0; k <= 10; k++) {
      const yy = cy - r * 0.35 - p * r * 0.45 - k * 5, xx = bx + Math.sin(k * 0.7 + t * 3 + i) * 6;
      k ? c.lineTo(xx, yy) : c.moveTo(xx, yy);
    }
    c.stroke();
  }
}

function drawSplat(c, s, x, y, r, alpha) {
  if (!pcTopCanvas) pcTopCanvas = buildPcTop();
  if (pcTopCanvas) {
    // 用煎餅圖糊在螢幕上：壓扁、轉一下、半透明，加幾滴噴濺
    const rand = mulberry32(s.seed);
    c.save(); c.translate(x, y); c.rotate(s.rot); c.globalAlpha = alpha;
    c.fillStyle = '#e9c27a';
    for (let i = 0; i < 7; i++) { const a = rand() * Math.PI * 2, d = r * (1.05 + rand() * 0.45); c.beginPath(); c.arc(Math.cos(a) * d, Math.sin(a) * d * 0.85, r * (0.05 + rand() * 0.09), 0, Math.PI * 2); c.fill(); }
    c.scale(1.12, 0.88);
    c.drawImage(pcTopCanvas, -r, -r, r * 2, r * 2);
    c.restore();
    return;
  }
  const rand = mulberry32(s.seed);
  c.save(); c.translate(x, y); c.rotate(s.rot); c.globalAlpha = alpha;
  c.fillStyle = '#efcf7a';
  c.beginPath();
  const n = 16;
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2, rr = r * (0.8 + rand() * 0.45);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath(); c.fill();
  // 噴濺點
  for (let i = 0; i < 6; i++) {
    const a = rand() * Math.PI * 2, d = r * (1.1 + rand() * 0.5);
    c.beginPath(); c.arc(Math.cos(a) * d, Math.sin(a) * d, r * (0.05 + rand() * 0.08), 0, Math.PI * 2); c.fill();
  }
  drawNoodles(c, 0, 0, r * 0.95, s.noodles, 'rgba(170,120,40,0.9)', Math.max(1.2, r * 0.05));
  c.restore();
}

function drawGame(t) {
  const c = ctx, pc = G.pc;
  // 天花板（= 螢幕）上的煎餅：最後畫在上層，但半透明
  // 盤子
  drawPlate(c, L.plate.x, L.plate.y, L.plate.r, G.plate, G.rawPlate, t);
  if (!pc) return;
  const px = L.cx + pc.x * L.R, py = L.cy + pc.y * L.R, r = L.pr;
  const up = pc.sides[1 - pc.down], down = pc.sides[pc.down];
  switch (pc.phase) {
    case 'pour': {
      const k = easeOut(clamp(pc.t / 0.3, 0, 1));
      drawPancake(c, px, py, r * k, 0, 0, pc.noodles, { alpha: k });
      break;
    }
    case 'cook': case 'mom': {
      let ox = 0, oy = 0, sx = 1;
      if (pc.stuck && pc.jitter) { ox = (Math.random() - 0.5) * 4 * pc.jitter; oy = (Math.random() - 0.5) * 4 * pc.jitter; }
      if (pc.wiggle > 0) ox += Math.sin(pc.wiggle * 60) * 5;
      if (pc.hop > 0) sx = 1 + Math.sin(pc.hop / 0.35 * Math.PI) * 0.12;
      // 影子
      c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.arc(px + 4, py + 6, r, 0, Math.PI * 2); c.fill();
      drawPancake(c, px + ox, py + oy - (sx - 1) * 30, r * sx, up, down, pc.noodles);
      // 黏鍋提示
      if (pc.stuck) {
        c.save(); c.setLineDash([8, 6]); c.strokeStyle = '#ff5a3c'; c.lineWidth = 4;
        c.beginPath(); c.arc(px, py, r * 1.05, 0, Math.PI * 2); c.stroke(); c.restore();
        label(c, '黏住了！快晃！', px, py - r - 18, '#ff7a5c', 18);
      } else if (pc.stick > 0.3) {
        c.strokeStyle = `rgba(255,${Math.round(180 - pc.stick * 150)},60,0.9)`; c.lineWidth = 4; c.lineCap = 'round';
        c.beginPath(); c.arc(px, py, r * 1.4, -Math.PI / 2, -Math.PI / 2 + pc.stick * Math.PI * 2); c.stroke();
        if (pc.stick > 0.65) label(c, '快黏住了！', px, py - r * 1.4 - 12, '#ffb070', 15);
      }
      break;
    }
    case 'flip': {
      const k = clamp(pc.t / 0.5, 0, 1);
      const sy = Math.abs(Math.cos(k * Math.PI)) * 0.95 + 0.05;
      const lift = Math.sin(k * Math.PI);
      c.fillStyle = `rgba(0,0,0,${0.3 - lift * 0.15})`; c.beginPath(); c.arc(px + 4 + lift * 10, py + 6 + lift * 14, r * (1 - lift * 0.1), 0, Math.PI * 2); c.fill();
      drawPancake(c, px, py - lift * r * 0.6, r * (1 + lift * 0.3), up, down, pc.noodles, { sx: 1, sy });
      break;
    }
    case 'serve': {
      const k = easeOut(clamp(pc.t / 0.55, 0, 1));
      const x = lerp(pc.from.x, L.plate.x, k), y = lerp(pc.from.y, L.plate.y - G.plate.length * 5, k) - Math.sin(k * Math.PI) * 80;
      drawPancake(c, x, y, lerp(r, L.plate.r * 0.62, k), pc.sides[1], pc.sides[0], pc.noodles, { rot: k * Math.PI * 2, noHalo: k > 0.3 });
      break;
    }
    case 'fail':
      drawFail(c, pc, t);
      break;
  }
}

function drawFail(c, pc, t) {
  const r = L.pr, f = pc.failFrom, k = pc.t;
  const up = pc.sides[1 - pc.down], down = pc.sides[pc.down];
  if (pc.failKind === 'floor') {
    // 滑出鍋外，掉到地上，貓叼走
    const slide = easeOut(clamp(k / 0.45, 0, 1));
    let x = f.x + pc.outDir.x * L.R * 0.7 * slide, y = f.y + pc.outDir.y * L.R * 0.7 * slide;
    x = clamp(x, r * 0.6, W - r * 0.6); y = clamp(y, r + 60, H - r * 0.6);
    pc.floorPos = pc.floorPos || null;
    if (k >= 0.45 && !pc.floorPos) pc.floorPos = { x, y };
    const fp = pc.floorPos || { x, y };
    const catIn = 0.75, catGrab = 1.25, catOut = 2.1;
    let catX = null;
    if (k < catIn) {
      drawPancake(c, x, y, r * (1 - slide * 0.15), up, down, pc.noodles, { noHalo: true, rot: slide * 0.6 });
    } else if (k < catGrab) {
      drawPancake(c, fp.x, fp.y, r * 0.85, up, down, pc.noodles, { noHalo: true, rot: 0.6 });
      const kk = easeOut((k - catIn) / (catGrab - catIn));
      catX = lerp(W + 60, fp.x + r * 0.3, kk);
    } else {
      const kk = clamp((k - catGrab) / (catOut - catGrab), 0, 1);
      catX = lerp(fp.x + r * 0.3, -120, kk * kk);
      drawPancake(c, catX - 30, fp.y + 10, r * 0.6, up, down, pc.noodles, { noHalo: true, rot: 0.3 + Math.sin(k * 30) * 0.1 });
    }
    if (catX != null) drawCat(c, catX, fp.y + Math.sin(k * 30) * 2, 64, k, 'run', false);
    if (k > 0.5) label(c, '貓叼走了！', W / 2, L.cy - L.R - 30, '#fbfaf3', 26);
  } else if (pc.failKind === 'ceiling') {
    const sp = splatPos(pc.splat);
    if (k < 0.5) {
      const kk = k / 0.5;
      const x = lerp(f.x, sp.x, kk * kk), y = lerp(f.y, sp.y, kk * kk);
      drawPancake(c, x, y, r * lerp(1, 3.2, kk * kk), up, down, pc.noodles, { rot: kk * 4, alpha: 1 });
    }
    if (k >= 0.5) label(c, '啪！糊在天花板上了', W / 2, L.cy - L.R * 0.1, '#fbfaf3', 26);
    if (k >= 0.7) label(c, '（太大力了）', W / 2, L.cy + 26, '#d9c39a', 17);
  } else if (pc.failKind === 'burnt') {
    drawPancake(c, f.x + (Math.random() - 0.5) * 3, f.y, r, 3, 3, pc.noodles, { black: true });
    if (k < 1.1 && Math.floor(k * 6) % 2 === 0) { c.fillStyle = 'rgba(255,0,0,0.18)'; c.fillRect(0, 0, W, H); }
    if (k < 1.2) drawAlarm(c, W / 2 + Math.sin(k * 40) * 3, L.splatTop + 10, 26, k);
    if (k < 1.2) label(c, '嗶嗶嗶！', W / 2, L.splatTop + 54, '#ff6060', 22);
    label(c, '燒成黑炭了…', W / 2, L.cy + L.R + 40, '#fbfaf3', 24);
  } else if (pc.failKind === 'mom') {
    drawPancake(c, f.x, f.y, r, up, down, pc.noodles, { alpha: Math.max(0, 1 - k) });
  }
}

function drawMomOverlay(c, t) {
  const pc = G && G.pc; if (!pc) return;
  let m = pc.mom, light = 0, stage = null;
  if (pc.phase === 'mom') { light = m.light; stage = m.stage; }
  else if (pc.phase === 'fail' && pc.failKind === 'mom') { light = Math.max(0, 1 - Math.max(0, pc.t - 1.4) * 2); stage = 'caught'; }
  if (light <= 0) return;
  c.fillStyle = `rgba(255,246,215,${0.55 * light})`; c.fillRect(0, 0, W, H);
  // 門縫的光
  const g = c.createLinearGradient(0, 0, 0, H * 0.7);
  g.addColorStop(0, `rgba(255,255,230,${0.5 * light})`); g.addColorStop(1, 'rgba(255,255,230,0)');
  c.fillStyle = g; c.beginPath(); c.moveTo(W * 0.38, 0); c.lineTo(W * 0.62, 0); c.lineTo(W * 0.95, H * 0.7); c.lineTo(W * 0.05, H * 0.7); c.fill();
  const momY = L.splatTop + 52;
  drawDoorMom(c, W / 2, momY, 92, t, stage, light);
  if (stage === 'caught') {
    label(c, '媽媽：你在幹嘛！', W / 2, momY + 72, '#b00020', 30, '#fff');
  } else if (stage === 'pass') {
    label(c, '媽媽：……大概是貓吧。', W / 2, momY + 72, '#3a2a10', 24, '#fff');
  } else {
    label(c, '……是誰在廚房？', W / 2, momY + 72, '#3a2a10', 30, '#fff');
    // 靜止條
    const bw = W * 0.7, bh = 18, bx = (W - bw) / 2, by = L.cy + L.R + 34;
    c.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(c, bx, by, bw, bh, 9); c.fill();
    const p = stage === 'hold' ? m.still / CONFIG.momStillSeconds : 0;
    c.fillStyle = '#4caf50'; roundRect(c, bx, by, Math.max(bh, bw * p), bh, 9); c.fill();
    label(c, stage === 'hold' ? (inputMode === 'touch' ? '手指離開螢幕，不要動！' : '拿穩手機，不要動！') : '……', W / 2, by + 40, '#3a2a10', 18, '#fff');
  }
}

function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function shadeStroke(col) { return col === '#fff' || col === '#ffffff' ? '#b9a77e' : '#2a0c04'; }
function label(c, text, x, y, color, size, strokeColor = '#7a2412') {
  c.font = `900 ${size}px -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  // 跟 landing 標題一樣：底下一層深色厚影＋描邊
  c.lineWidth = Math.max(4, size * 0.26); c.strokeStyle = shadeStroke(strokeColor); c.strokeText(text, x, y + Math.max(2, size * 0.1));
  c.strokeStyle = strokeColor; c.strokeText(text, x, y);
  c.fillStyle = color; c.fillText(text, x, y);
}

function drawFx(c) {
  for (const p of fx.particles) {
    const a = 1 - p.t / p.life;
    c.fillStyle = rgba(p.c, p.kind === 'smoke' ? a * 0.35 : a);
    c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill();
  }
  for (const n of fx.fallingNoodles) {
    c.save(); c.translate(n.x, n.y); c.rotate(n.rot);
    c.strokeStyle = `rgba(230,190,90,${1 - n.t / n.life})`; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-n.len / 2, 0); c.quadraticCurveTo(0, -8, n.len / 2, 0); c.stroke(); c.restore();
  }
  for (const s of fx.texts) {
    const k = s.t / s.life;
    const sc = k < 0.15 ? easeOut(k / 0.15) * 1.15 : 1;
    c.globalAlpha = k > 0.75 ? (1 - k) / 0.25 : 1;
    label(c, s.text, s.x, s.y - k * 30, s.color, s.size * sc);
    c.globalAlpha = 1;
  }
  if (fx.flash) { c.fillStyle = rgba(fx.flash.color, fx.flash.a * (1 - fx.flash.t / fx.flash.life)); c.fillRect(0, 0, W, H); }
}

/* ---------- 開始畫面：GPT 生的背景＋煎餅圖 ---------- */
// 背景圖裡鍋子的位置（原圖 941×1672 的像素座標）
const LANDING_PAN = { cx: 467, floorY: 1226, innerW: 535 };
function drawLanding(t) {
  const bg = IMG.bg, pc = IMG.pc;
  const s = Math.max(W / bg.naturalWidth, H / bg.naturalHeight);
  const dw = bg.naturalWidth * s, dh = bg.naturalHeight * s;
  const ox = (W - dw) / 2, oy = (H - dh) * 0.7;
  ctx.drawImage(bg, ox, oy, dw, dh);
  const cx = ox + LANDING_PAN.cx * s, floor = oy + LANDING_PAN.floorY * s;
  // 爐火的光微微閃動
  const fl = 0.5 + 0.5 * Math.sin(t * 11) * Math.sin(t * 7.3);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, floor + 60 * s, 10, cx, floor + 60 * s, 420 * s);
  g.addColorStop(0, `rgba(255,140,50,${0.10 + 0.06 * fl})`); g.addColorStop(1, 'rgba(255,140,50,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  if (!imgReady(pc)) return;
  // 煎餅：配合鍋子的透視壓扁一點
  const pw = LANDING_PAN.innerW * 0.88 * s, ph = pw * pc.naturalHeight / pc.naturalWidth * 0.62;
  const hop = Math.max(0, Math.sin(t * 2.4)) ** 6 * 10 * s * 2; // 偶爾滋一下跳起來
  const bob = Math.sin(t * 18) * 0.6;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(cx, floor - ph * 0.2, pw * 0.48 * (1 - hop / 200), ph * 0.26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(pc, cx - pw / 2, floor - ph - hop + bob, pw, ph);
  // 熱氣
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const p = (t * 0.45 + i / 3) % 1, bx = cx + (i - 1) * pw * 0.22, by = floor - ph * 0.7;
    ctx.strokeStyle = `rgba(255,255,255,${0.32 * Math.sin(p * Math.PI)})`; ctx.lineWidth = 4;
    ctx.beginPath();
    for (let k = 0; k <= 10; k++) {
      const yy = by - p * ph * 0.9 - k * 5, xx = bx + Math.sin(k * 0.7 + t * 3 + i) * 6;
      k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
    }
    ctx.stroke();
  }
}

function render() {
  const t = now();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (appState === 'title' && imgReady(IMG.bg)) { drawLanding(t); return; }
  ctx.save();
  if (fx.camShake > 0) ctx.translate((Math.random() - 0.5) * 14 * fx.camShake / 0.35, (Math.random() - 0.5) * 14 * fx.camShake / 0.35);
  let warn = 0;
  if (G && G.pc && G.pc.phase === 'cook') { const d = Math.hypot(G.pc.x, G.pc.y); warn = clamp((d - 0.68) / 0.25, 0, 1); }
  if (L.bg && imgReady(IMG.bgGame)) {
    ctx.drawImage(IMG.bgGame, L.bg.ox, L.bg.oy, L.bg.dw, L.bg.dh);
    const fl = 0.5 + 0.5 * Math.sin(t * 11) * Math.sin(t * 7.3);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(L.cx, L.cy, L.R * 0.9, L.cx, L.cy, L.R * 1.6);
    g.addColorStop(0, `rgba(90,120,255,${0.05 + 0.05 * fl})`); g.addColorStop(0.4, `rgba(255,140,50,${0.06 + 0.04 * fl})`); g.addColorStop(1, 'rgba(255,140,50,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
    if (warn > 0) {
      ctx.strokeStyle = `rgba(255,60,40,${warn * (0.5 + 0.5 * Math.sin(t * 18))})`;
      ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(L.cx, L.cy, L.R * 1.02, 0, Math.PI * 2); ctx.stroke();
    }
  } else {
    drawKitchen(t);
    drawPan(warn);
  }
  if (G && appState !== 'title' && appState !== 'perm' && appState !== 'calib') drawGame(t);
  // 糊在螢幕上的煎餅（半透明、不擋鍋子）
  if (G) for (const s of G.splats) { const p = splatPos(s); drawSplat(ctx, s, p.x, p.y, L.pr * 0.85, 0.5); }
  drawFx(ctx);
  if (G) drawMomOverlay(ctx, t);
  ctx.restore();
}

    try { pMotion = DM.requestPermission(); } catch (e) { pMotion = Promise.reject(e); }
    let pOrient = Promise.resolve('granted');
    if (DO && typeof DO.requestPermission === 'function') { try { pOrient = DO.requestPermission(); } catch (e) { pOrient = Promise.resolve('denied'); } }
    Promise.all([pMotion.catch(() => 'denied'), pOrient.catch(() => 'denied')]).then(([rm, ro]) => {
      if (rm === 'granted' || ro === 'granted') { track('permission_result', { result: 'granted' }); sensorCheck(); }
      else { track('permission_result', { result: 'denied' }); showDenied(); }
    });
  } else {
    track('permission_result', { result: 'not_needed' });
    sensorCheck();
  }
});

function permScreen(emoji, msg, sub, copy, touch) {
  appState = 'perm'; showScreen('s-perm');
  $('perm-emoji').innerHTML = ICONS[emoji] || ''; $('perm-msg').textContent = msg; $('perm-sub').textContent = sub || '';
  $('btn-copyurl').classList.toggle('hidden', !copy); $('btn-touch').classList.toggle('hidden', !touch);
}
function showDenied() { permScreen('pan', '沒關係，可以用手指玩', '按住拖曳＝晃，快速上滑放開＝翻面', false, true); }

function sensorCheck() {
  permScreen('phone', '感應器檢查中…', '', false, false);
  const t0 = now();
  const iv = setInterval(() => {
    if (Input.sensorSeen) {
      clearInterval(iv); track('sensor_check', { received: true });
      inputMode = 'motion'; startCalib();
    } else if (now() - t0 > CONFIG.sensorTimeout) {
      clearInterval(iv); track('sensor_check', { received: false });
      if (IS_MOBILE) permScreen('phone', '這裡讀不到動作感應，請用 Safari / Chrome 開啟', IN_APP ? '（看起來你是從 App 裡打開的）' : '', true, true);
      else permScreen('phone', '這裡讀不到動作感應，請用 Safari / Chrome 開啟', '在電腦上可以用滑鼠拖曳或方向鍵＋空白鍵玩', true, true);
    }
  }, 100);
}

$('btn-copyurl').addEventListener('click', async () => { Snd.click(); const ok = await copyText(cleanUrl()); toast(ok ? '已複製網址，貼到 Safari / Chrome 開啟' : cleanUrl()); });
$('btn-touch').addEventListener('click', () => { Snd.init(); Snd.click(); inputMode = 'touch'; startGame(); });
$('btn-calib-touch').addEventListener('click', () => { Snd.click(); inputMode = 'touch'; calib = null; startGame(); });

// 校準
let calib = null;
function savedCalib() { try { const c = JSON.parse(lsGet(CALIB_KEY) || 'null'); return c && c.force ? c : null; } catch (e) { return null; } }
function startCalib() {
  appState = 'calib'; showScreen('s-calib');
  calib = { step: 1, t: 0, samples: [] };
  Input.shakeHandler = null;
  $('calib-emoji').innerHTML = ICONS.pan;
  $('calib-msg').textContent = '把手機拿平，像拿著平底鍋';
  $('btn-calib-touch').classList.add('hidden');
  $('btn-skip-calib').classList.toggle('hidden', !savedCalib());
}
$('btn-skip-calib').addEventListener('click', () => {
  Snd.click(); const c = savedCalib(); if (!c) return;
  Input.base = { b: c.b, g: c.g }; Input.force = c.force; calib = null; startGame();
});
function updateCalib(dt) {
  if (!calib) return;
  calib.t += dt;
  if (calib.step === 1) {
    $('calib-count').textContent = Math.max(1, Math.ceil(2 - calib.t));
    if (calib.t > 1.2 && Input.beta != null) calib.samples.push([Input.beta, Input.gamma]);
    if (calib.t >= 2) {
      if (calib.samples.length) {
        const n = calib.samples.length;
        Input.base = { b: calib.samples.reduce((a, s) => a + s[0], 0) / n, g: calib.samples.reduce((a, s) => a + s[1], 0) / n };
      } else Input.base = { b: Input.beta || 0, g: Input.gamma || 0 };
      Snd.click();
      calib.step = 2; calib.t = 0;
      $('calib-emoji').innerHTML = ICONS.flick;
      $('calib-msg').textContent = '用力往上搖一下試試看！';
      $('calib-count').textContent = '';
      Input.cooldownUntil = 0; Input.peak = null;
      Input.shakeHandler = (ratio, raw) => {
        if (!calib || calib.step !== 2) return;
        const force = Math.max(raw, CONFIG.shakeMinAccel * 1.25);
        Input.force = force;
        lsSet(CALIB_KEY, JSON.stringify({ b: Input.base.b, g: Input.base.g, force }));
        track('calibration_done', { force: +force.toFixed(2), raw: +raw.toFixed(2) });
        Snd.perfect(); vibrate(40);
        calib.step = 3; calib.t = 0;
        $('calib-emoji').innerHTML = ICONS.ok;
        $('calib-msg').textContent = 'OK，開始煎！';
        $('calib-count').textContent = '';
        $('btn-calib-touch').classList.add('hidden');
        Input.shakeHandler = null;
      };
    }
  } else if (calib.step === 2) {
    if (calib.t > 6) $('btn-calib-touch').classList.remove('hidden');
  } else if (calib.step === 3) {
    if (calib.t >= 1.2) { calib = null; startGame(); }
  }
}

// 續命
function showRevive() {
  appState = 'revive'; showScreen('s-revive'); Snd.sizzle(0);
  if (HOST) HOST.pause(window);
  $('revive-sub').textContent = `已經煎好 ${G.served} / ${CONFIG.level1Target} 片`;
  $('buy-note').textContent = '';
  renderReviveButtons(); renderWallet();
  setHint();
}
function renderReviveButtons() {
  const free = Wallet.isFree();
  $('btn-free').classList.toggle('hidden', !free);
  $('btn-ad').classList.toggle('hidden', free);
  const b = $('btn-buy');
  b.innerHTML = `免費補充 ${CONFIG.buyNoodlesAmount} 包泡麵`;
  b.classList.toggle('dim', Wallet.bal < CONFIG.buyNoodlesCost);
}
function resumeWithLives(n, msg) {
  G.lives = clamp(n, 1, CONFIG.maxLives); Snd.life();
  if (HOST) HOST.resume(window);
  appState = 'play'; showScreen(null);
  toast(msg);
  newPancake();
}
// 看廣告 → 30 分鐘免費（開局免費、泡麵用完免費補）
let adCtx = null;
function startAd(from) {
  track('fake_ad_click', { pancakes: G ? G.served : 0, from, balance: Wallet.bal });
  adCtx = { from, t: CONFIG.fakeAdSeconds };
  appState = 'ad'; showScreen('s-ad'); $('ad-count').textContent = CONFIG.fakeAdSeconds;
}
$('btn-ad').addEventListener('click', () => { Snd.click(); if (G) G.adUsed++; startAd('revive'); });
$('btn-free').addEventListener('click', () => {
  Snd.click(); if (!Wallet.isFree()) { renderReviveButtons(); return; }
  track('free_refill', { pancakes: G.served, left_sec: Math.round(Wallet.freeLeftMs() / 1000) });
  resumeWithLives(CONFIG.freeRefillLives, `免費補 ${CONFIG.freeRefillLives} 包，繼續煎！`);
});
$('btn-buy').addEventListener('click', () => {
  Snd.click(); Wallet.tick(Date.now());
  if (!Wallet.spend(CONFIG.buyNoodlesCost)) {
    track('points_buy_fail', { pancakes: G.served, balance: Wallet.bal });
    $('buy-note').textContent = `點數不夠（需要 ${CONFIG.buyNoodlesCost} 點），可以先看廣告`;
    Snd.stuck(); return;
  }
  track('points_buy', { pancakes: G.served, cost: CONFIG.buyNoodlesCost, noodles: CONFIG.buyNoodlesAmount, balance: Wallet.bal });
  renderWallet();
  resumeWithLives(CONFIG.buyNoodlesAmount, `免費補給，泡麵 +${CONFIG.buyNoodlesAmount}包`);
});
$('btn-sleep').addEventListener('click', () => { Snd.click(); G.ended = true; showResult(); });
function updateAd(dt) {
  adCtx.t -= dt;
  $('ad-count').textContent = Math.max(0, Math.ceil(adCtx.t));
  if (adCtx.t <= 0) {
    Wallet.grantFree(CONFIG.adFreeMinutes);
    track('fake_ad_complete', { pancakes: G ? G.served : 0, from: adCtx.from, free_minutes: CONFIG.adFreeMinutes });
    const from = adCtx.from; adCtx = null;
    if (from === 'revive') resumeWithLives(CONFIG.freeRefillLives, `接下來 ${CONFIG.adFreeMinutes} 分鐘免費，泡麵補滿`);
    else { toast(`接下來 ${CONFIG.adFreeMinutes} 分鐘免費`); const n = lowNext; lowNext = null; if (n) n(); else { appState = 'title'; showScreen('s-title'); } }
  }
}
// 點數不足
let lowNext = null;
function showLow(next) {
  lowNext = next; appState = 'low'; showScreen('s-low');
  $('hud').classList.add('hidden'); renderWallet();
}
$('btn-low-ad').addEventListener('click', () => { Snd.click(); startAd('low_points'); });
$('btn-low-back').addEventListener('click', () => { Snd.click(); lowNext = null; G = null; appState = 'title'; showScreen('s-title'); });

// 結算
function rankOf() {
  if (G.passed && G.plate.length >= CONFIG.level1Target && G.plate.every(k => k === 'perfect')) return '宵夜之神';
  if (G.passed) return '宿舍廚神';
  if (G.served >= 1) return '宵夜新手';
  return '連泡麵都會煮壞';
}
function showResult() {
  appState = 'result'; Snd.sizzle(0);
  if (!G.passed) Snd.sad();
  $('hud').classList.add('hidden'); setHint();
  showScreen('s-result');
  $('r-title').textContent = G.passed ? '第 1 晚完成！今晚吃飽了' : '第 1 晚失敗……今晚餓肚子';
  const rank = rankOf(); G.rank = rank;
  $('r-rank').textContent = rank;
  const notes = [];
  if (G.fails.ceiling >= 2) notes.push('房東明天會來找你');
  if (G.fails.floor >= 2) notes.push('貓今天吃得比你好');
  if (G.fails.mom >= 1) notes.push('明天早餐桌上會很尷尬');
  $('r-notes').innerHTML = notes.map(n => '・' + n).join('<br>');
  $('r-stats').textContent = `煎好 ${G.served} 片（完美 ${G.perfectCount}）・天花板 ${G.fails.ceiling}・貓 ${G.fails.floor}・黑炭 ${G.fails.burnt}・被抓 ${G.fails.mom}`;
  track('game_over', { passed: G.passed, pancakes: G.served, fails: { ...G.fails }, play_seconds: Math.round(G.playTime) });
  if (HOST && !G.hostFinished) { G.hostFinished = true; HOST.finish(window, { served: G.served, perfect: G.perfectCount, passed: G.passed }); }
  setupResultCanvas();
}
let rctx = null, RW = 340, RH = 200;
function setupResultCanvas() {
  const rc = $('rcv'); const r = rc.getBoundingClientRect();
  RW = r.width || 320; RH = r.height || 200;
  rc.width = Math.round(RW * DPR); rc.height = Math.round(RH * DPR);
  rctx = rc.getContext('2d');
}
function drawResult(t) {
  if (!rctx) return;
  const c = rctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 牆
  c.fillStyle = '#2b2420'; c.fillRect(0, 0, RW, RH);
  // 天花板
  c.fillStyle = '#3b332c'; c.fillRect(0, 0, RW, 46);
  c.fillStyle = '#4a4038'; c.fillRect(0, 44, RW, 3);
  const nC = G.fails.ceiling;
  for (let i = 0; i < nC; i++) {
    const s = G.splats[i] || { seed: i + 1, rot: i, noodles: PLATE_NOODLES };
    const x = nC === 1 ? RW / 2 : 30 + i * ((RW - 60) / Math.max(1, nC - 1));
    drawSplat(c, s, x, 22, 16, 0.85);
  }
  // 桌子
  c.fillStyle = '#5a3d26'; c.fillRect(0, RH - 60, RW, 60);
  c.fillStyle = '#6e4b2f'; c.fillRect(0, RH - 60, RW, 6);
  // 盤子
  drawPlate(c, RW / 2, RH - 62, 40, G.plate, G.rawPlate, t);
  // 垃圾桶 + 黑炭
  const bx = 42, by = RH - 30;
  for (let i = 0; i < G.fails.burnt; i++) {
    c.fillStyle = '#141010'; c.beginPath(); c.arc(bx - 10 + (i % 3) * 10, by - 38 - Math.floor(i / 3) * 8, 8, 0, Math.PI * 2); c.fill();
  }
  c.fillStyle = '#6b6f75'; c.beginPath(); c.moveTo(bx - 22, by - 36); c.lineTo(bx + 22, by - 36); c.lineTo(bx + 17, by + 10); c.lineTo(bx - 17, by + 10); c.closePath(); c.fill();
  c.strokeStyle = '#555a60'; c.lineWidth = 2; for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(bx + i * 9, by - 30); c.lineTo(bx + i * 7, by + 6); c.stroke(); }
  if (G.fails.burnt) label(c, '黑炭 ×' + G.fails.burnt, bx, by - 64, '#fbfaf3', 13);
  // 吃很飽的貓
  if (G.fails.floor > 0) {
    drawCat(c, RW - 46, RH - 44, 52, t, 'sit');
    label(c, '飽～ ×' + G.fails.floor, RW - 46, RH - 82, '#fbfaf3', 14);
  }
  if (nC) label(c, '天花板 ×' + nC, RW - 50, 58, '#efcf7a', 12);
}
$('btn-retry').addEventListener('click', () => { Snd.click(); track('retry_click', { prev_passed: G.passed }); tryStart(startGame); });
$('btn-share').addEventListener('click', async () => {
  Snd.click();
  const text = `我半夜煎了 ${G.served} 片泡麵煎餅，天花板糊了 ${G.fails.ceiling} 片，貓吃掉 ${G.fails.floor} 片\n稱號：「${G.rank}」\n你翻得贏我嗎？ ${cleanUrl()}`;
  if (navigator.share) {
    track('share_click', { pancakes: G.served, method: 'native' });
    try { await navigator.share({ text }); } catch (e) {}
  } else {
    track('share_click', { pancakes: G.served, method: 'clipboard' });
    const ok = await copyText(text);
    toast(ok ? '已複製，貼給同事吧！' : '複製失敗，請手動截圖分享');
  }
});
$('btn-next').addEventListener('click', () => {
  Snd.click();
  track('next_level_interest_click', { passed: G.passed });
  lsSet('noodle_pancake_next_clicks', String((+lsGet('noodle_pancake_next_clicks') || 0) + 1));
  toast('第 2 晚還在準備中，我們會加油的！', 3);
});

// 靜音
$('mute').addEventListener('click', (e) => {
  e.stopPropagation(); Snd.init(); Snd.setMuted(!Snd.muted); $('mute').classList.toggle('muted', Snd.muted); $('mute').setAttribute('aria-pressed', String(Snd.muted));
});

// 切到背景
// 平台切換到別的遊戲／回大廳時暫停；回來時倒數 1 秒繼續
window.setPancakePlatformActive = function (active) {
  if (!active) {
    if (appState === 'play' || appState === 'calib') pauseReason = pauseReason || 'platform';
    Snd.sizzle(0); if (Snd.ctx && Snd.ctx.state === 'running') Snd.ctx.suspend();
  } else {
    if (pauseReason === 'platform') { pauseReason = null; resumeCountdown = 1; }
    if (Snd.ctx && !Snd.muted && Snd.ctx.state === 'suspended') Snd.ctx.resume().catch(() => {});
    resize(); heroCtx = null;
  }
};
// 大廳的「結束本局」按鈕
window.finishPancakePlatformRound = function () {
  if (!G || G.hostFinished || !['play', 'revive', 'ad'].includes(appState)) return;
  G.ended = true; adCtx = null; showResult();
};
// iframe 裡的操作不會冒泡到大廳，主動通知有效遊玩時間
if (HOST) {
  let lastTouch = 0;
  const touch = () => { const t = Date.now(); if (t - lastTouch > 3000) { lastTouch = t; try { HOST.touch(window); } catch (_) {} } };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, touch, { capture: true, passive: true }));
  window.addEventListener('devicemotion', () => { if (appState === 'play') touch(); }, { passive: true });
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (appState === 'play') pauseReason = pauseReason || 'hidden'; Snd.sizzle(0); }
  else if (pauseReason === 'hidden') { pauseReason = null; resumeCountdown = 1; }
});

/* =========================================================
   Debug
   ========================================================= */
if (DEBUG) {
  $('debug').classList.remove('hidden');
  $('btn-export').addEventListener('click', () => {
    const data = lsGet(EVENTS_KEY) || '[]';
    const blob = new Blob([JSON.stringify(JSON.parse(data), null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'noodle_pancake_events.json';
    document.body.appendChild(a); a.click(); a.remove();
    copyText(data).then(ok => ok && toast('已下載，也複製到剪貼簿了'));
  });
}
let dbgT = 0;
function updateDebug(dt) {
  if (!DEBUG) return;
  dbgT += dt; if (dbgT < 0.1) return; dbgT = 0;
  const tl = getTilt(), pc = G && G.pc;
  const lines = [
    `mode   ${inputMode}  state ${appState}${pauseReason ? ' (' + pauseReason + ')' : ''}`,
    `beta   ${Input.beta == null ? '-' : Input.beta.toFixed(1)}  gamma ${Input.gamma == null ? '-' : Input.gamma.toFixed(1)}`,
    `tilt   x ${tl.x.toFixed(1)}  y ${tl.y.toFixed(1)}  ${now() < Input.tiltPauseUntil ? '[PAUSED]' : ''}`,
    `accel  ${Input.accelMag.toFixed(2)}  peak ${(+Input.lastPeak || 0).toFixed(2)}  std ${Input.force.toFixed(1)}`,
  ];
  if (pc) {
    lines.push(`phase  ${pc.phase}  side ${pc.side + 1}`);
    lines.push(`stick  ${pc.stick.toFixed(2)}${pc.stuck ? ' STUCK' : ''}  spd ${(pc.speed || 0).toFixed(2)}`);
    lines.push(`done   A ${pc.sides[0].toFixed(2)}  B ${pc.sides[1].toFixed(2)}  (down ${pc.down ? 'B' : 'A'})`);
    if (pc.mom && pc.mom.dTilt != null) lines.push(`momΔ   ${pc.mom.dTilt.toFixed(1)}°`);
  }
  lines.push(`events ${eventCount()}`);
  $('debug-text').textContent = lines.join('\n');
}

/* =========================================================
   主迴圈
   ========================================================= */
let lastT = now(), hintT = 0;
function loop() {
  const t = now();
  const dt = Math.min(0.05, t - lastT); lastT = t;
  // 搖動峰值逾時（沒有新事件時）
  if (Input.peak && t - Input.peak.start > 0.12) resolvePeak();

  const landscape = IS_MOBILE && window.innerWidth > window.innerHeight;
  const rotatable = appState === 'play' || appState === 'calib';
  if (landscape && rotatable) {
    if (pauseReason !== 'rotate') { pauseReason = 'rotate'; track('orientation_pause'); Snd.sizzle(0); }
    $('rotate').classList.add('show');
  } else if (pauseReason === 'rotate') {
    pauseReason = null; $('rotate').classList.remove('show'); resumeCountdown = 1; resize();
  }

  if (!pauseReason) {
    if (resumeCountdown > 0) {
      resumeCountdown -= dt;
      $('countdown').textContent = '1'; $('countdown').classList.toggle('show', resumeCountdown > 0);
    } else {
      if (appState === 'play' && G) updateGame(dt);
      else if (appState === 'calib') updateCalib(dt);
      else if (appState === 'ad') updateAd(dt);
      updateFx(dt);
    }
  }
  // 點數：每秒回點／更新顯示
  loop.wT = (loop.wT || 0) + dt;
  if (loop.wT > 0.5) { loop.wT = 0; Wallet.tick(Date.now()); renderWallet(); }
  // 靜音按鈕只在首頁出現
  const showMute = appState === 'title';
  if (loop.mute !== showMute) { loop.mute = showMute; $('mute').classList.toggle('hidden', !showMute); }
  render();
  if (appState === 'result') drawResult(t);
  hintT += dt; if (hintT > 0.15) { hintT = 0; setHint(); }
  updateDebug(dt);
  requestAnimationFrame(loop);
}

// 開啟紀錄
(function pageOpen() {
  const last = +lsGet('noodle_pancake_last_open') || 0;
  const nowMs = Date.now();
  track('page_open', {
    returning: isReturning,
    hours_since_last: last ? +((nowMs - last) / 3600000).toFixed(2) : null,
    device: DEVICE, in_app_browser: IN_APP,
  });
  lsSet('noodle_pancake_last_open', String(nowMs));
})();
Wallet.load(); renderWallet(); fillIcons();
requestAnimationFrame(loop);
</script>
