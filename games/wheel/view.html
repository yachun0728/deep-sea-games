  <section class="view" id="view-wheel" hidden>
    <div class="console">
      <div class="dice-stage keno-stage" id="wh-stage">
        <div class="wh-wrap">
          <div class="wh-pointer" aria-hidden="true"></div>
          <canvas id="wh" width="840" height="840" aria-hidden="true"></canvas>
          <div class="wh-hub" id="wh-hub">—</div>
        </div>
        <div class="field">
          <label id="wh-legend-label">{{t:wheel.view.01}}</label>
          <div class="kpay" id="wh-legend" aria-labelledby="wh-legend-label"></div>
        </div>
        <div class="history" aria-label="{{t:wheel.view.19}}">
          <span class="label">{{t:wheel.view.02}}</span>
          <div class="pills" id="wh-last"></div>
        </div>
      </div>
      <div class="side">
        <section class="panel" aria-label="{{t:wheel.view.20}}">
          <div class="field">
            <label for="wh-amount">{{t:wheel.view.03}}</label>
            <div class="input-row">
              <input id="wh-amount" type="number" inputmode="numeric" min="10" step="10" value="50">
              <button class="chip wchip" type="button" data-wchip="half">½</button>
              <button class="chip wchip" type="button" data-wchip="double">2×</button>
              <button class="chip wchip" type="button" data-wchip="max">{{t:wheel.view.04}}</button>
            </div>
          </div>
          <div class="field">
            <label id="wh-risk-label">{{t:wheel.view.05}}</label>
            <div class="seg-row" role="group" aria-labelledby="wh-risk-label">
              <button class="chip seg" type="button" data-wrisk="low">{{t:wheel.view.06}}</button>
              <button class="chip seg" type="button" data-wrisk="mid">{{t:wheel.view.07}}</button>
              <button class="chip seg" type="button" data-wrisk="high">{{t:wheel.view.08}}</button>
            </div>
          </div>
          <div class="field">
            <label id="wh-n-label">{{t:wheel.view.09}}</label>
            <div class="seg-row" role="group" aria-labelledby="wh-n-label">
              <button class="chip seg" type="button" data-wn="10">10</button>
              <button class="chip seg" type="button" data-wn="20">20</button>
              <button class="chip seg" type="button" data-wn="30">30</button>
            </div>
          </div>
          <dl class="stats">
            <div><dt>{{t:wheel.view.10}}</dt><dd id="wh-max">—</dd></div>
            <div><dt>{{t:wheel.view.11}}</dt><dd id="wh-chance">—</dd></div>
            <div><dt>{{t:wheel.view.12}}</dt><dd id="wh-rtp">—</dd></div>
          </dl>
          <button class="go" id="wh-go" type="button" data-mode="bet">{{t:wheel.view.13}}</button>
          <p class="msg" id="wh-msg" aria-live="polite">{{t:wheel.view.14}}</p>
        </section>
      </div>
    </div>
    <details class="rules">
      <summary>{{t:wheel.view.15}}</summary>
      <p>{{t:wheel.view.16}}</p>
      <p>{{t:wheel.view.17}}</p>
      <p>{{t:wheel.view.18}}</p>
    </details>
  </section>
