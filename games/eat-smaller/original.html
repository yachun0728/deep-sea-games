<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8dcbd">
<title>數字吞噬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html[lang=en]{--font:"Patrick Hand","Comic Sans MS",cursive}
  :root{
    --desk:#e8dcbd; --paper:#f6eedb; --paper2:#fbf6ea; --ink:#2b2b2b; --mute:rgba(43,43,43,.62); --mute2:rgba(43,43,43,.42);
    --cyan:#3f97c4; --violet:#8e5fcf; --amber:#d9801a; --red:#c8402f; --green:#4a8a3a;
    --m-cyan:#8fd3e8; --m-violet:#c9a6e8; --m-amber:#f6c47a; --m-green:#a9d98f; --m-red:#f2a594;
    --font:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","Comic Sans MS",cursive;
    --sk:255px 15px 225px 15px/15px 225px 15px 255px;
    --sk2:15px 255px 15px 225px/225px 15px 255px 15px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-font-smoothing:antialiased;
    background-color:var(--desk);
    background-image:radial-gradient(rgba(43,43,43,.06) 1px,transparent 1.2px);background-size:7px 7px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  b{font-weight:700}
  .num{font-variant-numeric:tabular-nums}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .lbl{font-size:13px;letter-spacing:.08em;color:var(--mute)}
  .icon-btn{width:44px;height:44px;border-radius:var(--sk);background:var(--paper2);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:18px;margin-left:5px;box-shadow:2px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .icon-btn:nth-child(2n){border-radius:var(--sk2)}
  .icon-btn:hover{background:#fff}
  .icon-btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
  canvas#cv{display:block;border:2.5px solid var(--ink);border-radius:14px 26px 12px 24px/24px 12px 26px 14px;box-shadow:5px 6px 0 rgba(43,43,43,.85);background:var(--paper);cursor:crosshair}
  .overlay{position:fixed;inset:0;display:none;background:rgba(232,220,189,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);padding:22px 16px 16px;z-index:10;overflow-y:auto;touch-action:pan-y}
  .overlay *{touch-action:pan-y}
  .overlay.show{display:flex}
  .overlay .card{margin:auto}
  .card{position:relative;width:min(460px,100%);background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--sk);padding:26px 24px 22px;text-align:center;box-shadow:7px 8px 0 var(--ink);transform:rotate(-.6deg)}
  .card.wide{width:min(560px,100%)}
  .card::before{content:"";position:absolute;left:50%;top:-14px;width:96px;height:26px;margin-left:-48px;background:rgba(246,196,122,.75);transform:rotate(-3deg);border-left:2px dashed rgba(43,43,43,.15);border-right:2px dashed rgba(43,43,43,.15)}
  .card h1{font-size:46px;font-weight:700;letter-spacing:.02em;line-height:1.05}
  .card h2{font-size:32px;font-weight:700}
  .card h3{font-size:21px;font-weight:700;margin-top:16px;text-align:left}
  .sub{color:var(--mute);font-size:17px;line-height:1.5;margin-top:6px}
  .rules{text-align:left;margin:14px 0 4px;display:grid;gap:9px;font-size:16px;line-height:1.45}
  .rules div{display:flex;gap:10px;align-items:flex-start}
  .btn{display:inline-block;margin-top:18px;padding:10px 28px;border-radius:var(--sk);border:2.5px solid var(--ink);font-weight:700;font-size:20px;box-shadow:3px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;background:var(--m-green);min-height:48px}
  .btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
  .btn.ghost{background:var(--paper2);padding:8px 16px;font-size:17px;margin-top:12px;border-radius:var(--sk2);min-height:46px}
  .btn.ghost:hover{background:#fff}
  .btn.play{display:flex;flex-direction:column;align-items:center;width:100%;max-width:300px;margin:16px auto 0;padding:10px 20px 8px;font-size:34px;line-height:1.05}
  .btn.play small{font-size:15px;font-weight:400;color:var(--ink);opacity:.72;margin-top:2px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .row .btn.ghost{flex:1 1 0;min-width:84px;max-width:150px;padding:8px 8px}
  .col{display:flex;flex-direction:column;align-items:center;gap:0}
  .col .btn{min-width:220px}
  #mascot{display:block;margin:-4px auto 4px;width:210px;height:104px}
  .levels{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(4,1fr)}
  .levels button{aspect-ratio:1.1;background:var(--paper2);border:2px solid var(--ink);border-radius:var(--sk);font-weight:700;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:2px 3px 0 var(--ink);line-height:1.1}
  .levels button:nth-child(2n){border-radius:var(--sk2);transform:rotate(1deg)}
  .levels button:nth-child(3n){transform:rotate(-1.2deg)}
  .levels button small{font-size:12px;font-weight:400;color:var(--mute)}
  .levels button:disabled{opacity:.35;cursor:default;border-style:dashed;box-shadow:none}
  .levels button.done{background:#e3f1d6}
  .levels button.cur{outline:3px dashed var(--amber);outline-offset:2px}
  .slider{display:grid;grid-template-columns:1fr 52px;align-items:center;gap:4px 12px;text-align:left;font-size:19px;margin-top:16px}
  .slider span{grid-column:1/3}
  .slider b{text-align:right;font-size:18px}
  .slider input{width:100%;height:34px;accent-color:var(--green);cursor:pointer;touch-action:none}
  .keys{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:16px;margin-top:8px;text-align:left}
  kbd{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:var(--sk2);padding:0 6px;background:#fff;margin-right:3px}
  .stat{display:flex;justify-content:center;gap:28px;margin-top:14px}
  .stat b{display:block;font-size:32px}
  .stat span{font-size:13px;color:var(--mute)}
  .bar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .big{font-size:40px;font-weight:700;line-height:1}
  .target{color:var(--amber)}
  .mid{flex:1;min-width:0;padding:0 6px 2px}
  .big.bump{animation:bump .28s ease-out}
  @keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
  .prog{height:13px;border:2px solid var(--ink);border-radius:var(--sk);background:var(--paper2);overflow:hidden;margin-top:6px}
  .prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--green) 0 3px,var(--m-green) 3px 7px);transition:width .2s}
  .prog i.over{background:repeating-linear-gradient(-45deg,var(--red) 0 3px,var(--m-red) 3px 7px)}
  .status{font-size:15px;line-height:1.2;color:var(--mute);text-align:center;min-height:18px;margin-top:4px}
  .status.warn{color:var(--red);font-weight:700}
  .chip{flex:none;min-width:36px;height:27px;padding:0 6px;border-radius:var(--sk);border:2px solid var(--ink);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  @media (max-height:560px){ .card{padding:20px 20px 16px} .card h1{font-size:38px} #mascot{height:80px;width:162px} .btn.play{font-size:28px;margin-top:10px} .levels button{aspect-ratio:1.5} }
  @media (max-height:420px){ .overlay{padding:14px 12px 10px} .card{padding:14px 18px 12px} .card h1{font-size:30px} #mascot{height:52px;width:105px;margin:0 auto} .sub{font-size:14px;margin-top:2px} .btn.play{font-size:24px;margin-top:8px;padding:6px 16px 4px} .btn{margin-top:10px;min-height:42px} .btn.ghost{margin-top:8px;min-height:42px} .levels{gap:6px;margin-top:8px} .levels button{aspect-ratio:2.2;font-size:18px} .card h2{font-size:26px} }
  /* Touch joystick */
  #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2.5px dashed rgba(43,43,43,.45);background:rgba(246,238,219,.45);display:none;pointer-events:none;z-index:6}
  #joy.on{display:block}
  #joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#8fd3e8;border:2.5px solid var(--ink);box-shadow:2px 3px 0 rgba(43,43,43,.8)}
  #app,#app *{touch-action:none}
  .thumb{display:none}
  @media (pointer:coarse) and (orientation:portrait){
    .thumb{display:flex;align-items:center;justify-content:center;flex:none;height:150px;border:2.5px dashed rgba(43,43,43,.3);border-radius:var(--sk);color:var(--mute2);font-size:16px;gap:10px}
    .thumb b{display:inline-block;width:34px;height:34px;border-radius:50%;border:2.5px dashed rgba(43,43,43,.35)}
  }
</style>
</head>
<body data-i18n-ignore>
<div id="app">
  <div class="bar" id="bar">
    <div><div class="lbl" data-t="you"></div><div class="big num" id="hudVal">2</div></div>
    <div class="mid">
      <div class="lbl" id="hudLv" style="text-align:center">&nbsp;</div>
      <div class="prog"><i id="prog"></i></div>
      <div class="status" id="status"></div>
    </div>
    <div style="text-align:right"><div class="lbl" data-t="target"></div><div class="big num target" id="hudTarget">12</div></div>
    <div style="align-self:center;white-space:nowrap"><button class="icon-btn" id="btnSound">🔊</button><button class="icon-btn" id="btnPause">❚❚</button></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="thumb" id="thumb"><b></b><span data-t="thumb"></span></div>
</div>
<div id="joy"><i></i></div>

<div class="overlay" id="ovMenu">
  <div class="card">
    <canvas id="mascot" width="420" height="208"></canvas>
    <h1 data-t="title"></h1>
    <div class="sub" data-t="tagline"></div>
    <button class="btn play" id="btnPlay"><span id="playLbl"></span><small id="playSub"></small></button>
    <div class="row">
      <button class="btn ghost" id="btnLevels" data-t="levels"></button>
      <button class="btn ghost" id="btnSettings" data-t="settings"></button>
      <button class="btn ghost" id="btnInfo" data-t="info"></button>
    </div>
  </div>
</div>

<div class="overlay" id="ovLevels">
  <div class="card">
    <h2 data-t="levels"></h2>
    <div class="levels" id="levels"></div>
    <button class="btn ghost" data-back data-t="back"></button>
  </div>
</div>

<div class="overlay" id="ovSettings">
  <div class="card">
    <h2 data-t="settings"></h2>
    <label class="slider"><span data-t="music"></span><input type="range" id="volMusic" min="0" max="100" step="1"><b class="num" id="volMusicV"></b></label>
    <label class="slider"><span data-t="sfx"></span><input type="range" id="volSfx" min="0" max="100" step="1"><b class="num" id="volSfxV"></b></label>
    <button class="btn" data-back data-t="back"></button>
  </div>
</div>

<div class="overlay" id="ovInfo">
  <div class="card wide">
    <h2 data-t="info"></h2>
    <div id="infoBody"></div>
    <button class="btn" data-back data-t="back"></button>
  </div>
</div>

<div class="overlay" id="ovPause">
  <div class="card">
    <h2 data-t="paused"></h2>
    <div class="col">
      <button class="btn" id="btnResume" data-t="resume"></button>
      <button class="btn ghost" id="btnRestart" data-t="restart"></button>
      <button class="btn ghost" id="btnPauseSettings" data-t="settings"></button>
      <button class="btn ghost" id="btnPauseMenu" data-t="mainMenu"></button>
    </div>
  </div>
</div>

<div class="overlay" id="ovEnd">
  <div class="card">
    <h2 id="endTitle"></h2>
    <div class="sub" id="endSub"></div>
    <div class="stat" id="endStat">
      <div><b class="num" id="endTime">0.0</b><span data-t="seconds"></span></div>
      <div><b class="num" id="endBest">0.0</b><span data-t="best"></span></div>
    </div>
    <button class="btn" id="btnEnd"></button>
    <div><button class="btn ghost" id="btnEndMenu" data-t="mainMenu"></button></div>
  </div>
</div>

<script>
(() => {
'use strict';
function host() { try { return window.parent !== window ? window.parent.deepSeaEatSmaller || null : null; } catch (e) { return null; } }
function siteLang() { try { const i = window.parent !== window && window.parent.deepSeaI18n; return i ? i.getLanguage() : null; } catch (e) { return null; } }
const pickLang = l => l === 'en' ? 'en' : 'zh';
let LANG = pickLang(siteLang() || new URLSearchParams(location.search).get('lang') || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en'));
const STR = {
  zh: {
  title: '數字吞噬',
  tagline: '吃掉比你小的數字，躲開比你大的，<b>剛好</b>湊到目標數字。',
  you: '你', target: '目標', level: n => `第 ${n} 關`,
  play: '開始', cont: '繼續', levels: '選關', settings: '設定', info: '玩法說明', back: '返回',
  music: '音樂', sfx: '音效', paused: '暫停中', resume: '繼續遊戲', restart: '重來這一關', mainMenu: '主選單',
  sound: '聲音開關 (M)', pause: '暫停 (P)',
  thumb: '在這裡按住拖曳來移動',
  seconds: '秒', best: '最佳', next: '下一關', retry: '再試一次',
  exactly: t => `剛好 ${t}！`, cleared: '過關了。', finale: '12 關全部通關！',
  eatenBy: v => `被 ${v} 吃掉了`, youWere: (v, t) => `你當時是 ${v}，目標是 ${t}。`,
  timeUp: '時間到！', timeUpSub: (v, t) => `你到了 ${v}，目標是 ${t}。`,
  reach: '剛好變成 ',
  startMouse: '移動滑鼠就開始 · 也可以用方向鍵 / WASD', startTouch: '在任何地方按住拖曳就開始',
  stCleared: '過關！', stOver: n => `超過了 ${n}！找 −3 或 ÷2 降回來`, stReady: t => `剛好變成 ${t}`,
  stNeed: (n, v) => `還差 ${n}` + (n < v ? `：吃一個「${n}」就剛好` : ''),
  coach: {
    eat: '吃掉比你小的（綠色）數字來長大', red: '紅色比你大：碰到會被吃掉！', hunter: '帶尖刺的會追你，快跑！',
    exact: '吃掉發光的那個就剛好！', over: '太大了！撿 −3 或 ÷2 縮回來',
    sleep: '噓…靠太近它會醒來', flee: '長腳的點心會逃跑，把它逼到角落！',
    double: '×2 會讓你變兩倍，先算一下！', boss: '大魔王不會停，躲到尺的後面！',
    wall: '尺會擋住所有人，獵人也一樣', stain: '咖啡很黏：在裡面大家都游得比較慢',
    clock: '跟時間賽跑！',
  },
  infoHtml: `
    <div class="rules">
      <div><span class="chip" style="background:var(--m-cyan)">7</span><span>你是藍色的數字。用滑鼠、方向鍵 / WASD 控制，觸控螢幕在任何地方按住拖曳就能移動。</span></div>
      <div><span class="chip" style="background:var(--m-green)">3</span><span><b>綠色</b>比你小：碰到就吃掉，數值加到你身上。</span></div>
      <div><span class="chip" style="background:var(--m-red)">9</span><span><b>紅色</b>比你大，碰到會被吃掉。帶尖刺的會追你，睡著的靠太近會醒來。</span></div>
      <div><span class="chip" style="background:var(--m-amber)">÷2</span><span><b>運算子</b>一碰到就生效：−3、+1、÷2（無條件捨去）、×2。吃過頭時靠它們修正。</span></div>
      <div><span class="chip" style="background:#e2dccd">=</span><span><b>剛好</b>變成目標數字就過關。越大游得越慢。</span></div>
      <div><span class="chip" style="background:#f5d98b">12</span><span>共 12 關，每關都有新花樣：擋路的尺、黏黏的咖啡、沉睡的巨人、會逃跑的點心、倒數計時，還有一個超大的數字。</span></div>
    </div>
    <h3>操作</h3>
    <div class="keys"><span><kbd>滑鼠</kbd>引導方向</span><span><kbd>←↑↓→</kbd><kbd>WASD</kbd>移動</span><span><kbd>觸控</kbd>任意處拖曳</span><span><kbd>P</kbd>暫停</span><span><kbd>R</kbd>重來</span><span><kbd>M</kbd>靜音</span></div>`,},
  en: {
  title: 'Eat Smaller',
  tagline: 'Eat smaller numbers, dodge bigger ones, hit the target <b>exactly</b>.',
  you: 'You', target: 'Target', level: n => `Level ${n}`,
  play: 'Play', cont: 'Continue', levels: 'Levels', settings: 'Settings', info: 'How to play', back: 'Back',
  music: 'Music', sfx: 'Sound effects', paused: 'Paused', resume: 'Resume', restart: 'Restart level', mainMenu: 'Main menu',
  sound: 'Sound (M)', pause: 'Pause (P)',
  thumb: 'Press and drag here to move',
  seconds: 'Seconds', best: 'Best', next: 'Next level', retry: 'Try again',
  exactly: t => `Exactly ${t}!`, cleared: 'Level cleared.', finale: 'You cleared all 12 levels!',
  eatenBy: v => `Eaten by ${v}`, youWere: (v, t) => `You were ${v}; the target was ${t}.`,
  timeUp: "Time's up!", timeUpSub: (v, t) => `You reached ${v}; the target was ${t}.`,
  reach: 'Reach exactly ',
  startMouse: 'Move your mouse to start  ·  or arrow keys / WASD', startTouch: 'Drag anywhere to start',
  stCleared: 'Level cleared!', stOver: n => `Over by ${n}! Find a −3 or ÷2`, stReady: t => `Reach exactly ${t}`,
  stNeed: (n, v) => `${n} to go` + (n < v ? `: eat ${/^(8|11|18)/.test(n) ? 'an' : 'a'} ${n} to land it exactly` : ''),
  coach: {
    eat: 'Eat smaller (green) numbers to grow', red: 'Red is bigger: it eats you!', hunter: 'Spiky numbers chase you. Run!',
    exact: 'Eat the glowing one to land it exactly!', over: 'Too big! Grab a −3 or ÷2 to shrink',
    sleep: 'Shh… it wakes up if you get close', flee: 'Snacks with legs run away. Corner them!',
    double: '×2 doubles you. Count first!', boss: 'The Big One never stops. Hide behind the rulers!',
    wall: 'Rulers block everyone, hunters too', stain: 'Coffee is sticky: everyone swims slower in it',
    clock: 'Beat the clock!',
  },
  infoHtml: `
    <div class="rules">
      <div><span class="chip" style="background:var(--m-cyan)">7</span><span>You are the blue number. Steer with the mouse, the arrow keys / WASD, or drag anywhere on a touch screen.</span></div>
      <div><span class="chip" style="background:var(--m-green)">3</span><span><b>Green</b> numbers are smaller than you. Touch one to eat it and add its value.</span></div>
      <div><span class="chip" style="background:var(--m-red)">9</span><span><b>Red</b> numbers are bigger and eat you. Spiky ones chase you; sleeping ones wake up when you get close.</span></div>
      <div><span class="chip" style="background:var(--m-amber)">÷2</span><span><b>Operators</b> work the moment you touch them: −3, +1, ÷2 (rounds down) and ×2. Use them to fix an overshoot.</span></div>
      <div><span class="chip" style="background:#e2dccd">=</span><span>Hit the target <b>exactly</b> to clear the level. The bigger you get, the slower you swim.</span></div>
      <div><span class="chip" style="background:#f5d98b">12</span><span>12 levels, each with a twist: rulers that block the way, sticky coffee, sleeping giants, runaway snacks, a clock, and one very big number.</span></div>
    </div>
    <h3>Controls</h3>
    <div class="keys"><span><kbd>Mouse</kbd>steer</span><span><kbd>←↑↓→</kbd><kbd>WASD</kbd>move</span><span><kbd>Touch</kbd>drag anywhere</span><span><kbd>P</kbd>pause</span><span><kbd>R</kbd>restart</span><span><kbd>M</kbd>mute</span></div>`,}
};
let T = STR[LANG];
const tx = v => (v && typeof v === 'object') ? (v[LANG] || v.zh) : v;

// pop: numbers on the field; danger: share bigger than you; hunt: share of big ones that chase; sleep: share of big ones that doze;
// flee: share of small ones that run away; ops/opRate: operators; walls/stains: map features; time: seconds; boss: the Big One
const LEVELS = [
  { name: { zh: '暖身', en: 'Warm-up' }, start: 2, target: 12, pop: 12, danger: .25, ops: ['−3'], opRate: .12,

}
function drawTip(t) {
  const a = Math.min(1, t.t * 5, (3.2 - t.t) * 3);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `700 22px ${FONT}`;
  const tw = ctx.measureText(t.text).width + 28, th = 40;
  const above = player.y - player.r - 70 > 0;
  let cx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, player.x));
  const cy = above ? player.y - player.r - 42 : player.y + player.r + 42;
  sketchRect(cx - tw / 2, cy - th / 2, tw, th, 21, { fill: '#fff8e6', stroke: INK, lw: 2, j: 1 });
  ctx.fillStyle = '#fff8e6'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); // little pointer toward the player
  const py = above ? cy + th / 2 : cy - th / 2, dir = above ? 1 : -1, px = Math.max(cx - tw / 2 + 14, Math.min(cx + tw / 2 - 14, player.x));
  ctx.moveTo(px - 8, py); ctx.lineTo(px, py + 10 * dir); ctx.lineTo(px + 8, py); ctx.fill(); ctx.stroke();
  inkText(t.text, cx, cy + 1, 22, INK, 700);
  ctx.restore();
}
function drawEnt(e, now, boil) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const appear = Math.min(1, e.born * 3);
  ctx.scale(appear, appear);
  const seed = e.id * 31 + boil * 7;
  if (e.op) {
    if (applyOp(player.v, e.op) === L.target) { // this operator would land you exactly on the target
      ctx.save(); ctx.globalAlpha = .55 + .45 * Math.sin(now / 150);
      sketchCircle(0, 0, e.r + 10, seed + 3, { stroke: '#d9801a', lw: 2.4, dash: [6, 6], passes: 1 });
      ctx.restore();
    }
    ctx.rotate(Math.sin(e.wob * 2) * .15);
    const s = e.r + 3;
    sketchPoly([[0, -s], [s, 0], [0, s], [-s, 0]], seed, { fill: e.op === '×2' ? '#c9a6e8' : '#f6c47a', stroke: INK, lw: 2.2 });
    inkText(e.op, 0, 1, 17, INK, 700);
    ctx.restore(); return;
  }
  const rel = e.boss ? 'big' : e.v < player.v ? 'small' : e.v > player.v ? 'big' : 'eq';
  const c = COLORS[rel], r = e.r;
  const ox = player.x - e.x, oy = player.y - e.y, dist = Math.hypot(ox, oy) || 1;
  const blink = ((now / 1000 + e.id * .37) % 3.7) < .13;
  if (rel === 'small' && player.v + e.v === L.target) {
    ctx.save(); ctx.globalAlpha = .55 + .45 * Math.sin(now / 150);
    sketchCircle(0, 0, r + 8, seed + 3, { stroke: '#d9801a', lw: 2.4, dash: [6, 6], passes: 1 });
    ctx.restore();
  }
  const scared = rel === 'small' && state === 'play' && (e.running || dist < r + player.r + 90);
  if (scared) ctx.translate(Math.sin(now / 24 + e.id) * 1.1, 0);
  if (e.flee && rel === 'small') { // little legs, pedalling when it runs
    const sp = e.running ? now / 60 : now / 260;
    ctx.strokeStyle = c.ink; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
    for (const sx of [-1, 1]) { const kx = sx * r * .38, sw = Math.sin(sp + (sx > 0 ? Math.PI : 0)) * 5; ctx.moveTo(kx, r * .8); ctx.lineTo(kx + sw, r + 7); ctx.lineTo(kx + sw + 4 * sx, r + 7); }
    ctx.stroke();
  }
  if ((e.hunter && rel === 'big' && !e.sleeping) || e.boss) { // spiky outline for hunters
    const a0 = Math.atan2(e.vy, e.vx) + (e.boss ? now / 900 : 0), R = rng(seed);
    ctx.strokeStyle = c.ink; ctx.lineWidth = e.boss ? 3 : 2.2; ctx.lineJoin = 'round'; ctx.beginPath();
    const n = e.boss ? 16 : 9;
    for (let k = 0; k <= n * 2; k++) {
      const a = a0 + k / (n * 2) * 6.2832, rr = k % 2 ? r + 3 : r + (e.boss ? 15 : 10) + (R() - .5) * 3;
      k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    if (e.boss) { ctx.fillStyle = 'rgba(242,165,148,.35)'; ctx.fill(); }
    ctx.stroke();
  }
  sketchCircle(0, 0, r, seed, { fill: e.boss ? 'rgba(232,120,100,.75)' : c.wash, stroke: c.ink, lw: e.boss ? 3.2 : 2.4 });
  if (rel === 'big') {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r - 3, 0, 6.2832); ctx.clip();
    hatch(-r, -r, r * 2, r * 2, e.id, 'rgba(200,64,47,.28)', 6, 1.2);
    ctx.restore();
  }
  const fs = Math.round(Math.max(21, Math.min(30, r * 1.1)));
  if (e.boss) {
    inkText(e.v, 0, r * .36, 34, '#8a2418', 700);
    drawEyes(0, -r * .3, r * .9, ox / dist, oy / dist, { brows: 'angry', blink });
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 1.6; // fangs
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * r * .22, r * .02); ctx.lineTo(sx * r * .12, r * .02); ctx.lineTo(sx * r * .17, r * .16); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  } else if (rel === 'big' && r >= 24) { // big ones watch you; hunters frown, sleepers doze
    inkText(e.v, 0, r * .3, Math.min(fs, Math.round(r * .85)), c.ink, 700);
    drawEyes(0, -r * .36, r, ox / dist, oy / dist, { closed: e.sleeping, blink: blink && !e.sleeping, brows: e.locked ? 'angry' : null });
  } else if (rel === 'small') { // small ones have dot eyes; they go wide when you get close
    const ey = -r * .44, gx = r * .28;
    inkText(e.v, 0, r * .16, Math.round(fs * .92), c.ink, 700);
    if (scared) {
      for (const sx of [-1, 1]) { ctx.fillStyle = '#fff'; ctx.strokeStyle = c.ink; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(sx * gx, ey, 3.6, 0, 6.2832); ctx.fill(); ctx.stroke(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(sx * gx + ox / dist * 1.2, ey + oy / dist * 1.2, 1.3, 0, 6.2832); ctx.fill(); }
      ctx.fillStyle = '#8fd3e8'; ctx.strokeStyle = c.ink; ctx.lineWidth = 1.2; const dx = r * .82, dy = -r * .5;
      ctx.beginPath(); ctx.moveTo(dx, dy - 5); ctx.quadraticCurveTo(dx + 4, dy + 1, dx, dy + 3); ctx.quadraticCurveTo(dx - 4, dy + 1, dx, dy - 5); ctx.fill(); ctx.stroke();
    } else if (blink) {
      ctx.strokeStyle = c.ink; ctx.lineWidth = 1.6; ctx.beginPath(); for (const sx of [-1, 1]) { ctx.moveTo(sx * gx - 2.5, ey); ctx.lineTo(sx * gx + 2.5, ey); } ctx.stroke();
    } else {
      ctx.fillStyle = c.ink; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * gx, ey, Math.max(1.8, r * .085), 0, 6.2832); ctx.fill(); }
    }
  } else inkText(e.v, 0, 1, fs, c.ink, 700);
  if (e.sleeping && rel === 'big') { // z Z floating up
    for (let k = 0; k < 2; k++) {
      const t = ((now / 1400 + k * .5 + e.id * .13) % 1);
      ctx.globalAlpha = Math.sin(t * Math.PI);
      inkText(k ? 'Z' : 'z', r * .7 + t * 12, -r * .8 - t * 22, 14 + k * 5, '#7d776b', 700);
    }
    ctx.globalAlpha = 1;
  }
  if (e.locked && !e.boss) { // a hunter that has spotted you
    const bob = Math.sin(now / 90) * 2;
    inkText('!', 0, -r - 20 + bob, 28, '#c8402f', 700);
  }
  ctx.restore();
}
// Title-screen mascot: the blue number chomping toward a nervous small one, with a big one glaring from behind
const mascotCv = document.getElementById('mascot'), mascotCtx = mascotCv.getContext('2d');
function drawMascot(now) {
  const main = ctx; ctx = mascotCtx;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 210, 104);
  const boil = Math.floor(now / 170), bob = Math.sin(now / 300) * 2;
  // big red, glaring
  ctx.save(); ctx.translate(166, 50 - bob);
  sketchCircle(0, 0, 33, 400 + boil * 7, { fill: 'rgba(242,165,148,.6)', stroke: '#c8402f', lw: 2.4 });
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 30, 0, 6.2832); ctx.clip(); hatch(-33, -33, 66, 66, 3, 'rgba(200,64,47,.28)', 6, 1.2); ctx.restore();
  inkText('9', 0, 10, 26, '#c8402f', 700);
  drawEyes(0, -12, 33, -1, .2, { brows: 'angry', blink: (now / 1000 % 4.1) < .13 });
  ctx.restore();
  // small green, scared
  ctx.save(); ctx.translate(108 + Math.sin(now / 24) * 1, 60);
  sketchCircle(0, 0, 21, 500 + boil * 7, { fill: 'rgba(169,217,143,.6)', stroke: '#3f7a31', lw: 2.2 });
  inkText('3', 0, 4, 21, '#3f7a31', 700);
  for (const sx of [-1, 1]) { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#3f7a31'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(sx * 6, -9, 3.6, 0, 6.2832); ctx.fill(); ctx.stroke(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(sx * 6 - 1.2, -9, 1.3, 0, 6.2832); ctx.fill(); }
  ctx.restore();
  // the player
  const chomp = .5 + .5 * Math.sin(now / 160);
  drawPlayer(48, 54 + bob, 34, 7, { lx: 1, ly: .1, mouth: chomp, blink: (now / 1000 % 3.3) < .13, seed: 600 + boil * 13 });
  ctx = main;
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play' || state === 'ready' || state === 'menu') update(dt);
  else if (state === 'end') { player.pop *= Math.exp(-dt * 4); stepFx(dt); }
  draw(now);
  if (visible('ovMenu')) drawMascot(now);
  requestAnimationFrame(frame);
}

// ---------- Screens ----------
function adBreak(go) { go(); } // hook: portal builds replace this line to show an ad before Play / Next level / Try again
function show(id) {
  document.querySelectorAll('.overlay').forEach(o => o.classList.toggle('show', o.id === id));
  sfx.duck(id === 'ovPause' || id === 'ovSettings' && state === 'pause');
}
function setCur(i) { cur = i; store.set('cur', i); }
// Main menu: the current level idles behind the title
function openMain() {
  endJoy(); keys.clear(); pointer = null;
  loadLevel(cur); state = 'menu'; updHud();
  const progress = unlocked > 1 || bests[0] != null;
  document.getElementById('playLbl').textContent = progress ? T.cont : T.play;
  document.getElementById('playSub').textContent = T.level(cur + 1) + ' · ' + tx(LEVELS[cur].name);
  show('ovMenu');
}
function openLevels() {
  const box = document.getElementById('levels'); box.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.innerHTML = `${lv.target}<small>${bests[i] != null ? bests[i].toFixed(1) + 's' : T.level(i + 1)}</small>`;
    b.title = T.level(i + 1) + ' · ' + tx(lv.name);
    b.disabled = i >= unlocked;
    if (bests[i] != null) b.classList.add('done');
    if (i === cur) b.classList.add('cur');
    b.onclick = () => adBreak(() => intro(i));
    box.appendChild(b);
  });
  openSub('ovLevels');
}
let subBack = 'ovMenu';
function openSub(id) { const v = document.querySelector('.overlay.show'); subBack = v ? v.id : 'ovMenu'; show(id); }
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => show(subBack));
// Show a level on the board, waiting for the player's first move (no extra click needed).
function intro(i) { show(null); setCur(i); loadLevel(i); state = 'ready'; pointer = null; keys.clear(); updHud(); }
function begin() {
  beginPlatform();
  sfx.start(); show(null); state = 'play'; last = performance.now(); invuln = 1.2; updHud();
  if (lvIndex === 0) coach('eat');
  else if (L.boss) coach('boss', true);
  else if (L.walls) coach('wall');
  else if (L.stains) coach('stain');
  else if (L.time) coach('clock');
}
let pausedFrom = null;
function pause() {
  if (state !== 'play' && state !== 'ready') return;
  pausedFrom = state; state = 'pause'; endJoy(); keys.clear(); pointer = null;
  show('ovPause');
  const h = host(); if (h && roundOn && h.pause) h.pause(window);
}
function unpause() {
  if (state !== 'pause') return;
  state = pausedFrom; show(null); last = performance.now();
  const h = host(); if (h && roundOn && h.resume) h.resume(window);
}
function restartLevel() { loadLevel(lvIndex); show(null); state = 'ready'; begin(); }
document.getElementById('btnPlay').onclick = () => adBreak(() => intro(cur));
document.getElementById('btnLevels').onclick = openLevels;
document.getElementById('btnSettings').onclick = () => openSub('ovSettings');
document.getElementById('btnInfo').onclick = () => openSub('ovInfo');
document.getElementById('btnPause').onclick = () => state === 'pause' ? unpause() : pause();
document.getElementById('btnResume').onclick = unpause;
document.getElementById('btnRestart').onclick = restartLevel;
document.getElementById('btnPauseSettings').onclick = () => openSub('ovSettings');
document.getElementById('btnPauseMenu').onclick = openMain;
document.getElementById('btnEndMenu').onclick = openMain;
function toggleSound() { const m = sfx.toggle(); const b = document.getElementById('btnSound'); b.textContent = m ? '🔇' : '🔊'; b.style.opacity = m ? .55 : 1; }
document.getElementById('btnSound').onclick = toggleSound;
if (sfx.muted) { const b = document.getElementById('btnSound'); b.textContent = '🔇'; b.style.opacity = .55; }
// Settings: separate music and effects volume, saved on this device
for (const [id, k] of [['volMusic', 'music'], ['volSfx', 'sfx']]) {
  const el = document.getElementById(id), out = document.getElementById(id + 'V');
  el.value = Math.round(sfx.vol(k) * 100); out.textContent = el.value + '%';
  el.addEventListener('input', () => { out.textContent = el.value + '%'; sfx.setVol(k, el.value / 100); });
  if (k === 'sfx') el.addEventListener('change', () => sfx.eat(.6));
}

// Fill in the text
document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T[el.dataset.t]; });
document.getElementById('infoBody').innerHTML = T.infoHtml;
document.getElementById('btnSound').title = T.sound;
document.getElementById('btnPause').title = T.pause;
document.title = T.title;

const docLang = () => { document.documentElement.lang = LANG === 'en' ? 'en' : siteLang() === 'zh-Hans' ? 'zh-Hans' : 'zh-Hant'; };
docLang();
function setLang(next) {
  next = pickLang(next); docLang();
  if (next === LANG) return;
  LANG = next; T = STR[LANG]; docLang();
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T[el.dataset.t]; });
  document.getElementById('infoBody').innerHTML = T.infoHtml;
  document.getElementById('btnSound').title = T.sound;
  document.getElementById('btnPause').title = T.pause;
  document.title = T.title;
  updHud();
  if (document.getElementById('ovMenu').classList.contains('show')) openMain();
  if (document.getElementById('ovLevels').classList.contains('show')) openLevels();
  draw();
}
try { window.parent.addEventListener('arcade-languagechange', e => setLang(e.detail && e.detail.language)); } catch (e) {}

// Parent platform hooks
window.startEatPlatformRound = () => { if (state === 'play') return false; intro(cur); return begin(); };
window.endEatPlatformRound = () => { roundOn = false; };
window.setEatPlatformActive = v => { if (!v) pause(); };

resize();
openMain();
requestAnimationFrame(frame);
})();
</script>
