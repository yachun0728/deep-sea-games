  <section class="view" id="view-dice" hidden>
    <div class="console">
      <div class="dice-stage" id="dc-stage">
        <div class="dc-read">
          <div class="mult" id="dc-result">50.00</div>
          <div class="sub-line" id="dc-sub">{{t:dice.view.01}}</div>
        </div>
        <div>
          <div class="dc-track">
            <div class="dc-zones" id="dc-zones"></div>
            <div class="dc-marker" id="dc-marker" hidden></div>
          </div>
          <div class="dc-scale" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
        </div>
        <div class="dc-target">
          <label for="dc-target">{{t:dice.view.02}}<output id="dc-target-out" for="dc-target">50</output></label>
          <input id="dc-target" type="range" min="2" max="95" step="1" value="50">
        </div>
        <div class="history" aria-label="{{t:dice.view.20}}">
          <span class="label">{{t:dice.view.03}}</span>
          <div class="pills" id="dc-last"></div>
        </div>
      </div>
      <div class="side">
        <section class="panel" aria-label="{{t:dice.view.21}}">
          <div class="field">
            <label for="dc-amount">{{t:dice.view.04}}</label>
            <div class="input-row">
              <input id="dc-amount" type="number" inputmode="numeric" min="10" step="10" value="100">
              <button class="chip dchip" type="button" data-dchip="half">½</button>
              <button class="chip dchip" type="button" data-dchip="double">2×</button>
              <button class="chip dchip" type="button" data-dchip="max">{{t:dice.view.05}}</button>
            </div>
          </div>
          <div class="field">
            <label id="dc-mode-label">{{t:dice.view.06}}</label>
            <div class="seg-row" role="group" aria-labelledby="dc-mode-label">
              <button class="chip seg" type="button" data-dmode="under" id="dc-under">{{t:dice.view.07}}</button>
              <button class="chip seg" type="button" data-dmode="over" id="dc-over">{{t:dice.view.08}}</button>
            </div>
          </div>
          <dl class="stats">
            <div><dt>{{t:dice.view.09}}</dt><dd id="dc-chance">—</dd></div>
            <div><dt>{{t:dice.view.10}}</dt><dd id="dc-mult">—</dd></div>
            <div><dt>{{t:dice.view.11}}</dt><dd id="dc-win">—</dd></div>
          </dl>
          <button class="go" id="dc-go" type="button" data-mode="bet">{{t:dice.view.12}}</button>
          <p class="msg" id="dc-msg" aria-live="polite">{{t:dice.view.13}}</p>
        </section>
      </div>
    </div>
    <details class="rules">
      <summary>{{t:dice.view.14}}</summary>
      <p>{{t:dice.view.15}}</p>
      <p>{{t:dice.view.16}} <code>{{t:dice.view.17}}</code>{{t:dice.view.18}}</p>
      <p>{{t:dice.view.19}}</p>
    </details>
  </section>
