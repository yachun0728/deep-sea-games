<!doctype html><meta charset="utf-8"><title>Sand art picture QA</title><style>body{font:14px system-ui;background:#faf5e9;color:#544c3b}pre{white-space:pre-wrap}</style><h1>All picture geometry / adhesion QA</h1><pre id="results">Running…</pre><script>
(async()=>{const out=document.getElementById('results'),lines=[];const ok=(v,label)=>{if(!v)throw Error(label);lines.push('PASS '+label);out.textContent=lines.join('\n')};try{const html=await(await fetch('../preview/sand-art/index.html')).text();const script=document.createElement('script');script.textContent=html.match(/<script id="sand-engine">([\s\S]*?)<\/script>/)[1];document.body.append(script);const {pictureCatalog,activatePicture,paths,rasterizeRegions,SandWorld}=SandEngine;ok(pictureCatalog.length===6,'Original cat plus five new pictures');for(const picture of pictureCatalog){activatePicture(picture.id);const canvas=document.createElement('canvas');canvas.width=360;canvas.height=400;const ctx=canvas.getContext('2d'),shapes=paths.map(p=>new Path2D(p[1])),ids=rasterizeRegions(ctx,shapes,360,400,paths.map(p=>p[2]||0),paths.map(p=>p[3]===undefined?[]:shapes.slice(p[3]+1,picture.baseCount)));const counts=new Array(paths.length).fill(0);for(const id of ids)if(id>=0)counts[id]++;ok(counts.every(n=>n>0),picture.id+': every fill/line has a visible peelable area '+counts.map((n,i)=>n===0?paths[i][0]:'').filter(Boolean));const at=(x,y)=>x<0||x>=360||y<0||y>=400?-1:ids[Math.floor(x)+Math.floor(y)*360];const w=new SandWorld(at,()=>.01);for(let id=0;id<paths.length;id++)ok(w.peel(id),picture.id+': peel '+paths[id][0]);const target=counts.slice(1,picture.baseCount).reduce((best,n,i)=>n>counts[best]?i+1:best,1);let spot=null;for(let y=24;y<376&&!spot;y++)for(let x=24;x<336&&!spot;x++)if(at(x+.5,y+.5)===target&&[[-2,0],[2,0],[0,-2],[0,2]].every(([dx,dy])=>at(x+.5+dx,y+.5+dy)===target))spot=[x+.5,y+.5];ok(spot,picture.id+': broad glue area is reachable');w.reset();w.peel(target);w.emit(...spot,8,1,0);Object.assign(w.moving[0],{z:0,vz:0,vx:0,vy:0});for(let i=0;i<24;i++)w.step(1/120);ok(w.stats().bound===1&&w.grains[0].color===8,picture.id+': only the physically contacted grain binds');}activatePicture('cat');document.body.dataset.result='PASS';out.textContent=lines.join('\n')+'\nALL PICTURE REGRESSIONS PASS';}catch(e){document.body.dataset.result='FAIL';out.textContent+='\nFAIL '+e.stack}})();
</script>
