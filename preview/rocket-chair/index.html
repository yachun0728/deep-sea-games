<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f2b4a">
<title>火箭椅提早下班</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#24201f;--paper:#fbf7ec;--sun:#ffb347;--sunset:#f2784b;--dusk:#3d3a66;--dusk-dk:#24223f;--teal:#2f8f8a;--red:#d8483a;--red-dk:#7c2119}
html,body{height:100%;background:var(--dusk-dk);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--paper)}
body{position:fixed;inset:0}
#app{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:#2f2b4a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
.ol{text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 5px 0 var(--ink)}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));text-align:center;
  background:linear-gradient(180deg,rgba(47,43,74,.9),rgba(92,52,70,.92));z-index:20;gap:14px}
.screen.show{display:flex}
.screen h2{font-size:28px;font-weight:900;color:var(--sun);letter-spacing:1px;line-height:1.3}
.screen p{font-size:16px;line-height:1.6;color:#f4ead8;font-weight:600}
.screen .small{font-size:13px;color:#d9cbe0;font-weight:500}
.btn{appearance:none;border:3px solid var(--ink);border-radius:16px;padding:13px 22px;min-width:230px;font-size:18px;font-weight:900;cursor:pointer;
  background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--ink);font-family:inherit;letter-spacing:1px;line-height:1.3}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sec{background:var(--paper)}
.btn.red{background:var(--red);color:var(--paper)}
.btn.ghost{background:transparent;border:none;color:#e6d9ee;box-shadow:none;font-size:15px;font-weight:600;text-decoration:underline;padding:6px;min-width:0}
.btn.ghost:active{transform:none}
.btn.small{min-width:0;padding:7px 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled],.btn.dim{opacity:.45}
.btn-sub{display:block;font-size:12px;font-weight:600;letter-spacing:0;opacity:.85}
.pill{font-size:14px;font-weight:700;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;line-height:1.4;box-shadow:0 3px 0 var(--ink)}
.pill b{color:var(--red);font-size:17px;font-weight:900}
.pill .w-sub{font-size:11px;font-weight:500;color:#6b5f66}
.pill:empty{display:none}
.privacy{font-size:13px;font-weight:700;color:var(--ink);background:#cfeee9;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;line-height:1.5;max-width:320px}

/* 首頁 */
#s-title{justify-content:space-between;background:linear-gradient(180deg,rgba(47,43,74,.25) 0%,rgba(47,43,74,0) 40%,rgba(47,43,74,0) 60%,rgba(36,34,63,.85) 100%);pointer-events:none}
#s-title button{pointer-events:auto}
.t-top{margin-top:calc(54px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px}
.t-bot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px}
#logo{display:flex;flex-direction:column;align-items:center;line-height:1.05;transform:rotate(-4deg)}
#logo .l1{font-size:52px;font-weight:900;color:var(--sun);letter-spacing:4px;
  text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 9px 0 var(--red-dk)}
#logo .l2{font-size:40px;font-weight:900;color:var(--paper);letter-spacing:8px;margin-top:6px;transform:rotate(3deg);
  text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 8px 0 var(--teal)}
#t-sub{font-size:15px;font-weight:700;color:var(--paper);margin-top:10px}
#btn-story{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:25}
#mute{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;z-index:25;width:46px;height:46px;padding:0;border:none;background:none;cursor:pointer}
#mute svg{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 0 var(--ink))}
#mute:active{transform:translateY(2px)}
#mute .slash{opacity:0}#mute.muted .waves{opacity:0}#mute.muted .slash{opacity:1}

/* 校準 */
#calib-step{font-size:26px;font-weight:900;color:var(--sun)}
#calib-meter{width:260px;height:26px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);overflow:hidden;box-shadow:0 3px 0 var(--ink);position:relative}
#calib-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--teal),var(--sun),var(--red))}
#calib-prog{width:260px;height:8px;border-radius:4px;background:rgba(251,247,236,.25);overflow:hidden}
#calib-prog div{height:100%;width:0;background:var(--paper)}

#s-ad{background:#9a9a9a}
#s-ad p{color:#222}
#ad-count{font-size:80px;font-weight:900;color:#333}

#s-result{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;gap:10px}
#r-head{font-size:26px;font-weight:900;color:var(--paper);line-height:1.35;margin-top:6px}
#r-head b{color:var(--sun);font-size:34px}
#r-title{font-size:15px;font-weight:700;color:#e6d9ee}
#r-title b{display:inline-block;margin-top:2px;font-size:28px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:10px;padding:2px 14px;box-shadow:0 4px 0 var(--ink);transform:rotate(-2deg)}
#r-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:330px}
#r-stats div{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:5px 6px;font-size:12px;font-weight:700;line-height:1.3}
#r-stats div b{display:block;font-size:19px;color:var(--red)}
#r-cards{display:flex;flex-direction:column;gap:8px;width:100%;max-width:330px}
.card{background:#fff3c4;color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:800;line-height:1.4;text-align:left;box-shadow:0 3px 0 var(--ink)}
.card:nth-child(odd){transform:rotate(-1.2deg)}.card:nth-child(even){transform:rotate(1deg)}
.card small{display:block;font-size:11px;color:#8a6a3a;font-weight:700}
#s-result .btn{min-width:250px;padding:11px 20px;font-size:17px}
#rotate{position:absolute;inset:0;z-index:60;background:var(--dusk-dk);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:18px;font-weight:700}
#rotate.show{display:flex}
#toast{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);z-index:70;background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:10px 16px;border-radius:12px;
  font-size:15px;font-weight:700;line-height:1.5;max-width:86%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 0 var(--ink)}
#toast.show{opacity:1}
#debug{position:absolute;left:4px;top:120px;z-index:50;font:11px/1.35 ui-monospace,Menlo,monospace;background:rgba(20,20,40,.78);color:#8fffb0;padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:auto}
#debug button{font:11px ui-monospace,monospace;margin:4px 4px 0 0;padding:3px 6px;border-radius:4px;border:none;background:#2c6;color:#012}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="safe"></div>

  <!-- 首頁 -->
  <div id="s-title" class="screen show">
    <div class="t-top">
      <div id="logo"><span class="l1">火箭椅</span><span class="l2">提早下班</span></div>
      <div id="t-sub" class="ol">對著手機大吼，衝破 5 層樓</div>
    </div>
    <div class="t-bot">
      <div id="t-wallet" class="pill"></div>
      <button class="btn" id="btn-start">準備落跑</button>
    </div>
  </div>
  <button class="btn sec small hidden" id="btn-story">看故事</button>
  <button id="mute" class="hidden" aria-label="音效開關"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#fbf7ec" stroke="#24201f" stroke-width="3.5"/><path d="M15 26h8l11-9v30l-11-9h-8z" fill="#2f8f8a" stroke="#24201f" stroke-width="3" stroke-linejoin="round"/><g class="waves" fill="none" stroke="#24201f" stroke-width="3" stroke-linecap="round"><path d="M40 25q5 7 0 14"/><path d="M45 20q9 12 0 24"/></g><g class="slash" stroke="#d8483a" stroke-width="4" stroke-linecap="round"><path d="M40 24l12 16M52 24l-12 16"/></g></svg></button>

  <!-- 選模式＋點火 -->
  <div id="s-mode" class="screen">
    <div class="privacy">聲音只在你的手機上判斷大小，不會錄音，也不會上傳</div>
    <h2 class="ol">對著手機大吼，點火！</h2>
    <button class="btn red" id="btn-normal">正常模式・點火<span class="btn-sub">大吼一聲就能衝</span></button>
    <button class="btn sec" id="btn-quiet">小聲模式・點火<span class="btn-sub">在捷運上也能玩，哼歌就能飛</span></button>
    <button class="btn ghost" id="btn-touch">不方便出聲？用按的玩</button>
    <div id="mode-wallet" class="pill"></div>
    <button class="btn ghost" id="btn-mode-back">回首頁</button>
  </div>

  <!-- 校準 -->
  <div id="s-calib" class="screen">
    <div class="privacy">聲音只在你的手機上判斷大小，不會錄音，也不會上傳</div>
    <div id="calib-step" class="ol">請安靜 2 秒</div>
    <p id="calib-desc">正在聽聽辦公室有多吵</p>
    <div id="calib-meter"><div id="calib-fill"></div></div>
    <div id="calib-prog"><div></div></div>
    <button class="btn sec small hidden" id="btn-skip-calib">跳過校準（用上次的設定）</button>
  </div>

  <!-- 讀不到麥克風 -->
  <div id="s-micfail" class="screen">
    <h2 class="ol" id="mf-title">這裡讀不到麥克風</h2>
    <p id="mf-desc">請用 Safari / Chrome 開啟</p>
    <button class="btn sec" id="btn-copy">複製網址</button>
    <button class="btn" id="btn-mf-touch">用按的玩</button>
    <button class="btn ghost" id="btn-mf-back">回首頁</button>
  </div>

  <!-- 暫停／繼續 -->
  <div id="s-pause" class="screen">
    <h2 class="ol" id="pause-title">先躲一下</h2>
    <p id="pause-desc">主管還在開會，趕快回來</p>
    <button class="btn red" id="btn-resume">繼續落跑</button>
  </div>

  <!-- 續命 -->
  <div id="s-revive" class="screen">
    <h2 class="ol">主管要開完會了！</h2>
    <p id="revive-sub"></p>
    <div id="revive-wallet" class="pill"></div>
    <button class="btn" id="btn-ad">看 5 秒示範廣告<span class="btn-sub" id="ad-sub">主管的會議延長 20 秒（每局 1 次）</span></button>
    <button class="btn sec" id="btn-coffee"></button>
    <div class="small" id="coffee-note"></div>
    <button class="btn ghost" id="btn-quit">放棄，乖乖留下</button>
  </div>

  <div id="s-ad" class="screen">
    <p>示範廣告</p>
    <div id="ad-count">5</div>
    <p class="small" style="color:#333">這不是真的廣告</p>
  </div>

  <div id="s-low" class="screen">
    <h2 class="ol">點數不夠</h2>
    <p>每局需要 <span id="low-fee"></span> 點</p>
    <div id="low-wallet" class="pill"></div>
    <button class="btn" id="btn-low-ad">看 5 秒示範廣告<span class="btn-sub">之後 30 分鐘開局不扣點</span></button>
    <button class="btn ghost" id="btn-low-back">回首頁</button>
  </div>

  <!-- 結算 -->
  <div id="s-result" class="screen">
    <div id="r-head" class="ol"></div>
    <div id="r-title"></div>
    <div id="r-stats"></div>
    <div id="r-cards"></div>
    <button class="btn red" id="btn-retry">再吼一次</button>
    <button class="btn sec" id="btn-share">分享成績</button>
    <button class="btn sec" id="btn-next">想玩第 2 關？</button>
    <div id="r-wallet" class="pill"></div>
    <button class="btn ghost" id="btn-home">回首頁</button>
  </div>

  <div id="rotate"><div>請把手機轉回直的</div><div class="small" style="font-size:13px;opacity:.8">遊戲先暫停</div></div>
  <div id="toast"></div>
  <div id="debug" class="hidden"><div id="debug-text"></div>
    <button id="dbg-clear">直接過關</button><button id="dbg-fail">直接失敗</button><button id="dbg-export">匯出事件</button></div>
</div>

<script>
'use strict';
/* =========================================================
   可調參數
   ========================================================= */
const CONFIG = {
  // 時間
  meetingSeconds: 60,          // 主管會議倒數
  startClock: '16:30',
  offClock: '18:00',

  // 吼聲
  ambientMargin: 1.3,          // 環境噪音乘上多少當作 0
  quietModeScale: 0.4,         // 小聲模式的最大聲基準 = 校準最大聲 × 這個數
  roarCurve: 0.5,              // 音量換算吼聲值的曲線（0.5 = 開根號，小聲的人比較好飛）
  smoothing: 0.2,
  levelFall: 0.15,
  levelHover: 0.35,
  levelFast: 0.7,

  // 推力
  gravity: 500,
  thrustMax: 900,
  drag: 1.6,                   // 空氣阻力（決定最高速度）
  burstJumpFrom: 0.3,
  burstJumpTo: 0.8,
  burstWindow: 0.15,           // 秒
  burstImpulse: 650,
  burstDuration: 0.6,          // 衝刺時不受重力／阻力影響的秒數
  burstCooldown: 1.5,

  // 天花板
  ceilingBreakSpeed: 600,      // 速度超過多少才撞得破（衝刺才達得到）
  ceilingBounce: 200,
  breakExitSpeed: 220,         // 撞破天花板後的速度上限

  // 障礙
  grabSeconds: 1,
  grabClockPenalty: 3,         // 分鐘
  grabPull: 120,
  handInterval: 1.5,           // 左右輪流伸手的間隔
  handLaneGap: 3.0,            // 同一排兩次伸手至少隔幾秒
  paperWaveInterval: 2.6,
  paperFallDistance: 320,      // 報帳單從天花板掉多遠就散開
  paperKnock: 300,
  meetingSecondsStuck: 2,
  beamPeriod: 4.4,             // 投影機光束來回一趟幾秒
  beamSweep: 240,              // 光束左右掃多遠
  beamHalfWidth: 50,           // 光斑半寬
  meetingClockPenalty: 5,
  gossipStickSeconds: 1,
  gossipInterval: 1.25,
  sprinklerThrustRatio: 0.5,
  hitInvuln: 1.4,

  // 備案
  touchHoldLevel: 0.6,
  touchIdleLevel: 0.2,         // 用按的玩：放手時慢慢下降
  doubleTapSeconds: 0.32,

  // 麥克風
  micCheckSeconds: 1.5,

  // 點數／續命
  entryFee: 10,
  adExtendSeconds: 20,
  adContinuePerGame: 1,
  fakeAdSeconds: 5,
  adFreeMinutes: 30,
  coffeeCost: 30,
  coffeeExtendSeconds: 15,
  coffeeBoostSeconds: 10,
};

const TRACK_ENDPOINT = '';
const GAME_ID = 'rocket_chair';
const EVENTS_KEY = 'rocket_chair_events';
const CALIB_KEY = 'rocket_chair_calib';
const SEEN_KEY = 'rocket_chair_seen_story';
const DAY_KEY = 'rocket_chair_day';
const MUTE_KEY = 'rocket_chair_muted';
const DEBUG = new URLSearchParams(location.search).get('debug') === '1';

/* 世界尺寸（單位：畫面寬 = 400） */
const VW = 400, FH = 820, SLAB = 34, FLOORS = 5, CH = 124, CHW = 34;
const FLOOR_INFO = [
  { name: '1F 業務部', wall: '#f4e6c8', trim: '#d9b77c' },
  { name: '2F 財務部', wall: '#dfeacf', trim: '#a8c08a' },
  { name: '3F 會議室', wall: '#dce3f2', trim: '#99a8cf' },
  { name: '4F 茶水間', wall: '#f5dcd0', trim: '#dba08b' },
  { name: '5F 頂樓前', wall: '#e6e1d6', trim: '#b4ab98' },
];
const LANES = [[290, 470, 640], [], [300, 560], [230, 420, 610], [250, 520]];
const INK = '#24201f';
const FONT = '-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

/* =========================================================
   小工具
   ========================================================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIO = (t) => { t = clamp(t, 0, 1); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const rand = (a, b) => a + Math.random() * (b - a);
const nowS = () => performance.now() / 1000;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const UA = navigator.userAgent || '';
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);
const IS_MOBILE = IS_IOS || IS_ANDROID;

function toast(msg, sec = 2.4) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('show'), sec * 1000);
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function cleanUrl() { return location.origin + location.pathname; }
function clockMin(str) { const [h, m] = str.split(':').map(Number); return h * 60 + m; }
function fmtClock(mins) { const h = Math.floor(mins / 60), m = Math.floor(mins % 60); return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }

/* =========================================================
   數據紀錄（只記數字，不記任何聲音）
   ========================================================= */
let inputMode = 'voice';   // voice / voice_quiet / touch
const playerId = (() => {
  let id = lsGet('mini_player_id');
  if (!id) { id = 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet('mini_player_id', id); }
  return id;
})();
function track(eventName, data = {}) {
  const rec = { ts: new Date().toISOString(), player_id: playerId, game_id: GAME_ID, input_mode: inputMode, event: eventName, data };
  if (DEBUG) console.log('[track]', eventName, data);
  try {
    const arr = JSON.parse(lsGet(EVENTS_KEY) || '[]');
    arr.push(rec); if (arr.length > 3000) arr.splice(0, arr.length - 3000);
    lsSet(EVENTS_KEY, JSON.stringify(arr));
  } catch (e) {}
  if (TRACK_ENDPOINT) {
    try {
      fetch(TRACK_ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ player_id: playerId, game_id: GAME_ID, input_mode: inputMode, event: eventName, data }) }).catch(() => {});
    } catch (e) {}
  }
}
function todayCount() {
  const d = new Date(); const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();

const Wallet = {
  STORE: 'crush-depth-balance', REGEN_KEY: 'deep-sea-regen-at', FREE_KEY: 'deep-sea-free-until',
  START: 500, REGEN_CAP: 100, REGEN_MS: 60000,
  bal: 500, regenAt: Date.now(), last: 500,
  load() {
    const v = parseInt(lsGet(this.STORE), 10); this.bal = isFinite(v) && v >= 0 ? v : this.START;
    const t = Number(lsGet(this.REGEN_KEY)); if (isFinite(t) && t > 0) this.regenAt = t;
    this.last = this.bal; this.tick(Date.now());
  },
  save() {
    if (this.last >= this.REGEN_CAP && this.bal < this.REGEN_CAP) this.regenAt = Date.now();
    this.last = this.bal;
    lsSet(this.STORE, String(this.bal)); lsSet(this.REGEN_KEY, String(this.regenAt));
  },
  tick(now = Date.now()) {
    const v = parseInt(lsGet(this.STORE), 10); if (isFinite(v) && v >= 0 && v !== this.bal) { this.bal = v; this.last = v; }
    if (this.bal >= this.REGEN_CAP) { this.regenAt = now; return false; }
    if (now < this.regenAt) this.regenAt = now;
    const mins = Math.floor((now - this.regenAt) / this.REGEN_MS);
    if (mins < 1) return false;
    this.bal += Math.min(mins, this.REGEN_CAP - this.bal);
    this.regenAt = this.bal >= this.REGEN_CAP ? now : this.regenAt + mins * this.REGEN_MS;
    this.save(); return true;
  },
  spend(n) { if (this.bal < n) return false; this.bal -= n; this.save(); return true; },
  freeLeftMs() { const t = Number(lsGet(this.FREE_KEY)); return Math.max(0, (isFinite(t) ? t : 0) - Date.now()); },
  isFree() { return this.freeLeftMs() > 0; },
  grantFree(min) { lsSet(this.FREE_KEY, String(Date.now() + min * 60000)); },
  canStart() { return this.isFree() || this.bal >= CONFIG.entryFee; },
};
function walletText() {
  if (Wallet.isFree()) { const s = Math.ceil(Wallet.freeLeftMs() / 1000); return `免費時間 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}・開局不扣點`; }
  let t = `餘額 <b>${Wallet.bal}</b> 點・每局 ${CONFIG.entryFee} 點`;
  if (Wallet.bal < Wallet.REGEN_CAP) {
    const s = Math.max(1, Math.min(60, Math.ceil((Wallet.REGEN_MS - (Date.now() - Wallet.regenAt)) / 1000)));
    t += `<br><span class="w-sub">下一點 0:${String(s % 60).padStart(2, '0')}・回到 ${Wallet.REGEN_CAP} 點為止</span>`;
  }
  return t;
}
function renderWallet() {
  const html = walletText();
  for (const id of ['t-wallet', 'mode-wallet', 'revive-wallet', 'r-wallet', 'low-wallet']) { const el = $(id); if (el && el.innerHTML !== html) el.innerHTML = html; }
  if (appState === 'revive') renderRevive();

/* =========================================================
   音效（Web Audio 合成）
   ========================================================= */
let actx = null, master = null, muted = lsGet(MUTE_KEY) === '1';
function ensureAudio() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); master = actx.createGain(); master.connect(actx.destination); }
    if (actx.state === 'suspended') actx.resume();
    master.gain.value = muted ? 0 : (inputMode === 'touch' ? 0.5 : 0.28); // 用聲控時音效小聲一點，避免被麥克風收進去
  } catch (e) {}
  return actx;
}
const Snd = {
  tone(f, d, type = 'square', v = 0.2, f2 = null, delay = 0) {
    if (!actx || muted) return; const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d, v = 0.3, freq = 1200, delay = 0) {
    if (!actx || muted) return; const t = actx.currentTime + delay;
    const n = Math.floor(actx.sampleRate * d), b = actx.createBuffer(1, n, actx.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  },
  bonk() { this.tone(180, 0.18, 'triangle', 0.35, 70); },
  crash() { this.noise(0.5, 0.45, 2200); this.tone(120, 0.3, 'sawtooth', 0.15, 40); },
  burst() { this.noise(0.35, 0.3, 900); this.tone(220, 0.3, 'sawtooth', 0.12, 660); },
  grab() { this.tone(520, 0.08, 'square', 0.15, 300); this.tone(300, 0.12, 'square', 0.12, 200, 0.08); },
  paper() { this.noise(0.25, 0.3, 4000); },
  meeting() { this.tone(660, 0.4, 'sine', 0.2); this.tone(440, 0.5, 'sine', 0.2, null, 0.25); },
  pop() { this.tone(800, 0.08, 'sine', 0.2, 1400); },
  splash() { this.noise(0.3, 0.2, 3000); },
  ding() { this.tone(1320, 1.0, 'sine', 0.3); this.tone(1980, 0.8, 'sine', 0.12); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, 'square', 0.12, null, i * 0.1)); },
  sad() { [392, 349, 311, 262].forEach((f, i) => this.tone(f, 0.35, 'triangle', 0.15, null, i * 0.22)); },
  click() { this.tone(900, 0.04, 'square', 0.08); },
};

/* =========================================================
   麥克風：只計算音量（RMS），不錄音、不上傳
   ========================================================= */
const Mic = {
  stream: null, src: null, an: null, buf: null, fbuf: null, on: false, rms: 0, startT: 0, gotSignal: false,
  start() {   // 必須在點擊事件裡同步呼叫
    ensureAudio();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !actx) return Promise.resolve('unavailable');
    const req = (c) => navigator.mediaDevices.getUserMedia(c);
    let p;
    try { p = req({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
    catch (e) { return Promise.resolve('unavailable'); }
    return p.catch((err) => {
      if (err && (err.name === 'OverconstrainedError' || err.name === 'TypeError')) return req({ audio: true });
      throw err;
    }).then((stream) => {
      this.stop();
      this.stream = stream;
      try {
        this.src = actx.createMediaStreamSource(stream);
        this.an = actx.createAnalyser(); this.an.fftSize = 1024; this.an.smoothingTimeConstant = 0;
        this.src.connect(this.an);   // 不接到喇叭，只讀數值
        this.fbuf = new Float32Array(this.an.fftSize); this.buf = new Uint8Array(this.an.fftSize);
      } catch (e) { this.stop(); return 'unavailable'; }
      this.on = true; this.startT = nowS(); this.gotSignal = false; this.rms = 0;
      return 'granted';
    }, (err) => (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError' || err.name === 'PermissionDeniedError')) ? 'denied' : 'unavailable');
  },
  read() {
    if (!this.on || !this.an) return 0;
    let sum = 0, n = this.an.fftSize;
    if (this.an.getFloatTimeDomainData) { this.an.getFloatTimeDomainData(this.fbuf); for (let i = 0; i < n; i++) sum += this.fbuf[i] * this.fbuf[i]; }
    else { this.an.getByteTimeDomainData(this.buf); for (let i = 0; i < n; i++) { const v = (this.buf[i] - 128) / 128; sum += v * v; } }
    this.rms = Math.sqrt(sum / n);
    if (this.rms > 1e-6) this.gotSignal = true;
    return this.rms;
  },
  failedCheck() { return this.on && !this.gotSignal && nowS() - this.startT > CONFIG.micCheckSeconds; },
  stop() {   // 關掉所有 track，讓手機的麥克風指示燈熄滅
    try { if (this.src) this.src.disconnect(); } catch (e) {}
    try { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    this.stream = null; this.src = null; this.an = null; this.on = false; this.rms = 0;
  },
};

/* 校準值 */
const Calib = {
  ambient: 0.01, max: 0.2, has: false,
  load() { try { const o = JSON.parse(lsGet(CALIB_KEY) || 'null'); if (o && o.ambient > 0 && o.max > 0) { this.ambient = o.ambient; this.max = o.max; this.has = true; } } catch (e) {} },
  save() { this.has = true; lsSet(CALIB_KEY, JSON.stringify({ ambient: this.ambient, max: this.max })); },
  zero() { return Math.max(1e-4, this.ambient * CONFIG.ambientMargin); },
  one() {
    const z = this.zero();
    const base = inputMode === 'voice_quiet' ? this.max * CONFIG.quietModeScale : this.max;
    return Math.max(base, z * (inputMode === 'voice_quiet' ? 2 : 3));
  },
  roar(rms) { const z = this.zero(), o = this.one(); if (rms <= z) return 0; return Math.pow((rms - z) / (o - z), CONFIG.roarCurve); },
};

/* 點火：在點擊事件裡同步要麥克風 */
function ignite(mode, fromRetry) {
  inputMode = mode; ensureAudio();
  track('mode_select', { mode: mode === 'voice' ? 'normal' : mode === 'voice_quiet' ? 'quiet' : 'touch' });
  if (needPoints(null)) return;
  if (mode === 'touch') { startGame(); return; }
  const p = Mic.start();
  p.then((res) => {
    track('mic_permission', { result: res });

    if (fromRetry && Calib.has) startGame(); else startCalib();

}

function micFail(res) {
  Mic.stop();
  $('mf-title').textContent = res === 'denied' ? '沒有拿到麥克風權限' : '這裡讀不到麥克風';
  $('mf-desc').textContent = res === 'denied' ? '可以到瀏覽器設定允許麥克風，或先用按的玩' : '請用 Safari / Chrome 開啟';
  if (G && !G.done) G.pausedByMic = true;
  appState = 'micfail'; showScreen('s-micfail');
}

/* ---------- 校準 ---------- */
let CAL = null;
function startCalib() {
  CAL = { phase: 'quiet', t: 0, sum: 0, n: 0, max: 0, retried: false };
  $('btn-skip-calib').classList.toggle('hidden', !Calib.has);
  setCalibText('請安靜 2 秒', '正在聽聽辦公室有多吵');
  appState = 'calib'; showScreen('s-calib');
}
function setCalibText(a, b) { $('calib-step').textContent = a; $('calib-desc').textContent = b; }
function updateCalib(dt) {
  const r = Mic.read();
  if (Mic.failedCheck()) { track('mic_permission', { result: 'unavailable' }); micFail('unavailable'); return; }
  CAL.t += dt;
  const live = clamp(Math.sqrt(r / Math.max(Calib.max, 0.15)), 0, 1);
  $('calib-fill').style.width = (live * 100).toFixed(1) + '%';
  $('calib-prog').firstChild.style.width = clamp(CAL.t / 2, 0, 1) * 100 + '%';
  if (CAL.phase === 'quiet') {
    if (CAL.t > 0.25) { CAL.sum += r; CAL.n++; }
    if (CAL.t >= 2) {
      CAL.ambient = CAL.n ? CAL.sum / CAL.n : r;
      CAL.phase = 'yell'; CAL.t = 0; CAL.max = 0;
      setCalibText(inputMode === 'voice_quiet' ? '輕輕哼一聲試試看！' : '大吼一聲試試看！', inputMode === 'voice_quiet' ? '小聲模式：之後輕輕哼歌就能飛' : '用你最大的聲音，等一下就是這麼大聲才衝得快');
    }
  } else if (CAL.phase === 'yell') {
    CAL.max = Math.max(CAL.max, r);
    if (CAL.t >= 2) {
      const amb = Math.max(CAL.ambient, 1e-4);
      if (CAL.max < amb * 2.2 && !CAL.retried) {
        CAL.retried = true; CAL.t = 0; CAL.max = 0;
        setCalibText('好像沒聽到，再一次！', '對著手機大聲一點');
        return;
      }
      Calib.ambient = amb;
      Calib.max = Math.max(CAL.max, amb * 3);
      Calib.save();
      track('calibration_done', { ambient: +amb.toFixed(5), max: +Calib.max.toFixed(5) });
      CAL.phase = 'done'; CAL.t = 0;
      setCalibText('校準完成！', '準備點火……');
    }
  } else if (CAL.phase === 'done' && CAL.t > 0.7) {
    CAL = null; startGame();
  }
}

/* ---------- 開局 ---------- */
function startGame() {
  ensureAudio();
  if (needPoints(null)) { Mic.stop(); return; }
  let paid = 0;
  if (!Wallet.isFree() && CONFIG.entryFee > 0) { if (!Wallet.spend(CONFIG.entryFee)) { needPoints(null); return; } paid = CONFIG.entryFee; }
  G = newGame(); G.paid = paid; G.obs = initFloorObs(0);
  particles = []; floaters = []; camB = -40; scene = null;
  Roar.raw = 0; Roar.smooth = 0; Roar.hist = []; Touch.holding = false; Touch.keyHold = false;
  track('game_start', { nth_today: todayCount(), paid });
  appState = 'play'; showScreen(null);
}

function resumePlay() {
  if (!G) { goTitle(); return; }
  G.pausedByMic = false;
  Roar.hist = []; Touch.holding = false;
  appState = 'play'; showScreen(null);
}
/* 暫停畫面上的「繼續」：在點擊裡重新開麥克風 */
function onResumeClick() {

/* ---------- 衝刺 ---------- */
function tryBurst() {
  if (!G || appState !== 'play' || G.stuck || G.cooldown > 0) return false;
  G.v = Math.max(G.v, 0) + CONFIG.burstImpulse; G.burstLeft = CONFIG.burstDuration; G.cooldown = CONFIG.burstCooldown;
  G.bursts++; shake(0.35, 5); Snd.burst(); vibrate(40);
  track('burst', { floor: G.floor + 1 });
  for (let i = 0; i < 14; i++) particles.push({ kind: 'spark', x: VW / 2 + rand(-20, 20), y: G.y, vx: rand(-80, 80), vy: rand(-300, -120), life: rand(.3, .6), size: rand(3, 6) });
  return true;
}
function shake(t, a) { shakeT = Math.max(shakeT, t); shakeAmp = Math.max(shakeAmp, a); }
function floatText(str, x, y, color = '#d8483a', size = 22) { floaters.push({ str, x, y, t: 0, color, size }); }

/* ---------- 撞到障礙 ---------- */
function hitObstacle(kind, ref) {
  if (G.invuln > 0 || G.stuck) return;
  track('obstacle_hit', { floor: G.floor + 1, kind });
  vibrate(60);
  if (kind === 'hand') {
    if (ref && G.obs) { G.obs.used = G.obs.used || {}; G.obs.used[ref.y] = true; }
    G.stuck = { kind, t: 0, dur: CONFIG.grabSeconds, ref }; G.penalty += CONFIG.grabClockPenalty; G.v = 0;
    floatText('+' + CONFIG.grabClockPenalty + ' 分鐘', VW / 2 + 60, G.y + 140); floatText('欸你有空嗎？', VW / 2, G.y + 175, '#24201f', 18);
    Snd.grab();
  } else if (kind === 'paper') {
    G.paperHits++; G.v = -CONFIG.paperKnock; G.y = Math.max(G.floor * FH, G.y - 30); G.burstLeft = 0;
    G.stuck = { kind, t: 0, dur: 0.35 }; floatText('啪！', VW / 2 + 50, G.y + 130); shake(0.25, 4); Snd.paper();
    for (let i = 0; i < 8; i++) particles.push({ kind: 'sheet', x: VW / 2 + rand(-30, 30), y: G.y + 120, vx: rand(-160, 160), vy: rand(-40, 160), life: 1.2, rot: rand(0, 6), vr: rand(-6, 6), size: 14 });
  } else if (kind === 'beam') {
    G.beamHit = true; G.stuck = { kind, t: 0, dur: CONFIG.meetingSecondsStuck, ref }; G.penalty += CONFIG.meetingClockPenalty; G.v = 0;
    floatText('+' + CONFIG.meetingClockPenalty + ' 分鐘', VW / 2 + 60, G.y + 140); floatText('被拉進會議……', VW / 2, G.y + 175, '#24201f', 18);
    Snd.meeting();
  } else if (kind === 'gossip') {
    G.stuck = { kind, t: 0, dur: CONFIG.gossipStickSeconds, ref }; G.v = 0;
    if (ref) ref.stuck = true;
    floatText('欸你知道嗎……', VW / 2, G.y + 170, '#24201f', 18); Snd.pop();
  }
  G.invuln = G.stuck.dur + CONFIG.hitInvuln;
  G.burstLeft = 0;
}

/* ---------- 過關／失敗 ---------- */
function levelClear() {
  if (G.done) return;
  G.done = true; G.cleared = true; Mic.stop();
  const total = clockMin(CONFIG.offClock) - clockMin(CONFIG.startClock);
  G.early = Math.max(0, total - (Math.floor(G.elapsed) + G.penalty));
  G.maxPct = G.mode === 'touch' ? 0 : Math.round(G.peakRms / Math.max(Calib.max, 1e-4) * 100);
  track('level_clear', { early_minutes: G.early, play_seconds: +G.elapsed.toFixed(1), bursts: G.bursts, max_roar_pct: G.maxPct });
  Snd.win(); appState = 'clearcs'; showScreen(null); scene = { kind: 'clear', t: 0 };
}
function timeUp() {
  if (G.done) return;
  G.done = true; Mic.stop();
  track('fail_timeout', { floor: G.floor + 1 });
  G.failSnap = { y: G.y, v: G.v, floor: G.floor };
  Snd.ding(); appState = 'failcs'; showScreen(null); scene = { kind: 'fail', t: 0, y0: G.y };
}

function renderRevive() {

function reviveContinue() {

/* =========================================================
   每幀更新
   ========================================================= */
function inputLevel(dt) {
  if (G.mode === 'touch') {
    const held = Touch.holding || Touch.keyHold;
    Roar.raw = held ? CONFIG.touchHoldLevel : CONFIG.touchIdleLevel;
    Roar.smooth += (Roar.raw - Roar.smooth) * (1 - Math.pow(1 - 0.35, dt * 60));
    return Roar.smooth;
  }
  const rms = Mic.read();
  if (Mic.failedCheck()) { track('mic_permission', { result: 'unavailable' }); micFail('unavailable'); return 0; }
  G.peakRms = Math.max(G.peakRms, rms);
  Roar.raw = Calib.roar(rms);
  const raw = Math.min(Roar.raw, 1.2);
  Roar.smooth += (raw - Roar.smooth) * (1 - Math.pow(1 - CONFIG.smoothing, dt * 60));
  // 短吼衝刺：0.15 秒內從 < 0.3 跳到 > 0.8
  const t = G.elapsed;
  Roar.hist.push({ t, v: raw });
  while (Roar.hist.length && Roar.hist[0].t < t - CONFIG.burstWindow) Roar.hist.shift();
  if (raw >= CONFIG.burstJumpTo && Roar.hist.some(h => h.v < CONFIG.burstJumpFrom)) { if (tryBurst()) Roar.hist = []; }
  return Roar.smooth;
}
function thrustFor(l) {
  const pts = [[0, 0], [CONFIG.levelFall, 380], [CONFIG.levelHover, 520], [CONFIG.levelFast, 800], [1, CONFIG.thrustMax]];
  if (l >= 1) return CONFIG.thrustMax;
  for (let i = 1; i < pts.length; i++) if (l <= pts[i][0]) { const [a, fa] = pts[i - 1], [b, fb] = pts[i]; return lerp(fa, fb, (l - a) / (b - a)); }
  return CONFIG.thrustMax;
}

function updatePlay(dt) {
  const level = inputLevel(dt);
  if (appState !== 'play') return;
  G.elapsed += dt; G.ft += dt;
  if (level > CONFIG.levelHover) G.roarSec += dt;
  G.invuln = Math.max(0, G.invuln - dt); G.cooldown = Math.max(0, G.cooldown - dt);
  G.coffeeLeft = Math.max(0, G.coffeeLeft - dt); G.hintT = Math.max(0, G.hintT - dt); G.startHintT = Math.max(0, G.startHintT - dt);
  const base = G.floor * FH, ceilY = (G.floor + 1) * FH - SLAB;

  updateObstacles(dt);

  if (G.stuck) {
    const s = G.stuck; s.t += dt;
    if (s.kind === 'hand') G.y = Math.max(base, G.y - CONFIG.grabPull * dt / s.dur);
    else if (s.kind === 'paper') { G.v -= CONFIG.gravity * dt; G.y = Math.max(base, G.y + G.v * dt); }
    else if (s.kind === 'beam') G.y = Math.max(base, G.y - 20 * dt);
    if (s.t >= s.dur) { if (s.ref) s.ref.dead = true; G.stuck = null; G.v = Math.min(G.v, 0); }
  } else {
    let thrust = thrustFor(level);
    if (G.coffeeLeft > 0 && thrust > CONFIG.gravity) thrust = CONFIG.gravity + (thrust - CONFIG.gravity) * 2;
    if (G.mist) thrust *= CONFIG.sprinklerThrustRatio;
    if (G.burstLeft > 0) { G.burstLeft -= dt; }
    else G.v += (thrust - CONFIG.gravity - CONFIG.drag * G.v) * dt;
    G.y += G.v * dt;
  }
  if (G.y < base) { G.y = base; if (G.v < 0) G.v = 0; }

  // 天花板
  if (G.y + CH > ceilY) {
    if (G.v >= CONFIG.ceilingBreakSpeed) breakCeiling();
    else {
      G.y = ceilY - CH; G.v = -CONFIG.ceilingBounce; G.burstLeft = 0;
      G.bounces[G.floor]++; Snd.bonk(); shake(0.15, 3); floatText('咚！', VW / 2 - 60, ceilY - 20, '#24201f', 24);
      track('ceiling', { floor: G.floor + 1, result: 'bounce' });
      if (!G.hintShown) { G.hintShown = true; G.hintT = 3.2; }
    }
  }

  // 表情
  G.arms = 'down';
  if (G.stuck) G.face = { hand: 'scared', paper: 'ouch', beam: 'daze', gossip: 'awk' }[G.stuck.kind];
  else if (G.burstLeft > 0) { G.face = 'yell'; G.arms = 'up'; }
  else if (G.mist) G.face = 'wet';
  else if (G.meetingTotal - G.elapsed < 10) G.face = 'panic';
  else G.face = 'normal';

  if (G.meetingTotal - G.elapsed <= 0) timeUp();
}

function breakCeiling() {
  const ceilY = (G.floor + 1) * FH - SLAB;
  track('ceiling', { floor: G.floor + 1, result: 'break' });
  G.broken++; Snd.crash(); shake(0.45, 9); vibrate(80);
  for (let i = 0; i < 26; i++) particles.push({ kind: 'chunk', x: VW / 2 + rand(-60, 60), y: ceilY + rand(0, SLAB), vx: rand(-260, 260), vy: rand(-100, 380), life: rand(.8, 1.4), rot: rand(0, 6), vr: rand(-8, 8), size: rand(6, 16) });
  G.floor++; G.ft = 0;
  G.burstLeft = 0; G.v = Math.min(G.v, CONFIG.breakExitSpeed);   // 撞破樓板會被卡一下，不會直接飛過整層
  if (G.floor >= FLOORS) { levelClear(); return; }
  G.obs = initFloorObs(G.floor);
  floatText(FLOOR_INFO[G.floor].name, VW / 2, G.y + 200, '#2f8f8a', 26);
}

function chairOverlap(y1, y2, halfW, cx) {
  return y2 > G.y + 6 && y1 < G.y + CH - 4 && Math.abs(cx - VW / 2) < halfW + CHW;
}
function updateObstacles(dt) {
  const O = G.obs; if (!O) return; O.t += dt;
  const k = G.floor, base = k * FH, ceilY = (k + 1) * FH - SLAB;
  if (k === 0) {            // 1F：「欸你有空嗎？」的手
    O.next -= dt;
    if (O.next <= 0) {
      O.next = CONFIG.handInterval;
      // 只從火箭椅前方、還沒抓過人的那一排伸手
      // 同一排至少隔 handLaneGap 秒才再伸，留空檔讓玩家通過
      O.used = O.used || {}; O.laneT = O.laneT || {};
      const lane = LANES[0].map(v => base + v).find(ly => ly - 16 > G.y + CH - 40 && !O.used[ly]);
      if (lane !== undefined && O.t - (O.laneT[lane] ?? -99) >= CONFIG.handLaneGap) { O.list.push({ side: O.side, y: lane, t: 0 }); O.laneT[lane] = O.t; }
      O.side ^= 1;
    }
    for (const h of O.list) {
      if (!(G.stuck && G.stuck.ref === h)) h.t += dt;
      h.reach = h.t < 0.35 ? h.t / 0.35 * 0.12 : h.t < 0.6 ? lerp(0.12, 1, easeOut((h.t - 0.35) / 0.25)) : h.t < 1.0 ? 1 : lerp(1, 0, (h.t - 1.0) / 0.3);
      if (h.reach > 0.6 && !h.dead) {
        const tipX = h.side === 0 ? 14 + h.reach * 226 : VW - 14 - h.reach * 226;
        const touching = h.side === 0 ? tipX > VW / 2 - CHW : tipX < VW / 2 + CHW;
        if (touching && chairOverlap(h.y - 16, h.y + 16, 0, VW / 2)) hitObstacle('hand', h);
      }
    }
    O.list = O.list.filter(h => h.t < 1.3);
  } else if (k === 1) {     // 2F：報帳單雪崩
    O.next -= dt;
    if (O.next <= 0) {
      O.next = CONFIG.paperWaveInterval;
      const n = 3;
      for (let i = 0; i < n; i++) {
        const delay = i * 0.22;
        O.list.push({ x: VW / 2 + rand(-18, 18), y: ceilY - 14, vy: -60, warn: 0.6 + delay, endY: ceilY - CONFIG.paperFallDistance, rot: rand(-.2, .2) });
      }
      O.list.push({ x: rand(60, 110), y: ceilY - 14, vy: -60, warn: 0.6, endY: ceilY - CONFIG.paperFallDistance, rot: rand(-.3, .3), deco: true });
      O.list.push({ x: rand(290, 340), y: ceilY - 14, vy: -60, warn: 0.8, endY: ceilY - CONFIG.paperFallDistance, rot: rand(-.3, .3), deco: true });
    }
    for (const p of O.list) {
      if (p.warn > 0) { p.warn -= dt; continue; }
      p.vy -= 1300 * dt; p.y += p.vy * dt;
      if (!p.deco && !p.dead && chairOverlap(p.y - 18, p.y + 18, 36, p.x)) { p.dead = true; hitObstacle('paper'); }
      if (p.y < p.endY && !p.dead) {
        p.dead = true;
        for (let i = 0; i < 5; i++) particles.push({ kind: 'sheet', x: p.x + rand(-20, 20), y: p.y, vx: rand(-120, 120), vy: rand(-60, 60), life: 1, rot: rand(0, 6), vr: rand(-6, 6), size: 12 });
      }
    }
    O.list = O.list.filter(p => !p.dead);
  } else if (k === 2) {     // 3F：投影機光束
    for (const b of O.beams) {
      b.x = VW / 2 + CONFIG.beamSweep * Math.sin((O.t + b.phase) * Math.PI * 2 / b.period);
      if (!G.stuck && chairOverlap(b.y - 28, b.y + 28, CONFIG.beamHalfWidth, b.x)) hitObstacle('beam', null);
    }
  } else if (k === 3) {     // 4F：八卦對話泡泡
    O.next -= dt;
    if (O.next <= 0) {
      O.next = CONFIG.gossipInterval;
      let li = Math.floor(Math.random() * 3); if (li === O.lastLane) li = (li + 1) % 3; O.lastLane = li;
      const side = Math.random() < .5 ? 0 : 1;
      const lines = ['欸你知道嗎', '聽說……', '他們兩個……', '我跟你講喔', '不要說是我說的'];
      O.list.push({ y: base + LANES[3][li], x: side === 0 ? -70 : VW + 70, vx: (side === 0 ? 1 : -1) * rand(70, 105), text: lines[Math.floor(Math.random() * lines.length)], wob: rand(0, 6) });
    }
    for (const b of O.list) {
      if (b.stuck) { b.x = lerp(b.x, VW / 2 + 40, dt * 8); b.y = lerp(b.y, G.y + 140, dt * 8); continue; }
      b.x += b.vx * dt;
      if (!b.dead && chairOverlap(b.y - 26, b.y + 26, 56, b.x)) hitObstacle('gossip', b);
    }
    O.list = O.list.filter(b => !b.dead && b.x > -120 && b.x < VW + 120);
  } else if (k === 4) {     // 5F：消防灑水器
    G.mist = false;
    for (const z of O.zones) {
      const ph = (O.t + z.phase) % z.period;
      z.state = ph < z.on ? 'on' : ph > z.period - 0.5 ? 'warn' : 'off';
      const cy = G.y + CH / 2;
      if (z.state === 'on' && cy > z.y - z.h / 2 && cy < z.y + z.h / 2) {
        if (!z.wasIn) { z.wasIn = true; track('obstacle_hit', { floor: 5, kind: 'sprinkler' }); Snd.splash(); floatText('推力減半！', VW / 2, G.y + 170, '#2f6fae', 18); }
        G.mist = true;
      } else if (!(cy > z.y - z.h / 2 && cy < z.y + z.h / 2)) z.wasIn = false;
    }
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'sheet') { p.vy -= 120 * dt; p.vx *= 0.98; } else p.vy -= 700 * dt;
    if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) f.t += dt;
  floaters = floaters.filter(f => f.t < 1.3);
}

/* =========================================================
   繪圖工具
   ========================================================= */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function fillInk(c, fill, lw = 3) { if (fill) { c.fillStyle = fill; c.fill(); } c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function inkText(c, str, x, y, size, fill = '#fbf7ec', align = 'center', shadow = INK) {
  c.font = `900 ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = Math.max(3, size * 0.24); c.strokeStyle = shadow; c.strokeText(str, x, y + size * 0.12);
  c.strokeStyle = INK; c.strokeText(str, x, y); c.fillStyle = fill; c.fillText(str, x, y);
}
function plainText(c, str, x, y, size, color = INK, align = 'center', weight = 800) {
  c.font = `${weight} ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(str, x, y);
}
function bubble(c, x, y, w, h, text, size = 15, tail = 'down') {
  rr(c, x - w / 2, y - h / 2, w, h, 14); fillInk(c, '#ffffff', 3);
  c.beginPath();
  if (tail === 'down') { c.moveTo(x - 8, y + h / 2 - 1); c.lineTo(x - 2, y + h / 2 + 12); c.lineTo(x + 8, y + h / 2 - 1); }
  else if (tail === 'left') { c.moveTo(x - w / 2 + 1, y - 6); c.lineTo(x - w / 2 - 12, y + 6); c.lineTo(x - w / 2 + 1, y + 8); }
  else { c.moveTo(x + w / 2 - 1, y - 6); c.lineTo(x + w / 2 + 12, y + 6); c.lineTo(x + w / 2 - 1, y + 8); }
  c.fillStyle = '#fff'; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
  c.fillStyle = '#fff'; c.fillRect(x - 7, y + h / 2 - 4, 14, 3);
  plainText(c, text, x, y + 1, size);
}

/* ---------- 火焰 ---------- */
function drawFlame(c, x, y, len, w) {
  const fl = len * (0.85 + Math.random() * 0.3);
  c.beginPath(); c.moveTo(x - w / 2, y); c.quadraticCurveTo(x - w * 0.6, y + fl * 0.55, x, y + fl); c.quadraticCurveTo(x + w * 0.6, y + fl * 0.55, x + w / 2, y); c.closePath();
  c.fillStyle = '#ff8a3d'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#a8321e'; c.stroke();
  c.beginPath(); c.moveTo(x - w * 0.28, y); c.quadraticCurveTo(x - w * 0.3, y + fl * 0.4, x, y + fl * 0.62); c.quadraticCurveTo(x + w * 0.3, y + fl * 0.4, x + w * 0.28, y); c.closePath();
  c.fillStyle = '#ffe27a'; c.fill();
}

/* ---------- 臉 ---------- */
function drawFace(c, kind, roar, boss) {
  c.lineWidth = 2.5; c.strokeStyle = INK; c.fillStyle = INK; c.lineCap = 'round';
  const eye = (x, y, r = 2.6) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); };
  const line = (x1, y1, x2, y2) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
  const ey = -116;
  if (boss && kind !== 'blank' && kind !== 'ask') { // 主管：瞇瞇眼＋小鬍子
    line(-9, ey, -4, ey); line(4, ey, 9, ey);
    c.beginPath(); c.moveTo(-6, -105); c.quadraticCurveTo(0, -108, 6, -105); c.stroke();
    if (kind === 'talk') { c.beginPath(); c.ellipse(0, -101, 3.5, 2.5, 0, 0, Math.PI * 2); c.fill(); }
    return;
  }
  switch (kind) {
    case 'yell': line(-11, ey - 3, -4, ey); line(-11, ey + 3, -4, ey); line(11, ey - 3, 4, ey); line(11, ey + 3, 4, ey);
      c.beginPath(); c.ellipse(0, -102, 7, 6, 0, 0, Math.PI * 2); c.fillStyle = '#7c2119'; c.fill(); c.stroke(); break;
    case 'scared': c.fillStyle = '#fff'; c.beginPath(); c.arc(-6, ey, 4.5, 0, 7); c.fill(); c.stroke(); c.beginPath(); c.arc(6, ey, 4.5, 0, 7); c.fill(); c.stroke();
      c.fillStyle = INK; eye(-6, ey, 1.6); eye(6, ey, 1.6); c.beginPath(); c.ellipse(0, -102, 4, 5, 0, 0, Math.PI * 2); c.fillStyle = '#7c2119'; c.fill(); c.stroke(); break;
    case 'ouch': line(-10, ey - 2, -3, ey + 1); line(-10, ey + 3, -3, ey + 1); line(10, ey - 2, 3, ey + 1); line(10, ey + 3, 3, ey + 1);
      c.beginPath(); c.moveTo(-6, -102); c.lineTo(-2, -105); c.lineTo(2, -102); c.lineTo(6, -105); c.stroke(); break;
    case 'daze': c.beginPath(); c.arc(-6, ey, 4, 0, Math.PI * 1.6); c.stroke(); c.beginPath(); c.arc(6, ey, 4, Math.PI, Math.PI * 2.6); c.stroke();
      line(-4, -103, 4, -103); break;
    case 'awk': eye(-3, ey); eye(9, ey); c.beginPath(); c.moveTo(-6, -103); c.quadraticCurveTo(0, -101, 6, -105); c.stroke(); break;
    case 'wet': line(-9, ey, -3, ey + 1); line(3, ey + 1, 9, ey); c.beginPath(); c.arc(0, -101, 4, Math.PI * 1.1, Math.PI * 1.9); c.stroke();

/* =========================================================
   主迴圈
   ========================================================= */
let lastT = nowS(), walletTimer = 0;
function tick(dt) {
  walletTimer += dt; if (walletTimer > 1) { walletTimer = 0; if (Wallet.tick()) renderWallet(); else if (Wallet.bal < Wallet.REGEN_CAP || Wallet.isFree()) renderWallet(); }
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeAmp = 0; }
  if (appState === 'calib' && CAL) updateCalib(dt);
  if (appState === 'ad' && adCtx) { adCtx.t -= dt; $('ad-count').textContent = Math.max(1, Math.ceil(adCtx.t)); if (adCtx.t <= 0) adDone(); }
  if (appState === 'play' && G) { updatePlay(dt); }
  if (G && (appState === 'play' || appState === 'failcs' || appState === 'clearcs')) updateParticles(dt);
  if (scene) {
    scene.t += dt;
    if (scene.kind === 'fail') { G.y = lerp(scene.y0, G.floor * FH, easeIO((scene.t - 1.2) / 2)); }
    if (scene.kind === 'story' && scene.t > 7.4) endStory();
    else if (scene.kind === 'clear' && scene.t > 5.6) showResult();
    else if (scene.kind === 'fail' && scene.t > 4.4) afterFailScene();
  }
}
function loop() {
  const t = nowS(); const dt = Math.min(0.05, t - lastT); lastT = t;
  tick(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene && scene.kind === 'story') renderStory(ctx, scene.t);
  else if (scene && scene.kind === 'clear') renderClear(ctx, scene.t);
  else if (scene && scene.kind === 'fail') renderFail(ctx, scene.t, dt);
  else if (G && ['play', 'paused', 'revive', 'ad', 'micfail', 'result'].includes(appState)) {
    if (appState === 'play') renderPlay(ctx, dt); else if (appState === 'result') { renderTitleBg(ctx, t); } else renderPlay(ctx, 0);
  } else renderTitleBg(ctx, t);

  if (DEBUG) renderDebug();
  requestAnimationFrame(loop);
}
function skipScene() {
  if (!scene) return;
  if (scene.kind === 'story') endStory();
  else if (scene.kind === 'clear') showResult();
  else if (scene.kind === 'fail') afterFailScene();
}

  Touch.holding = true;

document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (!e.target.closest('#s-result')) e.preventDefault(); }, { passive: false });

/* 切換分頁／離開：一定關掉麥克風 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    Mic.stop();
    if (appState === 'play') pauseGame();
    else if (appState === 'calib') { CAL = null; goMode(); }
  }
});
window.addEventListener('pagehide', () => Mic.stop());

function checkRotate() {
  const land = IS_MOBILE && window.innerWidth > window.innerHeight;
  $('rotate').classList.toggle('show', land);
  if (land && appState === 'play') pauseGame('先躲一下', '把手機轉回直的再繼續');
}

/* ---------- 按鈕 ---------- */
$('btn-start').onclick = onStartClick;
$('btn-story').onclick = () => { ensureAudio(); startStory(); };
$('btn-mode-back').onclick = goTitle;
$('btn-normal').onclick = () => ignite('voice', false);
$('btn-quiet').onclick = () => ignite('voice_quiet', false);
$('btn-touch').onclick = () => ignite('touch', false);
$('btn-skip-calib').onclick = () => { CAL = null; startGame(); };
$('btn-copy').onclick = async () => { const ok = await copyText(cleanUrl()); toast(ok ? '已複製網址，貼到 Safari / Chrome 開啟' : '複製失敗，請手動複製網址列'); };
$('btn-mf-touch').onclick = () => {
  inputMode = 'touch'; ensureAudio();
  if (G && !G.done && G.pausedByMic) { G.mode = 'touch'; G.quiet = false; track('mode_select', { mode: 'touch' }); resumePlay(); }
  else ignite('touch', false);
};
$('btn-mf-back').onclick = goTitle;
$('btn-resume').onclick = onResumeClick;
$('btn-ad').onclick = () => { if (G.adUsed >= CONFIG.adContinuePerGame) return; track('continue_click', { choice: 'ad' }); startAd('revive'); };
$('btn-coffee').onclick = () => {
  if (!Wallet.spend(CONFIG.coffeeCost)) { $('coffee-note').textContent = `點數不夠（需要 ${CONFIG.coffeeCost} 點），可以先看廣告`; return; }
  track('continue_click', { choice: 'item' });
  G.coffeeCount++; G.extraSpent += CONFIG.coffeeCost; G.meetingTotal += CONFIG.coffeeExtendSeconds; G.coffeeLeft = CONFIG.coffeeBoostSeconds;
  reviveContinue();
  $('pause-title').textContent = '特濃咖啡，喝！'; $('pause-desc').textContent = `會議再拖 ${CONFIG.coffeeExtendSeconds} 秒，${CONFIG.coffeeBoostSeconds} 秒內推力加倍`;
  $('btn-resume').textContent = '繼續落跑';
  // 這是點擊事件，直接幫玩家重開麥克風
  onResumeClick();
};
$('btn-quit').onclick = () => { track('continue_click', { choice: 'quit' }); finishFail(); };
$('btn-low-ad').onclick = () => startAd('low');
$('btn-low-back').onclick = goTitle;
$('btn-retry').onclick = () => {
  const g = lastResult; track('retry_click', { last_cleared: g ? g.cleared : false });
  ignite(g ? g.mode : 'voice', true);
};
$('btn-share').onclick = onShare;
$('btn-next').onclick = () => { track('next_level_interest_click', { cleared: lastResult ? lastResult.cleared : false }); toast('第 2 關還在準備中'); };
$('btn-home').onclick = goTitle;
$('mute').onclick = () => { muted = !muted; lsSet(MUTE_KEY, muted ? '1' : '0'); $('mute').classList.toggle('muted', muted); ensureAudio(); };
$('mute').classList.toggle('muted', muted);

/* ---------- debug ---------- */
function renderDebug() {
  const lines = [
    `state ${appState}  mode ${inputMode}`,
    `rms ${Mic.rms.toFixed(4)}  mic ${Mic.on ? 'on' : 'off'}`,
    `zero ${Calib.zero().toFixed(4)} one ${Calib.one().toFixed(4)}`,
    `roar raw ${Roar.raw.toFixed(2)} smooth ${Roar.smooth.toFixed(2)}`,
  ];
  if (G) lines.push(`thrust ${thrustFor(Roar.smooth).toFixed(0)}  v ${G.v.toFixed(0)}  y ${G.y.toFixed(0)}`,
    `floor ${G.floor + 1}  cd ${G.cooldown.toFixed(2)}  burst ${G.burstLeft.toFixed(2)}`,
    `t ${G.elapsed.toFixed(1)}/${G.meetingTotal}  +${G.penalty}min  mist ${G.mist}`);
  $('debug-text').textContent = lines.join('\n');
}
if (DEBUG) {
  $('debug').classList.remove('hidden');
  $('dbg-clear').onclick = () => { if (G && appState === 'play') { G.floor = 4; G.obs = initFloorObs(4); G.y = 5 * FH - SLAB - CH - 5; G.v = 800; G.burstLeft = 0.3; } };
  $('dbg-fail').onclick = () => { if (G && appState === 'play') G.elapsed = G.meetingTotal; };
  $('dbg-export').onclick = async () => { const ok = await copyText(lsGet(EVENTS_KEY) || '[]'); toast(ok ? '事件 JSON 已複製' : '複製失敗'); };
  // 自動測試用：不靠畫面幀，直接推進時間（ctrl 回傳 true 時停止）
  const sim = (sec, ctrl) => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { if (ctrl && ctrl(G) === true) break; tick(1 / 60); } return appState; };
  window.RC = { get G() { return G; }, tryBurst, Touch, CONFIG, Calib, sim, get state() { return appState; } };
}

/* ---------- 啟動 ---------- */
Wallet.load(); Calib.load();
resize(); showScreen('s-title');
requestAnimationFrame(loop);
</script>
</body>
</html>
