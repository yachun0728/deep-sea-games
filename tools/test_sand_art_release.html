<!doctype html><meta charset="utf-8"><title>Sand Art release integration QA</title><style>body{font:14px system-ui;background:#f6f0e3;color:#554b3b;margin:12px}iframe{width:390px;height:844px;border:1px solid #cdbf9f}pre{white-space:pre-wrap}</style><h1>Production controller / tutorial / lifecycle QA</h1><pre id="results">Running…</pre><iframe id="game"></iframe><script>
(async()=>{const out=document.getElementById('results'),frame=document.getElementById('game'),lines=[],events=[];const ok=(v,label)=>{if(!v)throw Error(label);lines.push('PASS '+label);out.textContent=lines.join('\n')};const wait=ms=>new Promise(r=>setTimeout(r,ms));window.deepSeaSandArt={getLanguage:()=> 'zh-Hant',translate:(source,text)=>text,prepare:(source,id)=>{events.push(['start',id]);return true},pause:()=>events.push(['pause']),resume:()=>events.push(['resume']),touch:()=>events.push(['touch']),finish:(source,data)=>events.push(['finish',data]),language:()=>{},exit:()=>events.push(['exit'])};try{frame.src='../games/sand-art/play.html';await new Promise(r=>frame.onload=r);await wait(60);const w=frame.contentWindow,d=frame.contentDocument,cv=d.getElementById('canvas'),state=()=>w.sandArt.snapshot();cv.setPointerCapture=()=>{};const point=(x,y)=>{const r=cv.getBoundingClientRect(),s=Math.min(r.width/360,r.height/400),v=state();return{x:r.left+(r.width-360*s)/2+(v.pan.x+x*v.zoom)*s,y:r.top+(r.height-400*s)/2+(v.pan.y+y*v.zoom)*s}};const ptr=(type,id,x,y)=>cv.dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:x,clientY:y,bubbles:true,cancelable:true}));const tap=(x,y)=>{const p=point(x,y);ptr('pointerdown',1,p.x,p.y);ptr('pointerup',1,p.x,p.y)};
ok(d.getElementById('pictureDialog').open&&d.querySelectorAll('[data-picture]').length===6,'Formal first screen is the six-picture chooser');ok(events.every(e=>e[0]!=='start'),'Picture browsing does not start analytics gameplay time');ok(d.getElementById('galleryExit').href.endsWith('index.html#lobby'),'The first chooser has a visible lobby exit');d.getElementById('choosePicture').click();ok(events.filter(e=>e[0]==='start').length===1,'Confirming paper starts one session');ok(state().guide.active&&state().guide.step===0,'A new player sees the peel step');
tap(180,160);ok(state().peeled.includes(4)&&state().guide.step===1,'Actually peeling paper advances to choosing colors and pouring');d.querySelector('[data-tool="pour"]').click();let p=point(180,160);ptr('pointerdown',2,p.x,p.y);await wait(240);ptr('pointerup',2,p.x,p.y);await wait(350);ok(w.sandArt.stats().emitted>0&&state().guide.step===2,'Actually pouring advances to spreading, with real grains');ok(w.sandArt.stats().bound>0,'Sand physically contacts and adheres to peeled paper');d.querySelector('[data-tool="brush"]').click();p=point(180,160);const q=point(196,178);ptr('pointerdown',3,p.x,p.y);ptr('pointermove',3,q.x,q.y);ptr('pointerup',3,q.x,q.y);await wait(50);ok(state().guide.step===3,'Spreading sand after adhesive contact advances to excess-sand guidance');d.getElementById('coachSkip').click();ok(!state().guide.active&&d.getElementById('coach').hidden,'The guide can be dismissed without resetting the picture');
const before=JSON.stringify(state().grains);w.setSandArtActive(false);tap(230,190);await wait(180);ok(JSON.stringify(state().grains)===before&&!state().platformActive,'Leaving the host route freezes physics and ignores canvas input');w.setSandArtActive(true);ok(state().platformActive,'Returning to the host route resumes the same work');
d.getElementById('desk').click();ok(events.some(e=>e[0]==='pause'),'A settings dialog pauses analytics engagement');d.getElementById('help').click();d.getElementById('guideReplay').click();ok(state().guide.active&&state().guide.step===0,'Help can replay the hands-on guide');d.getElementById('coachSkip').click();w.setSandArtLanguage('en');ok(d.getElementById('paper').textContent==='Paper'&&d.getElementById('guideReplay').textContent==='Guide me through it','Formal controls and tutorial support English');ok(state().peeled.length>0,'Changing language preserves artwork');d.getElementById('finish').click();ok(events.filter(e=>e[0]==='finish').length===1&&d.getElementById('finishDialog').open,'Admiring ends one session and opens the artwork view');d.getElementById('continue').click();ok(!d.getElementById('finishDialog').open&&state().peeled.length>0,'Continuing preserves the same artwork');d.getElementById('back').click();ok(events.some(e=>e[0]==='exit'),'The in-game back button uses the host lobby exit');
for(const [width,height]of [[390,844],[320,568],[430,760]]){frame.style.width=width+'px';frame.style.height=height+'px';w.setSandArtLanguage('zh-Hant');d.getElementById('desk').click();d.getElementById('help').click();d.getElementById('guideReplay').click();await wait(50);const coach=d.getElementById('coach').getBoundingClientRect(),canvas=cv.getBoundingClientRect(),app=d.getElementById('app').getBoundingClientRect();ok(coach.top>=canvas.bottom-.5&&app.bottom<=height+.5&&d.documentElement.scrollWidth===width,`Guide stays below the drawing and fits ${width}x${height}`);d.getElementById('coachSkip').click()}
document.body.dataset.result='PASS';out.textContent=lines.join('\n')+'\nALL RELEASE REGRESSIONS PASS';}catch(e){document.body.dataset.result='FAIL';out.textContent+='\nFAIL '+e.stack}})();
