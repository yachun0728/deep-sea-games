 ['eyeLeft','M129 179 Q141 187 151 178',5.4],
 ['eyeRight','M209 178 Q220 187 232 179',5.4],
 ['nose','M175 202 L185 202 L180 208 Z'],
 ['mouth','M180 208 Q175 219 169 212 M180 208 Q186 219 192 212',4.8],
 ['whiskerLeftTop','M112 199 L90 194',4.8],
 ['whiskerLeftBottom','M113 207 L90 210',4.8],

// otherwise invent the ID of an unrelated peeled region (ghost glue lines).

}

  }

 for(let pi=0;pi<this.moving.length;pi++){const p=this.moving[pi];if(!p.bound){p.vx+=this.gx*125*dt;p.vy+=this.gy*125*dt;const speed=Math.hypot(p.vx,p.vy);p.supported=false;p.vz-=300*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;p.vz=0;p.supported=true}const tacky=p.z<.35&&this.peeled.has(this.regionAt(p.x,p.y))&&!this.sites.has(Math.floor(p.x/.7)+Math.floor(p.y/.7)*1024);const grainFriction=.82+p.shade*.36;const friction= Math.max(0,1-grainFriction*(p.z<.35?(1.8+speed*1.6+speed*speed*.012+(tacky?2+speed*1.4:0)):speed*1.15)*dt/(speed||1));p.vx*=friction;p.vy*=friction;const limit=230/Math.max(230,Math.hypot(p.vx,p.vy));p.vx*=limit;p.vy*=limit;p.x+=p.vx*dt;p.y+=p.vy*dt}const k=key(p.x,p.y);next[pi]=bins[k];bins[k]=pi}

function point(e){const p=viewPoint(e);return{x:(p.x-panX)/zoom,y:(p.y-panY)/zoom}}
function clampPan(){panX=Math.max(W*(1-zoom),Math.min(0,panX));panY=Math.max(H*(1-zoom),Math.min(0,panY))}
function viewChanged(){clampPan();$('zoomReset').textContent=Number(zoom.toFixed(1))+'×';cv.dataset.zoom=zoom.toFixed(2);cv.dataset.pan=JSON.stringify([panX,panY])}
function setZoom(next,anchor={x:W/2,y:H/2}){const x=(anchor.x-panX)/zoom,y=(anchor.y-panY)/zoom;zoom=Math.max(1,Math.min(4,next));panX=anchor.x-x*zoom;panY=anchor.y-y*zoom;viewChanged()}
$('zoomIn').onclick=()=>setZoom(zoom*1.35);$('zoomOut').onclick=()=>setZoom(zoom/1.35);$('zoomReset').onclick=()=>{zoom=1;panX=panY=0;viewChanged()};
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.002),viewPoint(e))},{passive:false});
function pinchState(){const [a,b]=[...gesturePoints.values()];return{center:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},distance:Math.hypot(a.x-b.x,a.y-b.y)}}

function movePinch(){if(gesturePoints.size<2||!pinch)return;const v=pinchState();zoom=Math.max(1,Math.min(4,pinch.zoom*v.distance/pinch.distance));panX=v.center.x-pinch.anchor.x*zoom;panY=v.center.y-pinch.anchor.y*zoom;viewChanged()}

function peelAt(x,y,dx=0,dy=-1){let id=regionAt(x,y);
 // Near-line assistance makes narrow cut strips reachable with a fingertip.
 if(id>=0&&id<12){const reach=Math.max(2,7/zoom),limit=Math.ceil(reach);let best=reach*reach;for(let dy=-limit;dy<=limit;dy++)for(let dx=-limit;dx<=limit;dx++){const d=dx*dx+dy*dy;if(d>=best)continue;const near=regionAt(x+dx,y+dy);if(near>=12&&!world.peeled.has(near)){best=d;id=near}}}

cv.onpointerdown=e=>{e.preventDefault();if(view||portraitPaused||$('helpDialog').open||$('finishDialog').open||$('deskDialog').open)return;soundStart();cv.focus({preventScroll:true});sensorMessage='';gesturePoints.set(e.pointerId,viewPoint(e));cv.setPointerCapture(e.pointerId);if(gesturePoints.size>=2){beginPinch();return}if(gestureActive)return;const p=point(e);if((p.x>=7&&p.x<20)||(p.x>340&&p.x<=353)||(p.y>=7&&p.y<20)||(p.y>380&&p.y<=393)){doTap();return}cv.setPointerCapture(e.pointerId);p.mode=mode;p.colors=[...colors];p.startX=p.x;p.startY=p.y;p.moved=false;p.carry=0;p.nx=1;p.ny=0;p.lastMove=e.timeStamp;pointers.set(e.pointerId,p);renderText()};
cv.onpointermove=e=>{if(gesturePoints.has(e.pointerId))gesturePoints.set(e.pointerId,viewPoint(e));if(gestureActive){movePinch();return}const p=pointers.get(e.pointerId);if(!p)return;const q=point(e),dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(Math.hypot(q.x-p.startX,q.y-p.startY)>4)p.moved=true;if(['scraper','brush'].includes(p.mode)){const elapsed=Math.max((e.timeStamp-p.lastMove)/1000,1/120);if(d>.05){p.nx=-dy/d;p.ny=dx/d;world.sweep(p.x,p.y,q.x,q.y,p.mode,elapsed)};if(d>1&&performance.now()-lastSound>120){sfx('rub');lastSound=performance.now()}}p.x=q.x;p.y=q.y;p.lastMove=e.timeStamp};
function pointerEnd(e){const p=pointers.get(e.pointerId);if(!gestureActive&&p&&['pick','peel'].includes(p.mode))peelAt(p.startX,p.startY,p.x-p.startX,p.y-p.startY);pointers.delete(e.pointerId);gesturePoints.delete(e.pointerId);if(!gesturePoints.size){pinch=null;gestureActive=false}}
cv.onpointerup=pointerEnd;function cancelPointer(e){pointers.delete(e.pointerId);gesturePoints.delete(e.pointerId);if(!gesturePoints.size){pinch=null;gestureActive=false}}cv.onpointercancel=cancelPointer;cv.onlostpointercapture=cancelPointer;

// Pre-render paper fibers and adhesive stipple once; region redraw only on peeling.
const paper=document.createElement('canvas');paper.width=W;paper.height=H;const pc=paper.getContext('2d');pc.fillStyle='#e6c65f';pc.fillRect(0,0,W,H);let seed=841;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}for(let i=0;i<7000;i++){pc.strokeStyle=rnd()>.5?'#fff6cf35':'#84632c15';pc.lineWidth=.35;const x=rnd()*W,y=rnd()*H;pc.beginPath();pc.moveTo(x,y);pc.lineTo(x+rnd()*3-1,y+rnd()*4);pc.stroke()}
const glue=document.createElement('canvas');glue.width=W;glue.height=H;const gc=glue.getContext('2d');gc.fillStyle='#fcfaf1';gc.fillRect(0,0,W,H);for(let i=0;i<14000;i++){gc.fillStyle=i%2?'#bdb6a91a':'#ffffffaa';gc.fillRect(rnd()*W,rnd()*H,.6,.6)}
const base=document.createElement('canvas');base.width=W*2;base.height=H*2;const fixedLayer=document.createElement('canvas');fixedLayer.width=W*3;fixedLayer.height=H*3;const fc=fixedLayer.getContext('2d');fc.setTransform(3,0,0,3,0,0);let fixedRevision=0;
const bc=base.getContext('2d');const lineLayer=document.createElement('canvas');lineLayer.width=W*2;lineLayer.height=H*2;const lc=lineLayer.getContext('2d');let baseKey='';
function renderBase(){const k=[...world.peeled].join(',');if(k===baseKey&&baseKey!=='')return;baseKey=k;bc.setTransform(2,0,0,2,0,0);bc.clearRect(0,0,W,H);bc.fillStyle='#f9f4e6';bc.fillRect(14,14,332,372);bc.lineCap='round';bc.lineJoin='round';
 for(let i=0;i<shapes.length;i++){const stroke=paths[i][2]||0;
  if(stroke){const target=occluders[i].length?lc:bc;if(target===lc){lc.setTransform(2,0,0,2,0,0);lc.globalCompositeOperation='source-over';lc.clearRect(0,0,W,H)}target.lineCap='round';target.lineJoin='round';target.lineWidth=stroke+1;target.strokeStyle='#9f823a';target.stroke(shapes[i]);target.lineWidth=stroke;target.strokeStyle=target.createPattern(world.peeled.has(i)?glue:paper,'repeat');target.stroke(shapes[i]);if(target===lc){lc.globalCompositeOperation='destination-out';for(const cover of occluders[i])lc.fill(cover);bc.drawImage(lineLayer,0,0,W,H)}}
  else{bc.save();bc.clip(shapes[i]);bc.drawImage(world.peeled.has(i)?glue:paper,0,0);bc.restore();bc.lineWidth=i===0?1.2:1;bc.strokeStyle=world.peeled.has(i)?'#b6ab92':'#9f823a';bc.stroke(shapes[i])}
 }
 bc.fillStyle='#a68954';bc.font='8px Georgia';bc.textAlign='center';bc.fillText('A LITTLE SAND, A LITTLE STILLNESS',180,363)}
function resize(){const rect=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);scale=Math.min(rect.width/W,rect.height/H);ox=(rect.width-W*scale)/2;oy=(rect.height-H*scale)/2;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(stage);
// Stable irregular grains, cached at high resolution: no per-frame sparkle or jitter.
const grainAtlas=document.createElement('canvas'),grainTile=24,grainVariants=12;grainAtlas.width=grainTile*grainVariants;grainAtlas.height=grainTile*colorDefs.length;const ac=grainAtlas.getContext('2d');
for(let color=0;color<colorDefs.length;color++)for(let variant=0;variant<grainVariants;variant++){
 ac.save();ac.translate(variant*grainTile+12,color*grainTile+12);ac.scale(6,6);ac.rotate(variant*.73);const vertices=5+variant%3,outline=new Path2D();for(let k=0;k<vertices;k++){const angle=k/vertices*Math.PI*2,radius=1+.12*Math.sin(k*9.7+variant*4.1);const x=Math.cos(angle)*radius,y=Math.sin(angle)*radius;if(k)outline.lineTo(x,y);else outline.moveTo(x,y)}outline.closePath();ac.save();ac.translate(.12,.18);ac.fillStyle='#49371b24';ac.fill(outline);ac.restore();ac.fillStyle=colorDefs[color][0];ac.fill(outline);const light=ac.createLinearGradient(-.8,-.9,.8,.9);light.addColorStop(0,'#ffffff30');light.addColorStop(.5,'#ffffff00');light.addColorStop(1,'#36230c2b');ac.fillStyle=light;ac.fill(outline);if(variant%5===0){ac.fillStyle='#fff7dc66';ac.fillRect(-.35,-.4,.28,.18)}ac.restore()
}
function paintGrain(target,p){const variant=Math.min(grainVariants-1,Math.floor(p.shade*grainVariants)),size=p.r*4;target.drawImage(grainAtlas,variant*grainTile,p.color*grainTile,grainTile,grainTile,p.x-size/2,p.y-p.z*.55-size/2,size,size)}

function draw(){const dpr=Math.min(devicePixelRatio||1,2);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.width/dpr,cv.height/dpr);ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.translate(panX,panY);ctx.scale(zoom,zoom);ctx.fillStyle='#9c80521a';ctx.beginPath();ctx.roundRect(9,11,344,384,8);ctx.fill();ctx.fillStyle='#c5b18c';ctx.beginPath();ctx.roundRect(7,7,346,386,7);ctx.fill();renderBase();ctx.drawImage(base,0,0,W,H);
 if(fixedRevision!==world.revision){fc.clearRect(0,0,W,H);fixedRevision=world.revision}
 for(const p of world.boundQueue)paintGrain(fc,p);world.boundQueue.length=0;
 ctx.drawImage(fixedLayer,0,0,W,H);
 // A falling grain casts a separated shadow; resting layers keep contact shadows.
 ctx.fillStyle='#58401e12';for(const p of world.moving)if(p.z>1.5&&!p.supported){ctx.beginPath();ctx.ellipse(p.x+.3,p.y+.5,p.r*1.25,p.r*.7,0,0,Math.PI*2);ctx.fill()}
 const visibleGrains=world.moving.slice().sort((a,b)=>a.z-b.z||a.y-b.y);for(const p of visibleGrains)paintGrain(ctx,p);

 for(const a of peels){const progress=Math.min(1,a.age/.65),lift=Math.sin(progress*Math.PI/2);ctx.save();const stroke=paths[a.id][2]||0;ctx.translate(a.ux*lift*45,a.uy*lift*45);ctx.translate(a.x,a.y);ctx.scale(1-progress*.24,1-progress*.38);ctx.rotate(progress*.16*a.ux);ctx.translate(-a.x,-a.y);ctx.globalAlpha=1-progress;ctx.shadowColor='#66513166';ctx.shadowBlur=8;ctx.shadowOffsetY=4;ctx.fillStyle=ctx.createPattern(paper,'repeat');ctx.strokeStyle='#ddba54';ctx.lineWidth=stroke||1;if(stroke)ctx.stroke(shapes[a.id]);else{ctx.fill(shapes[a.id]);ctx.stroke(shapes[a.id])}ctx.restore();ctx.save();ctx.globalAlpha=1-progress;const x=a.x+a.ux*lift*45,y=a.y+a.uy*lift*45;ctx.strokeStyle='#ab8149';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+13,y-32);ctx.stroke();ctx.strokeStyle='#efdbb3';ctx.lineWidth=.7;ctx.stroke();ctx.restore()}peels=peels.filter(a=>a.age<.65);

 // Four tiny brass frame taps, also usable without motion access.
 ctx.fillStyle='#9f8c6c';for(const [x,y]of [[13,13],[347,13],[13,387],[347,387]]){ctx.beginPath();ctx.arc(x,y,1.6,0,7);ctx.fill()}
 for(const p of pointers.values()){ctx.strokeStyle='#66594d99';ctx.lineWidth=1;if(p.mode==='pour'||p.mode==='spoon'){ctx.beginPath();ctx.arc(p.x,p.y,p.mode==='spoon'?4:10,0,7);ctx.stroke()}else if(p.mode==='scraper'){ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x-p.nx*24,p.y-p.ny*24);ctx.lineTo(p.x+p.nx*24,p.y+p.ny*24);ctx.stroke()}else if(p.mode==='brush'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.ny,p.nx));for(let j=-3;j<=3;j++){ctx.beginPath();ctx.moveTo(j*4,-8);ctx.lineTo(j*4,10);ctx.stroke()}ctx.restore()}else if(p.mode==='pick'){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+10,p.y-22);ctx.stroke()}}
 // Tilt indicator points in the actual force direction.
 ctx.strokeStyle='#7c9076';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(180,392);ctx.lineTo(180+world.gx*17,392+world.gy*8);ctx.stroke();
}
function tick(now){if(!fpsStart)fpsStart=now;fpsFrames++;if(now-fpsStart>=1000){cv.dataset.fps=(fpsFrames*1000/(now-fpsStart)).toFixed(1);fpsStart=now;fpsFrames=0}if(!last)last=now;const dt=Math.min((now-last)/1000,.05);last=now;if(!document.hidden&&!portraitPaused){let g=sensorOn&&sensorSample?sensorGravity:gravity;if(keys.size)g={x:(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0),y:(keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0)};world.gx+=(g.x-world.gx)*Math.min(1,dt*12);world.gy+=(g.y-world.gy)*Math.min(1,dt*12);accumulator+=dt;let pouring=false;while(accumulator>=1/120){for(const p of pointers.values()){if(!['pour','spoon'].includes(p.mode)||!p.colors.length)continue;pouring=true;const rate=p.mode==='spoon'?90:850;p.carry+=rate/120;while(p.carry>=1){const c=p.colors[Math.floor(Math.random()*p.colors.length)];world.emit(p.x,p.y,c,1,p.mode==='spoon'?2.5:10);p.carry--}}world.step(1/120);accumulator-=1/120}if(flow)flow.gain.setTargetAtTime(pouring&&!muted&&!world.full?.055:0,audio.currentTime,.06);for(const a of peels)a.age+=dt;draw();if(++frame%24===0){const s=world.stats();cv.dataset.version='sand-art-demo-10';cv.dataset.peeled=JSON.stringify([...world.peeled]);cv.dataset.stats=JSON.stringify(s);$('status').textContent=lang==='zh'?`${t('bound')} ${s.bound} · ${t('loose')} ${s.loose}`:`${s.bound} ${t('bound')} · ${s.loose} ${t('loose')}`;const h=hint();if($('hint').textContent!==h)$('hint').textContent=h}}requestAnimationFrame(tick)}
viewChanged();renderText();resize();requestAnimationFrame(tick);
// Read-only diagnostics support reproducible QA without affecting gameplay.
window.sandArt={version:'sand-art-demo-10',stats:()=>world.stats(),snapshot:()=>({mode,colors:[...colors],peeled:[...world.peeled],gravity:{x:world.gx,y:world.gy},sensorOn,sensorSample,zoom,pan:{x:panX,y:panY},grains:world.grains.map(p=>({...p}))}),regionAt};
