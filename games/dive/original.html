<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>一口氣探險</title>
<style>
  :root{
    --bg:#000; --card:#0c0c0e; --card2:#131316; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --text:#f5f5f4; --mute:rgba(255,255,255,.52); --mute2:rgba(255,255,255,.38);
    --amber:#f5c26b; --cyan:#6be3f5; --red:#ff6b6b; --violet:#a78bfa; --green:#6ee7a8; --gold:#e8c872;
    --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,.9,.3,1.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .lbl{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:500}

  #app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}

  /* ---------- 舞台 ---------- */
  .stage{position:relative;height:clamp(220px,34dvh,320px);flex:none;background-color:#1386c7;transition:background-color 1.4s var(--ease);overflow:hidden;transform-origin:50% 60%}
  .stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,#000 100%);pointer-events:none}
  .rays{position:absolute;inset:-20% -10% 0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.0) 0 38px,rgba(255,255,255,.09) 38px 60px,rgba(255,255,255,0) 60px 110px);mask-image:linear-gradient(#000,transparent 75%);-webkit-mask-image:linear-gradient(#000,transparent 75%);transition:opacity 1.4s;animation:sway 9s ease-in-out infinite alternate}
  @keyframes sway{to{transform:translateX(-30px) skewX(-3deg)}}
  #cv{position:absolute;inset:0;width:100%;height:100%}
  .diver{position:absolute;left:50%;top:60%;font-size:46px;line-height:1;transform:translate(-50%,-50%);z-index:2;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
  .diver.dive{animation:diveDown .7s var(--ease)}
  @keyframes bob{50%{transform:translate(-50%,-58%) rotate(-5deg)}}
  @keyframes diveDown{30%{transform:translate(-50%,-30%) rotate(28deg) scale(.95)}100%{transform:translate(-50%,-50%)}}
  .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(255,80,80,.0),rgba(255,60,60,.55));opacity:0;z-index:3;pointer-events:none}
  .stage.hit{animation:camHit .5s var(--ease)}
  .stage.hit .flash{animation:flash .55s ease-out}
  @keyframes camHit{0%{transform:scale(1)}20%{transform:scale(1.07) translateX(-6px)}40%{transform:scale(1.06) translateX(5px)}60%{transform:scale(1.04) translateX(-3px)}100%{transform:scale(1)}}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  .stage.push{animation:camPush .9s var(--ease)}
  @keyframes camPush{35%{transform:scale(1.05)}100%{transform:scale(1)}}

  .hud{position:absolute;inset:0;z-index:4;display:flex;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 0;pointer-events:none}
  .hud .lbl{color:rgba(255,255,255,.7)}
  .depth{display:flex;align-items:baseline;gap:4px;margin-top:2px}
  .depth .roll{font-size:60px;font-weight:700;letter-spacing:-.045em;line-height:1}
  .depth .unit{font-size:18px;font-weight:600;color:rgba(255,255,255,.7)}
  .chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
  .hud-r{text-align:right}
  #pearlBox{display:inline-flex;align-items:center;gap:6px;margin-top:4px}
  #pearlBox .roll{font-size:28px;font-weight:700;letter-spacing:-.03em;color:var(--amber)}
  #pearlBox .gem{font-size:16px}
  .best{margin-top:6px;font-size:11px;color:rgba(255,255,255,.55)}

  /* 滾動數字：只有改變的位數會滾 */
  .roll{display:inline-flex;font-variant-numeric:tabular-nums}
  .dg{display:inline-block;height:1em;line-height:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
  .dg .st{display:flex;flex-direction:column;transition:transform .7s var(--ease)}
  .dg .st span{display:block;height:1em}

  /* ---------- 氧氣 ---------- */
  .meter{padding:6px 18px 0;flex:none;position:relative;z-index:2}
  .mrow{display:flex;align-items:baseline;justify-content:space-between}
  #o2Box{display:flex;align-items:baseline;gap:5px}
  #o2Box .roll{font-size:22px;font-weight:700;letter-spacing:-.02em}
  #o2Box .of{font-size:12px;color:var(--mute2)}
  .track{position:relative;height:8px;border-radius:5px;background:#1a1a1d;margin:8px 0 8px}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#3cc6dd,var(--cyan));transition:width .7s var(--ease),background .4s;box-shadow:0 0 14px rgba(107,227,245,.35)}
  .fill.mid{background:linear-gradient(90deg,#e0a43c,var(--amber));box-shadow:0 0 14px rgba(245,194,107,.35)}
  .fill.low{background:linear-gradient(90deg,#e04848,var(--red));box-shadow:0 0 14px rgba(255,107,107,.4)}
  .asc{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--red);border-radius:1px;transition:left .7s var(--ease)}
  .asc::before{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--red)}
  .sub{font-size:12.5px;min-height:18px;gap:10px}
  .log{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .log.in{animation:logIn .45s var(--ease)}
  .log.warn{color:var(--red)}
  @keyframes logIn{from{opacity:0;transform:translateY(6px)}}
  .asctxt{color:rgba(255,107,107,.85);flex:none;font-size:12px}

  /* ---------- 遺物托盤 ---------- */
  .tray{display:flex;gap:6px;padding:12px 18px 2px;min-height:46px;flex:none;align-items:center;overflow-x:auto;scrollbar-width:none}
  .tray::-webkit-scrollbar{display:none}
  .relic{flex:none;width:32px;height:32px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:16px;transition:opacity .3s,transform .3s var(--spring)}
  .relic.incoming{opacity:0;transform:scale(.6)}
  .relic.used{opacity:.25;filter:grayscale(1)}
  .tray .empty{font-size:12px;color:var(--mute2)}

  /* ---------- 選項卡 ---------- */
  .cards{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:6px 12px}
  .card{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px 12px 12px;
    animation:enter .5s var(--ease) backwards;transition:transform .32s var(--ease),opacity .28s ease,border-color .2s,background .2s}
  .card:active{transform:scale(.975);background:var(--card2)}
  @media (hover:hover){.card:hover{border-color:var(--line2)}}
  @keyframes enter{from{opacity:0;transform:translateY(16px) scale(.98)}}
  .card.picked{transform:translateY(-34px) scale(.94);opacity:0;transition-duration:.34s}
  .card.gone{transform:translateY(14px);opacity:0}
  .ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb,var(--k) 13%,transparent);border:1px solid color-mix(in srgb,var(--k) 22%,transparent)}
  .body{min-width:0;display:flex;flex-direction:column;gap:2px}
  .cat{font-size:10.5px;letter-spacing:.14em;font-weight:600;color:var(--k)}
  .tt{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .ds{font-size:12.5px;color:var(--mute);line-height:1.35}
  .ds .hl{color:var(--text)}
  .ds .bad{color:var(--red)}
  .cost{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
  .cost b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--cyan)}
  .cost small{font-size:10px;color:var(--mute2);letter-spacing:.08em}

  /* ---------- 上浮按鈕 ---------- */
  footer{flex:none;padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
  #surface{width:100%;height:58px;border-radius:18px;background:var(--text);color:#000;display:flex;align-items:center;justify-content:space-between;padding:0 20px;transition:background .3s,color .3s,transform .15s}
  #surface:active{transform:scale(.98)}
  #surface .sl{font-size:16px;font-weight:700}
  #surface .sr{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.75}
  #surface:disabled{background:var(--card);color:var(--mute);border:1px solid var(--line)}
  #surface.danger:disabled{color:var(--red);border-color:rgba(255,107,107,.25)}

  /* ---------- 飛行元素 ---------- */
  .fly{position:fixed;left:0;top:0;z-index:60;pointer-events:none;font-weight:750;font-size:20px;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;will-change:transform}
  .fly.relicfly{font-size:30px;filter:drop-shadow(0 6px 16px rgba(232,200,114,.55))}

  /* ---------- 底部抽屜 ---------- */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#0e0e10;border-top:1px solid var(--line2);border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .55s var(--spring);max-height:88%;overflow:auto}
  .sheet.open{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 16px}
  .sheet h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px}
  .sheet p{font-size:14px;color:var(--mute);line-height:1.55;margin-bottom:16px}
  .opt{display:grid;grid-template-columns:46px 1fr auto;gap:13px;align-items:center;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:8px;transition:transform .15s,opacity .2s}
  .opt:active{transform:scale(.98)}
  .opt:disabled{opacity:.35}
  .opt .price{font-size:15px;font-weight:650;color:var(--amber);font-variant-numeric:tabular-nums}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:18px;background:var(--text);color:#000;font-size:16px;font-weight:700;margin-top:8px}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}

  .result .eyebrow{margin-top:2px}
  .result .score{font-size:76px;font-weight:750;letter-spacing:-.05em;line-height:1;margin:8px 0 4px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;margin:16px 0 14px;overflow:hidden}
  .stats div{padding:12px 10px;border-right:1px solid var(--line)}
  .stats div:last-child{border-right:0}
  .stats b{display:block;font-size:18px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titlechip{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:650;padding:7px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line2)}
  .newbest{color:var(--amber);font-size:13px;font-weight:600;margin-left:8px}

  /* ---------- 開場 ---------- */
  .intro{position:absolute;inset:0;z-index:30;background:radial-gradient(120% 70% at 50% 0%,#0d4a7a 0%,#04192e 45%,#000 80%);display:flex;flex-direction:column;justify-content:flex-end;padding:28px 24px calc(24px + env(safe-area-inset-bottom));transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .intro.hide{opacity:0;transform:scale(1.04);pointer-events:none}
  .intro .big{font-size:64px;font-weight:800;letter-spacing:-.06em;line-height:.95;margin:10px 0 14px}
  .intro .big span{color:var(--cyan)}
  .intro .lead{font-size:15px;color:var(--mute);line-height:1.6;margin-bottom:22px}
  .intro ol{list-style:none;border-top:1px solid var(--line);margin-bottom:24px}
  .intro li{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82)}
  .intro li i{font-style:normal;color:var(--mute2);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
  .intro .bestline{font-size:12px;color:var(--mute2);text-align:center;margin-top:12px}
  .intro .d{font-size:96px;position:absolute;top:16%;left:50%;transform:translateX(-50%);animation:bobI 3s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(107,227,245,.25))}
  @keyframes bobI{50%{transform:translate(-50%,-10px) rotate(-6deg)}}

  /* ---------- v3：路線預告、負重、流派 ---------- */
  .stage{height:clamp(180px,28dvh,300px)}
  .cards{overflow-y:auto;scrollbar-width:none;justify-content:safe center}
  .card{padding:10px 14px 10px 12px}
  .tt .cat,.opt .cat{font-style:normal;margin-left:7px;font-size:10px;letter-spacing:.12em;font-weight:600;color:var(--k);vertical-align:1px}
  .nx{font-size:11.5px;color:var(--mute2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wn{font-size:11.5px;color:var(--red);font-weight:600}
  .card.risky{border-color:rgba(255,107,107,.28)}
  #surface.drop{background:var(--amber)}
  #surface .sl{white-space:nowrap}

  /* ---------- v4：分數顯示 ---------- */
  #mult{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--amber);font-variant-numeric:tabular-nums;margin-top:2px;display:inline-block}
  #mult.under{color:rgba(255,255,255,.85)}
  .best{margin-top:2px;font-size:12px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
  #pearlBox{margin-top:8px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
  #pearlBox .roll{font-size:14px;color:#fff;font-weight:600}
  #pearlBox .gem{font-size:12px}
  .card.hid{border-style:dashed}
  .intro{overflow-y:auto}
  .intro .d{top:9%;font-size:72px}
  .intro .big{font-size:52px}
  .intro .lead{margin-bottom:14px}
  .intro ol{margin-bottom:14px}
  .betbox{border:1px solid var(--line2);border-radius:18px;padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,.03)}
  .betrow1{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .betrow1 b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--amber)}
  #resetBal{font-size:11px;color:var(--mute);margin-left:10px;text-decoration:underline}
  .betrow2{display:grid;grid-template-columns:48px 1fr 48px 60px;gap:6px}
  .betrow2 button{height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
  .betrow2 input{height:44px;border-radius:12px;background:#000;border:1px solid var(--line2);color:var(--text);font:inherit;font-size:20px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;width:100%;min-width:0;-moz-appearance:textfield}
  .betrow2 input::-webkit-outer-spin-button,.betrow2 input::-webkit-inner-spin-button{-webkit-appearance:none}
  .btn:disabled{opacity:.4}
  .result .score{font-size:64px}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <section class="stage" id="stage">
    <div class="rays" id="rays"></div>
    <canvas id="cv"></canvas>
    <div class="diver" id="diver">🤿</div>
    <div class="flash"></div>
    <div class="hud">
      <div class="hud-l">
        <div class="lbl">深度</div>
        <div class="depth"><span class="roll" id="depth"></span><span class="unit">m</span></div>
        <div class="chip" id="zone"></div>
      </div>
      <div class="hud-r">
        <div class="lbl">分數</div>
        <div id="mult">0</div>
        <div class="best" id="best"></div>
        <div id="pearlBox"><span class="gem">💎</span><span class="roll" id="pearls"></span></div>
      </div>
    </div>
  </section>

  <section class="meter">
    <div class="mrow">
      <span class="lbl">氧氣</span>
      <span id="o2Box"><span class="roll" id="o2"></span><span class="of">/ <span id="o2max">100</span></span></span>
    </div>
    <div class="track" id="track"><div class="fill" id="fill"></div><div class="asc" id="asc"></div></div>
    <div class="mrow sub"><span class="log" id="log"></span><span class="asctxt" id="ascTxt"></span></div>
  </section>

  <div class="tray" id="tray"></div>
  <section class="cards" id="cards"></section>
  <footer><button id="surface"><span class="sl" id="sL">上浮結束</span><span class="sr" id="sR"></span></button></footer>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

  <div class="intro" id="intro">
    <div class="d">🤿</div>
    <div class="lbl">通勤小遊戲</div>
    <div class="big">一口氣<br><span>探險</span></div>
    <div class="lead">珍珠越多、潛得越深，分數越高。<br>活著上岸才算數，溺水就歸零。</div>
    <ol>
      <li><i>01</i><span>每層挑一條路往下潛。<b style="color:var(--red)">紅線</b>是上浮所需的氧氣，珍珠越重紅線越高</span></li>
      <li><i>02</i><span>隨時可以上浮結束這一趟，帶回當下的分數</span></li>
      <li><i>03</i><span>越深越暗、水雷越多。潛到第 40 層海底自動結束</span></li>
    </ol>
    <button class="btn" id="go">深吸一口氣</button>
    <div class="bestline" id="introBest"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const FAST = /fast/.test(location.hash);   // 測試用：略過動畫
const wait = ms => FAST ? Promise.resolve() : new Promise(r => setTimeout(r, ms));

/* ================= 資料 ================= */
// t = 流派標籤：同流派的遺物會互相加成
const RELICS = {
  shield:  { i:'🛡️', n:'防爆潛水服', d:'下一次水雷爆炸無效（用一次）', t:'水雷' },
  star:    { i:'⭐', n:'幸運海星',   d:'水雷爆炸機率 −15%', t:'水雷' },
  defuse:  { i:'🧤', n:'拆彈手套',   d:'躲過水雷時，珍珠再 ×2', t:'水雷' },
  blast:   { i:'🧨', n:'氣爆背包',   d:'水雷爆炸只扣 10 氧氣，而且珍珠照拿', t:'水雷' },
  catcher: { i:'🫧', n:'氣泡捕手',   d:'氣泡帶多補 10 氧氣', t:'氣泡' },
  lungs:   { i:'🫁', n:'大肺活量',   d:'氧氣上限 +30，並立刻補 30', t:'氣泡' },
  shell:   { i:'🐚', n:'呼吸貝殼',   d:'每下潛滿 5 層，補 20 氧氣', t:'氣泡' },
  overflow:{ i:'🫙', n:'集氣瓶',     d:'氧氣補到滿出來時，每溢出 1 點變成 2 顆珍珠', t:'氣泡' },
  puffer:  { i:'🐡', n:'河豚肺',     d:'氣泡帶不耗氧', t:'氣泡' },
  magnet:  { i:'🧲', n:'珍珠磁鐵',   d:'獲得的珍珠 +50%', t:'貪婪' },
  greed:   { i:'💰', n:'貪婪之心',   d:'珍珠 ×2，但每層耗氧 +2', t:'貪婪' },
  belt:    { i:'🪙', n:'黃金腰帶',   d:'每帶 40 顆珍珠，每層耗氧 −1（最多 −4）；被炸或被電會掉兩成珍珠', t:'貪婪' },
  ballast: { i:'🎈', n:'浮力袋',     d:'珍珠的重量減半', t:'貪婪' },
  abyss:   { i:'👁️', n:'深淵之眼',   d:'珍珠 ×3，但看不到耗氧和警告', t:'詛咒' },
  lead:    { i:'🪨', n:'鉛塊鞋',     d:'每層耗氧 −3，但上浮所需氧氣 +50%', t:'詛咒' },

  compass: { i:'🧭', n:'深海羅盤',   d:'每層多一個選項' },

  fins:    { i:'🧜', n:'人魚鰭',     d:'上浮所需的氧氣 −40%' }
};
const TAGCOL = { '水雷':'var(--red)', '氣泡':'var(--cyan)', '貪婪':'var(--amber)', '詛咒':'var(--violet)' };
const ZONES = [
  { d:0,  n:'淺海帶', e:'🌊', col:'#1386c7', rays:1,   c:['🐠','🐟','🐡','🐢'] },
  { d:10, n:'暮光帶', e:'🌅', rule:'每層有一張卡看不清楚', col:'#0b3e6e', rays:.35, c:['🐬','🦑','🪼','🐟'] },
  { d:20, n:'午夜帶', e:'🌑', rule:'水雷變多，氣泡變少', col:'#061a33', rays:0,   c:['🪼','🦐','🦈','🐋'] },
  { d:30, n:'深淵帶', e:'🕳️', rule:'兩張卡看不清楚，也看不到下一層', col:'#02060d', rays:0,   c:['🦑','🐙','🪼','👁️'] }
];
// [分類, 顏色, 圖示, 名稱]
const KIND = {
  bubble:  ['補給','var(--cyan)','🫧','氣泡帶'],
  treasure:['寶藏','var(--amber)','🧰','寶箱'],
  mine:    ['高風險','var(--red)','💣','水雷區'],
  shortcut:['捷徑','var(--violet)','🌀','捷徑洋流'],
  cave:    ['未知','#9aa3ad','🕳️','未知洞穴'],
  wreck:   ['遺物','var(--gold)','🏛️','沉船'],
  shop:    ['交易','var(--green)','🐚','寄居蟹商人']
};

/* ================= 規則 ================= */
let S;
const has = id => S.relics.includes(id);
const zoneOf = d => [...ZONES].reverse().find(z => d >= z.d);
const layerCost = () => Math.max(2, Math.round(6 + S.depth * 0.35) - (has('coral') ? 1 : 0) + (has('greed') ? 2 : 0) - (has('lead') ? 3 : 0) - (has('belt') ? Math.min(4, Math.floor(S.pearls / 40)) : 0));
// 上浮所需 = 深度 + 珍珠的重量（每 10 顆 +1）
const baseAscent = (d = S.depth) => Math.ceil(d * 1.2 * (has('fins') ? 0.6 : 1) * (has('lead') ? 1.5 : 1));
const weightOf = (p = S.pearls) => Math.floor(Math.floor(p / 10) * (has('ballast') ? 0.5 : 1));
const ascentCost = (d = S.depth, p = S.pearls) => baseAscent(d) + weightOf(p);
const pearlMult = () => (has('magnet') ? 1.5 : 1) * (has('greed') ? 2 : 1) * (has('abyss') ? 3 : 1);
const mineChance = () => Math.max(0.08, Math.min(0.6, 0.25 + S.depth * 0.006 - (has('star') ? 0.15 : 0)));
const priceMult = () => has('crab') ? 0.6 : 1;
const unowned = () => Object.keys(RELICS).filter(k => !has(k));
function loadBest() { try { return +localStorage.getItem('diveBestScore') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('diveBestScore', v); } catch (e) {} }
// 點數由 Deep Sea Arcade 父頁的共用錢包處理（deepSeaDive 橋接）；此頁不保存點數
const BOTTOM = 40;
// 分數 = 珍珠 + 深度×2，只作為成績與最佳紀錄，不換算點數
const multOf = (p = S.pearls, d = S.depth) => Math.max(0, Math.floor(p + d * 2));
// 要丟幾顆珍珠才浮得上去：0 = 不用丟，-1 = 丟光也不夠
function dropNeeded() {
  if (S.o2 >= ascentCost()) return 0;
  if (S.o2 < baseAscent()) return -1;
  for (let p = S.pearls; p >= 0; p--) if (ascentCost(S.depth, p) <= S.o2) return S.pearls - p;
  return -1;
}

// 某一層會出現哪些地點
function pickKinds(depthAt, count, have = []) {
  // 午夜帶以下：水雷變多、氣泡變少
  const deep = depthAt >= 20;
  const Wt = { bubble: deep ? 14 : 22, treasure:24, mine: depthAt >= 2 ? (deep ? 24 : 16) : 0, cave:18, shortcut:12, shop: depthAt >= 4 ? 8 : 0 };
  const out = [];
  if ((depthAt + 1) % 5 === 0 && unowned().length && !have.includes('wreck') && count > 0) out.push('wreck');
  while (out.length < count) {
    const pool = Object.entries(Wt).filter(([k, w]) => w > 0 && !have.includes(k) && !out.includes(k));
    if (!pool.length) break;
    let x = Math.random() * pool.reduce((a, [, w]) => a + w, 0);
    for (const [k, w] of pool) { x -= w; if (x <= 0) { out.push(k); break; } }
  }
  return out;
}
function genCard(kind) {
  const base = layerCost();
  const treasure = () => Math.round((5 + S.depth * 1.2) * rand(0.8, 1.25));
  const K = KIND[kind];
  let c;
  switch (kind) {
    case 'bubble': { const g = ri(14, 24) + (has('catcher') ? 10 : 0);
      c = { ds:`氧氣 <span class="hl">+${g}</span>`, cost: has('puffer') ? 0 : base, dd:1, g }; break; }
    case 'treasure': { const p = Math.round(treasure() * pearlMult());
      c = { ds:`珍珠 <span class="hl">+${p}</span>`, cost: base, dd:1, p }; break; }
    case 'mine': { const p = Math.round(treasure() * 2.5 * pearlMult()), ch = mineChance(), dmg = has('blast') ? 10 : 25;
      c = { ds:`珍珠 <span class="hl">+${p}${has('defuse') ? ' ×2' : ''}</span> · <span class="bad">${Math.round(ch * 100)}% 爆炸 −${dmg}</span>${S.shield ? ' · 🛡️' : ''}`, cost: base, dd:1, p, ch }; break; }
    case 'shortcut': { const dd = ri(2, 3);
      c = { ds:`一口氣下潛 <span class="hl">${dd} 層</span>`, cost: Math.max(2, Math.round(base * 1.6 * (has('turtle') ? 0.5 : 1))), dd }; break; }
    case 'cave': { const r = Math.random();
      const out = r < 0.32 && unowned().length ? { t:'relic', d:'遠古遺物' }
        : r < 0.57 ? (v => ({ t:'pearl', v, d:`珍珠 +${v}` }))(Math.round(treasure() * 1.8 * pearlMult()))
        : r < 0.78 ? { t:'air', v:25, d:'空氣囊 +25' }
        : { t:'eel', v:20, d:'電鰻 −20 氧氣' };
      c = { ic: has('lamp') ? '🔦' : K[2], ds: has('lamp') ? `照到了：<span class="hl">${out.d}</span>` : '可能是寶物，也可能是危險', cost: base + 1, dd:1, out }; break; }
    case 'wreck': c = { ds:'從 2 個遺物中挑 1 個', cost: base, dd:1 }; break;
    case 'shop':  c = { ds:'用珍珠換氧氣或遺物', cost: base, dd:1 }; break;
  }
  c.kind = kind; c.ic = c.ic || K[2]; c.tt = K[3];
  c.next = pickKinds(S.depth + c.dd, 2);   // 走這條路，下一層會看到的地點
  return c;
}

/* ================= 滾動數字 ================= */
function setRoll(el, v) {
  const s = String(Math.max(0, Math.round(v)));
  let cols = [...el.children];
  while (cols.length < s.length) {
    const d = document.createElement('span'); d.className = 'dg';
    d.innerHTML = '<span class="st">' + '0123456789'.split('').map(n => `<span>${n}</span>`).join('') + '</span>';
    el.prepend(d); cols.unshift(d); void d.offsetHeight;
  }
  while (cols.length > s.length) cols.shift().remove();
  s.split('').forEach((ch, i) => { cols[i].firstChild.style.transform = `translateY(${-ch}em)`; });
}

/* ================= 畫面 ================= */
function renderDepth() {
  setRoll($('#depth'), S.depth * 10);
  const z = zoneOf(S.depth);
  $('#zone').textContent = `${z.e} ${z.n} · 第 ${S.depth} 層`;
  if (S.zone !== z) {
    if (S.zone && z.rule) S.zoneNote = `進入${z.n}：${z.rule}`;
    S.zone = z;
    $('#stage').style.backgroundColor = z.col;
    $('#rays').style.opacity = z.rays;
    setCritters(z);
  }
  renderAscent();
}
function renderPearls() { setRoll($('#pearls'), S.pearls); renderAscent(); }
function renderO2() {
  const v = Math.max(0, S.o2);
  setRoll($('#o2'), v);
  $('#o2max').textContent = S.max;
  const pct = v / S.max;
  const f = $('#fill');
  f.style.width = pct * 100 + '%';
  f.className = 'fill' + (pct > .5 ? '' : pct > .25 ? ' mid' : ' low');
  renderAscent();
}
function renderMult() {
  const m = S.bet ? multOf() : 0;
  const el = $('#mult');
  const txt = String(m);
  if (el.textContent !== txt) { el.textContent = txt; if (S.bet) pulse(el); }
  $('#best').textContent = '';
  if (S.hosted && !S.over && diveHost()) diveHost().live(window, m, S.depth);
}
function renderAscent() {
  renderMult();
  const ac = ascentCost(), w = weightOf();
  $('#asc').style.left = Math.min(100, ac / S.max * 100) + '%';
  $('#ascTxt').textContent = w ? `上浮線 ${ac}（負重 ${w}）` : `上浮線 ${ac}`;
  const drop = S.depth > 0 ? dropNeeded() : -1;
  const b = $('#surface');
  b.disabled = drop < 0 || S.over;
  b.classList.toggle('danger', S.depth > 0 && drop < 0);
  b.classList.toggle('drop', drop > 0);
  if (S.depth === 0) { $('#sL').textContent = '先往下潛吧'; $('#sR').textContent = ''; }
  else if (drop === 0) { $('#sL').textContent = '⬆ 上浮結束'; $('#sR').textContent = `${multOf()} 分`; }
  else if (drop > 0) { $('#sL').textContent = `⬆ 丟 ${drop} 💎 減重上浮`; $('#sR').textContent = `${multOf(S.pearls - drop)} 分`; }
  else { $('#sL').textContent = '氧氣低於上浮線'; $('#sR').textContent = `需 ${baseAscent()}`; }
}
function renderTray(incoming) {
  const t = $('#tray');
  if (!S.relics.length) { t.innerHTML = '<span class="empty">還沒有遺物</span>'; return null; }
  t.innerHTML = S.relics.map(k => {
    const used = (k === 'shield' && !S.shield) || (k === 'rope' && S.ropeUsed);
    const col = TAGCOL[RELICS[k].t];
    return `<button class="relic ${used ? 'used' : ''} ${k === incoming ? 'incoming' : ''}" data-k="${k}" ${col ? `style="border-color:color-mix(in srgb,${col} 55%,transparent)"` : ''}>${RELICS[k].i}</button>`;
  }).join('');
  t.querySelectorAll('.relic').forEach(el => el.onclick = () => { const r = RELICS[el.dataset.k]; log(`${r.i} ${r.n}${r.t ? `〔${r.t}〕` : ''}：${r.d}`); });
  return incoming ? t.querySelector(`[data-k="${incoming}"]`) : null;
}
function renderCards() {
  const box = $('#cards'); box.innerHTML = '';
  const blind = has('abyss'), safeNow = S.o2 >= ascentCost();
  S.choices.forEach((c, i) => {
    const hid = c.hidden;
    const [cat, col] = hid ? ['看不清楚', '#9aa3ad'] : KIND[c.kind];
    let warn = '';
    if (!blind) {
      const after = Math.min(S.max, S.o2 - c.cost + (c.kind === 'bubble' && !hid ? c.g : 0));
      if (S.o2 - c.cost <= 0) warn = '氧氣不夠，選了會溺水';
      else if (safeNow && after < ascentCost(S.depth + (hid ? 1 : c.dd))) warn = '選了會低於上浮線';
    }
    const nx = hid || S.noPreview ? '' : `<span class="nx">↳ 下一層 ${c.next.map(k => `${KIND[k][2]} ${KIND[k][3]}`).join(' · ')} · …</span>`;
    const b = document.createElement('button');
    b.className = 'card' + (warn ? ' risky' : '') + (hid ? ' hid' : '');
    b.style.setProperty('--k', col);
    b.style.animationDelay = i * 0.06 + 's';
    b.innerHTML = `<span class="ico">${hid ? '🌫️' : c.ic}</span>
      <span class="body"><span class="tt">${hid ? '漆黑的水域' : c.tt}<em class="cat">${cat}</em></span><span class="ds">${hid ? '太暗了，進去才知道是什麼' : c.ds}</span>
        ${warn ? `<span class="wn">⚠ ${warn}</span>` : ''}${nx}</span>
      <span class="cost"><b>${blind ? '−?' : '−' + c.cost}</b><small>氧氣</small></span>`;
    b.onclick = () => choose(c, b);
    box.appendChild(b);
  });
}
function log(t, warn) { const l = $('#log'); l.textContent = t; l.className = 'log' + (warn ? ' warn' : ''); void l.offsetWidth; l.classList.add('in'); }

/* ================= 動態：飛行與鏡頭 ================= */
const centerOf = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
function pulse(el) { el.animate([{ transform:'scale(1)' }, { transform:'scale(1.14)' }, { transform:'scale(1)' }], { duration: 340, easing:'cubic-bezier(.2,.8,.2,1)' }); }
function fly(html, cls, from, toEl, color) {
  if (FAST) return Promise.resolve();
  return new Promise(res => {
    const n = document.createElement('div');
    n.className = 'fly ' + (cls || ''); n.innerHTML = html; if (color) n.style.color = color;
    document.body.appendChild(n);
    const to = centerOf(toEl);
    const mx = (from.x + to.x) / 2, my = Math.min(from.y, to.y) - 50;
    const T = (x, y, s) => `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s})`;
    const a = n.animate([
      { transform: T(from.x, from.y, .6), opacity: 0 },
      { transform: T(from.x, from.y - 34, 1.15), opacity: 1, offset: .28 },
      { transform: T(mx, my, 1), opacity: 1, offset: .62 },
      { transform: T(to.x, to.y, .55), opacity: .25 }
    ], { duration: 820, easing: 'cubic-bezier(.45,0,.2,1)' });
    a.onfinish = () => { n.remove(); pulse(toEl); res(); };
  });
}
function floatAt(html, color) {
  const p = centerOf($('#diver'));
  const n = document.createElement('div');
  n.className = 'fly'; n.innerHTML = html; n.style.color = color;
  document.body.appendChild(n);
  const T = (y, s) => `translate(${p.x}px,${y}px) translate(-50%,-50%) scale(${s})`;
  n.animate([{ transform: T(p.y, .7), opacity: 0 }, { transform: T(p.y - 30, 1.15), opacity: 1, offset: .25 }, { transform: T(p.y - 70, 1), opacity: 0 }],
    { duration: 1100, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => n.remove();
}
function cam(cls) { const s = $('#stage'); s.classList.remove('hit', 'push'); void s.offsetWidth; s.classList.add(cls); }
const diverPt = () => centerOf($('#diver'));

async function gainPearls(v, from) { S.pearls += v; await fly(`+${v}`, '', from || diverPt(), $('#pearlBox'), 'var(--amber)'); renderPearls(); }
async function gainO2(v, from) {
  const over = Math.max(0, S.o2 + v - S.max);
  S.o2 = Math.min(S.max, S.o2 + v);
  await fly(`+${v}`, '', from || diverPt(), $('#o2Box'), 'var(--cyan)'); renderO2();
  if (over > 0 && has('overflow')) { log(`🫙 集氣瓶：溢出的 ${over} 氧氣變成珍珠`); await gainPearls(over * 2, centerOf($('#o2Box'))); }
}
async function gainRelic(k, from) {
  S.relics.push(k);
  if (k === 'lungs') { S.max += 30; S.o2 += 30; }
  if (k === 'shield') S.shield++;
  const chip = renderTray(k);
  cam('push');
  log(`${RELICS[k].i} ${RELICS[k].n}：${RELICS[k].d}`);
  buzz([10, 30, 10]);
  await fly(RELICS[k].i, 'relicfly', from || diverPt(), chip);
  chip.classList.remove('incoming');
  if (k === 'lungs') renderO2();
}

/* ================= 舞台粒子 ================= */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, boost = 0, lastTs = 0, critters = [];
const snow = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: rand(.5, 1.9), a: rand(.15, .55), s: rand(.4, 1.2) }));
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function setCritters(z) {
  critters = Array.from({ length: 3 }, () => ({ e: pick(z.c), x: Math.random(), y: rand(.2, .85), v: rand(.012, .035) * (Math.random() < .5 ? -1 : 1), ph: rand(0, 6), s: rand(18, 26), a: rand(.55, .85) }));
}
function frame(ts) {
  if (!diveActive) { requestAnimationFrame(frame); return; }
  const dt = Math.min(.05, (ts - (lastTs || ts)) / 1000); lastTs = ts;
  boost *= Math.pow(.05, dt);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (const p of snow) {
    p.y -= (.015 + boost * .9) * p.s * dt;
    if (p.y < -.03) { p.y = 1.03; p.x = Math.random(); }
    ctx.globalAlpha = Math.min(1, p.a * (1 + boost * .6));
    const len = boost * 18 * p.s;
    if (len > 1.5) { ctx.fillRect(p.x * W - p.r / 2, p.y * H, p.r, len); }
    else { ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.r, 0, 7); ctx.fill(); }
  }
  for (const c of critters) {
    c.x += c.v * dt; c.y -= boost * .55 * dt; c.ph += dt * 1.6;
    if (c.x < -.15) c.x = 1.15; if (c.x > 1.15) c.x = -.15;
    if (c.y < -.15) { c.y = 1.15; c.x = Math.random(); c.e = pick(S && S.zone ? S.zone.c : ZONES[0].c); }
    ctx.save();
    ctx.globalAlpha = c.a;
    ctx.translate(c.x * W, c.y * H + Math.sin(c.ph) * 4);
    if (c.v > 0) ctx.scale(-1, 1);
    ctx.font = `${c.s}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.e, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
function descend(dd) {
  boost = Math.min(3, boost + 1.1 * dd);
  const d = $('#diver'); d.classList.remove('dive'); void d.offsetWidth; d.classList.add('dive');
  setTimeout(() => d.classList.remove('dive'), 750);
}

/* ================= 流程 ================= */
function newChoices() {
  const n = 3 + (has('compass') ? 1 : 0);
  let kinds = (S.pendingNext || []).filter(k => k !== 'wreck' || unowned().length).slice(0, n);
  S.pendingNext = null;
  if (S.o2 < 30 && !kinds.includes('bubble') && kinds.length < n && Math.random() < 0.7) kinds.push('bubble');
  kinds = kinds.concat(pickKinds(S.depth, n - kinds.length, kinds));
  S.choices = kinds.map(genCard);
  // 越深越暗：暮光帶起每層有 1 張看不清楚，深淵帶 2 張，而且看不到下一層
  const zi = S.depth >= 30 ? 3 : S.depth >= 20 ? 2 : S.depth >= 10 ? 1 : 0;
  S.noPreview = zi >= 3;
  if (!has('lamp')) {
    const cand = shuffle(S.choices.filter(c => c.kind !== 'wreck'));
    cand.slice(0, zi >= 3 ? 2 : zi >= 1 ? 1 : 0).forEach(c => { c.hidden = true; });
  }
  renderCards();
  S.busy = false;
  if (S.o2 < baseAscent()) log('氧氣已經低於上浮線，只能賭氣泡帶了', true);
  else if (S.o2 < ascentCost()) log('珍珠太重了：可以丟一些減重上浮', true);
  else if (S.zoneNote) log(S.zoneNote, true);
  S.zoneNote = null;
}
async function beltLoss() {
  if (!has('belt') || S.pearls <= 0) return;
  const lost = Math.ceil(S.pearls * 0.2);
  S.pearls -= lost; renderPearls();
  await wait(350); floatAt(`−${lost} 💎`, 'var(--amber)'); await wait(500);
}

async function choose(c, el) {
  if (S.over || S.busy) return;
  S.busy = true; buzz(12);
  [...$('#cards').children].forEach((k, i) => {
    if (k === el) k.classList.add('picked');
    else { k.style.transitionDelay = i * 35 + 'ms'; k.classList.add('gone'); }
  });
  const before = S.depth;
  S.o2 -= c.cost; S.depth += c.dd;
  S.pendingNext = c.next;
  await wait(170);
  descend(c.dd); renderDepth(); renderO2();
  if (S.hosted && diveHost()) diveHost().progress(window, S.depth);
  await wait(260);

  let modal = null;
  switch (c.kind) {
    case 'bubble': log('穿過一串氣泡，大口吸氣'); await gainO2(c.g); break;
    case 'treasure': log('打開寶箱，閃閃發亮'); await gainPearls(c.p); break;
    case 'mine':
      if (Math.random() < c.ch) {
        if (S.shield > 0) { S.shield--; renderTray(); cam('push'); log('爆炸了！但防爆衣擋下來，珍珠照拿'); await gainPearls(c.p); }
        else {
          const dmg = has('blast') ? 10 : 25;
          S.o2 -= dmg; cam('hit'); buzz(140); floatAt(`💥 −${dmg}`, 'var(--red)'); renderO2();
          if (has('blast')) { log('炸開了！氣爆背包擋掉大半，珍珠照拿', true); await wait(500); if (S.o2 > 0) await gainPearls(c.p); }
          else { log('碰到水雷！氧氣瓶漏氣了', true); await wait(700); }
          await beltLoss();
        }
      } else {
        const p = c.p * (has('defuse') ? 2 : 1);
        log(has('defuse') ? '俐落地拆掉水雷，珍珠加倍' : '小心繞過水雷，撿到一大把珍珠'); await gainPearls(p);
      }
      break;
    case 'shortcut': log(`順著洋流一路往下衝了 ${c.dd} 層`); await wait(500); break;
    case 'cave': {
      const o = c.out;
      if (o.t === 'relic') { const k = pick(unowned()); if (k) await gainRelic(k); }
      else if (o.t === 'pearl') { log('洞穴深處藏著一堆珍珠'); await gainPearls(o.v); }
      else if (o.t === 'air') { log('找到一個空氣囊，好險'); await gainO2(o.v); }
      else { S.o2 -= o.v; cam('hit'); buzz(140); floatAt(`⚡ −${o.v}`, 'var(--red)'); renderO2(); log('被電鰻電了一下！', true); await wait(700); await beltLoss(); }
      break; }
    case 'wreck': modal = wreckSheet; log('發現一艘沉船…'); break;
    case 'shop': modal = shopSheet; log('一隻寄居蟹揮了揮鉗子'); break;
  }
  if (has('shell') && S.o2 > 0) {
    const n = Math.floor(S.depth / 5) - Math.floor(before / 5);
    if (n > 0) await gainO2(20 * n, centerOf($('#tray').querySelector('[data-k="shell"]')));
  }
  S.o2 = Math.min(S.o2, S.max);
  renderO2();
  if (S.o2 <= 0) { S.over = true; renderAscent(); await wait(400); return drown(); }
  if (S.depth >= BOTTOM) { S.over = true; renderAscent(); await wait(400); return endRun('bottom'); }
  if (modal) return modal();
  newChoices();
}
/* ================= 抽屜 ================= */
function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  $('#scrim').classList.add('open'); $('#sheet').classList.add('open');
}
function closeSheet() { $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); }
const optHTML = (ic, k, title, desc, right, attrs = '') => `<button class="opt" ${attrs} style="--k:${k}"><span class="ico">${ic}</span><span class="body"><span class="tt">${title}</span><span class="ds">${desc}</span></span>${right || ''}</button>`;

function wreckSheet() {
  // 其中一個選項偏向你已經在走的流派
  const un = unowned();
  const tags = new Set(S.relics.map(k => RELICS[k].t).filter(t => t && t !== '詛咒'));
  const syn = shuffle(un.filter(k => tags.has(RELICS[k].t)));
  const opts = [];
  if (syn.length && Math.random() < 0.75) opts.push(syn[0]);
  shuffle(un).forEach(k => { if (opts.length < 2 && !opts.includes(k)) opts.push(k); });
  const tagOf = k => { const t = RELICS[k].t; return t ? `<em class="cat">${t === '詛咒' ? '詛咒' : t + '流'}</em>` : ''; };
  openSheet(`<div class="lbl" style="color:var(--gold)">沉船・第 ${S.depth} 層</div><h2>挑一個帶走</h2><p>同一個流派的遺物會互相加成。</p>
    ${opts.map(k => optHTML(RELICS[k].i, TAGCOL[RELICS[k].t] || 'var(--gold)', RELICS[k].n + tagOf(k), RELICS[k].d, '', `data-k="${k}"`)).join('')}`);
  document.querySelectorAll('#sheetBody .opt').forEach(b => b.onclick = async () => {
    const from = centerOf(b.querySelector('.ico'));
    closeSheet();
    await gainRelic(b.dataset.k, from);
    S.o2 = Math.min(S.o2, S.max); renderO2();
    newChoices();
  });
}
function shopSheet() {
  const pAir = Math.round((12 + S.depth) * priceMult());
  const pRel = Math.round((25 + S.depth * 1.5) * priceMult());
  const canRel = unowned().length > 0;
  openSheet(`<div class="lbl" style="color:var(--green)">寄居蟹商人</div><h2>要買點什麼？</h2><p>你身上有 💎 ${S.pearls}。花掉珍珠也會變輕。</p>
    ${optHTML('🫁', 'var(--cyan)', '氧氣瓶', '氧氣 +30', `<span class="price">💎 ${pAir}</span>`, `id="bAir" ${S.pearls < pAir ? 'disabled' : ''}`)}
    ${optHTML('🎁', 'var(--gold)', '神秘遺物', '隨機一個沒有的遺物', `<span class="price">💎 ${pRel}</span>`, `id="bRel" ${S.pearls < pRel || !canRel ? 'disabled' : ''}`)}
    <button class="btn ghost" id="bLeave">不買，繼續潛</button>`);
  $('#bAir').onclick = async () => {
    const from = centerOf($('#bAir .ico'));
    S.pearls -= pAir; renderPearls(); closeSheet();
    log('買了一瓶氧氣');
    await gainO2(30, from); newChoices();
  };
  $('#bRel').onclick = async () => {
    const from = centerOf($('#bRel .ico'));
    S.pearls -= pRel; renderPearls(); closeSheet();
    await gainRelic(pick(unowned()), from);
    S.o2 = Math.min(S.o2, S.max); renderO2(); newChoices();
  };
  $('#bLeave').onclick = () => { closeSheet(); newChoices(); };
}

function endRun(kind, note) {
  S.over = true; renderAscent();
  const pearls = kind === 'drown' ? 0 : kind === 'rope' ? Math.floor(S.pearls / 2) : S.pearls;
  const m = kind === 'drown' ? 0 : multOf(pearls);

  const bestM = loadBest(), isBest = m > bestM;
  if (isBest) saveBest(m);
  S.result = { kind, m };
  const host = S.hosted ? diveHost() : null;
  const paid = host ? host.finish(window, { kind, score: m, depth: S.depth, pearls }) : null;
  const H = { up: ['平安上岸', 'var(--green)'], bottom: ['潛到海底了', 'var(--gold)'], rope: ['救生繩把你拉上來了', 'var(--gold)'], drown: ['氧氣耗盡', 'var(--red)'] }[kind];
  const msg = kind === 'drown' ? '珍珠全掉進深海，這一趟分數歸零。'
    : `${note || ''}${kind === 'rope' ? '保住一半珍珠。' : ''}帶著 ${pearls} 顆珍珠回到水面。`;
  openSheet(`<div class="result">
    <div class="lbl eyebrow" style="color:${H[1]}">${H[0]}</div>
    <div class="score" style="color:${m > 0 ? 'var(--amber)' : 'var(--text)'}">${m} 分</div>
    <p style="margin-bottom:0">${msg}${isBest && m > 0 ? '<span class="newbest">最佳紀錄</span>' : ''}</p>
    <div class="stats">
      <div><span class="lbl">最深</span><b>${S.depth * 10} m</b></div>
      <div><span class="lbl">珍珠</span><b>${pearls}</b></div>
      <div><span class="lbl">遺物</span><b>${S.relics.length} 個</b></div>
    </div>
    <span class="titlechip">${S.relics.map(k => RELICS[k].i).join(' ') || '沒有遺物'}</span>
    <div style="height:14px"></div>
    <button class="btn" id="again">再潛一次</button>
  </div>`);


  $('#again').onclick = () => { closeSheet(); showIntro(); };
}
function surface() {
  if (S.over || S.busy || S.depth === 0) return;
  const drop = dropNeeded();
  if (drop < 0) return;
  buzz([20, 40, 20]);
  boost = -1.5;
  if (drop > 0) { S.pearls -= drop; renderPearls(); }
  endRun('up', drop > 0 ? `丟掉 ${drop} 顆珍珠減重。` : '');
}
function drown() {
  if (has('rope') && !S.ropeUsed) { S.ropeUsed = true; renderTray(); endRun('rope'); }
  else { buzz(300); endRun('drown'); }
}
function newRun(bet, hosted) {
  S = { bet, hosted: !!hosted, o2: 100, max: 100, depth: 0, pearls: 0, relics: [], shield: 0, ropeUsed: false, over: false, busy: true, zone: null, choices: [] };
  renderDepth(); renderPearls(); renderO2(); renderTray();
  $('#cards').innerHTML = '';
  log('深吸一口氣，出發');
  setTimeout(async () => {
    await gainRelic(pick(['coral', 'catcher', 'magnet', 'star', 'shell']));
    newChoices();
  }, FAST ? 0 : 350);
}
/* ================= 開場 ================= */
// 這個 demo 不處理點數。平台串接時只扣固定入場點數；分數只作成績，不換算點數。
function showIntro() {
  $('#introBest').textContent = loadBest() ? `最佳分數 ${loadBest()} 分` : '';
  $('#intro').classList.remove('hide');
}
// 開場按鈕與平台右側「開始下潛」共用同一個開局流程，由父頁決定是否免費
function beginRound() {
  const host = diveHost();
  let bet = 0;                                  // 單獨開啟時維持原本免費的示範模式
  if (host) {
    const started = host.start(window);
    if (!started) { $('#introBest').textContent = '遊戲尚未準備完成，請稍後重試。'; return false; }
  }
  closeSheet(); $('#intro').classList.add('hide'); newRun(bet, !!host);
  return true;
}
$('#go').onclick = beginRound;
window.startDivePlatformRound = beginRound;
// 平台橋接：在 Deep Sea Arcade 內由父頁免費、結算與追蹤
function diveHost() { try { return window.parent !== window ? window.parent.deepSeaDive || null : null; } catch (e) { return null; } }
let diveActive = true;
window.setDivePlatformActive = v => { diveActive = !!v; lastTs = 0; if (diveActive) resize(); };
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => { const h = diveHost(); if (h) h.touch(window); }, { capture: true, passive: true }));
$('#surface').onclick = surface;
window.addEventListener('resize', resize);

S = { bet: 0, o2: 100, max: 100, depth: 0, pearls: 0, relics: [], shield: 0, choices: [], zone: null, over: true, busy: true };
renderDepth(); renderPearls(); renderO2(); renderTray();
showIntro();
resize(); requestAnimationFrame(frame);
</script>
</body>
