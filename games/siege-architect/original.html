<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c2840">
<title>萌獸破城隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --out:#1d1a24; --bg:#2c2840; --cream:#fff3d6; --cream2:#f6e3b4; --yellow:#ffd23f; --red:#ff5247; --green:#35d07a; --blue:#3d8bff;
    --slot:#463f63; --slot2:#51497a; --text:#fff8e8; --mute:rgba(255,248,232,.72); --ink:#1d1a24; --ink2:rgba(29,26,36,.62);
    --font:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  }
  html[lang=en]{--font:"Fredoka","Noto Sans TC",system-ui,sans-serif}
  html[lang=zh-Hans]{--font:"Noto Sans SC","Noto Sans TC",system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;color:var(--text);font-family:var(--font);font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;
    background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.07) 1.6px,transparent 1.8px);background-size:22px 22px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  img.ic{width:1.25em;height:1.25em;vertical-align:-.28em;display:inline-block}
  .num{font-variant-numeric:tabular-nums}
  .box{background:var(--cream);color:var(--ink);border:3px solid var(--out);border-radius:10px;box-shadow:0 4px 0 var(--out)}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:10px 16px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;padding:4px 10px;height:40px;white-space:nowrap}
  .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:18px;font-weight:900}
  .title small{font-size:12px;color:var(--ink2);font-weight:700;margin-right:6px}
  .stat{font-size:17px}
  .stat img{width:24px;height:24px}
  .stat.bad{animation:shake .35s;background:#ffb3ad}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .iconbtn{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center}
  .iconbtn svg{width:22px;height:22px}
  canvas#cv{position:fixed;inset:0;display:block;touch-action:none;background:#7bd35a}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 12px 0;pointer-events:none;z-index:5}
  #hud>*{pointer-events:auto}
  #panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:6;background:rgba(44,40,64,.95);border:3px solid var(--out);border-bottom:0;
    border-radius:18px 18px 0 0;box-shadow:0 -5px 0 rgba(29,26,36,.35);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .phead{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .phead .actions{display:flex;gap:8px}
  .pbody{display:flex;flex-direction:column;gap:10px;overflow:hidden;transition:max-height .34s cubic-bezier(.3,.8,.3,1),opacity .26s ease,margin-top .34s cubic-bezier(.3,.8,.3,1)}
  #panel:not(.open) .pbody{max-height:0 !important;opacity:0;margin-top:-10px;pointer-events:none}
  #legend{display:none}
  .tip{position:fixed;left:0;top:0;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,-100%) translateY(6px) scale(.9);transform-origin:50% 100%;
    transition:opacity .18s ease,transform .22s cubic-bezier(.3,1.5,.5,1);background:var(--cream);color:var(--ink);border:3px solid var(--out);border-radius:12px;
    box-shadow:0 4px 0 var(--out);padding:6px 11px 7px;white-space:nowrap;text-align:left}
  .tip.show{opacity:1;transform:translate(-50%,-100%) translateY(-6px) scale(1)}
  .tip b{font-size:15px;font-weight:900}
  .tip .r{font-size:14px;margin-top:2px}
  .tip .st{font-size:11.5px;color:var(--ink2);margin-top:2px}
  .tip::after{content:'';position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--cream);border-right:3px solid var(--out);border-bottom:3px solid var(--out);transform:translateX(-50%) rotate(45deg)}
  .tip.wide{white-space:normal;width:270px}
  .tip.wide .r{font-size:13px;line-height:1.4;font-weight:500;margin-top:4px}
  .tip.wide .st{margin-top:3px}
  .coach{position:fixed;left:0;top:0;width:30px;height:36px;z-index:9;pointer-events:none;opacity:0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .coachunit{position:fixed;left:0;top:0;width:52px;height:52px;z-index:8;pointer-events:none;opacity:0}
  .card.new::before{content:attr(data-new);position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:2;background:var(--red);color:#fff;
    border:2px solid var(--out);border-radius:999px;padding:0 7px;font-size:11px;line-height:16px;font-weight:900;letter-spacing:.04em;animation:newBob 1.1s ease-in-out infinite}
  @keyframes newBob{50%{transform:translateX(-50%) translateY(-3px)}}
  .btn.go.pulse{animation:goPulse 1.2s ease-in-out infinite}
  @keyframes goPulse{50%{box-shadow:0 4px 0 var(--out),0 0 0 6px rgba(255,210,63,.55)}}
  #panelBtn{padding:8px 14px}
  #panelBtn svg{transition:transform .2s}
  #panel:not(.open) #panelBtn svg{transform:rotate(180deg)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:13px}
  .legend span{padding:2px 9px 2px 5px;border-radius:999px;border-width:2px;box-shadow:0 2px 0 var(--out);font-weight:700}
  .goals{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:13px}
  .goals span{display:flex;align-items:center;gap:4px;padding:2px 9px 2px 5px;border-radius:999px;border-width:2px;box-shadow:0 2px 0 var(--out)}
  .goals span.met{background:#c6f2b8}
  .goals span.miss{background:#efe3c8;color:var(--ink2)}
  .goals .best{background:var(--slot);color:var(--text);border-color:var(--out)}
  .goals .best img{width:15px;height:15px;vertical-align:-2px}
  #hud .hint{background:rgba(44,40,64,.88);border:2px solid var(--out);border-radius:12px;padding:4px 12px;max-width:min(760px,calc(100vw - 24px))}
  #hud .hint:empty{display:none}
  .phead .goals{flex:1;justify-content:center}
  /* the goal chips get their own row when they do not fit between the buttons (fitGoals() sets .stack) */
  .phead.stack{flex-wrap:wrap;row-gap:6px}
  .phead.stack .goals{order:3;flex-basis:100%}
  .hint{font-size:14px;color:var(--mute);text-align:center;min-height:20px;line-height:1.45;font-weight:500}
  .hint b{color:var(--yellow)}
  .tlwrap{width:100%}
  .tlhead{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding:0 2px 4px}
  #tl{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}
  .slot{position:relative;aspect-ratio:1.7/1;border-radius:10px;border-radius:8px;background:var(--slot);border:3px solid var(--out);display:flex;align-items:center;justify-content:center}
  .slot.sec{background:var(--slot2)}
  .slot img{height:82%;width:auto;pointer-events:none}
  .slot .t{position:absolute;top:1px;left:5px;font-size:11px;color:var(--mute);pointer-events:none}
  .slot.filled{background:var(--cream)}
  .slot.filled .t{color:var(--ink2)}
  .slot.over{background:var(--yellow)}
  .slot.play{background:var(--yellow);transform:translateY(-3px)}
  .slot.done{opacity:.4}
  .hand{display:flex;gap:12px;justify-content:center}
  .card{position:relative;min-width:108px;padding:6px 10px 7px;text-align:center;transition:transform .1s}
  .card img{width:50px;height:50px;display:block;margin:0 auto -2px;pointer-events:none}
  .card .n{font-size:16px;font-weight:900}
  .sv{display:inline-flex;align-items:center;gap:1px;margin:0 3px;white-space:nowrap}
  .sv img{width:15px;height:15px}
  .card .ab{position:absolute;top:-10px;left:-8px;font-size:11px;line-height:18px;font-weight:900;background:var(--ink);color:var(--cream);border:2px solid var(--out);border-radius:999px;padding:0 7px;white-space:nowrap;z-index:1}
  .panel p.lg{font-size:12px;margin-top:-2px}
  .tip .st .sv{margin:0 8px 0 0;font-size:13px;font-weight:900;color:var(--ink)}
  .tip .st .sv img{width:17px;height:17px}
  .gatebox{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;margin:6px 0 2px}
  .gatebox img{width:30px;height:30px}
  .gatebox .need{font-size:13px;color:var(--ink2)}
  .fates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
  .fate{display:flex;flex-direction:column;align-items:center;gap:1px;border:3px solid var(--out);border-radius:10px;padding:3px 6px 4px;min-width:60px;font-size:12px;font-weight:900}
  .fate img.u{width:40px;height:40px}
  .fate.ok{background:#c6f2b8}
  .fate.bad{background:#f8d3cb}
  .fate.part{background:#f6e3b4}
  .fate .res img{width:16px;height:16px;vertical-align:-3px}
  .tipbox{background:#fff;border:3px solid var(--out);border-radius:10px;padding:8px 12px;text-align:left;font-size:14px;line-height:1.6;font-weight:500}
  .tipbox b{font-weight:900}
  .tipbox .lb{display:inline-block;background:var(--yellow);border:2px solid var(--out);border-radius:999px;padding:0 8px;margin-right:6px;font-weight:900;font-size:12px}
  .card .s{font-size:11.5px;color:var(--ink2);white-space:nowrap;line-height:1.3;font-weight:700}
  .card .c{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;background:var(--yellow);border:3px solid var(--out);font-size:13px;line-height:20px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;font-variant-numeric:tabular-nums}
  .card.sel{transform:translateY(-6px);background:var(--yellow)}
  .card.dis{opacity:.45}
  .card.locked{opacity:.55;background:#d9cfb8;cursor:default}
  .card.locked img{filter:grayscale(1) brightness(.6)}
  .card.hidden{display:none}
  .newunits{display:flex;flex-direction:column;gap:12px;margin:12px 0;text-align:left}
  .newunit{display:flex;gap:12px;align-items:center;background:var(--cream2);border:3px solid var(--out);border-radius:12px;padding:8px 12px}
  .newunit>img{width:76px;height:76px;flex:none}
  .newunit .st{display:flex;flex-wrap:wrap;gap:2px 4px;margin-top:3px}
  .newunit .st .sv{font-size:13px;color:var(--ink);margin:0 6px 0 0}
  .newunit .st .sv img{width:17px;height:17px}
  .newunit b{font-size:18px;font-weight:900}
  .newunit p{margin:4px 0 0;font-size:14px}
  .newunit .st{font-size:12px;color:var(--ink2)}
  .actions{display:flex;gap:9px;justify-content:center}
  .btn{display:flex;align-items:center;gap:6px;padding:8px 18px;font-size:16px;white-space:nowrap}
  .btn svg{width:18px;height:18px}
  .btn:active:not(:disabled),.card:active,.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--out)}
  .btn.go{background:var(--yellow);padding:8px 26px;font-weight:900}
  .btn.go.stop{background:#ff8f86}
  .btn:disabled{opacity:.45;cursor:default}
  .ghost{position:fixed;pointer-events:none;width:52px;height:52px;z-index:50;transform:translate(-50%,-60%)}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,16,32,.6);padding:16px;z-index:20}
  .overlay.show{display:flex}
  .panel{width:min(460px,100%);max-height:100%;overflow:auto;padding:22px 20px 20px;text-align:center;border-width:4px;border-radius:16px;box-shadow:0 7px 0 var(--out)}
  .overlay.show .panel{animation:panelIn .35s cubic-bezier(.3,1.4,.5,1)}
  @keyframes panelIn{0%{transform:translateY(24px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
  .panel h2{font-size:28px;font-weight:900;margin-bottom:4px}
  .panel .logo{width:116px;height:116px;margin:-2px auto 6px;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
  .panel p{font-size:15px;line-height:1.55;color:var(--ink2);margin:6px 0;font-weight:500}
  .panel .stars{margin:6px 0 2px}
  .panel .stars img{width:54px;height:54px;margin:0 4px;animation:starPop .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(.45s + var(--i) * .22s)}
  @keyframes starPop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:none}}
  .panel ul{list-style:none;text-align:left;font-size:14px;margin:10px 0;line-height:1.8}
  .panel ul li.no{color:var(--ink2)}
  .panel .why{background:var(--cream2);border:3px solid var(--out);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px;line-height:1.7;margin:10px 0;font-weight:500}
  .panel .why b{font-weight:900}
  .panel .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .levels{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:14px 0 4px}
  .lv{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900;padding:0}
  .mview{display:none}.mview.on{display:block}
  .btn.big{display:flex;width:fit-content;font-size:22px;padding:12px 44px;margin:12px auto 0}
  .mrow .btn{font-size:15px;padding:8px 14px}
  .slider{display:grid;grid-template-columns:auto 1fr 40px;align-items:center;gap:12px;margin:16px 4px;font-weight:900;text-align:left;font-size:16px}
  .slider input{width:100%;accent-color:#e0a800;height:22px}
  .slider b{text-align:right}
  .info{text-align:left;font-size:14px;line-height:1.6;font-weight:500;margin:8px 0}
  .info ul{list-style:none;margin:8px 0;text-align:left}
  .info li{margin:7px 0;padding-left:20px;position:relative}
  .info li::before{content:'';position:absolute;left:4px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--yellow);border:2px solid var(--out)}
  .info h3{font-size:15px;font-weight:900;margin:12px 0 2px}
  .pcol{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:12px}
  .pcol .btn{min-width:210px}
  .lv .st{display:flex;gap:1px}
  .lv .st img{width:14px;height:14px}
  .lv>img{width:28px;height:28px}
  .lv.lock{opacity:.5;background:#d9cfb8}
  .lv.cur{background:var(--yellow)}
  @media (max-width:640px){
    #tl{gap:6px;grid-template-columns:repeat(5,minmax(0,1fr))}
    .slot{aspect-ratio:1.35/1}
    #panel{width:100% !important;border-left:0;border-right:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
    .phead{flex-wrap:wrap}
    #panel .hand,#panel .hand.many{display:flex;gap:5px;row-gap:0}
    .hand .card{flex:1 1 0;min-width:0;padding:5px 2px 4px}
    .hand .card .s{display:grid;grid-template-columns:auto auto;justify-content:center;gap:0 2px;font-size:9px;line-height:1.2;margin-top:1px}
    .hand .card .s .sv:first-child{grid-column:1/-1;justify-self:center}
    .hand .card .s .sv{margin:0;gap:0}
    .hand .card .s .sv img{width:11px;height:11px}
    .hand .card .ab{font-size:9px;line-height:14px;padding:0 5px;top:-8px;left:-4px}
    .hand .card img{width:34px;height:34px}
    .hand .card .n{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hand .card .c{width:21px;height:21px;font-size:11px;line-height:15px;top:-8px;right:-6px;border-width:2px}
    .slot{aspect-ratio:1.65/1 !important}
    #hud .hint{font-size:12px;line-height:1.35;padding:3px 10px}
    .legend{flex-wrap:nowrap;font-size:11px}
    .legend span{white-space:nowrap}
    .phead .goals{order:3;flex-basis:100%}
    .phead .btn{padding:7px 11px;font-size:15px}
    .card img{width:40px;height:40px}
    .card .n{font-size:14px}
    .slot .t{font-size:9px;left:3px}
    .goals{font-size:12px}
    .hand{gap:6px;width:100%}
    .hand.many{display:grid;grid-template-columns:repeat(3,1fr);row-gap:12px}
    .card{flex:1 1 0;min-width:0;padding:4px 2px}
    .card .s{font-size:9.5px}
    .top{flex-wrap:wrap;row-gap:8px}
    .chip{height:36px;padding:3px 7px}
    .title{font-size:15px;flex:1 1 calc(100% - 100px);order:0}
    #muteBtn{order:1}
    .top .stat{order:2;flex:1;justify-content:center}
    .stat{font-size:14px}
    .stat img{width:20px;height:20px}
    .iconbtn{width:36px;height:36px}
    .legend{font-size:12px}
    /* compact deploy panel so the map keeps most of the screen */
    #tl{grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
    .slot{aspect-ratio:.92/1 !important;border-width:2px;border-radius:6px}
    .slot img{height:70%}
    .slot .t{font-size:8px;left:2px;top:0}
    .tlhead{font-size:11px;padding-bottom:3px}
    .phead .btn,.phead #panelBtn{padding:6px 10px;font-size:14px}
    .goals{font-size:11px;gap:4px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
    .goals span{flex:none}
    .goals .best{display:none}
    .phead{row-gap:6px}
    #panel .pbody{margin-top:6px}
    .goals span{padding:1px 7px 1px 4px}
    .hand .card img{width:30px;height:30px}
    .hand .card{padding:4px 2px 3px}
    #hud .hint{font-size:11px;line-height:1.35;padding:3px 8px}
    /* menus */
    .overlay{padding:10px}
    .panel{padding:16px 12px 14px}
    .panel h2{font-size:23px}
    .panel .logo{width:84px;height:84px}
    .panel p{font-size:13.5px}
    .levels{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0 2px}
    .lv{font-size:18px}
    .lv .st img{width:10px;height:10px}
    .newunit{padding:6px 8px;gap:8px}
    .newunit>img{width:56px;height:56px}
  }
  /* landscape screens up to 900px tall (typical embedded game sizes below 1920x1080): one 20-slot timeline row and slim
     unit cards, so the open deploy panel stays short and the map keeps most of the screen */
  @media (max-height:900px) and (min-width:641px){
    #tl{grid-template-columns:repeat(20,minmax(0,1fr));gap:4px}
    .slot{aspect-ratio:1/1 !important;border-width:2px;border-radius:7px;align-items:flex-end;padding-bottom:3px}
    .slot img{height:56%}
    .slot .t{font-size:12px;top:1px;left:4px}
    .hand{gap:10px}
    .hand .card{min-width:0;flex:0 1 150px;padding:4px 8px 5px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:5px;row-gap:1px;align-items:center;text-align:left}
    .hand .card.hidden{display:none}
    .hand .card img{width:36px;height:36px;margin:0}
    .hand .card .n{font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hand .card .s{grid-column:1/-1;display:flex;justify-content:center;gap:0 5px;font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden}
    .hand .card .s .sv{margin:0;gap:1px}
    .hand .card .s .sv img{width:13px;height:13px}
    .hand .card .ab{font-size:11px;line-height:16px;padding:0 7px;top:-11px;left:8px}
    .hand .card:has(.ab){padding-top:9px}
    .hand .card.new:has(.ab)::before{left:64%}
    .hand .card .c{width:24px;height:24px;font-size:13px;line-height:18px;top:-9px;right:-9px}
    .hand{margin-top:4px}
    .goals{font-size:12px;flex-wrap:nowrap}
    .goals span{flex:none}
    .goals .best{display:none}
    #menuOv .panel{width:min(600px,100%)}
    .panel .logo{width:72px;height:72px}
    .levels{grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin:12px 0 2px}
    .lv{font-size:17px}
    .lv .st img{width:11px;height:11px}
    .lv>img{width:22px;height:22px}
  }
  /* wide landscape screens: room for bigger unit art, so the picture sits on the left and the name and stats stack beside it
     (the panel may grow to 1160px here, see layout()) */
  @media (max-height:900px) and (min-width:1100px){
    .hand{gap:8px}

<script id="sim">
// ===== Critter Crashers deterministic simulation (shared by game + solver) =====
const SIM = (() => {
  const TICK = 0.05;          // seconds per tick
  const SLOT = 0.5;           // seconds per timeline slot
  const SLOTS = 20;           // 10 seconds of timeline
  const MAX_T = 45;
  const UNITS = {
    shield: { name: '盾兵', icon: '🛡️', cost: 3, hp: 14, speed: 1.5, siege: 1, count: 1, r: 0.32, color: '#4a7bd0' },
    scout:  { name: '斥候', icon: '💨', cost: 1, hp: 2,  speed: 4,   siege: 1, count: 1, r: 0.22, color: '#3fb58a' },
    rats:   { name: '鼠群', icon: '🐀', cost: 2, hp: 1,  speed: 2.5, siege: 0.5, count: 6, gap: 0.12, r: 0.14, color: '#a07850' },
    sapper: { name: '工兵', icon: '💣', cost: 4, hp: 5,  speed: 2.5, siege: 5, count: 1, r: 0.27, color: '#e0703a' },
    // taunt: every tower that has the peacock in range must shoot it (breaks sticky locks)
    peacock: { cost: 3, hp: 10, speed: 2.5, siege: 1, count: 1, r: 0.3, taunt: true },
    // burrow: underground (untargetable, unhittable, never 'enters' range) for the first N tiles of the path
    mole:   { cost: 3, hp: 6, speed: 2.5, siege: 2, count: 1, r: 0.26, burrow: 6 },
  };
  const TOWERS = {
    gun:    { name: '機槍塔', icon: '🔫', rule: 'closest', ruleText: '打最近的', ruleIcon: '👉', dmg: 1,  period: 0.4, range: 2.5, color: '#d9a400' },
    cannon: { name: '大砲塔', icon: '💥', rule: 'maxhp',   ruleText: '打血最多的・範圍爆炸', ruleIcon: '❤️', dmg: 5, period: 2.5, range: 3.5, splash: 1, color: '#d0453a' },
    sniper: { name: '狙擊塔', icon: '🎯', rule: 'first',   ruleText: '打最先進入射程的', ruleIcon: '🚩', dmg: 99, period: 3, range: 6, color: '#8a5cd0' },
  };

  function buildPath(pts) {
    const segs = []; let len = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const l = Math.hypot(x2 - x1, y2 - y1);
      segs.push({ x1, y1, x2, y2, l, start: len }); len += l;
    }
    return { pts, segs, len };
  }
  function posAt(path, d) {
    if (d <= 0) return [path.pts[0][0], path.pts[0][1]];
    for (const s of path.segs) {
      if (d <= s.start + s.l) { const f = (d - s.start) / s.l; return [s.x1 + (s.x2 - s.x1) * f, s.y1 + (s.y2 - s.y1) * f]; }
    }
    const p = path.pts[path.pts.length - 1]; return [p[0], p[1]];
  }

  function cost(timeline) { return timeline.reduce((a, u) => a + (u ? UNITS[u].cost : 0), 0); }

  function create(level, timeline) {
    const path = buildPath(level.path);
    const units = []; let id = 0;
    timeline.forEach((type, slot) => {
      if (!type) return;
      const U = UNITS[type];
      for (let i = 0; i < U.count; i++) {
        units.push({ id: id++, type, slot, hp: U.hp, maxHp: U.hp, d: 0, x: 0, y: 0,
          spawnT: slot * SLOT + i * (U.gap || 0), state: 'wait', entered: {} });
      }
    });
    const towers = level.towers.map((t, i) => ({ i, type: t.type, x: t.x, y: t.y, cd: 0, target: null, kills: 0 }));
    return { level, path, units, towers, t: 0, tick: 0, gate: level.gate, gateMax: level.gate,
      events: [], shots: [], done: false, win: false };
  }

  function inRange(tw, u) { return Math.hypot(tw.x - u.x, tw.y - u.y) <= TOWERS[tw.type].range; }
  function underground(u) { const b = UNITS[u.type].burrow; return !!b && u.d < b; }

  function step(s) {
    if (s.done) return;
    s.shots = [];
    const t = s.t;
    // spawn + move
    for (const u of s.units) {
      if (u.state === 'wait' && u.spawnT <= t + 1e-9) { u.state = 'live'; [u.x, u.y] = posAt(s.path, 0); }
      else if (u.state === 'live') {
        u.d += UNITS[u.type].speed * TICK;
        if (u.d >= s.path.len) {
          u.state = 'arrived'; s.gate -= UNITS[u.type].siege;
          s.events.push({ kind: 'arrive', t, unit: u });
          if (s.gate <= 1e-9) { s.gate = 0; s.done = true; s.win = true; return; }
        } else [u.x, u.y] = posAt(s.path, u.d);
      }
    }
    // towers
    for (const tw of s.towers) {
      const T = TOWERS[tw.type];
      const live = s.units.filter(u => u.state === 'live' && !underground(u));
      for (const u of live) {
        const k = tw.i;
        if (inRange(tw, u)) { if (u.entered[k] === undefined) u.entered[k] = s.tick; }
        else delete u.entered[k];
      }
      tw.cd -= TICK;
      if (tw.target && (tw.target.state !== 'live' || !inRange(tw, tw.target))) tw.target = null;
      const taunts = live.filter(u => UNITS[u.type].taunt && inRange(tw, u));
      if (taunts.length) {
        taunts.sort((a, b) => (Math.hypot(tw.x - a.x, tw.y - a.y) - Math.hypot(tw.x - b.x, tw.y - b.y)) || a.id - b.id);
        if (!tw.target || !UNITS[tw.target.type].taunt) tw.target = taunts[0];
      } else if (!tw.target) {
        const cands = live.filter(u => inRange(tw, u));
        if (cands.length) {
          cands.sort((a, b) => {
            if (T.rule === 'closest') {
              const da = Math.hypot(tw.x - a.x, tw.y - a.y), db = Math.hypot(tw.x - b.x, tw.y - b.y);
              if (Math.abs(da - db) > 1e-6) return da - db;
            } else if (T.rule === 'maxhp') {
              if (a.hp !== b.hp) return b.hp - a.hp;
              if (Math.abs(a.d - b.d) > 1e-6) return b.d - a.d;
            } else if (T.rule === 'first') {
              if (a.entered[tw.i] !== b.entered[tw.i]) return a.entered[tw.i] - b.entered[tw.i];
            }
            return a.id - b.id;
          });
          tw.target = cands[0];
        }
      }
      if (tw.target && tw.cd <= 1e-9) {
        const tg = tw.target;
        const hits = T.splash ? live.filter(u => Math.hypot(u.x - tg.x, u.y - tg.y) <= T.splash) : [tg];
        s.shots.push({ tower: tw, x: tg.x, y: tg.y, splash: T.splash || 0 });
        for (const u of hits) {
          u.hp -= T.dmg;
          if (u.hp <= 0 && u.state === 'live') {
            u.state = 'dead'; tw.kills++;
            s.events.push({ kind: 'death', t, unit: u, tower: tw, x: u.x, y: u.y });
          }
        }
        tw.cd = T.period;
        if (tw.target.state !== 'live') tw.target = null;
      }
    }
    s.t = Math.round((s.t + TICK) * 1000) / 1000; s.tick++;
    const pending = s.units.some(u => u.state === 'wait' || u.state === 'live');
    if (!pending || s.t >= MAX_T) { s.done = true; s.win = false; }
  }

  function run(level, timeline) { const s = create(level, timeline); while (!s.done) step(s); return s; }

  return { TICK, SLOT, SLOTS, UNITS, TOWERS, buildPath, posAt, cost, create, step, run, underground };
})();
</script>

// ============================================================
//  ART: flat vivid colors + thick dark outlines, all drawn in code
// ============================================================
const OUT = '#1d1a24';
const COL = {
  shield: '#3d8bff', scout: '#35d07a', scoutDark: '#1fa35a', rats: '#a99b8f', ratPink: '#ff8fb1', sapper: '#ff9330',
  gun: '#ffd23f', cannon: '#ff5247', sniper: '#a06bff', barrel: '#4b4560',
  stone: '#ddd6ee', stoneDark: '#b6add0', grass: '#7bd35a', grassDark: '#62bd44', path: '#f7d27e', pathDark: '#e2b45e',
  wood: '#c98a4b', woodDark: '#99602f', tree: '#2fb456', treeLight: '#55d277', rock: '#bdb7cc', flag: '#ff4d6d', yellow: '#ffd23f',
};
const TCOL = t => COL[t];
const UCOL = { shield: '#3E8E6B', scout: '#F4F1EA', rats: '#B08A6A', sapper: '#A9714B', peacock: '#2E7FD8', mole: '#6D5A80' };
let OL = 3;   // outline width in px, set from cell size

function withT(c, x, y, s, fn) {
  c.save(); c.translate(x, y); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  fn(c, OL / s); c.restore();
}
function blob(c, lw, fill, path) { c.beginPath(); path(c); c.fillStyle = fill; c.fill(); c.lineWidth = lw; c.strokeStyle = OUT; c.stroke(); }
const circ = (x, y, r) => c => c.arc(x, y, r, 0, Math.PI * 2);
const ell = (x, y, rx, ry) => c => c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
const rr = (x, y, w, h, r) => c => { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
const poly = pts => c => { pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
function dot(c, x, y, r, col = OUT) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
function shadow(c, y, rx) { c.beginPath(); c.ellipse(0.04, y, rx, rx * 0.32, 0, 0, Math.PI * 2); c.fillStyle = 'rgba(20,40,10,.22)'; c.fill(); }
function shine(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, -0.5, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.45)'; c.fill(); }

// --- shared style rules: light from top-left, shadow drops down-right, same eyes on every character ---
function eyes(c, x, y, gap, one = false) {
  for (const sx of one ? [0] : [-1, 1]) {
    c.beginPath(); c.ellipse(x + sx * gap, y, 0.032, 0.043, 0, 0, Math.PI * 2); c.fillStyle = OUT; c.fill();
    dot(c, x + sx * gap - 0.01, y - 0.016, 0.012, '#ffffff');
  }
}
function lump(c, lw, fill, parts) {   // several circles merged into one outlined silhouette
  c.beginPath(); for (const [px, py, pr] of parts) { c.moveTo(px + pr, py); c.arc(px, py, pr, 0, Math.PI * 2); }
  c.lineWidth = lw * 2; c.strokeStyle = OUT; c.stroke(); c.fillStyle = fill; c.fill();

// ===== Animal squad (design direction B): drawn in the design's 160×160 coordinates via Path2D =====
const AC = {
  shell: '#3E8E6B', plate: '#5BAE84', skin: '#8BC86A', band: '#F5C342',
  fur: '#F4F1EA', pink: '#F4A7B9', scarf: '#E8504A',
  rat: '#B08A6A', helm: '#9AA3B5',
  beaver: '#A9714B', belly: '#D9AE85', tail: '#6B4A3A', tailLine: '#4E352A', lamp: '#FFF6DC',
  poof: '#ECE8F2', dust: '#E6DCC4',

const P2cache = {};

function star5(c, x, y, k, w) { c.save(); c.translate(x, y); c.scale(k, k); sP(c, STAR5, COL.yellow, w / k); c.restore(); }
function rot(c, deg, cx, cy) { c.translate(cx, cy); c.rotate(deg * Math.PI / 180); c.translate(-cx, -cy); }

// one rat in its own small coordinate system (body centered on 0,0)
function ratShape(c, W, o = {}) {
  sL(c, 'M-14 2 Q-26 6 -22 -8', W * 0.6);
  sE(c, 0, 0, 15, 11, 0, AC.rat, W * 0.8);
  sP(c, 'M-6 -10 Q4 -22 14 -10 Z', AC.helm, W * 0.6);
  sC(c, 9, -1, 2.5, OUT); sC(c, 15, 2, 2.5, AC.pink);

  for (const [cx, cy, r] of [[-14, 6, 12], [0, -2, 13], [2, 12, 11]]) sC(c, cx, cy, r, AC.poof);

// o: { face: 1|-1, phase: walk cycle, hurt: 0..1 (hit reaction), dmg: 0..1 (hp lost), pose: 'walk'|'dead', t: 0..1 (death progress), flag }
const SPRITE = { peacock: { ox: 84, oy: 104, k: 1 / 188 }, mole: { ox: 84, oy: 106, k: 1 / 215 }, shield: { ox: 80, oy: 98, k: 1 / 215 }, scout: { ox: 80, oy: 100, k: 1 / 215 }, sapper: { ox: 88, oy: 100, k: 1 / 215 }, rats: { ox: 0, oy: 0, k: 1 / 88 } };
function drawUnit(c, type, x, y, s, o = {}) {
  const sp = SPRITE[type], face = o.face || 1, ph = o.phase || 0, hurt = o.hurt || 0, dead = o.pose === 'dead', t = o.t || 0;
  withT(c, x, y, s, (c, lw) => {
    c.scale(sp.k * face, sp.k); c.translate(-sp.ox, -sp.oy);
    const W = lw / sp.k;                       // outline width in design units
    if (type === 'shield') {
      if (dead) {
        sE(c, 80, 152, 60, 6, 0, 'rgba(0,0,0,.15)');
        c.save(); rot(c, 180, 80, 96);
        sR(c, 34, 112, 20, 26, 9, AC.skin, W); sR(c, 104, 112, 20, 26, 9, AC.skin, W);
        sC(c, 134, 98, 18, AC.skin, W); sL(c, 'M135 89 L145 99 M145 89 L135 99', W * 0.7);
        sP(c, 'M22 116 Q22 44 78 44 Q134 44 134 116 Z', AC.shell, W);
        sP(c, 'M62 62 L94 62 L104 86 L94 108 L62 108 L52 86 Z', AC.plate, W * 0.8);
        sR(c, 16, 110, 124, 14, 7, AC.band, W);
        c.restore();

        return;
      }
      sE(c, 80, 142, 60, 8, 0, 'rgba(0,0,0,.15)');
      c.save(); rot(c, -3 + Math.sin(ph) * 2, 80, 100);
      const l1 = Math.max(0, Math.sin(ph)) * 5, l2 = Math.max(0, -Math.sin(ph)) * 5;

      else {
        const st = Math.sin(ph) * 3;
        sR(c, 34 - st, 114 - l1, 20, 24, 9, AC.skin, W); sR(c, 104 + st, 114 - l2, 20, 24, 9, AC.skin, W);
        sC(c, 134, 96, 18, AC.skin, W); sC(c, 140, 92, 4, OUT);
      }

function drawRuleGlyph(c, type, lw) {   // centered at 0,0, fits r≈0.15
  if (type === 'gun') {
    c.strokeStyle = OUT; c.lineWidth = lw * 0.8;
    c.beginPath(); c.arc(0, 0, 0.085, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(0, -0.15); c.lineTo(0, -0.04); c.moveTo(0, 0.15); c.lineTo(0, 0.04); c.moveTo(-0.15, 0); c.lineTo(-0.04, 0); c.moveTo(0.15, 0); c.lineTo(0.04, 0); c.stroke();
    dot(c, 0, 0, 0.03, COL.cannon);
  } else if (type === 'cannon') {
    blob(c, lw * 0.8, COL.flag, c => { c.moveTo(0, 0.12); c.bezierCurveTo(-0.2, -0.02, -0.1, -0.18, 0, -0.07); c.bezierCurveTo(0.1, -0.18, 0.2, -0.02, 0, 0.12); c.closePath(); });
  } else {
    c.strokeStyle = OUT; c.lineWidth = lw * 0.9; c.beginPath(); c.moveTo(-0.07, 0.14); c.lineTo(-0.07, -0.14); c.stroke();
    blob(c, lw * 0.8, COL.scout, poly([[-0.07, -0.14], [0.13, -0.08], [-0.07, -0.01]]));
  }
}

function drawCastle(c, x, y, s, open = 0, dmg = 0) {

    const crenel = (x0, x1, top, teethTop, teeth, gone = []) => {

        const a = x0 + i * 2 * tw, b = a + tw, h = gone.includes(i) ? top - 3 : teethTop;
        d += ` H${a} V${h} H${b} V${top}`;

    };
    const block = (p, fill, shadeX, shadeW, bricks) => {
      c.fillStyle = fill; c.fill(p);

      c.strokeStyle = LINE; c.lineWidth = W * 0.4; c.lineCap = 'round'; c.beginPath();

    // flag on a pole behind the wall, waving

    fs(c, new Path2D(`M101 8 Q112 ${3 + wv} 122 ${9 + wv * 0.4} Q130 ${14 - wv} 140 ${10 - wv * 0.5} L136 ${21 - wv * 0.3} Q127 ${25 + wv * 0.5} 120 ${20 + wv * 0.3} Q111 ${15 - wv} 101 22 Z`), '#E8504A', W * 0.75);
    sC(c, 100, 5, 3.5, '#F5C342', W * 0.6);

    // towers

    for (const [x0, gone] of [[12, leftGone], [146, rightGone]]) {
      const p = crenel(x0, x0 + 42, 46, 32, 3, gone.map(i => x0 > 100 ? i : i));
      block(p, STONE2, x0 + 30, 14, [[x0 + 6, 62, 12], [x0 + 22, 62, 12], [x0 + 12, 80, 14], [x0 + 6, 104, 12], [x0 + 24, 104, 12], [x0 + 12, 126, 16]]);
      sL(c, `M${x0} 46 H${x0 + 42}`, W * 0.6);                                   // ledge under the battlements
      sP(c, `M${x0 + 16} 92 V76 Q${x0 + 21} 68 ${x0 + 26} 76 V92 Z`, '#3A3448', W * 0.6);   // arched arrow slit
    }

      const [ax, ay] = rat ? RAT_SPOTS[i] : [0, 0];
      const formD = v.d + ax * pop, formO = v.o + ay * pop;
      const walkD = sim ? -(u.spawnT - vt) * U.speed : -1e9;
      const d = Math.max(formD, walkD), m = Math.max(0, Math.min(1, -d / 0.9));   // m: 1 = in formation, 0 = at the entrance
      const qs = (rat ? 0.95 : 1.15) * shrink * pop, ls = rat ? 1.4 : 1.25;
      sprites.push({ type: e.type, d, o: formO * m, s: ls + (qs - ls) * m, walking: walkD > formD, flag: rat && i === 0, ph: now * 5 + e.slot + i * 1.3 });
    });
  }
  sprites.sort((p, q) => (p.o * dx - p.d * dy) - (q.o * dx - q.d * dy));   // back rows first
  for (const sp2 of sprites) {
    const [x, y] = P(p0[0] + dx * sp2.d - dy * sp2.o, p0[1] + dy * sp2.d + dx * sp2.o);
    const phase = sp2.walking ? sp2.d * (sp2.type === 'shield' ? 3.5 : sp2.type === 'scout' ? 3 : 5) : sp2.type === 'scout' ? 0 : sp2.type === 'rats' ? sp2.ph * 0.6 : sp2.ph * 0.15;
    drawUnit(ctx, sp2.type, x, y, cell * sp2.s, { face, phase, flag: sp2.flag, under: sp2.type === 'mole' && sp2.walking });
  }
}

// ============================================================
//  DRAW
// ============================================================
const P = (x, y) => [ox + x * cell, oy + y * cell];
function lineOutlined(x1, y1, x2, y2, w, col) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = w + OL * 1.4; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function drawX(gx, gy, color, s, alpha = 1) {
  const [x, y] = P(gx, gy), r = s * cell;
  ctx.globalAlpha = alpha;
  lineOutlined(x - r, y - r, x + r, y + r, OL * 1.2, color); lineOutlined(x + r, y - r, x - r, y + r, OL * 1.2, color);
  ctx.globalAlpha = 1;
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function txt(t, x, y, size, fill) {
  ctx.font = `900 ${Math.round(size)}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.22); ctx.strokeStyle = OUT; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}

function draw() {
  const L = level();
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  OL = Math.max(1.6, Math.min(3.4, cell * 0.06));
  if (bg && bg.width > 0 && bg.height > 0) {
    const k = cell / tcell;
    if (Math.abs(k - 1) > 1e-3) { ctx.fillStyle = regionOf(li).base; ctx.fillRect(0, 0, W, H); }
    ctx.drawImage(bg, ox - (tox + bgM) * k, oy - (toy + bgM) * k, (W + 2 * bgM) * k, (H + 2 * bgM) * k);
  }
  drawQueue();
  // ranges
  L.towers.forEach((t, ti) => {
    const T = TOWERS[t.type], [x, y] = P(t.x, t.y), hot = ti === hoverTower;
    ctx.beginPath(); ctx.arc(x, y, T.range * cell, 0, Math.PI * 2);
    ctx.fillStyle = hexA(TCOL(t.type), hot ? 0.3 : mode === 'run' ? 0.1 : 0.16); ctx.fill();
    ctx.setLineDash(hot ? [] : [cell * 0.18, cell * 0.14]); ctx.lineWidth = Math.max(1.5, OL * (hot ? 1.1 : 0.7));
    ctx.strokeStyle = RING[t.type]; ctx.stroke(); ctx.setLineDash([]);
  });
  // death markers
  if (lastRun && mode !== 'run' && !outro) for (const e of lastRun.events) if (e.kind === 'death') drawX(e.x, e.y, TCOL(e.tower.type), e.unit.type === 'rats' ? 0.1 : 0.18);
  if ((mode === 'run' || outro) && sim) for (const e of sim.events) if (e.kind === 'death') drawX(e.x, e.y, TCOL(e.tower.type), e.unit.type === 'rats' ? 0.08 : 0.15, 0.55);
  // castle
  const [gx, gy] = P(...gatePos());
  const gateHp = sim ? sim.gate : (lastRun && !lastRun._retreat ? lastRun.gate : L.gate);
  const cs = cell * CASTLE, cy0 = gy - cs * 0.235;   // the door sits on the end of the road
  drawCastle(ctx, gx, cy0, cs, doorOpen, 1 - gateHp / L.gate);   // a breached gate is just the design's most damaged state
  if (gateFlash > 0) { ctx.beginPath(); ctx.arc(gx, gy - cs * 0.1, cs * 0.55, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${0.55 * gateFlash})`; ctx.fill(); }
  if (gateDisp === null) gateDisp = gateHp;
  gateDisp += (gateHp - gateDisp) * 0.2;
  const bw = cs * 0.95, bh = Math.max(7, cell * 0.19), bx = gx - bw / 2, by = gy - cs * 1.27;
  ctx.fillStyle = OUT; ctx.beginPath(); rr(bx - OL, by - OL, bw + OL * 2, bh + OL * 2, bh / 2 + OL)(ctx); ctx.fill();
  ctx.fillStyle = '#4a4260'; ctx.beginPath(); rr(bx, by, bw, bh, bh / 2)(ctx); ctx.fill();
  if (gateDisp > 0) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); rr(bx, by, Math.max(bh, bw * gateDisp / L.gate), bh, bh / 2)(ctx); ctx.fill(); }
  if (gateHp > 0) { ctx.fillStyle = COL.cannon; ctx.beginPath(); rr(bx, by, Math.max(bh, bw * gateHp / L.gate), bh, bh / 2)(ctx); ctx.fill(); }
  // towers
  const ts = sim ? sim.towers : null;
  L.towers.forEach((t, i) => {
    const [x, y] = P(t.x, t.y);
    if (ts && ts[i].target && ts[i].target.state === 'live') {
      const tg = ts[i].target, want = Math.atan2(tg.y - (t.y - 0.06), tg.x - t.x);
      let d = want - aim[i]; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
      aim[i] += d * 0.35;
      const [tx2, ty2] = P(tg.x, tg.y);
      ctx.setLineDash([4, 5]); ctx.strokeStyle = hexA(TCOL(t.type), 0.95); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx2, ty2); ctx.stroke(); ctx.setLineDash([]);
    }
    drawTower(ctx, t.type, x, y, cell * 1.12, aim[i], true, recoil[i] || 0);
    if (ts) {
      const T = TOWERS[t.type], f = Math.max(0, ts[i].cd) / T.period;
      if (f > 0) {
        ctx.beginPath(); ctx.arc(x, y + cell * 0.5, cell * 0.11, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - f));
        ctx.lineWidth = OL * 1.4; ctx.strokeStyle = OUT; ctx.stroke(); ctx.lineWidth = OL * 0.6; ctx.strokeStyle = '#fff'; ctx.stroke();
      }
    }
  });
  { const k = OL; drawSign(ctx, ...P(...signPos()), cell * 1.1); OL = k; }   // start sign above the towers
  // units (sorted by y so lower ones overlap upper ones)
  if (sim) {
    const live = sim.units.filter(u => u.state === 'live').sort((a, b) => a.y - b.y);
    const a = sim.done ? 1 : Math.max(0, Math.min(1, acc / TICK));
    for (const u of live) {
      let ix, iy, idd;
      if (u._px === undefined) {   // spawned this tick: slide in from behind the entrance
        idd = u.d - UNITS[u.type].speed * TICK * (1 - a);
        [ix, iy] = roadPoint(idd);
      } else { ix = u._px + (u.x - u._px) * a; iy = u._py + (u.y - u._py) * a; idd = u._pd + (u.d - u._pd) * a; }
      const U = UNITS[u.type], [x, y0] = P(ix, iy);
      const left = sim.path.len - idd, enter = Math.max(0, Math.min(1, left / 0.7));   // fade + shrink into the castle door
      const y = y0;
      ctx.globalAlpha = 0.15 + 0.85 * enter;
      if (u._lx !== undefined && Math.abs(u.x - u._lx) > 1e-4) u._face = u.x < u._lx ? -1 : 1;
      u._lx = u.x;
      const prev = sim.units[u.id - 1], leader = u.type === 'rats' && (!prev || prev.type !== 'rats' || prev.slot !== u.slot);
      drawUnit(ctx, u.type, x, y, cell * (u.type === 'rats' ? 1.4 : 1.25) * (0.55 + 0.45 * enter), {
        face: u._face || 1, phase: idd * (u.type === 'shield' ? 3.5 : u.type === 'scout' ? 3 : 5),
        hurt: hurt.get(u) || 0, dmg: 1 - u.hp / u.maxHp, flag: leader,
        fan: u.type === 'peacock' && sim.towers.some(tw => tw.target === u), under: SIM.underground(u),
      });
      if (u.hp < u.maxHp && u.type !== 'rats') {
        const w = U.r * cell * 2.4, h = Math.max(4, cell * 0.09), bx2 = x - w / 2, by2 = y - U.r * cell * 1.25 - cell * 0.28;
        ctx.fillStyle = OUT; ctx.fillRect(bx2 - 1.5, by2 - 1.5, w + 3, h + 3);
        ctx.fillStyle = '#4a4260'; ctx.fillRect(bx2, by2, w, h);
        ctx.fillStyle = COL.scout; ctx.fillRect(bx2, by2, w * u.hp / u.maxHp, h);
      }
      ctx.globalAlpha = 1;
    }
  }
  // fx
  for (const f of fx) {
    const a = Math.max(0, f.life / f.max);
    if (f.kind === 'shot') {
      const [x, y] = P(f.tw.x, f.tw.y - 0.06), [tx2, ty2] = P(f.x, f.y);
      if (f.splash) {
        const r = f.splash * cell * (1.15 - a * 0.4);
        ctx.globalAlpha = Math.min(1, a * 1.6);
        ctx.beginPath(); ctx.arc(tx2, ty2, r, 0, Math.PI * 2); ctx.fillStyle = '#ff8a3d'; ctx.fill(); ctx.lineWidth = OL; ctx.strokeStyle = OUT; ctx.stroke();
        ctx.beginPath(); ctx.arc(tx2, ty2, r * 0.6, 0, Math.PI * 2); ctx.fillStyle = COL.yellow; ctx.fill();
        ctx.beginPath(); ctx.arc(tx2, ty2, r * 0.28, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = a; lineOutlined(x, y, tx2, ty2, f.tw.type === 'sniper' ? OL * 1.3 : OL * 0.8, f.tw.type === 'sniper' ? '#e3d4ff' : COL.yellow); ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(tx2, ty2, cell * 0.08 * a + 2, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      }
    } else if (f.kind === 'corpse') {
      const [x, y] = P(f.x, f.y);
      ctx.globalAlpha = Math.min(1, a * 2.5);
      drawUnit(ctx, f.type, x, y, cell * (f.type === 'rats' ? 1.4 : 1.25), { pose: 'dead', t: 1 - a, face: f.face });
      ctx.globalAlpha = 1;
    } else if (f.kind === 'part') {
      const [x, y] = P(f.x, f.y), r = f.size * cell * (0.4 + a * 0.6);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = f.color; ctx.globalAlpha = Math.min(1, a * 1.5); ctx.fill();
      if (r > 3) { ctx.lineWidth = Math.max(1, OL * 0.6); ctx.strokeStyle = OUT; ctx.stroke(); }
      ctx.globalAlpha = 1;
    } else if (f.kind === 'ring') {
      const [x, y] = P(f.x, f.y);
      ctx.beginPath(); ctx.arc(x, y, cell * (0.15 + (1 - a) * 0.45), 0, Math.PI * 2);
      ctx.globalAlpha = a; ctx.lineWidth = OL * 1.6; ctx.strokeStyle = OUT; ctx.stroke(); ctx.lineWidth = OL * 0.8; ctx.strokeStyle = f.color; ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.kind === 'puff') {
      const [x, y] = P(f.x, f.y);
      ctx.globalAlpha = a;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.arc(x - (1 - a) * cell * (0.2 + i * 0.15), y + (i - 1) * cell * 0.15 * (1 - a), cell * (0.1 + (1 - a) * 0.13), 0, Math.PI * 2);
        ctx.fillStyle = '#fff6e0'; ctx.fill(); ctx.lineWidth = OL * 0.6; ctx.strokeStyle = OUT; ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (f.kind === 'text') {
      const [x, y] = P(f.x, f.y);
      ctx.globalAlpha = Math.min(1, a * 2); txt(f.text, x, y, cell * (f.big ? 0.75 : 0.5), f.big ? COL.yellow : '#fff'); ctx.globalAlpha = 1;
    } else if (f.kind === 'confetti') {
      const [x, y] = P(f.x, f.y), w = f.size * cell;
      ctx.save(); ctx.translate(x, y); ctx.rotate(f.rot + f.life * 8); ctx.globalAlpha = Math.min(1, a * 2);
      ctx.fillStyle = f.color; ctx.fillRect(-w / 2, -w / 4, w, w / 2); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.strokeRect(-w / 2, -w / 4, w, w / 2);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
  if (outro && !outro.win) {
    const k = Math.min(1, outro.t / outro.dur);
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.65);
    v.addColorStop(0, 'rgba(160,20,30,0)'); v.addColorStop(1, `rgba(160,20,30,${0.5 * k})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  if (sim) txt(S.sec(sim.t.toFixed(1)), W - 52, hudBottom + 22, 20, '#fff');
  placeTip();   // fixed screen corner, never on top of the castle
}

// ---------- art check sheet: open the game with #art to see every sprite at large, card and in-game sizes ----------
function artSheet() {
  const c = document.createElement('canvas'), g = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const sizes = [130, 64, Math.max(30, Math.round(cell))], gap = 18;
  const items = [
    ['shield', (g, x, y, z) => drawUnit(g, 'shield', x, y, z * 1.25)], ['scout', (g, x, y, z) => drawUnit(g, 'scout', x, y, z * 1.25)],
    ['rats', (g, x, y, z) => drawUnit(g, 'rats', x, y, z * 1.4)], ['sapper', (g, x, y, z) => drawUnit(g, 'sapper', x, y, z * 1.25)],
    ['turtle hit', (g, x, y, z) => drawUnit(g, 'shield', x, y, z * 1.25, { hurt: 1 })], ['rabbit hit', (g, x, y, z) => drawUnit(g, 'scout', x, y, z * 1.25, { hurt: 1 })],
    ['squad card', (g, x, y, z) => drawRatSquad(g, x, y, z)], ['beaver hit (low hp)', (g, x, y, z) => drawUnit(g, 'sapper', x, y, z * 1.25, { hurt: 1, dmg: 0.8 })],
    ['turtle down', (g, x, y, z) => drawUnit(g, 'shield', x, y, z * 1.25, { pose: 'dead' })], ['rabbit down', (g, x, y, z) => drawUnit(g, 'scout', x, y, z * 1.25, { pose: 'dead', t: 0.15 })],
    ['peacock', (g, x, y, z) => drawUnit(g, 'peacock', x, y, z * 1.25)], ['peacock taunt', (g, x, y, z) => drawUnit(g, 'peacock', x, y, z * 1.25, { fan: true })],
    ['peacock hit', (g, x, y, z) => drawUnit(g, 'peacock', x, y, z * 1.25, { fan: true, hurt: 1 })], ['peacock down', (g, x, y, z) => drawUnit(g, 'peacock', x, y, z * 1.25, { pose: 'dead' })],
    ['mole', (g, x, y, z) => drawUnit(g, 'mole', x, y, z * 1.25)], ['mole underground', (g, x, y, z) => drawUnit(g, 'mole', x, y, z * 1.25, { under: true })],
    ['mole hit', (g, x, y, z) => drawUnit(g, 'mole', x, y, z * 1.25, { hurt: 1 })], ['mole down', (g, x, y, z) => drawUnit(g, 'mole', x, y, z * 1.25, { pose: 'dead' })],
    ['rat poof', (g, x, y, z) => drawUnit(g, 'rats', x, y, z * 1.4, { pose: 'dead', t: 0.1 })], ['beaver down', (g, x, y, z) => drawUnit(g, 'sapper', x, y, z * 1.25, { pose: 'dead' })],
    ['gun', (g, x, y, z) => drawTower(g, 'gun', x, y, z * 1.12, -0.6)], ['cannon', (g, x, y, z) => drawTower(g, 'cannon', x, y, z * 1.12, -0.6)],
    ['sniper', (g, x, y, z) => drawTower(g, 'sniper', x, y, z * 1.12, -0.6)], ['castle', (g, x, y, z) => drawCastle(g, x, y + z * 0.25, z * 1.25)],
    ['castle hit', (g, x, y, z) => drawCastle(g, x, y + z * 0.25, z * 1.25, 0, 0.5)], ['castle breaking', (g, x, y, z) => drawCastle(g, x, y + z * 0.25, z * 1.25, 0, 0.8)],
    ['castle open', (g, x, y, z) => drawCastle(g, x, y + z * 0.25, z * 1.25, 0.7)], ['peacock low hp', (g, x, y, z) => drawUnit(g, 'peacock', x, y, z * 1.25, { dmg: 0.8, phase: 1 })],
    ['logo', (g, x, y, z) => { g.save(); g.translate(x - z * 0.6, y - z * 0.6); drawLogo(g, z * 1.2); g.restore(); }],
    ...REGIONS.flatMap(R => R.deco.map(([k], j) => [R.id + ' ' + k, (g, x, y, z) => drawDecor(g, k, x, y + z * 0.12, z, R, j)])),
    ['sign', (g, x, y, z) => drawSign(g, x, y, z * 1.1)], ['pond small', (g, x, y, z) => drawPond(g, x, y, z * 1.3)],
    ...LANDMARKS.map((k, i) => [(i + 1) + ' ' + k, (g, x, y, z) => drawLandmark(g, k, x, y + z * 0.25, z * 0.5)]),
  ];
  const vw = Math.max(innerWidth || 0, document.documentElement.clientWidth || 0, 600);
  const colW = sizes[0] * 1.9, rowH = sizes.map(z => z * 2.1), cols = Math.max(1, Math.floor((vw - 20) / colW));
  const rows = Math.ceil(items.length / cols), Wd = vw, Hd = rows * (rowH.reduce((a, b) => a + b) + gap * 2) + 20;
  c.width = Wd * dpr; c.height = Hd * dpr; c.style.cssText = `position:fixed;inset:0;width:${Wd}px;height:100vh;object-fit:cover;object-position:top;z-index:100;overflow:auto;background:${COL.grass}`;
  const wrap = document.createElement('div'); wrap.style.cssText = 'position:fixed;inset:0;overflow:auto;z-index:100;background:' + COL.grass;
  c.style.cssText = `display:block;width:${Wd}px;height:${Hd}px`;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = COL.grass; g.fillRect(0, 0, Wd, Hd);
  const keep = OL;
  items.forEach(([name, fn], i) => {
    const col = i % cols, row = Math.floor(i / cols);
    let y = 10 + row * (rowH.reduce((a, b) => a + b) + gap * 2);
    const x = 10 + col * colW + colW / 2;
    g.fillStyle = OUT; g.font = '700 13px sans-serif'; g.textAlign = 'center'; g.fillText(name, x, y + 12);
    y += 16;
    sizes.forEach((z, k) => { OL = Math.max(1.6, Math.min(3.4, z * 0.06)); fn(g, x, y + rowH[k] / 2, z); y += rowH[k]; });
  });
  OL = keep;
  wrap.appendChild(c); document.body.appendChild(wrap);
}

// ---------- boot ----------
const docLang = () => { document.documentElement.lang = LANG === 'en' ? 'en' : siteLang() === 'zh-Hans' ? 'zh-Hans' : 'zh-Hant'; };
docLang();
function setLang(next) {
  next = pickLang(next); docLang();
  if (next === LANG) return;
  LANG = next; S = STR[LANG]; docLang();
  hideTip(); buildStatic(); render(); layout(); draw();
  if ($('menuOv').classList.contains('show')) {
    const curV = document.querySelector('.mview.on');
    openMenu(curV && curV.id === 'mLevels' ? 'levels' : (curV && curV.id === 'mSettings' ? 'settings' : (curV && curV.id === 'mInfo' ? 'info' : 'home')));
  }
}
try { window.parent.addEventListener('arcade-languagechange', e => setLang(e.detail && e.detail.language)); } catch (e) {}
document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
buildIcons(); buildStatic(); muteIcon();
window.addEventListener('resize', () => layout());
PORTRAIT = wantPortrait();
loadLevel(unlocked(li) ? li : 0, true, true);
layout();

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
requestAnimationFrame(frame);
if (location.hash === '#art') artSheet();
if (location.hash === '#marks') {   // landmark sheet: each level's landmark on its region's ground
  const c = document.createElement('canvas'), g = c.getContext('2d'), dpr = window.devicePixelRatio || 1, z = 64, cw = z * 3.4, ch = z * 3.2;
  c.width = cw * 5 * dpr; c.height = ch * 4 * dpr; c.style.cssText = `position:fixed;left:0;top:0;width:${cw * 5}px;height:${ch * 4}px;z-index:100`;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); const keep = OL; OL = Math.max(1.6, Math.min(3.4, z * 0.06));
  LANDMARKS.forEach((k, i) => {
    const x = (i % 5) * cw, y = Math.floor(i / 5) * ch; g.fillStyle = regionOf(i).base; g.fillRect(x, y, cw, ch);
    g.fillStyle = OUT; g.font = '700 13px sans-serif'; g.fillText((i + 1) + ' ' + k, x + 8, y + 18);
    drawLandmark(g, k, x + cw / 2, y + ch * 0.55, z);
  });
  OL = keep; document.body.appendChild(c);
}
})();
