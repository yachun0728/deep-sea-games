<!doctype html><meta charset="utf-8"><title>Sand Art input regression QA</title><style>body{font:14px system-ui;background:#faf7ee;color:#40362c;margin:16px}iframe{width:390px;height:844px;border:1px solid #cabca5}pre{white-space:pre-wrap}</style><h1>Sand Art input regression (synthetic pointer / mocked device APIs)</h1><pre id="results">Running…</pre><iframe id="game"></iframe><script>
(async()=>{const out=document.getElementById('results'),frame=document.getElementById('game'),lines=[];const ok=(v,label)=>{if(!v)throw Error(label);lines.push('PASS '+label);out.textContent=lines.join('\n')};const wait=ms=>new Promise(r=>setTimeout(r,ms));
try{
const html=await(await fetch('../preview/sand-art/index.html')).text();
const prelude=`(${function(){const native=window.matchMedia.bind(window);let mobileLandscape=false;const listeners=new Set();window.matchMedia=q=>q.includes('any-pointer:coarse')?{get matches(){return mobileLandscape},addEventListener:(name,fn)=>listeners.add(fn)}:native(q);window.__qaRotate=v=>{mobileLandscape=v;for(const fn of listeners)fn()}}.toString()})();`;
frame.srcdoc=html.replace('<script id="sand-engine">','<script>'+prelude+'<'+'/script><script id="sand-engine">');await new Promise(r=>frame.onload=r);await wait(100);
const w=frame.contentWindow,d=frame.contentDocument,cv=d.getElementById('canvas');cv.setPointerCapture=()=>{}; // Synthetic events have no browser-owned active pointer.
const state=()=>w.sandArt.snapshot();
const point=(x,y)=>{const rect=cv.getBoundingClientRect(),s=Math.min(rect.width/360,rect.height/400),v=state();return{x:rect.left+(rect.width-360*s)/2+(v.pan.x+x*v.zoom)*s,y:rect.top+(rect.height-400*s)/2+(v.pan.y+y*v.zoom)*s}};
const pointer=(type,id,x,y)=>cv.dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:x,clientY:y,bubbles:true,cancelable:true}));
const tap=(x,y,id=90)=>{const p=point(x,y);pointer('pointerdown',id,p.x,p.y);pointer('pointerup',id,p.x,p.y)};
ok(w.getComputedStyle(cv).userSelect==='none','Canvas and game UI disable text selection');ok(!cv.dispatchEvent(new w.Event('selectstart',{bubbles:true,cancelable:true})),'Selection-start default is cancelled');ok(!cv.dispatchEvent(new w.Event('contextmenu',{bubbles:true,cancelable:true})),'Long-press context menu default is cancelled');
tap(140,182);ok(state().peeled.includes(w.SandEngine.paths.findIndex(p=>p[0]==='eyeLeft')),'Eye line peels independently');
d.getElementById('zoomIn').click();d.getElementById('zoomIn').click();ok(state().zoom>1.8,'Zoom buttons enlarge only the board');tap(220,182);ok(state().peeled.includes(w.SandEngine.paths.findIndex(p=>p[0]==='eyeRight')),'Zoomed tap maps back to the correct eye');
const before=state().peeled.length;pointer('pointerdown',11,100,240);pointer('pointerdown',12,280,240);pointer('pointermove',11,60,220);pointer('pointermove',12,320,260);pointer('pointerup',11,60,220);pointer('pointerup',12,320,260);ok(state().zoom>2.3,'Synthetic two-finger pinch changes zoom');ok(state().peeled.length===before,'Pinch does not peel either initial finger location');
d.getElementById('zoomReset').click();ok(state().zoom===1&&state().pan.x===0&&state().pan.y===0,'Reset restores the complete board without resetting art');
w.__qaRotate(true);ok(cv.dataset.portraitPaused==='true'&&w.getComputedStyle(d.getElementById('rotateGuard')).display==='flex','Simulated mobile landscape pauses and shows upright guidance');ok(d.getElementById('app').inert,'Landscape blocks game controls');const count=state().peeled.length;tap(70,275);ok(state().peeled.length===count,'Landscape cannot accidentally peel hidden artwork');w.__qaRotate(false);ok(cv.dataset.portraitPaused==='false'&&w.getComputedStyle(d.getElementById('rotateGuard')).display==='none','Returning upright restores the same picture');ok(state().peeled.length===before,'Rotation preserves peeled artwork');
let locks=0;Object.defineProperty(w.screen.orientation,'lock',{configurable:true,value:async()=>{locks++;throw new Error('unsupported in test')}});d.documentElement.requestFullscreen=async()=>{};d.getElementById('portrait').click();await wait(30);ok(locks===1&&d.getElementById('hint').textContent.includes('無法鎖定'),'Rejected orientation lock provides system-lock fallback');
d.getElementById('sensor').click();await wait(40);const orient=(beta)=>{const e=new w.Event('deviceorientation');Object.defineProperties(e,{gamma:{value:0},beta:{value:beta}});w.dispatchEvent(e)};orient(80);await wait(80);ok(Math.abs(state().gravity.y)<.001,'Enabling motion at an upright pose does not create downward drift');orient(90);await wait(180);ok(state().gravity.y>.03&&state().gravity.y<.2,'A small relative tilt produces a controlled gravity signal');orient(80);await wait(350);ok(Math.abs(state().gravity.y)<.02,'Returning to the calibrated pose levels the board');d.getElementById('sensor').click();
d.querySelector('[data-color="3"]').click();ok(state().colors.length===0,'Last sand color can be deselected');d.querySelector('[data-tool="pour"]').click();let q=point(180,150);const emitted=state().grains.length;pointer('pointerdown',77,q.x,q.y);await wait(150);pointer('pointerup',77,q.x,q.y);ok(state().grains.length===emitted,'Holding pour with no selected colors emits nothing');d.querySelector('[data-color="4"]').click();pointer('pointerdown',78,q.x,q.y);await wait(150);pointer('pointerup',78,q.x,q.y);ok(state().grains.length>emitted&&state().grains.every(p=>p.color===4),'Selecting a color resumes pouring only that color');
d.getElementById('lang').click();ok(d.getElementById('portrait').textContent==='Portrait'&&d.getElementById('rotateTitle').textContent==='Turn your phone upright','New controls and rotation guidance support English');
d.querySelector('[data-tool="pick"]').click();ok(d.querySelectorAll('[data-tool]').length===5&&!d.querySelector('[data-tool="peel"]'),'The pick replaces the separate peel tool');const head=w.SandEngine.paths.findIndex(p=>p[0]==='head');q=point(180,160);const end=point(200,170);pointer('pointerdown',79,q.x,q.y);pointer('pointermove',79,end.x,end.y);pointer('pointerup',79,end.x,end.y);ok(state().peeled.includes(head)&&Number(cv.dataset.peelAnimation)===head,'Dragging the pick lifts paper and triggers the peel animation');
d.getElementById('desk').click();ok(d.getElementById('deskDialog').open,'Desk settings opens secondary controls');d.getElementById('deskClose').click();ok(!d.getElementById('deskDialog').open,'Closing settings returns to the unchanged artwork');
for(const [width,height]of [[390,844],[320,568],[430,760]]){frame.style.width=width+'px';frame.style.height=height+'px';await wait(60);const r=cv.getBoundingClientRect(),app=d.getElementById('app').getBoundingClientRect();ok(d.documentElement.scrollWidth===width&&app.bottom<=height+.5&&r.height>=140,`Layout fits ${width}×${height} without overflow`);const controls=[...d.querySelectorAll('header button,#palette button,#tools button,.desk-actions button')];ok(controls.every(e=>e.getBoundingClientRect().height>=44&&e.getBoundingClientRect().width>=44),`Primary touch targets remain 44px at ${width}×${height}`);if(width===390)ok(Math.min(r.width/360,r.height/400)*346>360,'Paper frame uses over 360px of a 390px screen')}
document.body.dataset.result='PASS';out.textContent=lines.join('\n')+'\nALL INPUT REGRESSIONS PASS';
}catch(e){document.body.dataset.result='FAIL';out.textContent+='\nFAIL '+e.stack}
})();
</script>
