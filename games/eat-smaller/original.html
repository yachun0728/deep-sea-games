<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8dcbd">
<title>數字吞噬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#e8dcbd; --paper:#f6eedb; --paper2:#fbf6ea; --ink:#2b2b2b; --mute:rgba(43,43,43,.62); --mute2:rgba(43,43,43,.42);
    --cyan:#3f97c4; --violet:#8e5fcf; --amber:#d9801a; --red:#c8402f; --green:#4a8a3a;
    --m-cyan:#8fd3e8; --m-violet:#c9a6e8; --m-amber:#f6c47a; --m-green:#a9d98f; --m-red:#f2a594;
    --font:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","Comic Sans MS",cursive;
    --sk:255px 15px 225px 15px/15px 225px 15px 255px;
    --sk2:15px 255px 15px 225px/225px 15px 255px 15px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-font-smoothing:antialiased;
    background-color:var(--desk);
    background-image:radial-gradient(rgba(43,43,43,.06) 1px,transparent 1.2px);background-size:7px 7px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  b{font-weight:700}
  .num{font-variant-numeric:tabular-nums}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .lbl{font-size:13px;letter-spacing:.08em;color:var(--mute)}
  .icon-btn{width:38px;height:38px;border-radius:var(--sk);background:var(--paper2);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-left:5px;box-shadow:2px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .icon-btn:nth-child(2n){border-radius:var(--sk2)}
  .icon-btn:hover{background:#fff}
  .icon-btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
  canvas#cv{display:block;border:2.5px solid var(--ink);border-radius:14px 26px 12px 24px/24px 12px 26px 14px;box-shadow:5px 6px 0 rgba(43,43,43,.85);background:var(--paper)}
  .hint{font-size:14px;color:var(--mute);text-align:center}
  .overlay{position:fixed;inset:0;display:none;background:rgba(232,220,189,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:22px 16px 16px;z-index:10;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
  .overlay.show{display:flex}
  .overlay .card{margin:auto}
  .card{position:relative;width:min(460px,100%);background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--sk);padding:28px 24px 24px;text-align:center;box-shadow:7px 8px 0 var(--ink);transform:rotate(-.6deg)}
  .card::before{content:"";position:absolute;left:50%;top:-14px;width:96px;height:26px;margin-left:-48px;background:rgba(246,196,122,.75);transform:rotate(-3deg);border-left:2px dashed rgba(43,43,43,.15);border-right:2px dashed rgba(43,43,43,.15)}
  .card h1{font-size:38px;font-weight:700;letter-spacing:.02em}
  .card h2{font-size:30px;font-weight:700}
  .sub{color:var(--mute);font-size:16px;line-height:1.65;margin-top:10px}
  .rules{text-align:left;margin:18px 0 6px;display:grid;gap:10px;font-size:16px;line-height:1.5}
  .rules div{display:flex;gap:10px;align-items:flex-start}
  .btn{display:inline-block;margin-top:18px;padding:10px 28px;border-radius:var(--sk);border:2.5px solid var(--ink);font-weight:700;font-size:19px;box-shadow:3px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
  .btn.ghost{background:var(--paper2);padding:7px 18px;font-size:16px;margin-top:12px;border-radius:var(--sk2)}
  .levels{display:grid;gap:10px;margin-top:18px}
  .levels button{aspect-ratio:1;background:var(--paper2);border:2px solid var(--ink);border-radius:var(--sk);font-weight:700;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:2px 3px 0 var(--ink)}
  .levels button:nth-child(2n){border-radius:var(--sk2);transform:rotate(1deg)}
  .levels button:nth-child(3n){transform:rotate(-1.2deg)}
  .levels button small{font-size:12px;font-weight:400;color:var(--mute)}
  .levels button:disabled{opacity:.35;cursor:default;border-style:dashed;box-shadow:none}
  .stat{display:flex;justify-content:center;gap:28px;margin-top:14px}
  .stat b{display:block;font-size:32px}
  .stat span{font-size:13px;color:var(--mute)}
  .bar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .big{font-size:40px;font-weight:700;line-height:1}
  .target{color:var(--amber)}
  .mid{flex:1;min-width:0;padding:0 6px 2px}
  .big.bump{animation:bump .28s ease-out}
  @keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
  .prog{height:13px;border:2px solid var(--ink);border-radius:var(--sk);background:var(--paper2);overflow:hidden;margin-top:6px}
  .prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--green) 0 3px,var(--m-green) 3px 7px);transition:width .2s}
  .prog i.over{background:repeating-linear-gradient(-45deg,var(--red) 0 3px,var(--m-red) 3px 7px)}
  .status{font-size:15px;line-height:1.2;color:var(--mute);text-align:center;min-height:18px;margin-top:4px}
  .status.warn{color:var(--red);font-weight:700}
  .chip{flex:none;min-width:36px;height:27px;padding:0 6px;border-radius:var(--sk);border:2px solid var(--ink);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .btn{background:var(--m-green)}
  @media (max-height:520px){ .levels button{aspect-ratio:1.35} .card{padding:22px 22px 18px} }
  .levels{grid-template-columns:repeat(4,1fr)}
  .levels button.done{background:#e3f1d6}
  canvas#cv{cursor:crosshair}
  .plat{margin-top:14px;padding:8px 12px;border:2px dashed rgba(43,43,43,.35);border-radius:var(--sk2);font-size:14px;line-height:1.5;color:var(--ink);background:rgba(246,196,122,.25)}
  .bonus{margin-top:10px;font-size:17px;font-weight:700;color:var(--green);min-height:0}
  .bonus:empty{display:none}
  /* 觸控搖桿 */
  #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2.5px dashed rgba(43,43,43,.45);background:rgba(246,238,219,.45);display:none;pointer-events:none;z-index:6}
  #joy.on{display:block}
  #joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#8fd3e8;border:2.5px solid var(--ink);box-shadow:2px 3px 0 rgba(43,43,43,.8)}
  #app,#app *{touch-action:none}
  .thumb{display:none}
  @media (pointer:coarse) and (orientation:portrait){
    .thumb{display:flex;align-items:center;justify-content:center;flex:none;height:150px;border:2.5px dashed rgba(43,43,43,.3);border-radius:var(--sk);color:var(--mute2);font-size:16px;gap:10px}
    .thumb b{display:inline-block;width:34px;height:34px;border-radius:50%;border:2.5px dashed rgba(43,43,43,.35)}
  }
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="bar">
    <div><div class="lbl" data-t="you"></div><div class="big num" id="hudVal">2</div></div>
    <div class="mid">
      <div class="lbl" id="hudLv" style="text-align:center"></div>
      <div class="prog"><i id="prog"></i></div>
      <div class="status" id="status"></div>
    </div>
    <div style="text-align:right"><div class="lbl" data-t="target"></div><div class="big num target" id="hudTarget">12</div></div>
    <div style="align-self:center;white-space:nowrap"><button class="icon-btn" id="btnSound" data-tt="sound">🔊</button><button class="icon-btn" id="btnRestart" data-tt="restart">↻</button><button class="icon-btn" id="btnMenu" data-tt="menu">☰</button></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="thumb" id="thumb"><b></b><span data-t="thumb"></span></div>
</div>
<div id="joy"><i></i></div>

<div class="overlay" id="ovMenu">
  <div class="card">
    <h1 data-t="title"></h1>
    <div class="sub" data-t="intro"></div>
    <div class="plat" id="platNote" hidden></div>
    <div class="levels" id="levels"></div>
    <button class="btn" id="btnBack" data-t="back"></button>
  </div>
</div>

<div class="overlay" id="ovEnd">
  <div class="card">
    <h2 id="endTitle"></h2>
    <div class="sub" id="endSub"></div>
    <div class="stat" id="endStat">
      <div><b class="num" id="endTime">0.0</b><span data-t="sec"></span></div>
      <div><b class="num" id="endBest">0.0</b><span data-t="best"></span></div>
    </div>
    <div class="bonus" id="endBonus"></div>
    <button class="btn" id="btnEnd"></button>
    <div><button class="btn ghost" id="btnEndMenu" data-t="pick"></button></div>
  </div>
</div>

<div class="overlay" id="ovPause">
  <div class="card">
    <h2 data-t="paused"></h2>
    <div class="sub" data-t="pausedSub"></div>
    <button class="btn" id="btnResume" data-t="resume"></button>
  </div>
</div>

<script>
(() => {
'use strict';
// 世界尺寸（遊戲單位）：短邊固定 SHORT，長邊跟著畫面比例，讓棋盤填滿畫面而不是縮在中間的正方形。
const SHORT = 520;
let W = SHORT, H = SHORT;
const REF_AREA = SHORT * SHORT * 16 / 9; // 關卡數量以 16:9 棋盤為基準

// ---------- 語言：字串寫成「中文|English」，語言跟隨 Deep Sea Arcade 頁首切換 ----------
function lang() { try { const i = window.parent !== window && window.parent.deepSeaI18n; return i && i.getLanguage() === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; } }
function Lx(s, p) {
  const k = s.indexOf('|'); let t = k < 0 ? s : lang() === 'en' ? s.slice(k + 1) : s.slice(0, k);
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return p ? t.replace(/\{(\w+)\}/g, (_, n) => p[n] != null ? p[n] : '') : t;
}
const TX = {
  you: '你|You', target: '目標|Target', sound: '音效 (M)|Sound (M)', restart: '重來 (R)|Restart (R)', menu: '選關 (P / Esc)|Stages (P / Esc)',
  thumb: '在這裡按住拖曳來移動|Press and drag here to move',
  title: '數字吞噬|Number Gulp',
  intro: '吃掉比你小的數字、躲開比你大的，**剛好**變成目標數字就過關。|Eat smaller numbers, dodge bigger ones, and hit the target **exactly**.',
  back: '回到遊戲|Back to game', sec: '秒|sec', best: '最佳|Best', pick: '選關|Stages',
  paused: '已暫停|Paused', pausedSub: '離開畫面時會自動暫停。|The game pauses when you leave the screen.', resume: '繼續|Resume',
};
function applyStatic() {
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = Lx(TX[el.dataset.t]); });
  document.querySelectorAll('[data-tt]').forEach(el => { el.title = Lx(TX[el.dataset.tt]); el.setAttribute('aria-label', el.title); });
}

// pop: 場上數字量；danger: 比你大的比例；hunt: 大數字會追人的比例；ops: 可能出現的運算符；opRate: 運算符出現機率
// tip 畫在棋盤上的開場卡，要短到一行放得下
const LEVELS = [
  { name: '暖身|Warm-up', start: 2, target: 12, pop: 12, danger: .25, hunt: 0, ops: ['−3'], opRate: .12,
    tip: '吃小的數字長大。吃過頭？撿 −3 降回來。|Eat smaller numbers. Overshot? A −3 brings you back down.' },
  { name: '剛剛好|Just Right', start: 3, target: 25, pop: 14, danger: .3, hunt: 0, ops: ['−3', '+1'], opRate: .14,
    tip: '快到目標時，先算好再吃。|Close to the target? Count before you eat.' },
  { name: '除以二|Halve It', start: 4, target: 40, pop: 15, danger: .35, hunt: 0, ops: ['÷2', '−3', '+1'], opRate: .16,
    tip: '新的 ÷2（無條件捨去）：能救你，也能害你。|New: ÷2 (rounds down). It can save you, or ruin you.' },
  { name: '獵人|Hunters', start: 3, target: 30, pop: 15, danger: .38, hunt: .45, ops: ['−3', '+1'], opRate: .13,
    tip: '帶尖角的數字會追你，快跑！|Spiky numbers hunt you down. Run!' },
  { name: '大胃王|Big Eater', start: 5, target: 99, pop: 17, danger: .4, hunt: .35, ops: ['÷2', '−3', '+1'], opRate: .14,
    tip: '越大游得越慢，越後面越難逃。|The bigger you get, the slower you swim.' },
  { name: '陷阱海|Sea of Traps', start: 4, target: 50, pop: 18, danger: .3, hunt: .3, ops: ['÷2', '÷2', '−3', '+1'], opRate: .32,
    tip: '到處都是運算符，別一頭撞上 ÷2。|Operators everywhere. Don\'t swim into a ÷2.' },
  { name: '質數|Prime', start: 2, target: 61, pop: 17, danger: .45, hunt: .5, ops: ['÷2', '−3', '+1'], opRate: .15,
    tip: '61 是質數，靠 ÷2 永遠湊不到。|61 is prime: ÷2 can never land you on it.' },
  { name: '128', start: 2, target: 128, pop: 18, danger: .48, hunt: .55, ops: ['÷2', '−3', '+1'], opRate: .14,
    tip: '最終關：從 2 一路長到 128。|Final stage: from 2 all the way to 128.' },
];

// ---------- Deep Sea Arcade 平台：開局、BONUS 與暫停由父頁 deepSeaEatSmaller 處理；單獨開啟時是不入帳的示範 ----------
function host() { try { return window.parent !== window ? window.parent.deepSeaEatSmaller || null : null; } catch (e) { return null; } }
let roundOn = false, earned = 0, platformVisible = true;
function ensureRound() {
  const h = host();
  if (!h || roundOn) return true;
  if (!(h.start(window) > 0)) return false;
  roundOn = true; earned = 0; renderNote();
  return true;
}
function renderNote() {
  const el = document.getElementById('platNote');
  if (!host()) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = roundOn
    ? Lx('本局進行中：每關第一次通過 BONUS +2 點（已得 {e} / 10）。失敗可以直接重來。|Round in progress: +2 BONUS pts the first time you clear each stage ({e} / 10 earned). Retry freely after a loss at no extra cost.', { e: earned })
    : Lx('開始遊玩就會開一局；本局每關第一次通過 BONUS +2 點，最多 10 點。|Start playing to open a round; each stage’s first clear in the round gives a +2 pt BONUS, up to 10 pts.');
}
function touch() { const h = host(); if (h && roundOn && h.touch) h.touch(window); }

const store = {
  get(k, d) { try { const v = localStorage.getItem('eatSmaller.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('eatSmaller.' + k, JSON.stringify(v)); } catch (e) {} }
};
let unlocked = store.get('unlocked', 1);
let bests = store.get('bests', {});

// ---------- Sound (synthesized live with Web Audio; no audio files needed) ----------
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = store.get('muted', false);
  const VOL = .6, lastAt = {};
  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain(); master.gain.value = muted ? 0 : VOL;
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  // Skip a sound if the same one just played, so rapid eating does not turn into noise
  function gate(name, gap) { const n = performance.now(); if (lastAt[name] && n - lastAt[name] < gap) return false; lastAt[name] = n; return true; }
  function tone({ type = 'triangle', f0, f1, t = 0, dur = .12, vol = .3, attack = .006 }) {
    const a = ensure(); if (!a || muted) return;
    const s = a.currentTime + t, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, s);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, s + dur);
    g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(vol, s + attack);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(g); g.connect(master); o.start(s); o.stop(s + dur + .03);
  }
  function noise({ t = 0, dur = .06, vol = .15, freq = 2500, q = 1, type = 'bandpass' }) {
    const a = ensure(); if (!a || muted) return;
    const s = a.currentTime + t, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, s); g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(s); src.stop(s + dur + .02);
  }
  return {
    unlock: ensure,
    get muted() { return muted; },
    toggle() { muted = !muted; store.set('muted', muted); if (master) master.gain.value = muted ? 0 : VOL; return muted; },
    // Eat: the closer you are to the target, the higher the pitch
    eat(progress) {
      if (!gate('eat', 45)) return;
      const f = 330 + 560 * Math.max(0, Math.min(1, progress));
      tone({ f0: f, f1: f * 1.8, dur: .09, vol: .26 });
      noise({ dur: .025, vol: .07, freq: 3500 });
    },
    // Operators: −3 and ÷2 slide down, +1 hops up
    opDown() { tone({ type: 'sine', f0: 560, f1: 170, dur: .24, vol: .3 }); tone({ f0: 280, f1: 90, dur: .24, vol: .1 }); },
    opUp() { tone({ f0: 640, f1: 960, dur: .08, vol: .22 }); tone({ f0: 960, f1: 1280, t: .06, dur: .08, vol: .16 }); },
    // Same size: bounce off
    bump() { if (!gate('bump', 150)) return; tone({ type: 'sine', f0: 200, f1: 340, dur: .1, vol: .26 }); tone({ type: 'sine', f0: 340, f1: 190, t: .08, dur: .14, vol: .16 }); },
    // Warning when you overshoot the target
    over() { tone({ type: 'square', f0: 466, dur: .1, vol: .06 }); tone({ type: 'square', f0: 349, t: .13, dur: .18, vol: .06 }); },
    // Eaten
    lose() {
      tone({ type: 'sawtooth', f0: 320, f1: 55, dur: .65, vol: .16 });
      noise({ dur: .3, vol: .3, freq: 700, q: .6, type: 'lowpass' });
      noise({ t: .05, dur: .08, vol: .12, freq: 1800 });
    },
    // Hit the target exactly
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone({ f0: f, dur: .28, t: i * .09, vol: .2 }));
      tone({ type: 'sine', f0: 2093, f1: 2637, t: .38, dur: .4, vol: .07 });
    },
    start() { tone({ f0: 392, dur: .1, vol: .14 }); tone({ f0: 587.33, t: .08, dur: .16, vol: .14 }); },
    click() { tone({ type: 'square', f0: 1100, dur: .03, vol: .04 }); },
  };
})();
// Browsers only allow audio after a user gesture, so start it on the first tap or key press
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, () => sfx.unlock(), { capture: true, passive: true }));
document.addEventListener('click', e => { if (e.target.closest('button')) sfx.click(); });

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const bar = document.getElementById('bar'), thumb = document.getElementById('thumb');
  const thumbZone = matchMedia('(pointer:coarse) and (orientation:portrait)').matches ? 158 : 0;
  const availW = Math.max(240, window.innerWidth - 16);
  let cw = availW, ch = 0;
  // Two passes: the HUD may wrap onto more lines once the board (and so the HUD) gets narrower.
  for (let pass = 0; pass < 2; pass++) {
    bar.style.width = cw + 'px';
    const availH = Math.max(200, window.innerHeight - 16 - 8 - bar.offsetHeight - thumbZone);
    const asp = availW / availH;
    if (asp >= 1) { H = SHORT; W = Math.round(SHORT * Math.min(asp, 1.9)); }
    else { W = SHORT; H = Math.round(SHORT / Math.max(asp, 1 / 1.9)); }
    scale = Math.min(availW / W, availH / H);
    cw = Math.floor(W * scale); ch = Math.floor(H * scale);
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  bar.style.width = cw + 'px'; thumb.style.width = cw + 'px';
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.fill) {
    ctx.fillStyle = o.fill; ctx.beginPath();
    ctx.moveTo(x + R() * j, y + R() * j); ctx.lineTo(x + w - R() * j, y + R() * j);
    ctx.lineTo(x + w - R() * j, y + h - R() * j); ctx.lineTo(x + R() * j, y + h - R() * j); ctx.closePath(); ctx.fill();
  }
  if (o.stroke) {
    ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2;
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath();
    sketchLine(x - e, y, x + w + e * .4, y, R, j); sketchLine(x + w, y - e * .4, x + w, y + h + e, R, j);
    sketchLine(x + w + e * .4, y + h, x - e, y + h, R, j); sketchLine(x, y + h + e * .4, x, y - e, R, j);
    ctx.stroke(); ctx.setLineDash([]);
  }
}
function sketchPoly(pts, seed, o) {
  const R = rng(seed), j = o.j != null ? o.j : 1.4;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.fill) { ctx.fillStyle = o.fill; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
  if (o.stroke) {
    ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2; ctx.beginPath();
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; sketchLine(a[0], a[1], b[0] + (b[0] - a[0]) * .08, b[1] + (b[1] - a[1]) * .08, R, j); }
    ctx.stroke();
  }
}
function hatch(x, y, w, h, seed, color, gap, lw) {
  const R = rng(seed);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = lw || 1.2; ctx.lineCap = 'round'; ctx.beginPath();
  for (let k = -h; k < w + h; k += gap) {
    ctx.moveTo(x + k + (R() - .5) * 2, y + h + 2 + (R() - .5) * 2);
    ctx.lineTo(x + k + h + (R() - .5) * 2, y - 2 + (R() - .5) * 2);
  }
  ctx.stroke(); ctx.restore();
}
function inkText(text, x, y, size, color, weight, maxW) {
  ctx.font = `${weight || 700} ${size}px ${FONT}`;
  if (maxW) { const w = ctx.measureText(text).width; if (w > maxW) ctx.font = `${weight || 700} ${Math.floor(size * maxW / w)}px ${FONT}`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

// ---------- Rendering (paper sketch) ----------
const COLORS = {
  small: { ink: '#3f7a31', wash: 'rgba(169,217,143,.45)' },
  big:   { ink: '#c8402f', wash: 'rgba(242,165,148,.5)' },
  eq:    { ink: '#7d776b', wash: 'rgba(200,192,176,.4)' },
};
function draw(now) {
  const boil = Math.floor(now / 170);
  ctx.save();
  if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.fillStyle = PAPER; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.strokeStyle = 'rgba(63,151,196,.22)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (let y = 48; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
  ctx.strokeStyle = 'rgba(200,64,47,.28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(64, 0); ctx.lineTo(64, H); ctx.stroke();
  if (!L) { ctx.restore(); return; }

  for (const e of ents) drawEnt(e, now, boil);
  const won = state === 'end' && player.v === L.target;
  if (state !== 'end' || won) {
    const blink = state === 'play' && invuln > 0 && Math.floor(now / 110) % 2;
    const s = 1 + player.pop, r = player.r * s;
    ctx.save();
    ctx.globalAlpha = blink ? .45 : 1;
    if (danger > .15 && state === 'play') { // red warning ring when something bigger is close
      ctx.save(); ctx.globalAlpha = danger * (.45 + .35 * Math.sin(now / 90));
      sketchCircle(player.x, player.y, r + 9, 5 + boil, { stroke: '#c8402f', lw: 3, passes: 1 });
      ctx.restore();
    }
    sketchCircle(player.x + 3, player.y + 4, r, 7, { fill: 'rgba(43,43,43,.12)' });
    sketchCircle(player.x, player.y, r, 1 + boil * 13, { fill: '#8fd3e8', stroke: INK, lw: 2.8 });
    const fs = Math.round(Math.max(20, Math.min(32, r * .9)));
    inkText(player.v, player.x, player.y + r * .28, fs, INK, 700);
    drawEyes(player.x, player.y - r * .38, r, player.lookX, player.lookY, danger > .5 && state === 'play');
    if (danger > .5 && state === 'play') { // sweat drop, like on the cover
      ctx.fillStyle = '#8fd3e8'; ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
      const dx = player.x - r * .78, dy = player.y - r * .72;
      ctx.beginPath(); ctx.moveTo(dx, dy - 7); ctx.quadraticCurveTo(dx + 5, dy + 1, dx, dy + 4); ctx.quadraticCurveTo(dx - 5, dy + 1, dx, dy - 7); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    if (p.conf) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); ctx.fillStyle = p.color; ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.fillRect(-5, -3, 10, 6); ctx.strokeRect(-5, -3, 10, 6); ctx.restore();
    } else {
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .03, p.y - p.vy * .03); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / .9;
    const k = p.size * (1 + .5 * Math.max(0, 1 - p.t * 6)); // pops in big, settles
    inkText(p.text, p.x, p.y, Math.round(26 * k), p.color, 700);
  }
  ctx.globalAlpha = 1;
  if (won) drawStamp(Lx('剛好 {n}！|Exactly {n}!', { n: L.target }), Math.min(1, winT * 4));
  if (tip && state === 'play') drawTip(tip);
  ctx.restore();
  if (danger > .3 && state === 'play') { // soft red edge when in danger
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .65);
    g.addColorStop(0, 'rgba(200,64,47,0)'); g.addColorStop(1, `rgba(200,64,47,${(danger - .3) * .35})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (state === 'ready') drawReady(now);
}
function drawEyes(x, y, r, lx, ly, scared) {
  const er = Math.max(4, r * .2), gap = r * .34, px = lx * er * .45, py = ly * er * .45;
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.ellipse(ex, y, er * (scared ? 1.15 : 1), er * (scared ? 1.3 : 1.12), 0, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex + px, y + py, er * (scared ? .38 : .52), 0, 6.2832); ctx.fill();
  }
}
function card(cx, cy, w, h, seed) {
  sketchRect(cx - w / 2 + 6, cy - h / 2 + 7, w, h, seed + 1, { fill: 'rgba(43,43,43,.75)', j: 1 });
  sketchRect(cx - w / 2, cy - h / 2, w, h, seed, { fill: '#fbf6ea', stroke: INK, lw: 2.5, j: 1.4 });
}
function drawStamp(text, k) {
  ctx.save(); ctx.translate(W / 2, H * .3); ctx.rotate(-.06); const s = 1.6 - .6 * k; ctx.scale(s, s); ctx.globalAlpha = k;
  ctx.font = `700 64px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = '#fbf6ea'; ctx.lineJoin = 'round'; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = '#d9801a'; ctx.fillText(text, 0, 0);
  ctx.restore();
}
// 每關的開場卡，直接畫在棋盤上；第一次移動就收起並開始。
function drawReady(now) {
  const w = Math.min(W - 60, 520), h = 196, cx = W / 2, cy = Math.max(h / 2 + 16, player.y - player.r - 36 - h / 2); // 放在玩家上方
  const tw = w - 32;
  card(cx, cy, w, h, 11);
  inkText(Lx('第 {n} 關 · {name}|Stage {n} · {name}', { n: lvIndex + 1, name: Lx(L.name) }), cx, cy - 66, 22, 'rgba(43,43,43,.62)', 400, tw);
  ctx.font = `700 40px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const a = Lx('剛好變成 |Reach exactly '), b = String(L.target), aw = ctx.measureText(a).width, bw = ctx.measureText(b).width;
  ctx.fillStyle = INK; ctx.fillText(a, cx - bw / 2, cy - 24); ctx.fillStyle = '#d9801a'; ctx.fillText(b, cx + aw / 2, cy - 24);
  inkText(Lx(L.tip), cx, cy + 22, 22, INK, 400, tw);
  const pulse = .6 + .4 * Math.sin(now / 260);
  ctx.globalAlpha = pulse;
  inkText(isTouchUI() ? Lx('在畫面任何地方按住拖曳就開始|Drag anywhere to start') : Lx('移動滑鼠就開始 · 也可以用方向鍵／WASD|Move your mouse to start  ·  or arrow keys / WASD'), cx, cy + 66, 21, '#3f7a31', 700, tw);
  ctx.globalAlpha = 1;
}
function drawTip(t) {
  const a = Math.min(1, t.t * 5, (3.2 - t.t) * 3);
  if (a <= 0) return;
  const text = Lx(t.text);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `700 22px ${FONT}`;
  const tw = Math.min(W - 16, ctx.measureText(text).width + 28), th = 40;
  const above = player.y - player.r - 70 > 0;
  let cx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, player.x));
  const cy = above ? player.y - player.r - 42 : player.y + player.r + 42;
  sketchRect(cx - tw / 2, cy - th / 2, tw, th, 21, { fill: '#fff8e6', stroke: INK, lw: 2, j: 1 });
  ctx.fillStyle = '#fff8e6'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); // little pointer toward the player
  const py = above ? cy + th / 2 : cy - th / 2, dir = above ? 1 : -1, px = Math.max(cx - tw / 2 + 14, Math.min(cx + tw / 2 - 14, player.x));
  ctx.moveTo(px - 8, py); ctx.lineTo(px, py + 10 * dir); ctx.lineTo(px + 8, py); ctx.fill(); ctx.stroke();
  inkText(text, cx, cy + 1, 22, INK, 700, tw - 20);
  ctx.restore();
}
function drawEnt(e, now, boil) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const appear = Math.min(1, e.born * 3);
  ctx.scale(appear, appear);
  const seed = e.id * 31 + boil * 7;
  if (e.op) {
    ctx.rotate(Math.sin(e.wob * 2) * .15);
    const s = e.r + 3;
    sketchPoly([[0, -s], [s, 0], [0, s], [-s, 0]], seed, { fill: '#f6c47a', stroke: INK, lw: 2.2 });
    inkText(e.op, 0, 1, 17, INK, 700);
    ctx.restore(); return;
  }
  const rel = e.v < player.v ? 'small' : e.v > player.v ? 'big' : 'eq';
  const c = COLORS[rel];
  if (rel === 'small' && player.v + e.v === L.target) {
    ctx.save(); ctx.globalAlpha = .55 + .45 * Math.sin(now / 150);
    sketchCircle(0, 0, e.r + 8, seed + 3, { stroke: '#d9801a', lw: 2.4, dash: [6, 6], passes: 1 });
    ctx.restore();
  }
  if (e.hunter && rel === 'big') {
    const a0 = Math.atan2(e.vy, e.vx), R = rng(seed);
    ctx.strokeStyle = c.ink; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.beginPath();
    const n = 9;
    for (let k = 0; k <= n * 2; k++) {
      const a = a0 + k / (n * 2) * 6.2832, rr = k % 2 ? e.r + 3 : e.r + 10 + (R() - .5) * 3;
      k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.stroke();
  }
  sketchCircle(0, 0, e.r, seed, { fill: c.wash, stroke: c.ink, lw: 2.4 });
  if (rel === 'big') {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, e.r - 3, 0, 6.2832); ctx.clip();
    hatch(-e.r, -e.r, e.r * 2, e.r * 2, e.id, 'rgba(200,64,47,.28)', 6, 1.2);
    ctx.restore();
  }
  const fs = Math.round(Math.max(21, Math.min(30, e.r * 1.1)));
  if (rel === 'big' && e.r >= 24) { // big ones watch you
    inkText(e.v, 0, e.r * .3, Math.min(fs, Math.round(e.r * .85)), c.ink, 700);
    const ox = player.x - e.x, oy = player.y - e.y, d = Math.hypot(ox, oy) || 1;
    drawEyes(0, -e.r * .36, e.r, ox / d, oy / d, false);
  } else inkText(e.v, 0, 1, fs, c.ink, 700);
  if (e.locked) { // a hunter that has spotted you
    const bob = Math.sin(now / 90) * 2;
    inkText('!', 0, -e.r - 20 + bob, 28, '#c8402f', 700);
  }
  ctx.restore();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!platformVisible) { requestAnimationFrame(frame); return; }
  if (state === 'play' || state === 'ready') update(dt);
  else if (state === 'end') { player.pop *= Math.exp(-dt * 4); stepFx(dt); }
  draw(now);
  requestAnimationFrame(frame);
}

// ---------- UI ----------
function show(id) { document.querySelectorAll('.overlay').forEach(o => o.classList.toggle('show', o.id === id)); }
let before = null; // 關掉選關時要回到的狀態
function openMenu() {
  if (state === 'menu') return;
  if (state === 'pause') { tellResume(); state = 'play'; }
  before = state === 'play' || state === 'ready' ? state : null;
  state = 'menu'; endJoy(); keys.clear(); pointer = null;
  renderMenu(); renderNote();
  show('ovMenu');
}
function renderMenu() {
  document.getElementById('btnBack').style.display = before ? '' : 'none';
  const box = document.getElementById('levels'); box.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.innerHTML = `${lv.target}<small>${bests[i] != null ? bests[i].toFixed(1) + 's' : Lx('第 {n} 關|Stage {n}', { n: i + 1 })}</small>`;
    b.disabled = i >= unlocked;
    if (bests[i] != null) b.classList.add('done');
    b.onclick = () => intro(i);
    box.appendChild(b);
  });
}
function resume() { if (!before) return; state = before; before = null; show(null); last = performance.now(); }
// 把關卡擺上棋盤，等玩家第一次移動才開始（不用多按一次）。
function intro(i) { show(null); loadLevel(i); state = 'ready'; pointer = null; updHud(); }
function begin() {
  if (!ensureRound()) return; // 平台開局失敗時留在開場卡
  sfx.start(); show(null); state = 'play'; last = performance.now(); invuln = 1.2; updHud();
  if (lvIndex === 0) coach('eat', '吃掉綠色的小數字來長大|Eat smaller (green) numbers to grow');
}
document.getElementById('btnBack').onclick = resume;
document.getElementById('btnEndMenu').onclick = openMenu;
document.getElementById('btnMenu').onclick = openMenu;
function toggleSound() { const m = sfx.toggle(); const b = document.getElementById('btnSound'); b.textContent = m ? '🔇' : '🔊'; b.style.opacity = m ? .55 : 1; }
document.getElementById('btnSound').onclick = toggleSound;
if (sfx.muted) { const b = document.getElementById('btnSound'); b.textContent = '🔇'; b.style.opacity = .55; }
document.getElementById('btnRestart').onclick = () => { if (state === 'play' || state === 'end') { loadLevel(lvIndex); begin(); } };

// ---------- 暫停：切走遊戲、背景分頁時自動暫停，回來要按「繼續」 ----------
function pauseGame() {
  if (state !== 'play') return;
  state = 'pause'; keys.clear(); pointer = null; endJoy();
  show('ovPause');
  const h = host(); if (h && roundOn && h.pause) h.pause(window);
}
function tellResume() { const h = host(); if (h && roundOn && h.resume) h.resume(window); }
function resumeGame() {
  if (state !== 'pause') return;
  state = 'play'; show(null); last = performance.now(); tellResume();
}
document.getElementById('btnResume').onclick = resumeGame;
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

// 父頁介面：右側按鈕開局、切換畫面、結束本局
window.startEatPlatformRound = () => { if (roundOn) return roundOn; if (ensureRound()) openMenu(); return roundOn; };
window.setEatPlatformActive = v => { platformVisible = !!v; last = performance.now(); if (!platformVisible) pauseGame(); else resize(); };
window.endEatPlatformRound = () => { roundOn = false; earned = 0; endJoy(); if (state !== 'menu') state = 'end'; before = null; openMenu(); renderMenu(); renderNote(); };
window.isEatPlatformRound = () => roundOn;

function relang() {
  applyStatic(); updHud(); renderNote(); renderMenu(); renderEnd();
}
try { window.parent.addEventListener('arcade-languagechange', relang); } catch (e) {}
applyStatic();
resize();
// 直接進入遊玩：新玩家從第 1 關、回訪玩家從最遠的關開始。
intro(Math.min(unlocked, LEVELS.length) - 1);
requestAnimationFrame(frame);
})();
</script>
</body>
