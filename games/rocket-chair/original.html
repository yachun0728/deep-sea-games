<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>社畜要下班 吼破天花板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 漫畫線稿風：白紙、黑墨線，點綴色只用火焰紅橘／水桶淺藍／光束黃 */
:root{--ink:#1d1b1a;--paper:#ffffff;--paper2:#f6f5f1;--accent:#e8502e;--accent-dk:#9c2c16;--blue:#a9d8ee;--yellow:#f7e33b;--gray:#8a8784}
html,body{height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
body{position:fixed;inset:0}
#app{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
/* 標題字：黑色粗字，白色描邊（在線稿背景上也看得清楚） */
.ol{color:var(--ink);text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));text-align:center;
  background:rgba(255,255,255,.93);z-index:20;gap:14px}
.screen.show{display:flex}
.screen h2{font-size:28px;font-weight:900;color:var(--ink);letter-spacing:2px;line-height:1.3}
.screen p{font-size:16px;line-height:1.6;color:var(--ink);font-weight:600}
.screen .small{font-size:13px;color:#5f5c59;font-weight:500}
.btn{appearance:none;border:2.5px solid var(--ink);border-radius:6px;padding:12px 22px;min-width:230px;font-size:18px;font-weight:900;cursor:pointer;
  background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--ink);font-family:inherit;letter-spacing:2px;line-height:1.3}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:var(--paper)}
.btn.red{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:none;color:var(--ink);box-shadow:none;font-size:15px;font-weight:600;text-decoration:underline;padding:6px;min-width:0;letter-spacing:0}
.btn.ghost:active{transform:none}
.btn.small{min-width:0;padding:6px 12px;font-size:14px;box-shadow:3px 3px 0 var(--ink);letter-spacing:1px}
.btn[disabled],.btn.dim{opacity:.4}
.btn-sub{display:block;font-size:12px;font-weight:600;letter-spacing:0;opacity:.85}
.pill{font-size:14px;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:4px 12px;line-height:1.4}
.pill b{color:var(--accent);font-size:17px;font-weight:900}
.pill .w-sub{font-size:11px;font-weight:500;color:#5f5c59}
.pill:empty{display:none}
.privacy{font-size:13px;font-weight:700;color:var(--ink);background:var(--paper);border:2px dashed var(--ink);border-radius:4px;padding:8px 12px;line-height:1.5;max-width:320px}

/* 首頁 */
#s-title{justify-content:space-between;background:none;pointer-events:none}
#s-title button{pointer-events:auto}
.t-top{margin-top:calc(26px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:4px}
.t-bot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px}
#logo{display:flex;flex-direction:column;align-items:center;line-height:1.05;transform:rotate(-3deg)}
#logo .l1{font-size:min(58px,14.5vw);font-weight:900;color:var(--ink);letter-spacing:4px;
  text-shadow:0 3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 -3px 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff}
#logo .l2{font-size:min(48px,12vw);font-weight:900;color:var(--accent);letter-spacing:5px;margin-top:4px;transform:rotate(2deg);
  text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),5px 7px 0 var(--ink)}
#t-sub{font-size:15px;font-weight:800;margin-top:10px;background:#fff;padding:2px 10px}
#mute{position:absolute;top:calc(10px + env(safe-area-inset-top));right:2px;z-index:25;width:44px;height:44px;padding:0;border:none;background:none;cursor:pointer}
#mute svg{display:block;width:100%;height:100%}
#mute:active{transform:translateY(2px)}
#mute .slash{opacity:0}#mute.muted .waves{opacity:0}#mute.muted .slash{opacity:1}

/* 校準 */
#calib-step{font-size:26px;font-weight:900}
#calib-meter{width:260px;height:24px;border:2.5px solid var(--ink);border-radius:4px;background:var(--paper);overflow:hidden;position:relative;box-shadow:3px 3px 0 var(--ink)}
#calib-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
#calib-prog{width:260px;height:6px;border:1.5px solid var(--ink);overflow:hidden}
#calib-prog div{height:100%;width:0;background:var(--ink)}

#s-ad{background:#d9d7d3}
#ad-count{font-size:80px;font-weight:900;color:#333}

#s-result{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;gap:10px}
#r-head{font-size:26px;font-weight:900;line-height:1.35;margin-top:6px}
#r-head b{color:var(--accent);font-size:36px}
#r-title{font-size:15px;font-weight:700}
#r-title b{display:inline-block;margin-top:4px;font-size:28px;color:#fff;background:var(--ink);border-radius:2px;padding:2px 16px;transform:rotate(-2deg);letter-spacing:3px}
#r-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:330px}
#r-stats div{background:var(--paper);border:2px solid var(--ink);border-radius:2px;padding:5px 6px;font-size:12px;font-weight:700;line-height:1.3}
#r-stats div b{display:block;font-size:19px;color:var(--accent)}
#r-cards{display:flex;flex-direction:column;gap:8px;width:100%;max-width:330px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:2px;padding:8px 10px;font-size:14px;font-weight:800;line-height:1.4;text-align:left;box-shadow:3px 3px 0 var(--ink)}
.card:nth-child(odd){transform:rotate(-1.2deg)}.card:nth-child(even){transform:rotate(1deg)}
.card small{display:block;font-size:11px;color:#5f5c59;font-weight:700}
#s-result .btn{min-width:250px;padding:10px 20px;font-size:17px}
#rotate{position:absolute;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:18px;font-weight:700}
#rotate.show{display:flex}
#toast{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);z-index:70;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);padding:10px 16px;border-radius:4px;
  font-size:15px;font-weight:700;line-height:1.5;max-width:86%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:4px 4px 0 var(--ink)}
#toast.show{opacity:1}
#debug{position:absolute;left:4px;top:120px;z-index:50;font:11px/1.35 ui-monospace,Menlo,monospace;background:rgba(20,20,40,.78);color:#8fffb0;padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:auto}
#debug button{font:11px ui-monospace,monospace;margin:4px 4px 0 0;padding:3px 6px;border-radius:4px;border:none;background:#2c6;color:#012}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="safe"></div>

  <!-- 首頁 -->
  <div id="s-title" class="screen show">
    <div class="t-top">
      <div id="logo"><span class="l1">社畜要下班</span><span class="l2">吼破天花板</span></div>
      <div id="t-sub">對著手機大吼，衝破 5 層樓</div>
    </div>
    <div class="t-bot">
      <div id="t-wallet" class="pill"></div>
      <button class="btn" id="btn-start">準備落跑</button>
    </div>
  </div>
  <button id="mute" class="hidden" aria-label="音效開關"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#ffffff" stroke="#1d1b1a" stroke-width="3"/><path d="M15 26h8l11-9v30l-11-9h-8z" fill="#1d1b1a" stroke="#1d1b1a" stroke-width="3" stroke-linejoin="round"/><g class="waves" fill="none" stroke="#1d1b1a" stroke-width="3" stroke-linecap="round"><path d="M40 25q5 7 0 14"/><path d="M45 20q9 12 0 24"/></g><g class="slash" stroke="#e8502e" stroke-width="4" stroke-linecap="round"><path d="M40 24l12 16M52 24l-12 16"/></g></svg></button>

  <!-- 選模式＋點火 -->
  <div id="s-mode" class="screen">
    <h2 class="ol">對著手機大吼，點火！</h2>
    <button class="btn red" id="btn-normal">正常模式・點火<span class="btn-sub">大吼一聲就能衝</span></button>
    <button class="btn sec" id="btn-quiet">小聲模式・點火<span class="btn-sub">在捷運上也能玩，哼歌就能飛</span></button>
    <button class="btn ghost" id="btn-touch">不方便出聲？用按的玩</button>
    <div id="mode-wallet" class="pill"></div>
    <button class="btn ghost" id="btn-mode-back">回首頁</button>
  </div>

  <!-- 校準 -->
  <div id="s-calib" class="screen">
    <div id="calib-step" class="ol">請安靜 2 秒</div>
    <p id="calib-desc">正在聽聽辦公室有多吵</p>
    <div id="calib-meter"><div id="calib-fill"></div></div>
    <div id="calib-prog"><div></div></div>
    <button class="btn sec small hidden" id="btn-skip-calib">跳過校準（用上次的設定）</button>
  </div>

  <!-- 讀不到麥克風 -->
  <div id="s-micfail" class="screen">
    <h2 class="ol" id="mf-title">這裡讀不到麥克風</h2>
    <p id="mf-desc">請用 Safari / Chrome 開啟</p>
    <button class="btn sec" id="btn-copy">複製網址</button>
    <button class="btn" id="btn-mf-touch">用按的玩</button>
    <button class="btn ghost" id="btn-mf-back">回首頁</button>
  </div>

  <!-- 暫停／繼續 -->
  <div id="s-pause" class="screen">
    <h2 class="ol" id="pause-title">先躲一下</h2>
    <p id="pause-desc">主管還在開會，趕快回來</p>
    <button class="btn red" id="btn-resume">繼續落跑</button>
  </div>

  <!-- 續命 -->
  <div id="s-revive" class="screen">
    <h2 class="ol">主管要開完會了！</h2>
    <p id="revive-sub"></p>
    <div id="revive-wallet" class="pill"></div>
    <button class="btn" id="btn-ad">看 5 秒示範廣告<span class="btn-sub" id="ad-sub">主管的會議延長 20 秒（每局 1 次）</span></button>
    <button class="btn sec" id="btn-coffee"></button>
    <div class="small" id="coffee-note"></div>
    <button class="btn ghost" id="btn-quit">放棄，乖乖留下</button>
  </div>

  <div id="s-ad" class="screen">
    <p>示範廣告</p>
    <div id="ad-count">5</div>
    <p class="small" style="color:#333">這不是真的廣告</p>
  </div>

  <div id="s-low" class="screen">
    <h2 class="ol">點數不夠</h2>
    <p>每局需要 <span id="low-fee"></span> 點</p>
    <div id="low-wallet" class="pill"></div>
    <button class="btn" id="btn-low-ad">看 5 秒示範廣告<span class="btn-sub">之後 30 分鐘開局不扣點</span></button>
    <button class="btn ghost" id="btn-low-back">回首頁</button>
  </div>

  <!-- 結算 -->
  <div id="s-result" class="screen">
    <div id="r-head" class="ol"></div>
    <div id="r-title"></div>
    <div id="r-stats"></div>
    <div id="r-cards"></div>
    <button class="btn red" id="btn-retry">再吼一次</button>
    <button class="btn sec" id="btn-share">分享成績</button>
    <button class="btn sec" id="btn-next">想玩第 2 關？</button>
    <div id="r-wallet" class="pill"></div>
    <button class="btn ghost" id="btn-home">回首頁</button>
  </div>

  <div id="rotate"><div>請把手機轉回直的</div><div class="small" style="font-size:13px;opacity:.8">遊戲先暫停</div></div>
  <div id="toast"></div>
  <div id="debug" class="hidden"><div id="debug-text"></div>
    <button id="dbg-clear">直接過關</button><button id="dbg-fail">直接失敗</button><button id="dbg-export">匯出事件</button></div>
</div>

<script>
'use strict';
/* =========================================================
   可調參數
   ========================================================= */
const CONFIG = {
  // 時間
  meetingSeconds: 60,          // 主管會議倒數
  startClock: '16:30',
  offClock: '18:00',

  // 吼聲
  ambientMargin: 1.3,          // 環境噪音乘上多少當作 0
  quietModeScale: 0.4,         // 小聲模式的最大聲基準 = 校準最大聲 × 這個數
  roarCurve: 0.5,              // 音量換算吼聲值的曲線（0.5 = 開根號，小聲的人比較好飛）
  smoothing: 0.2,
  levelFall: 0.15,
  levelHover: 0.35,
  levelFast: 0.7,

  // 推力
  gravity: 500,
  thrustMax: 900,
  drag: 1.6,                   // 空氣阻力（決定最高速度）
  burstJumpFrom: 0.3,
  burstJumpTo: 0.8,
  burstWindow: 0.15,           // 秒
  burstImpulse: 650,
  burstDuration: 0.6,          // 衝刺時不受重力／阻力影響的秒數
  burstCooldown: 1.5,

  // 天花板
  ceilingBreakSpeed: 600,      // 速度超過多少才撞得破（衝刺才達得到）
  ceilingBounce: 200,
  breakExitSpeed: 220,         // 撞破天花板後的速度上限

  // 障礙
  grabSeconds: 1,
  grabClockPenalty: 3,         // 分鐘
  grabPull: 120,
  handInterval: 1.5,           // 左右輪流伸手的間隔
  handLaneGap: 3.0,            // 同一排兩次伸手至少隔幾秒
  paperWaveInterval: 2.6,
  paperFallDistance: 320,      // 報帳單從天花板掉多遠就散開
  paperKnock: 300,
  meetingSecondsStuck: 2,
  beamPeriod: 4.4,             // 投影機光束來回一趟幾秒
  beamSweep: 240,              // 光束左右掃多遠
  beamHalfWidth: 50,           // 光斑半寬
  meetingClockPenalty: 5,
  gossipStickSeconds: 1,
  gossipInterval: 1.25,
  sprinklerThrustRatio: 0.5,
  hitInvuln: 1.4,

  // 備案
  touchHoldLevel: 0.6,
  touchIdleLevel: 0.2,         // 用按的玩：放手時慢慢下降
  doubleTapSeconds: 0.32,

  // 麥克風
  micCheckSeconds: 1.5,

  // 點數／續命
  entryFee: 10,
  adExtendSeconds: 20,
  adContinuePerGame: 1,
  fakeAdSeconds: 5,
  adFreeMinutes: 30,
  coffeeCost: 30,
  coffeeExtendSeconds: 15,
  coffeeBoostSeconds: 10,
};

const TRACK_ENDPOINT = '';
const GAME_ID = 'rocket_chair';
const EVENTS_KEY = 'rocket_chair_events';
const CALIB_KEY = 'rocket_chair_calib';
const SEEN_KEY = 'rocket_chair_seen_story';
const DAY_KEY = 'rocket_chair_day';
const MUTE_KEY = 'rocket_chair_muted';
const DEBUG = new URLSearchParams(location.search).get('debug') === '1';

/* 世界尺寸（單位：畫面寬 = 400） */
const VW = 400, FH = 820, SLAB = 34, FLOORS = 5, CH = 146, CHW = 34;
const FLOOR_INFO = [
  { name: '1F 業務部' },
  { name: '2F 財務部' },
  { name: '3F 會議室' },
  { name: '4F 茶水間' },
  { name: '5F 頂樓前' },
];
const LANES = [[290, 470, 640], [], [300, 560], [230, 420, 610], [250, 520]];
const INK = '#1d1b1a';
const FONT = '-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

/* =========================================================
   小工具
   ========================================================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIO = (t) => { t = clamp(t, 0, 1); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const rand = (a, b) => a + Math.random() * (b - a);
const nowS = () => performance.now() / 1000;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const UA = navigator.userAgent || '';
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);
const IS_MOBILE = IS_IOS || IS_ANDROID;

function toast(msg, sec = 2.4) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('show'), sec * 1000);
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
/* 平台橋接：嵌在 deep-sea-games 大廳時，扣點／追蹤交給大廳（window.parent.deepSeaRocket） */
const HOST = (() => { try { return window.parent !== window ? window.parent.deepSeaRocket || null : null; } catch (_) { return null; } })();
function cleanUrl() {
  if (HOST) { try { const l = window.parent.location; return l.origin + l.pathname + '#rocket-chair'; } catch (_) {} }
  return location.origin + location.pathname;
}
function clockMin(str) { const [h, m] = str.split(':').map(Number); return h * 60 + m; }
function fmtClock(mins) { const h = Math.floor(mins / 60), m = Math.floor(mins % 60); return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }

/* =========================================================
   數據紀錄（只記數字，不記任何聲音）
   ========================================================= */
let inputMode = 'voice';   // voice / voice_quiet / touch
const playerId = (() => {
  let id = lsGet('mini_player_id');
  if (!id) { id = 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet('mini_player_id', id); }
  return id;
})();
function track(eventName, data = {}) {
  const rec = { ts: new Date().toISOString(), player_id: playerId, game_id: GAME_ID, input_mode: inputMode, event: eventName, data };
  if (DEBUG) console.log('[track]', eventName, data);
  try {
    const arr = JSON.parse(lsGet(EVENTS_KEY) || '[]');
    arr.push(rec); if (arr.length > 3000) arr.splice(0, arr.length - 3000);
    lsSet(EVENTS_KEY, JSON.stringify(arr));
  } catch (e) {}
  if (TRACK_ENDPOINT) {
    try {
      fetch(TRACK_ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ player_id: playerId, game_id: GAME_ID, input_mode: inputMode, event: eventName, data }) }).catch(() => {});
    } catch (e) {}
  }
}
function todayCount() {
  const d = new Date(); const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  let o = null; try { o = JSON.parse(lsGet(DAY_KEY) || 'null'); } catch (e) {}
  if (!o || o.d !== key) o = { d: key, n: 0 };
  o.n++; lsSet(DAY_KEY, JSON.stringify(o)); return o.n;
}

/* =========================================================
   點數錢包（跟 deep-sea-games 共用 localStorage）
   ========================================================= */
const Wallet = {
  STORE: 'crush-depth-balance', REGEN_KEY: 'deep-sea-regen-at', FREE_KEY: 'deep-sea-free-until',
  START: 500, REGEN_CAP: 100, REGEN_MS: 60000,
  bal: 500, regenAt: Date.now(), last: 500,
  load() {

let actx = null, master = null, muted = lsGet(MUTE_KEY) === '1';

  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); master = actx.createGain(); master.connect(actx.destination); }
    if (actx.state === 'suspended') actx.resume();

  },

    const n = Math.floor(actx.sampleRate * d), b = actx.createBuffer(1, n, actx.sampleRate), ch = b.getChannelData(0);

  burst() { this.noise(0.35, 0.3, 900); this.tone(220, 0.3, 'sawtooth', 0.12, 660); },
  grab() { this.tone(520, 0.08, 'square', 0.15, 300); this.tone(300, 0.12, 'square', 0.12, 200, 0.08); },
  paper() { this.noise(0.25, 0.3, 4000); },
  meeting() { this.tone(660, 0.4, 'sine', 0.2); this.tone(440, 0.5, 'sine', 0.2, null, 0.25); },
  pop() { this.tone(800, 0.08, 'sine', 0.2, 1400); },
  splash() { this.noise(0.3, 0.2, 3000); },

/* =========================================================
   麥克風：只計算音量（RMS），不錄音、不上傳
   ========================================================= */
const Mic = {
  stream: null, src: null, an: null, buf: null, fbuf: null, on: false, rms: 0, startT: 0, gotSignal: false,
  start() {   // 必須在點擊事件裡同步呼叫
    ensureAudio();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !actx) return Promise.resolve('unavailable');
    const req = (c) => navigator.mediaDevices.getUserMedia(c);
    let p;

    catch (e) { return Promise.resolve('unavailable'); }

      if (err && (err.name === 'OverconstrainedError' || err.name === 'TypeError')) return req({ audio: true });

    try { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); } catch (e) {}

  },

/* 校準值 */
const Calib = {
  ambient: 0.01, max: 0.2, has: false,

/* ---------- 校準 ---------- */
let CAL = null;
function startCalib() {
  CAL = { phase: 'quiet', t: 0, sum: 0, n: 0, max: 0, retried: false };
  $('btn-skip-calib').classList.toggle('hidden', !Calib.has);
  setCalibText('請安靜 2 秒', '正在聽聽辦公室有多吵');
  appState = 'calib'; showScreen('s-calib');
}
function setCalibText(a, b) { $('calib-step').textContent = a; $('calib-desc').textContent = b; }
function updateCalib(dt) {
  const r = Mic.read();
  if (Mic.failedCheck()) { track('mic_permission', { result: 'unavailable' }); micFail('unavailable'); return; }
  CAL.t += dt;
  const live = clamp(Math.sqrt(r / Math.max(Calib.max, 0.15)), 0, 1);
  $('calib-fill').style.width = (live * 100).toFixed(1) + '%';
  $('calib-prog').firstChild.style.width = clamp(CAL.t / 2, 0, 1) * 100 + '%';
  if (CAL.phase === 'quiet') {
    if (CAL.t > 0.25) { CAL.sum += r; CAL.n++; }
    if (CAL.t >= 2) {
      CAL.ambient = CAL.n ? CAL.sum / CAL.n : r;
      CAL.phase = 'yell'; CAL.t = 0; CAL.max = 0;
      setCalibText(inputMode === 'voice_quiet' ? '輕輕哼一聲試試看！' : '大吼一聲試試看！', inputMode === 'voice_quiet' ? '小聲模式：之後輕輕哼歌就能飛' : '用你最大的聲音，等一下就是這麼大聲才衝得快');
    }
  } else if (CAL.phase === 'yell') {
    CAL.max = Math.max(CAL.max, r);
    if (CAL.t >= 2) {
      const amb = Math.max(CAL.ambient, 1e-4);
      if (CAL.max < amb * 2.2 && !CAL.retried) {
        CAL.retried = true; CAL.t = 0; CAL.max = 0;
        setCalibText('好像沒聽到，再一次！', '對著手機大聲一點');
        return;
      }
      Calib.ambient = amb;
      Calib.max = Math.max(CAL.max, amb * 3);
      Calib.save();
      track('calibration_done', { ambient: +amb.toFixed(5), max: +Calib.max.toFixed(5) });
      CAL.phase = 'done'; CAL.t = 0;
      setCalibText('校準完成！', '準備點火……');
    }
  } else if (CAL.phase === 'done' && CAL.t > 0.7) {

  }
}

/* ---------- 開局 ---------- */

    const free = Wallet.isFree();
    let ok = false; try { ok = !!HOST.start(window); } catch (_) {}
    Wallet.tick();
    if (!ok) { needPoints(null); return; }
    paid = free ? 0 : CONFIG.entryFee;
  } else if (!Wallet.isFree() && CONFIG.entryFee > 0) { if (!Wallet.spend(CONFIG.entryFee)) { needPoints(null); return; } paid = CONFIG.entryFee; }
  G = newGame(); G.paid = paid; G.obs = initFloorObs(0);
  particles = []; floaters = []; camB = -40; scene = null;
  Roar.raw = 0; Roar.smooth = 0; Roar.hist = []; Touch.holding = false; Touch.keyHold = false;
  track('game_start', { nth_today: todayCount(), paid });

}

/* =========================================================
   每幀更新
   ========================================================= */
function inputLevel(dt) {
  if (G.mode === 'touch') {
    const held = Touch.holding || Touch.keyHold;
    Roar.raw = held ? CONFIG.touchHoldLevel : CONFIG.touchIdleLevel;
    Roar.smooth += (Roar.raw - Roar.smooth) * (1 - Math.pow(1 - 0.35, dt * 60));
    return Roar.smooth;
  }
  const rms = Mic.read();
  if (Mic.failedCheck()) { track('mic_permission', { result: 'unavailable' }); micFail('unavailable'); return 0; }
  G.peakRms = Math.max(G.peakRms, rms);
  Roar.raw = Calib.roar(rms);
  const raw = Math.min(Roar.raw, 1.2);
  Roar.smooth += (raw - Roar.smooth) * (1 - Math.pow(1 - CONFIG.smoothing, dt * 60));
  // 短吼衝刺：0.15 秒內從 < 0.3 跳到 > 0.8
  const t = G.elapsed;
  Roar.hist.push({ t, v: raw });
  while (Roar.hist.length && Roar.hist[0].t < t - CONFIG.burstWindow) Roar.hist.shift();
  if (raw >= CONFIG.burstJumpTo && Roar.hist.some(h => h.v < CONFIG.burstJumpFrom)) { if (tryBurst()) Roar.hist = []; }
  return Roar.smooth;
}
function thrustFor(l) {
  const pts = [[0, 0], [CONFIG.levelFall, 380], [CONFIG.levelHover, 520], [CONFIG.levelFast, 800], [1, CONFIG.thrustMax]];
  if (l >= 1) return CONFIG.thrustMax;
  for (let i = 1; i < pts.length; i++) if (l <= pts[i][0]) { const [a, fa] = pts[i - 1], [b, fb] = pts[i]; return lerp(fa, fb, (l - a) / (b - a)); }
  return CONFIG.thrustMax;
}

function updatePlay(dt) {
  const level = inputLevel(dt);
  if (appState !== 'play') return;
  G.elapsed += dt; G.ft += dt;
  if (level > CONFIG.levelHover) G.roarSec += dt;
  G.invuln = Math.max(0, G.invuln - dt); G.cooldown = Math.max(0, G.cooldown - dt);
  G.coffeeLeft = Math.max(0, G.coffeeLeft - dt); G.hintT = Math.max(0, G.hintT - dt); G.startHintT = Math.max(0, G.startHintT - dt);
  const base = G.floor * FH, ceilY = (G.floor + 1) * FH - SLAB;

  updateObstacles(dt);

  if (G.stuck) {
    const s = G.stuck; s.t += dt;
    if (s.kind === 'hand') G.y = Math.max(base, G.y - CONFIG.grabPull * dt / s.dur);
    else if (s.kind === 'paper') { G.v -= CONFIG.gravity * dt; G.y = Math.max(base, G.y + G.v * dt); }
    else if (s.kind === 'beam') G.y = Math.max(base, G.y - 20 * dt);
    if (s.t >= s.dur) { if (s.ref) s.ref.dead = true; G.stuck = null; G.v = Math.min(G.v, 0); }
  } else {
    let thrust = thrustFor(level);
    if (G.coffeeLeft > 0 && thrust > CONFIG.gravity) thrust = CONFIG.gravity + (thrust - CONFIG.gravity) * 2;
    if (G.mist) thrust *= CONFIG.sprinklerThrustRatio;
    if (G.burstLeft > 0) { G.burstLeft -= dt; }
    else G.v += (thrust - CONFIG.gravity - CONFIG.drag * G.v) * dt;
    G.y += G.v * dt;
  }
  if (G.y < base) { G.y = base; if (G.v < 0) G.v = 0; }

  // 天花板
  if (G.y + CH > ceilY) {
    if (G.v >= CONFIG.ceilingBreakSpeed) breakCeiling();
    else {
      G.y = ceilY - CH; G.v = -CONFIG.ceilingBounce; G.burstLeft = 0;
      G.bounces[G.floor]++; Snd.bonk(); shake(0.15, 3); floatText('咚！', VW / 2 - 60, ceilY - 20, INK, 24);
      track('ceiling', { floor: G.floor + 1, result: 'bounce' });
      if (!G.hintShown) { G.hintShown = true; G.hintT = 3.2; }
    }
  }

  // 表情
  G.arms = 'down';
  if (G.stuck) G.face = { hand: 'scared', paper: 'ouch', beam: 'daze', gossip: 'awk' }[G.stuck.kind];
  else if (G.burstLeft > 0) G.face = 'yell';
  else if (G.mist) G.face = 'wet';
  else if (G.meetingTotal - G.elapsed < 10) G.face = 'panic';
  else G.face = 'normal';

  if (G.meetingTotal - G.elapsed <= 0) timeUp();
}

function breakCeiling() {
  const ceilY = (G.floor + 1) * FH - SLAB;
  track('ceiling', { floor: G.floor + 1, result: 'break' });
  G.broken++; Snd.crash(); shake(0.45, 9); vibrate(80);
  for (let i = 0; i < 26; i++) particles.push({ kind: 'chunk', x: VW / 2 + rand(-60, 60), y: ceilY + rand(0, SLAB), vx: rand(-260, 260), vy: rand(-100, 380), life: rand(.8, 1.4), rot: rand(0, 6), vr: rand(-8, 8), size: rand(6, 16) });
  G.floor++; G.ft = 0;
  G.burstLeft = 0; G.v = Math.min(G.v, CONFIG.breakExitSpeed);   // 撞破樓板會被卡一下，不會直接飛過整層
  if (G.floor >= FLOORS) { levelClear(); return; }
  G.obs = initFloorObs(G.floor);
  floatText(FLOOR_INFO[G.floor].name, VW / 2, G.y + 200, INK, 26);
}

function chairOverlap(y1, y2, halfW, cx) {
  return y2 > G.y + 6 && y1 < G.y + CH - 4 && Math.abs(cx - VW / 2) < halfW + CHW;
}
function updateObstacles(dt) {
  const O = G.obs; if (!O) return; O.t += dt;
  const k = G.floor, base = k * FH, ceilY = (k + 1) * FH - SLAB;
  if (k === 0) {            // 1F：「欸你有空嗎？」的手
    O.next -= dt;
    if (O.next <= 0) {
      O.next = CONFIG.handInterval;
      // 只從火箭椅前方、還沒抓過人的那一排伸手
      // 同一排至少隔 handLaneGap 秒才再伸，留空檔讓玩家通過
      O.used = O.used || {}; O.laneT = O.laneT || {};
      const lane = LANES[0].map(v => base + v).find(ly => ly - 16 > G.y + CH - 40 && !O.used[ly]);
      if (lane !== undefined && O.t - (O.laneT[lane] ?? -99) >= CONFIG.handLaneGap) { O.list.push({ side: O.side, y: lane, t: 0 }); O.laneT[lane] = O.t; }
      O.side ^= 1;
    }
    for (const h of O.list) {
      if (!(G.stuck && G.stuck.ref === h)) h.t += dt;
      h.reach = h.t < 0.35 ? h.t / 0.35 * 0.12 : h.t < 0.6 ? lerp(0.12, 1, easeOut((h.t - 0.35) / 0.25)) : h.t < 1.0 ? 1 : lerp(1, 0, (h.t - 1.0) / 0.3);
      if (h.reach > 0.6 && !h.dead) {
        const tipX = h.side === 0 ? 14 + h.reach * 226 : VW - 14 - h.reach * 226;
        const touching = h.side === 0 ? tipX > VW / 2 - CHW : tipX < VW / 2 + CHW;
        if (touching && chairOverlap(h.y - 16, h.y + 16, 0, VW / 2)) hitObstacle('hand', h);
      }
    }
    O.list = O.list.filter(h => h.t < 1.3);
  } else if (k === 1) {     // 2F：報帳單雪崩
    O.next -= dt;
    if (O.next <= 0) {
      O.next = CONFIG.paperWaveInterval;
      const n = 3;
      for (let i = 0; i < n; i++) {
        const delay = i * 0.22;
        O.list.push({ x: VW / 2 + rand(-18, 18), y: ceilY - 14, vy: -60, warn: 0.6 + delay, endY: ceilY - CONFIG.paperFallDistance, rot: rand(-.2, .2) });
      }
      O.list.push({ x: rand(60, 110), y: ceilY - 14, vy: -60, warn: 0.6, endY: ceilY - CONFIG.paperFallDistance, rot: rand(-.3, .3), deco: true });
      O.list.push({ x: rand(290, 340), y: ceilY - 14, vy: -60, warn: 0.8, endY: ceilY - CONFIG.paperFallDistance, rot: rand(-.3, .3), deco: true });
    }
    for (const p of O.list) {
      if (p.warn > 0) { p.warn -= dt; continue; }
      p.vy -= 1300 * dt; p.y += p.vy * dt;
      if (!p.deco && !p.dead && chairOverlap(p.y - 18, p.y + 18, 36, p.x)) { p.dead = true; hitObstacle('paper'); }
      if (p.y < p.endY && !p.dead) {
        p.dead = true;
        for (let i = 0; i < 5; i++) particles.push({ kind: 'sheet', x: p.x + rand(-20, 20), y: p.y, vx: rand(-120, 120), vy: rand(-60, 60), life: 1, rot: rand(0, 6), vr: rand(-6, 6), size: 12 });
      }
    }
    O.list = O.list.filter(p => !p.dead);
  } else if (k === 2) {     // 3F：投影機光束
    for (const b of O.beams) {
      b.x = VW / 2 + CONFIG.beamSweep * Math.sin((O.t + b.phase) * Math.PI * 2 / b.period);
      if (!G.stuck && chairOverlap(b.y - 28, b.y + 28, CONFIG.beamHalfWidth, b.x)) hitObstacle('beam', null);
    }
  } else if (k === 3) {     // 4F：八卦對話泡泡
    O.next -= dt;
    if (O.next <= 0) {
      O.next = CONFIG.gossipInterval;
      let li = Math.floor(Math.random() * 3); if (li === O.lastLane) li = (li + 1) % 3; O.lastLane = li;
      const side = Math.random() < .5 ? 0 : 1;
      const lines = ['欸你知道嗎', '聽說……', '他們兩個……', '我跟你講喔', '不要說是我說的'];
      O.list.push({ y: base + LANES[3][li], x: side === 0 ? -70 : VW + 70, vx: (side === 0 ? 1 : -1) * rand(70, 105), text: lines[Math.floor(Math.random() * lines.length)], wob: rand(0, 6) });
    }
    for (const b of O.list) {
      if (b.stuck) { b.x = lerp(b.x, VW / 2 + 40, dt * 8); b.y = lerp(b.y, G.y + 140, dt * 8); continue; }
      b.x += b.vx * dt;
      if (!b.dead && chairOverlap(b.y - 26, b.y + 26, 56, b.x)) hitObstacle('gossip', b);
    }
    O.list = O.list.filter(b => !b.dead && b.x > -120 && b.x < VW + 120);
  } else if (k === 4) {     // 5F：消防灑水器
    G.mist = false;
    for (const z of O.zones) {
      const ph = (O.t + z.phase) % z.period;
      z.state = ph < z.on ? 'on' : ph > z.period - 0.5 ? 'warn' : 'off';
      const cy = G.y + CH / 2;
      if (z.state === 'on' && cy > z.y - z.h / 2 && cy < z.y + z.h / 2) {
        if (!z.wasIn) { z.wasIn = true; track('obstacle_hit', { floor: 5, kind: 'sprinkler' }); Snd.splash(); floatText('推力減半！', VW / 2, G.y + 170, INK, 18); }
        G.mist = true;
      } else if (!(cy > z.y - z.h / 2 && cy < z.y + z.h / 2)) z.wasIn = false;
    }
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'sheet') { p.vy -= 120 * dt; p.vx *= 0.98; } else p.vy -= 700 * dt;
    if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) f.t += dt;
  floaters = floaters.filter(f => f.t < 1.3);
}

/* =========================================================
   圖片素材（GPT 生圖，去背後的 webp）

const IMG = {};
const IMG_SRC = {
  hero: 'assets/hero_chair.webp', boss: 'assets/boss.webp', building: 'assets/bg_building.webp',
  folder: 'assets/coworker_folder.webp', phone: 'assets/coworker_phone.webp', glasses: 'assets/coworker_glasses.webp',
  surprised: 'assets/coworker_surprised.webp', coffee: 'assets/coworker_coffee.webp', woman: 'assets/coworker_woman.webp',
};
for (const [k, src] of Object.entries(IMG_SRC)) { const im = new Image(); im.src = src; IMG[k] = im; }
const ready = (im) => im && im.complete && im.naturalWidth > 0;
// 主角火箭椅圖：427×720，原點在水桶底部中間；兩支立可白噴嘴的位置（像素）
const HERO = { w: 427, h: 720, ox: 214, nl: 133, nr: 295, ny: 701 };
const HERO_K = 150 * 1.2 / HERO.h;   // 世界單位：主角＋椅子高 180（放大 1.2 倍）

/* =========================================================
   繪圖工具（線稿風：白底、黑墨線）
   ========================================================= */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function fillInk(c, fill, lw = 2.5) { if (fill) { c.fillStyle = fill; c.fill(); } c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function line(c, x1, y1, x2, y2, lw = 2, col = INK) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineWidth = lw; c.strokeStyle = col; c.lineCap = 'round'; c.stroke(); }
// 標題風格文字：粗黑字＋白色描邊（點綴色字則加黑描邊）
function inkText(c, str, x, y, size, fill = INK, align = 'center') {
  c.font = `900 ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (fill !== INK) { c.lineWidth = Math.max(4, size * 0.26); c.strokeStyle = INK; c.strokeText(str, x + size * 0.06, y + size * 0.1); }
  c.lineWidth = Math.max(3, size * 0.2); c.strokeStyle = fill === INK ? '#fff' : INK; c.strokeText(str, x, y);
  c.fillStyle = fill; c.fillText(str, x, y);
}
function plainText(c, str, x, y, size, color = INK, align = 'center', weight = 800) {
  c.font = `${weight} ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(str, x, y);
}
function bubble(c, x, y, w, h, text, size = 15, tail = 'down') {
  c.beginPath(); c.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2); fillInk(c, '#fff', 2.5);
  c.beginPath();
  if (tail === 'down') { c.moveTo(x - 8, y + h / 2 - 3); c.lineTo(x - 4, y + h / 2 + 12); c.lineTo(x + 8, y + h / 2 - 3); }
  else if (tail === 'left') { c.moveTo(x - w / 2 + 6, y - 2); c.lineTo(x - w / 2 - 12, y + 10); c.lineTo(x - w / 2 + 10, y + 9); }
  else { c.moveTo(x + w / 2 - 6, y - 2); c.lineTo(x + w / 2 + 12, y + 10); c.lineTo(x + w / 2 - 10, y + 9); }
  c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke();
  c.beginPath(); c.ellipse(x, y, w / 2 - 1.5, h / 2 - 1.5, 0, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
  plainText(c, text, x, y + 1, size);
}
function sprite(c, img, x, feetY, height, flip) {   // 以腳底中心為基準畫人物
  if (!ready(img)) return;
  const w = img.naturalWidth * height / img.naturalHeight;
  c.save(); c.translate(x, feetY); if (flip) c.scale(-1, 1);
  c.drawImage(img, -w / 2, -height, w, height); c.restore();
}

/* ---------- 火焰（紅橘外焰＋黃內焰＋墨線，跟主角圖一致） ---------- */
function drawFlame(c, x, y, len, w) {
  const fl = len * (0.85 + Math.random() * 0.3);
  c.beginPath(); c.moveTo(x - w / 2, y);
  c.quadraticCurveTo(x - w * 0.75, y + fl * 0.45, x - w * 0.15, y + fl * 0.8); c.lineTo(x, y + fl);
  c.lineTo(x + w * 0.12, y + fl * 0.78); c.quadraticCurveTo(x + w * 0.75, y + fl * 0.45, x + w / 2, y); c.closePath();
  c.fillStyle = '#e8502e'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke();
  c.beginPath(); c.moveTo(x - w * 0.26, y); c.quadraticCurveTo(x - w * 0.32, y + fl * 0.35, x, y + fl * 0.6); c.quadraticCurveTo(x + w * 0.32, y + fl * 0.35, x + w * 0.26, y); c.closePath();
  c.fillStyle = '#f7c83b'; c.fill();
}

/* ---------- 主角坐火箭椅（原點在水桶底，向上為負，單位＝世界單位） ---------- */
function drawHero(c, o = {}) {
  const sc = o.scale || 1, k = HERO_K * sc;
  c.save();
  if (o.tilt) c.rotate(o.tilt);
  if (o.flip) c.scale(-1, 1);
  const fl = o.burst ? 1 : clamp(o.flame || 0, 0, 1);
  if (fl > 0.03) {
    const len = (o.burst ? 140 : 14 + fl * 62) * sc, w = (o.burst ? 22 : 9 + fl * 6) * sc;

function renderPlay(c, dt) {
  const target = G.y - VH * 0.3;
  camB += (target - camB) * Math.min(1, dt * 6);
  camB = Math.max(-40, camB);
  const camTop = camB + VH;

  drawWorld(c, camTop);
  const py = camTop - G.y;
  c.save(); c.translate(VW / 2, py);
  const stuck = G.stuck;
  let tilt = 0;
  if (stuck && stuck.kind === 'hand') tilt = (stuck.ref && stuck.ref.side === 0 ? -0.15 : 0.15);
  if (stuck && stuck.kind === 'beam') tilt = Math.sin(G.elapsed * 6) * 0.1;
  if (G.face === 'panic' && !stuck) tilt = Math.sin(G.elapsed * 40) * 0.02;
  const flame = stuck ? 0.05 : clamp((Roar.smooth - 0.1) / 0.8, 0, 1) * (G.mist ? 0.5 : 1);
  if (G.invuln > 0 && !stuck && Math.floor(G.elapsed * 12) % 2 === 0) c.globalAlpha = 0.6;
  drawHero(c, { face: G.face, flame, burst: G.burstLeft > 0, tilt });
  c.globalAlpha = 1;
  if (stuck && stuck.kind === 'beam') { rr(c, -54, -165, 108, 170, 6); c.fillStyle = 'rgba(247,227,59,.35)'; c.fill(); }
  if (G.coffeeLeft > 0) { rr(c, 40, -110, 16, 20, 2); fillInk(c, '#fff', 2); c.fillStyle = INK; c.fillRect(42, -107, 12, 5); }
  c.restore();
  if (stuck && stuck.kind === 'gossip' && stuck.ref) bubble(c, stuck.ref.x, camTop - stuck.ref.y, 124, 50, stuck.ref.text, 15, 'left');
  for (const p of particles) {
    const x = p.x, y = camTop - p.y; c.save(); c.globalAlpha = clamp(p.life * 2, 0, 1); c.translate(x, y);
    if (p.kind === 'chunk') { c.rotate(p.rot); rr(c, -p.size / 2, -p.size / 2, p.size, p.size * 0.7, 1); fillInk(c, '#fff', 2); }
    else if (p.kind === 'sheet') { c.rotate(p.rot); rr(c, -p.size / 2, -p.size * 0.65, p.size, p.size * 1.3, 1); fillInk(c, '#fff', 1.5); }
    else { c.beginPath(); c.arc(0, 0, p.size, 0, 7); c.fillStyle = '#e8502e'; c.fill(); }
    c.restore();
  }
  for (const f of floaters) { c.globalAlpha = clamp(1.3 - f.t, 0, 1); inkText(c, f.str, f.x, camTop - f.y - f.t * 40, f.size, f.color); c.globalAlpha = 1; }
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawHUD(c);
}

  c.beginPath(); c.arc(sx, sy, sr, 0, 7); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#e8502e'; c.stroke();

/* =========================================================
   主迴圈
   ========================================================= */
let lastT = nowS(), walletTimer = 0;
function tick(dt) {
  walletTimer += dt; if (walletTimer > 1) { walletTimer = 0; if (Wallet.tick()) renderWallet(); else if (Wallet.bal < Wallet.REGEN_CAP || Wallet.isFree()) renderWallet(); }
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeAmp = 0; }
  if (appState === 'calib' && CAL) updateCalib(dt);
  if (appState === 'ad' && adCtx) { adCtx.t -= dt; $('ad-count').textContent = Math.max(1, Math.ceil(adCtx.t)); if (adCtx.t <= 0) adDone(); }
  if (appState === 'play' && G) { updatePlay(dt); }
  if (G && (appState === 'play' || appState === 'failcs' || appState === 'clearcs')) updateParticles(dt);
  if (scene) {
    scene.t += dt;
    if (scene.kind === 'fail') { G.y = lerp(scene.y0, G.floor * FH, easeIO((scene.t - 1.2) / 2)); }
    if (scene.kind === 'story' && scene.t > 7.4) endStory();
    else if (scene.kind === 'clear' && scene.t > 5.6) showResult();
    else if (scene.kind === 'fail' && scene.t > 4.4) afterFailScene();
  }
}
function loop() {
  const t = nowS(); const dt = Math.min(0.05, t - lastT); lastT = t;
  tick(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene && scene.kind === 'story') renderStory(ctx, scene.t);
  else if (scene && scene.kind === 'clear') renderClear(ctx, scene.t);
  else if (scene && scene.kind === 'fail') renderFail(ctx, scene.t, dt);
  else if (G && ['play', 'paused', 'revive', 'ad', 'micfail', 'result'].includes(appState)) {
    if (appState === 'play') renderPlay(ctx, dt); else if (appState === 'result') { renderTitleBg(ctx, t); } else renderPlay(ctx, 0);
  } else renderTitleBg(ctx, t);

  if (DEBUG) renderDebug();
  requestAnimationFrame(loop);
}
function skipScene() {
  if (!scene) return;
  if (scene.kind === 'story') endStory();
  else if (scene.kind === 'clear') showResult();
  else if (scene.kind === 'fail') afterFailScene();
}

   ========================================================= */
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); ensureAudio();
  if (scene) { if (scene.t > 0.3) skipScene(); return; }
  if (appState !== 'play' || !G || G.mode !== 'touch') return;
  Touch.holding = true;
  const t = nowS();
  if (t - Touch.lastTap < CONFIG.doubleTapSeconds) { tryBurst(); Touch.lastTap = -9; } else Touch.lastTap = t;
});
const releaseTouch = () => { Touch.holding = false; };
cv.addEventListener('pointerup', releaseTouch); cv.addEventListener('pointercancel', releaseTouch); cv.addEventListener('pointerleave', releaseTouch);
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' && e.code !== 'ArrowUp') return;
  e.preventDefault();
  if (scene) { skipScene(); return; }
  if (appState !== 'play' || !G || G.mode !== 'touch' || e.repeat) return;
  Touch.keyHold = true; const t = nowS();
  if (t - Touch.lastKey < CONFIG.doubleTapSeconds) { tryBurst(); Touch.lastKey = -9; } else Touch.lastKey = t;
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') Touch.keyHold = false; });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (!e.target.closest('#s-result')) e.preventDefault(); }, { passive: false });

/* 切換分頁／離開：一定關掉麥克風 */

});

/* 大廳切到別的遊戲／回大廳：關麥克風並暫停 */

  if (active) { resize(); return; }

};
if (HOST) {

  const touch = () => { const t = Date.now(); if (t - lastTouch > 3000) { lastTouch = t; try { HOST.touch(window); } catch (_) {} } };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, touch, { capture: true, passive: true }));
}

$('btn-next').onclick = () => { track('next_level_interest_click', { cleared: lastResult ? lastResult.cleared : false }); toast('第 2 關還在準備中'); };
$('btn-home').onclick = goTitle;
$('mute').onclick = () => { muted = !muted; lsSet(MUTE_KEY, muted ? '1' : '0'); $('mute').classList.toggle('muted', muted); ensureAudio(); };
$('mute').classList.toggle('muted', muted);

/* ---------- debug ---------- */
function renderDebug() {
  const lines = [
    `state ${appState}  mode ${inputMode}`,
    `rms ${Mic.rms.toFixed(4)}  mic ${Mic.on ? 'on' : 'off'}`,
    `zero ${Calib.zero().toFixed(4)} one ${Calib.one().toFixed(4)}`,
    `roar raw ${Roar.raw.toFixed(2)} smooth ${Roar.smooth.toFixed(2)}`,
  ];
  if (G) lines.push(`thrust ${thrustFor(Roar.smooth).toFixed(0)}  v ${G.v.toFixed(0)}  y ${G.y.toFixed(0)}`,
    `floor ${G.floor + 1}  cd ${G.cooldown.toFixed(2)}  burst ${G.burstLeft.toFixed(2)}`,
    `t ${G.elapsed.toFixed(1)}/${G.meetingTotal}  +${G.penalty}min  mist ${G.mist}`);
  $('debug-text').textContent = lines.join('\n');
}
if (DEBUG) {
  $('debug').classList.remove('hidden');
  $('dbg-clear').onclick = () => { if (G && appState === 'play') { G.floor = 4; G.obs = initFloorObs(4); G.y = 5 * FH - SLAB - CH - 5; G.v = 800; G.burstLeft = 0.3; } };
  $('dbg-fail').onclick = () => { if (G && appState === 'play') G.elapsed = G.meetingTotal; };
  $('dbg-export').onclick = async () => { const ok = await copyText(lsGet(EVENTS_KEY) || '[]'); toast(ok ? '事件 JSON 已複製' : '複製失敗'); };
  // 自動測試用：不靠畫面幀，直接推進時間（ctrl 回傳 true 時停止）
  const sim = (sec, ctrl) => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { if (ctrl && ctrl(G) === true) break; tick(1 / 60); } return appState; };
  window.RC = { get G() { return G; }, tryBurst, Touch, CONFIG, Calib, sim, get state() { return appState; } };
}

/* ---------- 啟動 ---------- */
Wallet.load(); Calib.load();
resize(); showScreen('s-title');
requestAnimationFrame(loop);
</script>
</body>
</html>
