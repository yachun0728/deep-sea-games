  <section class="view" id="view-blaster" hidden>
    <div class="bl-stage" id="bl-playfield">
      <div class="bl-board">
        <canvas id="bl-canvas" width="400" height="600" tabindex="0" aria-label="深海火線：自動射擊，拖曳或用方向鍵在水域內自由移動"></canvas>
        <button class="bl-launch" id="bl-go" type="button">開始出擊</button>
        <button class="bl-exit" id="bl-exit" type="button" aria-label="退出遊戲">←</button>
        <output class="bl-accessible" id="bl-lives" aria-label="剩餘潛艇">3 / 35</output>
        <p class="bl-accessible" id="bl-msg" role="status"></p>
      </div>
    </div>
  </section>
