  <section class="view" id="view-crossing" hidden>
    <div class="console">
      <div class="dice-stage keno-stage" id="cr-stage">
        <div class="lanes" id="cr-lanes" role="group" aria-label="{{t:crossing.view.19}}"></div>
        <div class="dc-read"><div class="sub-line" id="cr-sub">{{t:crossing.view.01}}</div></div>
      </div>
      <div class="side">
        <section class="panel" aria-label="{{t:crossing.view.20}}">
          <div class="field">
            <label for="cr-amount">{{t:crossing.view.02}}</label>
            <div class="input-row">
              <input id="cr-amount" type="number" inputmode="numeric" min="10" step="10" value="100">
              <button class="chip cchip" type="button" data-cchip="half">½</button>
              <button class="chip cchip" type="button" data-cchip="double">2×</button>
              <button class="chip cchip" type="button" data-cchip="max">{{t:crossing.view.03}}</button>
            </div>
          </div>
          <div class="field">
            <label id="cr-diff-label">{{t:crossing.view.04}}</label>
            <div class="seg-row" role="group" aria-labelledby="cr-diff-label">
              <button class="chip seg" type="button" data-cdiff="easy">{{t:crossing.view.05}}</button>
              <button class="chip seg" type="button" data-cdiff="mid">{{t:crossing.view.06}}</button>
              <button class="chip seg" type="button" data-cdiff="hard">{{t:crossing.view.07}}</button>
              <button class="chip seg" type="button" data-cdiff="extreme">{{t:crossing.view.08}}</button>
            </div>
          </div>
          <button class="chip guess hi step-btn" type="button" id="cr-step" disabled>{{t:crossing.view.09}}<small>—</small></button>
          <dl class="stats">
            <div><dt>{{t:crossing.view.10}}</dt><dd id="cr-mult">—</dd></div>
            <div><dt>{{t:crossing.view.11}}</dt><dd id="cr-p">—</dd></div>
            <div><dt>{{t:crossing.view.12}}</dt><dd id="cr-pos">—</dd></div>
          </dl>
          <button class="go" id="cr-go" type="button" data-mode="bet">{{t:crossing.view.13}}</button>
          <p class="msg" id="cr-msg" aria-live="polite">{{t:crossing.view.14}}</p>
        </section>
      </div>
    </div>
    <details class="rules">
      <summary>{{t:crossing.view.15}}</summary>
      <p>{{t:crossing.view.16}}</p>
      <p>{{t:crossing.view.17}}</p>
      <p>{{t:crossing.view.18}}</p>
    </details>
  </section>
