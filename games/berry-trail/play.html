try{const saved=Number(localStorage.getItem('berryTrailBest'));best=Number.isFinite(saved)?Math.max(0,Math.floor(saved)):0;}catch{}
const words={en:['Berry Trail','SCORE','BEST','A little snake, a big berry adventure.','Play','Pause','Restart','Arrow keys / WASD · Swipe to turn · Space to pause','Game over','Play again','Paused','Resume','You cleared the forest!'],zh:['莓果小蛇','分數','最高分','陪小蛇在森林中尋找甜甜的莓果。','開始遊戲','暫停','重新開始','方向鍵 / WASD · 滑動轉向 · 空白鍵暫停','遊戲結束','再玩一次','暫停中','繼續遊戲','你吃遍整座森林了！']};
function labels(){
 const w=words[lang].map(t=>bridge.translate(window,t));
 ['title','scoreLabel','bestLabel','hint'].forEach((id,i)=>$(id).textContent=w[[0,1,2,7][i]]);
 $('pause').textContent=state==='paused'?w[11]:w[5];$('restart').textContent=w[6];
 $('message').textContent=state==='over'?w[8]:state==='won'?w[12]:state==='paused'?w[10]:w[0];
 $('desc').textContent=state==='over'||state==='won'?w[1]+': '+score:state==='paused'?'':w[3];
 $('start').textContent=state==='paused'?w[11]:state==='over'||state==='won'?w[9]:w[4];
 $('overlay').hidden=state==='running';$('score').textContent=score;$('best').textContent=best;
 $('start').disabled=starting;$('restart').disabled=starting;$('pause').disabled=starting||!['running','paused'].includes(state);
 document.documentElement.lang=language;document.title=w[0]+' | TICATICA GAMES';
 $('leaders').setAttribute('aria-label',lang==='en'?'Leaderboard':bridge.translate(window,'排行榜'));
 rankStatus($('rank-message').dataset.state||'');
 $('rank-title').textContent=lang==='en'?'Leaderboard':bridge.translate(window,'排行榜');$('rank-close').textContent=lang==='en'?'Close':bridge.translate(window,'關閉');
 $('exit').setAttribute('aria-label',lang==='en'?'Back to lobby':bridge.translate(window,'返回遊戲大廳'));
 c.setAttribute('aria-label',lang==='en'?'Snake game board':bridge.translate(window,'貪食蛇遊戲棋盤'));

}
function sync(){snake=model.snake;food=model.food;dir=rules.directions[model.dir];score=model.score;}
function reset(){model=rules.create(rng);sync();state='ready';labels();draw();}
function start(){
 if(starting||!active)return;
 starting=true;labels();
 const accepted=bridge.prepare(window,function(random){starting=false;if(!active){labels();return;}rng=random;model=rules.create(rng);sync();state='running';last=performance.now();labels();draw();c.focus();});
 if(!accepted){starting=false;labels();}
}
function turn(x,y){
 if(state!=='running')return;
 const code=rules.directions.findIndex(d=>d[0]===x&&d[1]===y);
 if(rules.input(model,code)){bridge.record(window,code);bridge.touch(window);}
}
function step(dt){
 rules.advance(model,dt,rng);sync();
 if(score>best){best=score;try{localStorage.setItem('berryTrailBest',String(best));}catch{}}
 if(model.dead){state=model.won?'won':'over';labels();draw();bridge.finish(window,score);}
}
function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function draw(){
let bg=g.createLinearGradient(0,0,600,600);bg.addColorStop(0,'#b6d99a');bg.addColorStop(1,'#82b879');g.fillStyle=bg;g.fillRect(0,0,600,600);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let X=x*S,Y=y*S;g.fillStyle=(x+y)%2?'#315d3510':'#fff9d51a';g.fillRect(X,Y,S,S);let k=(x*47+y*73+x*y*13)%31;if(k<4){g.strokeStyle='#4c874e55';g.lineWidth=1.5;g.beginPath();g.moveTo(X+8,Y+22);g.quadraticCurveTo(X+5,Y+16,X+5,Y+14);g.moveTo(X+8,Y+22);g.quadraticCurveTo(X+11,Y+16,X+14,Y+15);g.stroke()}if(k===8){ellipse(X+22,Y+8,2,2,'#fff7c4aa');ellipse(X+19,Y+9,1.5,1.5,'#fff7c4aa')}}
let v=g.createRadialGradient(300,300,170,300,300,430);v.addColorStop(0,'#365f3500');v.addColorStop(1,'#365f3540');g.fillStyle=v;g.fillRect(0,0,600,600);
// Jewel-like woodland strawberry, drawn at native board scale.
if(food){g.save();g.translate(food.x*S+15,food.y*S+15);
ellipse(0,11,12,3.5,'#244b3355');
let glow=g.createRadialGradient(0,0,2,0,0,15);glow.addColorStop(0,'#fff4ba88');glow.addColorStop(1,'#fff4ba00');g.fillStyle=glow;g.fillRect(-15,-15,30,30);
function berryShape(){g.beginPath();g.moveTo(0,-7);g.bezierCurveTo(-8,-12,-14,-7,-12,0);g.bezierCurveTo(-11,5,-5,12,0,13);g.bezierCurveTo(5,12,11,5,12,0);g.bezierCurveTo(14,-7,8,-12,0,-7);g.closePath()}
berryShape();let ruby=g.createRadialGradient(-6,-6,1,3,5,17);ruby.addColorStop(0,'#ffb4a0');ruby.addColorStop(.35,'#ff6965');ruby.addColorStop(.72,'#e83d56');ruby.addColorStop(1,'#9d2044');g.fillStyle=ruby;g.fill();g.strokeStyle='#a32c49';g.lineWidth=1;g.stroke();
g.save();berryShape();g.clip();g.beginPath();g.moveTo(-9,-4);g.quadraticCurveTo(-12,1,-6,6);g.strokeStyle='#ffb9a280';g.lineWidth=2;g.lineCap='round';g.stroke();
for(let [x,y,r] of [[-7,-3,-.35],[0,-3,0],[7,-2,.35],[-5,3,-.3],[3,3,.25],[-1,8,.05]]){g.save();g.translate(x,y);g.rotate(r);ellipse(.3,.4,1.3,1.9,'#a82d46');ellipse(0,-.35,.8,1.3,'#ffe3a0');g.restore()}g.restore();
// Five distinct calyx leaves with a subtle central vein.
for(let [angle,len] of [[-1.05,9],[-.52,8],[0,9],[.55,8],[1.08,9]]){g.save();g.translate(0,-7);g.rotate(angle);let leaf=g.createLinearGradient(-3,0,3,-len);leaf.addColorStop(0,'#2f7446');leaf.addColorStop(1,'#a3d879');g.beginPath();g.moveTo(0,1);g.quadraticCurveTo(-5,-len*.52,0,-len);g.quadraticCurveTo(4,-len*.45,0,1);g.fillStyle=leaf;g.fill();g.strokeStyle='#387b48';g.lineWidth=.65;g.stroke();g.restore()}
g.beginPath();g.moveTo(0,-8);g.quadraticCurveTo(-1,-12,3,-13);g.strokeStyle='#366b40';g.lineWidth=1.8;g.lineCap='round';g.stroke();ellipse(-7,-5,1.8,.85,'#fff5dcbb');g.restore()}
// Hand-drawn jade snake: curved silhouette, tapered tail, warm gold markings.
let pts=snake.map(p=>({x:p.x*S+15,y:p.y*S+15}));
function centerline(offset=0){g.beginPath();g.moveTo(pts[0].x,pts[0].y+offset);for(let i=1;i<pts.length-1;i++){let a=pts[i],b=pts[i+1];g.quadraticCurveTo(a.x,a.y+offset,(a.x+b.x)/2,(a.y+b.y)/2+offset)}let t=pts.at(-1);g.lineTo(t.x,t.y+offset)}
g.lineCap='round';g.lineJoin='round';centerline(4);g.lineWidth=25;g.strokeStyle='#244a384d';g.stroke();
centerline();g.lineWidth=24;g.strokeStyle='#255945';g.stroke();g.lineWidth=21;g.strokeStyle='#439b70';g.stroke();g.lineWidth=15;g.strokeStyle='#78c68a';g.stroke();g.lineWidth=8;g.strokeStyle='#a6d99a';g.stroke();

for(let i=1;i<pts.length;i++){let p=pts[i],a=pts[i-1],b=pts[Math.min(i+1,pts.length-1)];g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(a.y-b.y,a.x-b.x));if(i===pts.length-1){ellipse(0,0,7,7,'#86ca91');}else{g.fillStyle='#3e926b';for(let side of [-1,1]){g.beginPath();g.moveTo(-5,side*4);g.quadraticCurveTo(0,side*10,5,side*4);g.quadraticCurveTo(0,side*6,-5,side*4);g.fill()}ellipse(0,0,2.5,1.8,'#e5eab0');}g.restore()}

function pause(){if(state==='running'){state='paused';bridge.pause(window);labels();}else if(state==='paused'&&active){state='running';last=performance.now();bridge.resume(window);labels();}}
function rankStatus(value){$('rank-message').dataset.state=value;const texts={loading:['載入排行榜中…','Loading…'],empty:['目前還沒有成績。','No scores yet.'],error:['載入失敗，請關閉後重試。','Could not load scores. Close and open to retry.']};$('rank-message').textContent=value?(lang==='en'?texts[value][1]:bridge.translate(window,texts[value][0])):'';}
$('rank-close').onclick=()=>$('rank-dialog').close();
$('leaders').onclick=async()=>{
 if(state==='running')pause();$('rank-list').replaceChildren();rankStatus('loading');$('rank-dialog').showModal();
 try{const result=await bridge.leaders(window);rankStatus(result.entries.length?'':'empty');for(const entry of result.entries){const li=document.createElement('li');li.textContent=(entry.nickname||entry.displayName||'Player')+' · '+entry.score;$('rank-list').append(li);}}
 catch{rankStatus('error');}
};
$('start').onclick=()=>state==='paused'?pause():start();$('restart').onclick=start;$('pause').onclick=pause;$('exit').onclick=()=>bridge.exit(window);
c.tabIndex=0;

 const m={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
 const d=m[e.code];if(d){e.preventDefault();turn(...d);}
 if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();pause();}
});
let touch=null;
$('board').addEventListener('pointerdown',e=>{if(e.target!==c)return;touch=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId);});
$('board').addEventListener('pointermove',e=>{if(!touch)return;const x=e.clientX-touch[0],y=e.clientY-touch[1];if(Math.max(Math.abs(x),Math.abs(y))>18){Math.abs(x)>Math.abs(y)?turn(Math.sign(x),0):turn(0,Math.sign(y));touch=[e.clientX,e.clientY];}});
for(const ev of ['pointerup','pointercancel'])$('board').addEventListener(ev,()=>touch=null);

window.addEventListener('blur',()=>{if(state==='running')pause();});

window.setBerryActive=function(value){active=value;touch=null;if(!value){starting=false;reset();}};
window.berryScore=()=>score;
