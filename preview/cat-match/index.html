</style></head><body><main id="app"><header><a href="https://yachun0728.github.io/deep-sea-games/#lobby" aria-label="離開遊戲，返回大廳">〈 離開遊戲</a><div class="brand"><small>TiCATiCA</small><strong>Cat Match</strong></div><button id="pause" aria-label="暫停與玩法">Ⅱ</button></header><div class="tag">PROTOTYPE · 未上架 / 拉布花園 v0.6</div><div class="stats"><div class="level">旅程<b id="level">1</b></div><div class="progress"><label><span id="shape">貓咪花園</span><span>慢慢玩，沒有倒數</span></label><progress id="progress" value="0" max="1"></progress><div id="score">本關 0 分 · 最佳旅程 1</div></div></div><div class="mission"><div><small>剩餘步數</small><strong id="moves">24</strong></div><div class="target"><span class="mini" id="targetIcon"></span><div><small id="goalLabel">收集小魚</small><strong id="remaining">18</strong></div></div></div><div id="stage"><canvas id="board" aria-label="三消棋盤，點選相鄰兩格或滑動交換"></canvas></div><div id="message" role="status" aria-live="polite">把三個一樣的排在一起吧</div><footer><button id="hint"><b>找一找</b><span id="hintCount">剩 3 次</span></button><button id="shuffle"><b>轉一轉</b><span id="shuffleCount">剩 2 次</span></button><button id="retry"><b>再試試</b>重玩本關</button></footer><div class="note">四連消會留下條紋道具 · 五連消會留下彩虹球</div><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button id="primary"></button><button id="secondary" class="secondary">繼續遊玩</button></div></div></main>
<script>
'use strict';
const N=8,KEY='proto-cat-match-save-v1',names=['橘貓','灰貓','黑貓','貓掌','小魚','毛線'];
const crops=[[10,4,250,220],[266,4,225,220],[493,4,241,220],[985,20,180,194],[1160,30,190,182],[1340,12,194,212]];
const masks=[['01111110','11111111','11111111','11111111','11111111','11111111','11111111','01111110'],['11000011','11100111','11111111','11111111','11111111','11111111','01111110','00111100'],['00111100','01111110','11111111','11100111','11100111','11111111','01111110','00111100']];
const $=id=>document.getElementById(id),cv=$('board'),ctx=cv.getContext('2d'),sheet=new Image();sheet.src='assets/icon-sheet.webp';
let board=[],level=1,best=1,score=0,moves=24,collected=0,goal=18,target=4,selected=-1,busy=false,paused=false,ended=false,clearing=new Set(),hintCells=[],size=0,cell=0,down=null,combo=0,offsets=new Map(),clearProgress=0,hintsLeft=3,shufflesLeft=2;
try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isSafeInteger(s.level)&&s.level>0&&s.level<=1000000){level=s.level;best=Math.max(level,Number.isSafeInteger(s.best)?s.best:level)}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify({level,best}))}catch{}}
function active(i){return i>=0&&i<64&&masks[(level-1)%3][i>>3][i%8]==='1'}
const adjacent=(a,b)=>Math.abs((a>>3)-(b>>3))+Math.abs(a%8-b%8)===1;
const tile=()=>({t:Math.floor(Math.random()*6),s:''});
function matches(){let groups=[];for(let i=0;i<64;i++){if(!board[i]||board[i].t===6)continue;for(let step of [1,8]){if(step===1&&i%8>5||step===8&&i>=48)continue;let run=[i];for(let j=i+step;j<64&&board[j]&&board[j].t===board[i].t&&(step===8||(j>>3)===(i>>3));j+=step)run.push(j);if(run.length>=3)groups.push(run)}}return groups.filter((g,i)=>!groups.some((h,j)=>j<i&&g.every(x=>h.includes(x))));}
function legal(){let result=[];for(let a=0;a<64;a++)if(board[a])for(let b of [a+1,a+8]){if(!board[b]||!adjacent(a,b))continue;[board[a],board[b]]=[board[b],board[a]];let ok=board[a].s==='rainbow'||board[b].s==='rainbow'||(board[a].s&&board[b].s)||matches().length;[board[a],board[b]]=[board[b],board[a]];if(ok)result.push([a,b])}return result}
function fresh(){for(let tries=0;tries<300;tries++){board=Array.from({length:64},(_,i)=>active(i)?tile():null);for(let i=0;i<64;i++)if(board[i]){let forbidden=new Set();if(i%8>=2&&board[i-1]&&board[i-2]&&board[i-1].t===board[i-2].t)forbidden.add(board[i-1].t);if(i>=16&&board[i-8]&&board[i-16]&&board[i-8].t===board[i-16].t)forbidden.add(board[i-8].t);while(forbidden.has(board[i].t))board[i]=tile()}if(legal().length)return}throw Error('無法建立棋盤')}
function shuffle(){let values=board.filter(Boolean);for(let k=0;k<300;k++){for(let i=values.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}let p=0;board=board.map(t=>t?values[p++]:null);if(!matches().length&&legal().length){selected=-1;hintCells=[];draw();return}}fresh();draw()}
function start(){hintsLeft=3;shufflesLeft=2;ended=false;paused=false;busy=false;selected=-1;hintCells=[];score=0;moves=24;collected=0;goal=18+Math.min(12,Math.floor((level-1)/3)*2);target=(level+3)%6;clearing.clear();$('overlay').hidden=true;fresh();hud();resize();say('點兩格或滑一下，交換相鄰圖案')}
function hud(){$('hintCount').textContent=`剩 ${hintsLeft} 次`;$('shuffleCount').textContent=`剩 ${shufflesLeft} 次`;$('hint').disabled=hintsLeft===0;$('shuffle').disabled=shufflesLeft===0;$('level').textContent=level;$('moves').textContent=moves;$('remaining').textContent=Math.max(0,goal-collected);$('goalLabel').textContent='收集'+names[target];$('score').textContent=`本關 ${score} 分 · 最佳旅程 ${best}`;$('progress').value=Math.min(1,collected/goal);$('shape').textContent=['花園小徑','貓耳庭院','祕密花環'][(level-1)%3];let c=crops[target];$('targetIcon').style.backgroundSize=`${1536*44/c[2]}px ${1024*44/c[3]}px`;$('targetIcon').style.backgroundPosition=`-${c[0]*44/c[2]}px -${c[1]*44/c[3]}px`}
function say(s){$('message').textContent=s}
function resize(){let box=$('stage').getBoundingClientRect();size=Math.min(box.width,box.height-12,464);cell=size/8;let dpr=Math.min(devicePixelRatio||1,2);cv.style.width=size+'px';cv.style.height=size+'px';cv.width=Math.round(size*dpr);cv.height=Math.round(size*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.clearRect(0,0,size,size);for(let i=0;i<64;i++){if(!active(i))continue;let x=i%8*cell,y=(i>>3)*cell,t=board[i],pad=cell*.055;ctx.fillStyle='#d4b293';round(x+1,y+2,cell-2,cell-2,cell*.23);ctx.fill();if(!t)continue;let offset=offsets.get(t);if(offset){x+=offset.x*cell;y+=offset.y*cell}ctx.save();ctx.globalAlpha=clearing.has(i)?1-clearProgress:1;let shrink=clearing.has(i)?clearProgress*.42:0;let p=pad+cell*shrink;round(x+p,y+p,cell-p*2,cell-p*2,cell*.21);ctx.clip();if(sheet.complete&&sheet.naturalWidth&&t.t<6){let c=crops[t.t];ctx.drawImage(sheet,...c,x+p,y+p,cell-p*2,cell-p*2)}else{ctx.fillStyle=t.t===6?'#e18cba':'#f4c890';ctx.fillRect(x,y,cell,cell)}ctx.restore();if(t.s)drawSpecial(t,x,y,clearing.has(i)?1-clearProgress:1);if(selected===i||down?.i===i||hintCells.includes(i)){ctx.strokeStyle=selected===i?'#fff5af':'#aaffde';ctx.lineWidth=3;round(x+2,y+2,cell-4,cell-4,cell*.22);ctx.stroke()}}}
// 金邊、實心方向徽章：避免白線穿過圖案，被誤認為顯示錯誤。
function drawSpecial(t,x,y,alpha){
 ctx.save();ctx.translate(x,y);ctx.scale(cell/48,cell/48);ctx.globalAlpha=alpha;
 ctx.shadowColor='#ffdb73';ctx.shadowBlur=5;ctx.strokeStyle='#ffe8a0';ctx.lineWidth=2;
 round(2.5,2.5,43,43,10);ctx.stroke();ctx.shadowBlur=0;
 if(t.s==='rainbow'){
  let g=ctx.createLinearGradient(10,9,38,40);['#ff739a','#ffd566','#88dc99','#73cef4','#b58aef'].forEach((c,k)=>g.addColorStop(k/4,c));
  ctx.fillStyle=g;ctx.strokeStyle='#7e425f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(24,24,16,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#fff6df';ctx.lineWidth=1.4;for(let n=0;n<3;n++){ctx.beginPath();ctx.ellipse(24,24,6+n*4,15,.7,0,Math.PI*2);ctx.stroke()}
  ctx.fillStyle='#ffffffc9';ctx.beginPath();ctx.ellipse(18,14,5,2.5,-.6,0,Math.PI*2);ctx.fill();
 }else if(t.s==='bomb'){
  ctx.fillStyle='#f59242';ctx.strokeStyle='#853f31';ctx.lineWidth=1.4;ctx.beginPath();
  for(let n=0;n<16;n++){let a=n*Math.PI/8-Math.PI/2,r=n%2?7:10;let px=36+Math.cos(a)*r,py=35+Math.sin(a)*r;n?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff0b5';ctx.beginPath();ctx.arc(36,36,3.3,0,Math.PI*2);ctx.fill();for(let [px,py] of [[32.5,32],[36,30.5],[39.5,32]]){ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill()}
 }else{
  const vertical=t.s==='col';ctx.fillStyle='#9c57ac';ctx.strokeStyle='#633658';ctx.lineWidth=1.2;
  if(vertical)round(34,6,11,36,5.5);else round(6,34,36,11,5.5);ctx.fill();ctx.stroke();
  // 兩端金色箭頭直接表達消除方向，中間保留小星光。
  ctx.fillStyle='#ffe79a';ctx.strokeStyle='#ffe79a';ctx.lineWidth=2;
  for(let sign of [-1,1]){let cx=vertical?39.5:24+sign*11,cy=vertical?24+sign*11:39.5;ctx.beginPath();if(vertical){ctx.moveTo(cx-3,cy-sign*1);ctx.lineTo(cx,cy+sign*3);ctx.lineTo(cx+3,cy-sign*1)}else{ctx.moveTo(cx-sign*1,cy-3);ctx.lineTo(cx+sign*3,cy);ctx.lineTo(cx-sign*1,cy+3)}ctx.stroke()}
  ctx.beginPath();ctx.arc(vertical?39.5:24,vertical?24:39.5,1.5,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
// 每個過場逐幀繪製；背景分頁直接完成，避免等待被節流的動畫。
function animate(ms,frame){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches||document.hidden){frame(1);draw();return Promise.resolve()}
 return new Promise(resolve=>{let begin=performance.now();function tick(now){let p=Math.min(1,(now-begin)/ms);frame(p);draw();if(p<1&&!document.hidden)requestAnimationFrame(tick);else{frame(1);draw();resolve()}}requestAnimationFrame(tick)})
}
async function slide(entries,ms){await animate(ms,p=>{let remaining=Math.pow(1-p,3);offsets=new Map(entries.map(([t,x,y])=>[t,{x:x*remaining,y:y*remaining}]))});offsets.clear();draw()}
async function exchange(a,b){[board[a],board[b]]=[board[b],board[a]];await slide([[board[a],b%8-a%8,(b>>3)-(a>>3)],[board[b],a%8-b%8,(a>>3)-(b>>3)]],125)}
async function settle(groups,preferred=[],forced=[]){let cascade=0;while(groups.length||forced.length){cascade++;let clear=new Set(forced),creates=new Map();for(let g of groups)g.forEach(i=>clear.add(i));let merged=[];for(let g of groups){let hits=merged.filter(h=>g.some(i=>h.has(i)));let union=new Set(g);for(let h of hits){h.forEach(i=>union.add(i));merged.splice(merged.indexOf(h),1)}merged.push(union)}for(let g of merged){let ids=[...g],straight=ids.every(i=>(i>>3)===(ids[0]>>3))||ids.every(i=>i%8===ids[0]%8);let special=straight&&ids.length>=5?'rainbow':!straight?'bomb':ids.length===4?((ids[0]>>3)===(ids[1]>>3)?'row':'col'):'';if(special){let at=preferred.find(i=>g.has(i))??ids.find(i=>!board[i].s);if(at!==undefined&&!board[at].s)creates.set(at,special)}}
let queue=[...clear];for(let n=0;n<queue.length;n++){let i=queue[n],t=board[i];if(!t?.s)continue;creates.delete(i);let extra=[];for(let j=0;j<64;j++)if(board[j]){if(t.s==='row'&&(j>>3)===(i>>3)||t.s==='col'&&j%8===i%8||t.s==='bomb'&&Math.abs((j>>3)-(i>>3))<=1&&Math.abs(j%8-i%8)<=1||t.s==='rainbow')extra.push(j)}for(let j of extra)if(!clear.has(j)){clear.add(j);queue.push(j)}}
clearing=new Set([...clear].filter(i=>!creates.has(i)));clearProgress=0;say(cascade>1?`${cascade} 連鎖！好棒的貓咪默契`:'喵！收集成功');await animate(115,p=>{clearProgress=p});for(let i of clear){if(board[i]?.t===target)collected++;score+=10*cascade;if(creates.has(i))board[i]={t:creates.get(i)==='rainbow'?6:board[i].t,s:creates.get(i)};else board[i]=null}clearing.clear();clearProgress=0;let falling=[];for(let x=0;x<8;x++){let rows=[];for(let y=7;y>=0;y--)if(active(y*8+x))rows.push(y*8+x);let values=rows.filter(i=>board[i]).map(i=>({t:board[i],row:i>>3}));let missing=rows.length-values.length;rows.forEach((i,k)=>{let prior=values[k],t=prior?.t||tile();board[i]=t;let from=prior?prior.row:(rows[rows.length-1]>>3)-missing+(k-values.length);falling.push([t,0,from-(i>>3)])})}hud();await slide(falling,190);groups=matches();forced=[];preferred=[]}
combo=cascade;if(!legal().length){shuffle();say('沒有可交換的位置，幫你免費洗好牌了')}hud();draw()}
async function swap(a,b){if(busy||paused||ended||!board[a]||!board[b]||!adjacent(a,b))return;busy=true;hintCells=[];selected=-1;await exchange(a,b);let forced=[],groups=matches(),ta=board[a],tb=board[b];if(ta.s==='rainbow'||tb.s==='rainbow'){let color=ta.s==='rainbow'?tb.t:ta.t;forced=[a,b,...board.flatMap((t,i)=>t&&(color===6||t.t===color)?[i]:[])];/* 彩虹只清指定顏色，避免再觸發全盤效果 */if(ta.s==='rainbow')ta.s='';if(tb.s==='rainbow')tb.s=''}else if(ta.s&&tb.s)forced=[a,b];if(!groups.length&&!forced.length){await exchange(a,b);say('要連成三個才算一步，再試試');busy=false;return}moves--;hud();await settle(groups,[b,a],forced);busy=false;if(collected>=goal){ended=true;level++;best=Math.max(best,level);save();show('這一站，完成！',`收集了 ${collected} 個${names[target]}，得到 ${score} 分。<br>下一站有新的棋盤，旅程沒有終點。`,'前往下一站',start,false)}else if(moves<=0){ended=true;show('貓咪休息一下',`還差 ${Math.max(0,goal-collected)} 個${names[target]}。<br>沒有體力限制，隨時可以免費再試。`,'免費重試',start,false)}}
function show(title,text,label,action,resume=true){paused=true;$('dialogTitle').textContent=title;$('dialogText').innerHTML=text;$('primary').textContent=label;$('primary').onclick=()=>{$('overlay').hidden=true;paused=false;action()};$('secondary').hidden=!resume;$('overlay').hidden=false}
function pick(i){if(busy||paused||ended||!board[i])return;if(selected===i){selected=-1;draw();return}if(selected>=0&&adjacent(selected,i)){swap(selected,i);return}selected=i;hintCells=[];draw()}
function index(e){let r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);return x>=0&&x<8&&y>=0&&y<8?y*8+x:-1}
cv.onpointerdown=e=>{if(busy||paused||ended||down)return;let i=index(e);if(board[i]){down={i,x:e.clientX,y:e.clientY,pointerId:e.pointerId};cv.setPointerCapture(e.pointerId);draw()}};
function swipe(e){if(!down||e.pointerId!==down.pointerId)return false;let d=down,dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.max(Math.abs(dx),Math.abs(dy))<cell*.22)return false;let b=d.i+(Math.abs(dx)>Math.abs(dy)?(dx>0?1:-1):(dy>0?8:-8));down=null;if(board[b]&&adjacent(d.i,b))swap(d.i,b);else draw();return true}
// 一過滑動門檻就交換，不必等手指放開；每次手勢只觸發一次。
cv.onpointermove=e=>{swipe(e)};
cv.onpointerup=e=>{if(swipe(e)||!down||e.pointerId!==down.pointerId)return;let i=down.i;down=null;pick(i)};
cv.onpointercancel=cv.onlostpointercapture=()=>{down=null;draw()};
$('hint').onclick=()=>{if(busy||paused||ended||hintsLeft<=0)return;hintCells=legal()[0]||[];if(!hintCells.length)return;hintsLeft--;hud();say(`亮起的兩格可以交換，提示剩 ${hintsLeft} 次`);draw()};$('shuffle').onclick=()=>{if(busy||paused||ended||shufflesLeft<=0)return;shuffle();shufflesLeft--;hud();say(`洗牌完成，剩 ${shufflesLeft} 次，不消耗步數`)};$('retry').onclick=()=>{if(busy||paused||ended)return;show('重玩這一站？','本關的分數與收集進度會重新開始，提示與洗牌次數補滿。','重新開始',start)};$('pause').onclick=()=>{if(busy||ended)return;show('陪貓咪慢慢玩','點選相鄰兩格，或滑動交換。<br>三連收集；四連產生整列／整行消除。<br>五連產生彩虹球，交換可清同類。<br>T／L 形會產生範圍消除。<br>每關提示 3 次、洗牌 2 次，不消耗步數。<br>無解自動洗牌不扣次數；重玩本關補滿。<br>進度記錄在此瀏覽器，重新整理重玩本關。','繼續旅程',()=>{},false)};$('secondary').onclick=()=>{paused=false;$('overlay').hidden=true};document.addEventListener('visibilitychange',()=>{if(document.hidden&&!busy&&!ended&&!paused)$('pause').click()});window.addEventListener('resize',resize);sheet.onload=draw;start();
</script></body></html>
