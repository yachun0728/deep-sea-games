  <section class="view" id="view-mines" hidden>
    <div class="console">
      <div class="board-wrap">
        <div class="board" id="board" role="group" aria-label="5 乘 5 海域"></div>
      </div>
      <div class="side">
        <section class="panel" aria-label="水雷區下注">
          <div class="field">
            <label for="mines-amount">下注點數</label>
            <div class="input-row">
              <input id="mines-amount" type="number" inputmode="numeric" min="10" step="10" value="100">
              <button class="chip mchip" type="button" data-mchip="half">½</button>
              <button class="chip mchip" type="button" data-mchip="double">2×</button>
              <button class="chip mchip" type="button" data-mchip="max">全押</button>
            </div>
          </div>
          <div class="field">
            <label for="mines-count">水雷數（1–24）</label>
            <div class="input-row">
              <input id="mines-count" type="number" inputmode="numeric" min="1" max="24" step="1" value="3">
              <button class="chip mchip" type="button" data-mcount="1">1</button>
              <button class="chip mchip" type="button" data-mcount="3">3</button>
              <button class="chip mchip" type="button" data-mcount="5">5</button>
              <button class="chip mchip" type="button" data-mcount="10">10</button>
            </div>
          </div>
          <dl class="stats">
            <div><dt>目前倍率</dt><dd id="mines-mult">—</dd></div>
            <div><dt>下一格</dt><dd id="mines-next">—</dd></div>
            <div><dt>剩餘珍珠</dt><dd id="mines-left">—</dd></div>
          </dl>
          <button class="go" id="mines-go" type="button" data-mode="bet">開始</button>
          <p class="msg" id="mines-msg" aria-live="polite">選好水雷數後按開始，每翻到一顆珍珠倍率就往上。</p>
        </section>
      </div>
    </div>
    <details class="rules">
      <summary>玩法與機率</summary>
      <p>25 格海域裡藏著你指定數量的水雷，其餘都是珍珠。每翻開一顆珍珠倍率就上升，隨時可以按「領回」拿走「下注 × 目前倍率」；翻到水雷就失去這一注。水雷越多，每一格的倍率漲得越快。</p>
      <p>倍率按實際機率計算再乘上 0.97：翻開第 k 顆珍珠後的倍率是 <code>0.97 × Π (25 − i) ÷ (25 − 水雷數 − i)</code>，i 從 0 到 k − 1。所以不論水雷數與翻幾格，長期期望回報都約 97%。</p>
      <p>水雷位置在按下開始時用瀏覽器亂數決定。點數與「壓潰深度」共用，沒有任何現金價值。</p>
    </details>
  </section>
