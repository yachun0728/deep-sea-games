  <section class="view" id="view-tower" hidden>
    <div class="console">
      <div class="dice-stage keno-stage" id="tw-stage">
        <div class="tower" id="tw-tower" role="group" aria-label="{{t:tower.view.17}}"></div>
      </div>
      <div class="side">
        <section class="panel" aria-label="{{t:tower.view.18}}">
          <div class="field">
            <label for="tw-amount">{{t:tower.view.01}}</label>
            <div class="input-row">
              <input id="tw-amount" type="number" inputmode="numeric" min="10" step="10" value="100">
              <button class="chip tchip" type="button" data-tchip="half">½</button>
              <button class="chip tchip" type="button" data-tchip="double">2×</button>
              <button class="chip tchip" type="button" data-tchip="max">{{t:tower.view.02}}</button>
            </div>
          </div>
          <div class="field">
            <label id="tw-diff-label">{{t:tower.view.03}}</label>
            <div class="seg-row" role="group" aria-labelledby="tw-diff-label">
              <button class="chip seg" type="button" data-tdiff="easy">{{t:tower.view.04}}</button>
              <button class="chip seg" type="button" data-tdiff="mid">{{t:tower.view.05}}</button>
              <button class="chip seg" type="button" data-tdiff="hard">{{t:tower.view.06}}</button>
              <button class="chip seg" type="button" data-tdiff="extreme">{{t:tower.view.07}}</button>
            </div>
          </div>
          <dl class="stats">
            <div><dt>{{t:tower.view.08}}</dt><dd id="tw-mult">—</dd></div>
            <div><dt>{{t:tower.view.09}}</dt><dd id="tw-next">—</dd></div>
            <div><dt>{{t:tower.view.10}}</dt><dd id="tw-level">—</dd></div>
          </dl>
          <button class="go" id="tw-go" type="button" data-mode="bet">{{t:tower.view.11}}</button>
          <p class="msg" id="tw-msg" aria-live="polite">{{t:tower.view.12}}</p>
        </section>
      </div>
    </div>
    <details class="rules">
      <summary>{{t:tower.view.13}}</summary>
      <p>{{t:tower.view.14}}</p>
      <p>{{t:tower.view.15}}</p>
      <p>{{t:tower.view.16}}</p>
    </details>
  </section>
