<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8dcbd">
<title>數字吞噬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#e8dcbd; --paper:#f6eedb; --paper2:#fbf6ea; --ink:#2b2b2b; --mute:rgba(43,43,43,.62); --mute2:rgba(43,43,43,.42);
    --cyan:#3f97c4; --violet:#8e5fcf; --amber:#d9801a; --red:#c8402f; --green:#4a8a3a;
    --m-cyan:#8fd3e8; --m-violet:#c9a6e8; --m-amber:#f6c47a; --m-green:#a9d98f; --m-red:#f2a594;
    --font:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","Comic Sans MS",cursive;
    --sk:255px 15px 225px 15px/15px 225px 15px 255px;
    --sk2:15px 255px 15px 225px/225px 15px 255px 15px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-font-smoothing:antialiased;
    background-color:var(--desk);
    background-image:radial-gradient(rgba(43,43,43,.06) 1px,transparent 1.2px);background-size:7px 7px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  b{font-weight:700}
  .num{font-variant-numeric:tabular-nums}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
  .lbl{font-size:13px;letter-spacing:.08em;color:var(--mute)}
  .icon-btn{width:38px;height:38px;border-radius:var(--sk);background:var(--paper2);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-left:5px;box-shadow:2px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .icon-btn:nth-child(2n){border-radius:var(--sk2)}
  .icon-btn:hover{background:#fff}
  .icon-btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
  canvas#cv{display:block;border:2.5px solid var(--ink);border-radius:14px 26px 12px 24px/24px 12px 26px 14px;box-shadow:5px 6px 0 rgba(43,43,43,.85);background:var(--paper)}
  .hint{font-size:14px;color:var(--mute);text-align:center}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(232,220,189,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;z-index:10}
  .overlay.show{display:flex}
  .card{position:relative;width:min(460px,100%);background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--sk);padding:28px 24px 24px;text-align:center;box-shadow:7px 8px 0 var(--ink);transform:rotate(-.6deg)}
  .card::before{content:"";position:absolute;left:50%;top:-14px;width:96px;height:26px;margin-left:-48px;background:rgba(246,196,122,.75);transform:rotate(-3deg);border-left:2px dashed rgba(43,43,43,.15);border-right:2px dashed rgba(43,43,43,.15)}
  .card h1{font-size:38px;font-weight:700;letter-spacing:.02em}
  .card h2{font-size:30px;font-weight:700}
  .sub{color:var(--mute);font-size:16px;line-height:1.65;margin-top:10px}
  .rules{text-align:left;margin:18px 0 6px;display:grid;gap:10px;font-size:16px;line-height:1.5}
  .rules div{display:flex;gap:10px;align-items:flex-start}
  .btn{display:inline-block;margin-top:18px;padding:10px 28px;border-radius:var(--sk);border:2.5px solid var(--ink);font-weight:700;font-size:19px;box-shadow:3px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
  .btn.ghost{background:var(--paper2);padding:7px 18px;font-size:16px;margin-top:12px;border-radius:var(--sk2)}
  .levels{display:grid;gap:10px;margin-top:18px}
  .levels button{aspect-ratio:1;background:var(--paper2);border:2px solid var(--ink);border-radius:var(--sk);font-weight:700;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:2px 3px 0 var(--ink)}
  .levels button:nth-child(2n){border-radius:var(--sk2);transform:rotate(1deg)}
  .levels button:nth-child(3n){transform:rotate(-1.2deg)}
  .levels button small{font-size:12px;font-weight:400;color:var(--mute)}
  .levels button:disabled{opacity:.35;cursor:default;border-style:dashed;box-shadow:none}
  .stat{display:flex;justify-content:center;gap:28px;margin-top:14px}
  .stat b{display:block;font-size:32px}
  .stat span{font-size:13px;color:var(--mute)}
  .bar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .big{font-size:40px;font-weight:700;line-height:1}
  .target{color:var(--amber)}
  .mid{flex:1;padding:0 6px 8px}
  .prog{height:13px;border:2px solid var(--ink);border-radius:var(--sk);background:var(--paper2);overflow:hidden;margin-top:6px}
  .prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--green) 0 3px,var(--m-green) 3px 7px);transition:width .2s}
  .prog i.over{background:repeating-linear-gradient(-45deg,var(--red) 0 3px,var(--m-red) 3px 7px)}
  .status{font-size:17px;color:var(--mute);text-align:center;min-height:22px}
  .status.warn{color:var(--red);font-weight:700}
  .chip{flex:none;min-width:36px;height:27px;padding:0 6px;border-radius:var(--sk);border:2px solid var(--ink);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .btn{background:var(--m-green)}
  .levels{grid-template-columns:repeat(4,1fr)}
  .levels button.done{background:#e3f1d6}
  canvas#cv{cursor:crosshair}
  .plat{margin-top:14px;padding:8px 12px;border:2px dashed rgba(43,43,43,.35);border-radius:var(--sk2);font-size:14px;line-height:1.5;color:var(--ink);background:rgba(246,196,122,.25)}
  .bonus{margin-top:10px;font-size:17px;font-weight:700;color:var(--green);min-height:0}
  .bonus:empty{display:none}
  /* 平台內嵌：說明卡比畫面高時可在浮層內捲動，不裁掉標題 */
  .overlay{overflow-y:auto;align-items:flex-start;touch-action:pan-y;overscroll-behavior:contain}
  .overlay .card{margin:auto}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="bar">
    <div><div class="lbl" data-t="you"></div><div class="big num" id="hudVal">2</div></div>
    <div class="mid">
      <div class="lbl" id="hudLv" style="text-align:center"></div>
      <div class="prog"><i id="prog"></i></div>
    </div>
    <div style="text-align:right"><div class="lbl" data-t="target"></div><div class="big num target" id="hudTarget">12</div></div>
    <div style="align-self:center"><button class="icon-btn" id="btnRestart" data-tt="restart">↻</button><button class="icon-btn" id="btnMenu" data-tt="menu">☰</button></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="status" id="status"></div>
</div>

<div class="overlay show" id="ovMenu">
  <div class="card">
    <h1 data-t="title"></h1>
    <div class="sub" data-t="intro"></div>
    <div class="rules">
      <div><span class="chip" style="background:var(--m-green)">3</span><span data-t="r1"></span></div>
      <div><span class="chip" style="background:var(--m-red)">9</span><span data-t="r2"></span></div>
      <div><span class="chip" style="background:var(--m-amber)">÷2</span><span data-t="r3"></span></div>
      <div><span class="chip" style="background:#e2dccd">•</span><span data-t="r4"></span></div>
    </div>
    <div class="plat" id="platNote" hidden></div>
    <div class="levels" id="levels"></div>
  </div>
</div>

<div class="overlay" id="ovIntro">
  <div class="card">
    <div class="lbl" id="introLv"></div>
    <h2 id="introName" style="margin-top:6px">—</h2>
    <div class="sub" id="introTip"></div>
    <button class="btn" id="btnGo" data-t="go"></button>
  </div>
</div>

<div class="overlay" id="ovEnd">
  <div class="card">
    <h2 id="endTitle"></h2>
    <div class="sub" id="endSub"></div>
    <div class="stat" id="endStat">
      <div><b class="num" id="endTime">0.0</b><span data-t="sec"></span></div>
      <div><b class="num" id="endBest">0.0</b><span data-t="best"></span></div>
    </div>
    <div class="bonus" id="endBonus"></div>
    <button class="btn" id="btnEnd"></button>
    <div><button class="btn ghost" id="btnEndMenu" data-t="pick"></button></div>
  </div>
</div>

<div class="overlay" id="ovPause">
  <div class="card">
    <h2 data-t="paused"></h2>
    <div class="sub" data-t="pausedSub"></div>
    <button class="btn" id="btnResume" data-t="resume"></button>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 800, H = 800;

// ---------- 語言：字串寫成「中文|English」，語言跟隨 Deep Sea Arcade 頁首切換 ----------
function lang() { try { const i = window.parent !== window && window.parent.deepSeaI18n; return i && i.getLanguage() === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; } }
function Lx(s, p) {
  const k = s.indexOf('|'); let t = k < 0 ? s : lang() === 'en' ? s.slice(k + 1) : s.slice(0, k);
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return p ? t.replace(/\{(\w+)\}/g, (_, n) => p[n] != null ? p[n] : '') : t;
}
const TX = {
  you: '你|You', target: '目標|Target', restart: '重來 (R)|Restart (R)', menu: '選單 (Esc)|Menu (Esc)',
  title: '數字吞噬|Number Gulp',
  intro: '你是一個數字。吃掉比你小的，躲開比你大的，讓自己**剛好**變成目標數字。|You are a number. Eat the smaller ones, dodge the bigger ones, and land **exactly** on the target.',
  r1: '綠色比你小：碰到就吃掉，數值加到你身上。|Green is smaller than you: touch it to eat it and add its value to yours.',
  r2: '紅色比你大：碰到就被吃掉。有些會主動追你。|Red is bigger than you: touch it and you get eaten. Some will chase you.',
  r3: '運算符：碰到立刻生效。超過目標時可以靠它們降回來，但不小心碰到也會白忙一場。|Operators take effect on contact. They bring you back down when you overshoot, but bump one by accident and your work is undone.',
  r4: '越大游得越慢，到後面要算好再出手。|The bigger you get, the slower you swim, so plan your moves later on.',
  go: '開始|Start', sec: '秒|sec', best: '最佳|Best', pick: '選關|Stages',
  paused: '已暫停|Paused', pausedSub: '離開畫面時會自動暫停。|The game pauses when you leave the screen.', resume: '繼續|Resume',
  hint: '滑鼠 / 手指指哪裡就往哪裡游 · 也可以用方向鍵|Swim toward your mouse or finger · arrow keys also work',
};
function applyStatic() {
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = Lx(TX[el.dataset.t]); });
  document.querySelectorAll('[data-tt]').forEach(el => { el.title = Lx(TX[el.dataset.tt]); el.setAttribute('aria-label', el.title); });
}

// pop: 場上數字量；danger: 比你大的比例；hunt: 大數字會追人的比例；ops: 可能出現的運算符；opRate: 運算符出現機率
const LEVELS = [
  { name: '暖身|Warm-up', start: 2, target: 12, pop: 12, danger: .25, hunt: 0, ops: ['−3'], opRate: .12,
    tip: '吃掉比你小的數字，**剛好**變成 12 就過關。吃過頭了？撿 **−3** 降回來。|Eat numbers smaller than you and hit **exactly** 12 to clear the stage. Overshot? Grab a **−3** to come back down.' },
  { name: '剛剛好|Just Right', start: 3, target: 25, pop: 14, danger: .3, hunt: 0, ops: ['−3', '+1'], opRate: .14,
    tip: '目標 25。快到的時候，別亂吃：先算一下差幾點。|Target 25. When you get close, don\'t eat blindly: work out how much you still need.' },
  { name: '除以二|Halve It', start: 4, target: 40, pop: 15, danger: .35, hunt: 0, ops: ['÷2', '−3', '+1'], opRate: .16,
    tip: '新的運算符 **÷2**（無條件捨去）。救命用的好東西，也可能害你。|New operator: **÷2** (rounds down). It can save you, and it can ruin you.' },
  { name: '獵人|Hunters', start: 3, target: 30, pop: 15, danger: .38, hunt: .45, ops: ['−3', '+1'], opRate: .13,
    tip: '有些大數字會**主動追你**（帶尖角的那種）。被盯上就快跑。|Some big numbers **hunt you down** (the spiky ones). If one locks on, run.' },
  { name: '大胃王|Big Eater', start: 5, target: 99, pop: 17, danger: .4, hunt: .35, ops: ['÷2', '−3', '+1'], opRate: .14,
    tip: '目標 99。越大越慢，越後面越難逃。|Target 99. The bigger you get, the slower you are, and the harder it is to escape.' },
  { name: '陷阱海|Sea of Traps', start: 4, target: 50, pop: 18, danger: .3, hunt: .3, ops: ['÷2', '÷2', '−3', '+1'], opRate: .32,
    tip: '到處漂著運算符。小心不要一頭撞上 ÷2。|Operators drift everywhere. Careful not to swim straight into a ÷2.' },
  { name: '質數|Prime', start: 2, target: 61, pop: 17, danger: .45, hunt: .5, ops: ['÷2', '−3', '+1'], opRate: .15,
    tip: '61 是質數，不能靠 ÷2 剛好湊到。要一點一點推上去。|61 is prime, so ÷2 can never land you on it. Build up bit by bit.' },
  { name: '128', start: 2, target: 128, pop: 18, danger: .48, hunt: .55, ops: ['÷2', '−3', '+1'], opRate: .14,
    tip: '最終關：從 2 長到 128。祝好運。|Final stage: grow from 2 to 128. Good luck.' },
];

// ---------- Deep Sea Arcade 平台：免費、BONUS 與暫停由父頁 deepSeaEatSmaller 處理；單獨開啟時是不免費的示範 ----------
function host() { try { return window.parent !== window ? window.parent.deepSeaEatSmaller || null : null; } catch (e) { return null; } }
let roundOn = false, earned = 0, platformVisible = true;
function ensureRound() {
  const h = host();
  if (!h || roundOn) return true;
  if (!(h.start(window) > 0)) return false;
  roundOn = true; earned = 0; renderNote();
  return true;
}
function renderNote() {
  const el = document.getElementById('platNote');
  if (!host()) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = roundOn
    ? Lx('本局進行中：每關第一次通過 BONUS +2 點（已得 {e} / 10）。失敗可以直接重來，不另免費。|Round in progress: +2 BONUS pts the first time you clear each stage ({e} / 10 earned). Retry freely after a loss at no extra cost.', { e: earned })
    : Lx('點一關就會扣 10 點開始一局；本局每過一關 BONUS +2 點，最多 10 點。|Picking a stage starts a round for 10 pts; each stage you clear in the round gives a +2 pt BONUS, up to 10 pts.');
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('eatSmaller.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('eatSmaller.' + k, JSON.stringify(v)); } catch (e) {} }
};
let unlocked = store.get('unlocked', 1);
let bests = store.get('bests', {});

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const avail = Math.min(window.innerWidth - 24, window.innerHeight - 120);
  const size = Math.max(260, Math.floor(avail));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = cv.style.height = size + 'px';
  cv.width = cv.height = Math.round(size * dpr);
  document.getElementById('bar').style.width = size + 'px';
  scale = size / W;
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
window.addEventListener('resize', resize); resize();

const radiusOf = v => 14 + Math.sqrt(v) * 3.2;
const speedOf = v => 250 / (1 + v / 28);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));

let uid = 0;
let lvIndex = 0, L, player, ents, state = 'menu', time = 0, spawnT = 0, invuln = 0, popups = [], particles = [], shake = 0;

function loadLevel(i) {
  lvIndex = i; L = LEVELS[i];
  player = { x: W / 2, y: H / 2, v: L.start, vx: 0, vy: 0, r: radiusOf(L.start) };
  ents = []; popups = []; particles = []; time = 0; invuln = 1.5; spawnT = 0;
  for (let k = 0; k < L.pop; k++) spawn(true);
  updHud();
}

function spawn(initial) {
  const isOp = Math.random() < L.opRate;
  let e;
  if (isOp) {
    e = { op: L.ops[randi(0, L.ops.length - 1)], r: 17 };
  } else {
    const pv = player.v;
    let v;
    if (Math.random() < L.danger) v = randi(pv + 1, Math.max(pv + 3, Math.round(pv * 2.2) + 3));
    else v = randi(1, Math.max(1, Math.min(pv - 1, Math.ceil(pv * 0.75))));
    e = { v, r: radiusOf(v), hunter: v > pv && Math.random() < L.hunt };
  }
  // 位置：初始散在場上（避開玩家），之後從邊緣漂進來
  let x, y, tries = 0;
  if (initial) {
    do { x = rand(40, W - 40); y = rand(40, H - 40); tries++; } while (Math.hypot(x - player.x, y - player.y) < 200 && tries < 50);
  } else {
    const side = randi(0, 3), m = e.r + 4;
    if (side === 0) { x = -m; y = rand(0, H); } else if (side === 1) { x = W + m; y = rand(0, H); }
    else if (side === 2) { x = rand(0, W); y = -m; } else { x = rand(0, W); y = H + m; }
  }
  const tx = rand(W * .2, W * .8), ty = rand(H * .2, H * .8);
  const a = Math.atan2(ty - y, tx - x) + rand(-.4, .4);
  const sp = e.op ? rand(25, 50) : (e.hunter ? rand(55, 80) : rand(30, 85));
  Object.assign(e, { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sp, wob: rand(0, 6.28), born: 0 });
  e.id = ++uid;
  ents.push(e);
}

// ---------- 輸入 ----------
const keys = new Set();
let pointer = null, pointerActive = false;
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || pointerActive) pointer = toLocal(e); });
cv.addEventListener('pointerdown', e => { touch(); pointerActive = true; pointer = toLocal(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', e => { pointerActive = false; if (e.pointerType !== 'mouse') pointer = null; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointer = null; });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  keys.add(k);
  if (keys.size && /^(arrow|[wasd]$)/.test(k)) pointer = null;
  touch();
  if (k === 'r' && (state === 'play' || state === 'end')) { loadLevel(lvIndex); state = 'play'; show(null); }
  if (k === 'escape') openMenu();
  if (k === ' ' || k === 'enter') { if (state === 'intro') begin(); else if (state === 'end') document.getElementById('btnEnd').click(); else if (state === 'pause') resumeGame(); }
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

// ---------- 更新 ----------
function update(dt) {
  time += dt; invuln = Math.max(0, invuln - dt);
  // 玩家移動
  let dx = 0, dy = 0;
  if (keys.has('arrowleft') || keys.has('a')) dx -= 1;
  if (keys.has('arrowright') || keys.has('d')) dx += 1;
  if (keys.has('arrowup') || keys.has('w')) dy -= 1;
  if (keys.has('arrowdown') || keys.has('s')) dy += 1;
  const sp = speedOf(player.v);
  let tvx = 0, tvy = 0;
  if (dx || dy) { const l = Math.hypot(dx, dy); tvx = dx / l * sp; tvy = dy / l * sp; }
  else if (pointer) {
    const ox = pointer.x - player.x, oy = pointer.y - player.y, d = Math.hypot(ox, oy);
    if (d > 4) { const k = Math.min(1, d / 60); tvx = ox / d * sp * k; tvy = oy / d * sp * k; }
  }
  const ease = 1 - Math.exp(-dt * 10);
  player.vx += (tvx - player.vx) * ease; player.vy += (tvy - player.vy) * ease;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x + player.vx * dt));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y + player.vy * dt));
  player.r += (radiusOf(player.v) - player.r) * (1 - Math.exp(-dt * 8));

  // 敵人
  for (const e of ents) {
    e.born += dt; e.wob += dt;
    if (e.hunter && e.v > player.v) {
      const ox = player.x - e.x, oy = player.y - e.y, d = Math.hypot(ox, oy);
      if (d < 260 && d > 1) {
        const k = 1 - Math.exp(-dt * 2.2);
        e.vx += (ox / d * e.sp * 1.25 - e.vx) * k; e.vy += (oy / d * e.sp * 1.25 - e.vy) * k;
      }
    }
    e.x += e.vx * dt; e.y += e.vy * dt;
  }
  // 離開場地的移除
  ents = ents.filter(e => e.born < 2 || (e.x > -80 && e.x < W + 80 && e.y > -80 && e.y < H + 80));

  // 碰撞
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d > e.r + player.r - 5) continue;
    if (e.op) {
      const before = player.v;
      if (e.op === '−3') player.v = Math.max(2, player.v - 3);
      else if (e.op === '÷2') player.v = Math.max(2, Math.floor(player.v / 2));
      else if (e.op === '+1') player.v += 1;
      popup(e.x, e.y, e.op, '#d9801a'); burst(e.x, e.y, '#d9801a', 10);
      ents.splice(i, 1);
      if (player.v !== before) afterChange();
    } else if (e.v < player.v) {
      player.v += e.v;
      popup(e.x, e.y, '+' + e.v, '#3f7a31'); burst(e.x, e.y, '#3f7a31', 8);
      ents.splice(i, 1);
      afterChange();
    } else if (e.v > player.v) {
      if (invuln > 0) continue;
      lose(e); return;
    } else {
      // 一樣大：互相彈開
      const nx = (e.x - player.x) / (d || 1), ny = (e.y - player.y) / (d || 1);
      e.vx = nx * e.sp; e.vy = ny * e.sp;
      player.vx -= nx * 220; player.vy -= ny * 220;
      e.x = player.x + nx * (e.r + player.r - 4);
      e.y = player.y + ny * (e.r + player.r - 4);
    }
    if (state !== 'play') return;
  }

  // 補充數字
  spawnT -= dt;
  if (ents.length < L.pop && spawnT <= 0) { spawn(false); spawnT = rand(.25, .7); }
  // 確保永遠有能吃的
  if (!ents.some(e => !e.op && e.v < player.v) && player.v > 1) { const s = L.danger; L.danger = 0; spawn(false); L.danger = s; }

  // 特效
  popups.forEach(p => { p.t += dt; p.y -= 30 * dt; }); popups = popups.filter(p => p.t < .9);
  particles.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94; }); particles = particles.filter(p => p.t < .6);
  shake = Math.max(0, shake - dt * 30);
}
function afterChange() {
  // 重新判斷誰是獵人（比你大的才會追）
  if (player.v === L.target) return win();
  updHud();
}
function popup(x, y, text, color) { popups.push({ x, y, text, color, t: 0 }); }
function burst(x, y, color, n) { for (let i = 0; i < n; i++) { const a = rand(0, 6.28), s = rand(80, 220); particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, t: 0 }); } }

function updHud() {
  document.getElementById('hudVal').textContent = player.v;
  document.getElementById('hudTarget').textContent = L.target;
  document.getElementById('hudLv').textContent = Lx('第 {n} 關 · {name}|Stage {n} · {name}', { n: lvIndex + 1, name: Lx(L.name) });
  const over = player.v > L.target;
  const pr = document.getElementById('prog');
  pr.style.width = Math.min(100, player.v / L.target * 100) + '%';
  pr.classList.toggle('over', over);
  const st = document.getElementById('status');
  if (over) { st.textContent = Lx('超過了 {d}！找 −3 或 ÷2 降回來|Over by {d}! Find a −3 or ÷2 to come back down', { d: player.v - L.target }); st.className = 'status warn'; }
  else if (state === 'play' || state === 'pause') {
    const need = L.target - player.v;
    st.textContent = need < player.v ? Lx('還差 {n}：吃一個「{n}」就剛好|{n} to go: eat a "{n}" to land exactly', { n: need }) : Lx('還差 {n}|{n} to go', { n: need });
    st.className = 'status';
  } else { st.textContent = Lx(TX.hint); st.className = 'status'; }
}

function win() {
  state = 'end';
  updHud();
  burst(player.x, player.y, '#3f7a31', 40);
  const t = Math.round(time * 10) / 10;
  if (bests[lvIndex] == null || t < bests[lvIndex]) { bests[lvIndex] = t; store.set('bests', bests); }
  if (lvIndex + 2 > unlocked) { unlocked = Math.min(LEVELS.length, lvIndex + 2); store.set('unlocked', unlocked); }
  const h = host(), got = h && roundOn ? Math.max(0, Math.floor(Number(h.clear(window, lvIndex)) || 0)) : 0;
  earned += got;
  endView = { win: true, t, got, target: L.target };
  renderEnd();
  const b = document.getElementById('btnEnd');
  b.onclick = () => lvIndex + 1 < LEVELS.length ? intro(lvIndex + 1) : openMenu();
  setTimeout(() => show('ovEnd'), 600);
}
let endView = null;
function renderEnd() {
  if (!endView) return;
  const v = endView, last = lvIndex + 1 >= LEVELS.length;
  document.getElementById('endTitle').textContent = v.win ? Lx('剛好 {n}！|Exactly {n}!', { n: v.target }) : Lx('被 {n} 吃掉了|Eaten by {n}', { n: v.by });
  document.getElementById('endSub').textContent = v.win ? Lx('過關了。|Stage cleared.') : Lx('你當時是 {v}，目標 {t}。|You were {v}; the target was {t}.', { v: v.was, t: v.target });
  document.getElementById('endStat').style.display = v.win ? '' : 'none';
  if (v.win) {
    document.getElementById('endTime').textContent = v.t.toFixed(1);
    document.getElementById('endBest').textContent = bests[lvIndex].toFixed(1);
  }
  document.getElementById('endBonus').textContent = v.win && v.got ? Lx('BONUS +{p} 點已入帳|BONUS +{p} pts added', { p: v.got }) : '';
  document.getElementById('btnEnd').textContent = !v.win ? Lx('再試一次|Try again') : last ? Lx('全部通關！回選單|All cleared! Back to menu') : Lx('下一關|Next stage');
}
function lose(e) {
  state = 'end'; shake = 14;
  burst(player.x, player.y, '#c8402f', 30);
  endView = { win: false, by: e.v, was: player.v, target: L.target };
  renderEnd();
  const b = document.getElementById('btnEnd');
  b.onclick = () => { loadLevel(lvIndex); begin(); };
  setTimeout(() => show('ovEnd'), 650);
}

// ---------- 手繪筆觸工具 ----------
const FONT = '"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","Comic Sans MS",cursive';
const INK = '#2b2b2b', PAPER = '#f6eedb';
function rng(seed) {
  let s = (Math.imul(seed | 0, 2654435761) >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function wobblyCircle(x, y, r, R, over) {
  const n = Math.max(12, Math.round(r / 2)), a0 = R() * 6.2832, amp = Math.min(2, r * .08);
  const extra = over ? 0.12 + R() * 0.12 : 0;
  ctx.beginPath();
  for (let i = 0; i <= n * (1 + extra); i++) {
    const a = a0 + i / n * 6.2832, rr = r + (R() - .5) * 2 * amp;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
}
function sketchCircle(x, y, r, seed, o) {
  const R = rng(seed);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.fill) { ctx.fillStyle = o.fill; wobblyCircle(x + (R() - .5) * 2.5, y + (R() - .5) * 2.5, r * .97, R, false); ctx.closePath(); ctx.fill(); }
  if (o.stroke) {
    ctx.strokeStyle = o.stroke;
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.lineWidth = o.lw || 2; wobblyCircle(x, y, r, R, true); ctx.stroke();
    if (o.passes !== 1) { ctx.lineWidth = (o.lw || 2) * .55; wobblyCircle(x, y, r + .6, R, true); ctx.stroke(); }
    ctx.setLineDash([]);
  }
}
function sketchLine(x1, y1, x2, y2, R, j) {
  const mx = (x1 + x2) / 2 + (R() - .5) * j * 2, my = (y1 + y2) / 2 + (R() - .5) * j * 2;
  ctx.moveTo(x1 + (R() - .5) * j, y1 + (R() - .5) * j);
  ctx.quadraticCurveTo(mx, my, x2 + (R() - .5) * j, y2 + (R() - .5) * j);
}
function sketchRect(x, y, w, h, seed, o) {
  const R = rng(seed), j = o.j != null ? o.j : 1.6, e = o.over != null ? o.over : 3;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.fill) {
    ctx.fillStyle = o.fill; ctx.beginPath();
    ctx.moveTo(x + R() * j, y + R() * j); ctx.lineTo(x + w - R() * j, y + R() * j);
    ctx.lineTo(x + w - R() * j, y + h - R() * j); ctx.lineTo(x + R() * j, y + h - R() * j); ctx.closePath(); ctx.fill();
  }
  if (o.stroke) {
    ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2;
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath();
    sketchLine(x - e, y, x + w + e * .4, y, R, j); sketchLine(x + w, y - e * .4, x + w, y + h + e, R, j);
    sketchLine(x + w + e * .4, y + h, x - e, y + h, R, j); sketchLine(x, y + h + e * .4, x, y - e, R, j);
    ctx.stroke(); ctx.setLineDash([]);
  }
}
function sketchPoly(pts, seed, o) {
  const R = rng(seed), j = o.j != null ? o.j : 1.4;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.fill) { ctx.fillStyle = o.fill; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
  if (o.stroke) {
    ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2; ctx.beginPath();
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; sketchLine(a[0], a[1], b[0] + (b[0] - a[0]) * .08, b[1] + (b[1] - a[1]) * .08, R, j); }
    ctx.stroke();
  }
}
function hatch(x, y, w, h, seed, color, gap, lw) {
  const R = rng(seed);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = lw || 1.2; ctx.lineCap = 'round'; ctx.beginPath();
  for (let k = -h; k < w + h; k += gap) {
    ctx.moveTo(x + k + (R() - .5) * 2, y + h + 2 + (R() - .5) * 2);
    ctx.lineTo(x + k + h + (R() - .5) * 2, y - 2 + (R() - .5) * 2);
  }
  ctx.stroke(); ctx.restore();
}
function inkText(text, x, y, size, color, weight) {
  ctx.font = `${weight || 700} ${size}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

// ---------- 繪圖（紙張手繪） ----------
const COLORS = {
  small: { ink: '#3f7a31', wash: 'rgba(169,217,143,.45)' },
  big:   { ink: '#c8402f', wash: 'rgba(242,165,148,.5)' },
  eq:    { ink: '#7d776b', wash: 'rgba(200,192,176,.4)' },
};
function draw(now) {
  const boil = Math.floor(now / 170);
  ctx.save();
  if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.fillStyle = PAPER; ctx.fillRect(-20, -20, W + 40, H + 40);
  // 筆記本橫線與紅色邊線
  ctx.strokeStyle = 'rgba(63,151,196,.22)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (let y = 48; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
  ctx.strokeStyle = 'rgba(200,64,47,.28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(64, 0); ctx.lineTo(64, H); ctx.stroke();
  if (!L) { ctx.restore(); return; }

  for (const e of ents) drawEnt(e, now, boil);
  // 玩家
  if (state !== 'end' || player.v === L.target) {
    const blink = invuln > 0 && Math.floor(now / 110) % 2;
    ctx.save();
    ctx.globalAlpha = blink ? .45 : 1;
    sketchCircle(player.x + 3, player.y + 4, player.r, 7, { fill: 'rgba(43,43,43,.12)' });
    sketchCircle(player.x, player.y, player.r, 1 + boil * 13, { fill: '#8fd3e8', stroke: INK, lw: 2.8 });
    inkText(player.v, player.x, player.y + 1, Math.round(Math.min(32, player.r * 1.05)), INK, 700);
    ctx.restore();
  }
  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / .6; ctx.strokeStyle = p.color; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .03, p.y - p.vy * .03); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / .9;
    inkText(p.text, p.x, p.y, 26, p.color, 700);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function drawEnt(e, now, boil) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const appear = Math.min(1, e.born * 3);
  ctx.scale(appear, appear);
  const seed = e.id * 31 + boil * 7;
  if (e.op) {
    ctx.rotate(Math.sin(e.wob * 2) * .15);
    const s = e.r + 3;
    sketchPoly([[0, -s], [s, 0], [0, s], [-s, 0]], seed, { fill: '#f6c47a', stroke: INK, lw: 2.2 });
    inkText(e.op, 0, 1, 17, INK, 700);
    ctx.restore(); return;
  }
  const rel = e.v < player.v ? 'small' : e.v > player.v ? 'big' : 'eq';
  const c = COLORS[rel];
  if (rel === 'small' && player.v + e.v === L.target) {
    ctx.save(); ctx.globalAlpha = .55 + .45 * Math.sin(now / 150);
    sketchCircle(0, 0, e.r + 8, seed + 3, { stroke: '#d9801a', lw: 2.4, dash: [6, 6], passes: 1 });
    ctx.restore();
  }
  if (e.hunter && rel === 'big') {
    // 鋸齒尖角
    const a0 = Math.atan2(e.vy, e.vx), R = rng(seed);
    ctx.strokeStyle = c.ink; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.beginPath();
    const n = 9;
    for (let k = 0; k <= n * 2; k++) {
      const a = a0 + k / (n * 2) * 6.2832, rr = k % 2 ? e.r + 3 : e.r + 10 + (R() - .5) * 3;
      k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.stroke();
  }
  sketchCircle(0, 0, e.r, seed, { fill: c.wash, stroke: c.ink, lw: 2.4 });
  if (rel === 'big') {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, e.r - 3, 0, 6.2832); ctx.clip();
    hatch(-e.r, -e.r, e.r * 2, e.r * 2, e.id, 'rgba(200,64,47,.28)', 6, 1.2);
    ctx.restore();
  }
  inkText(e.v, 0, 1, Math.round(Math.min(28, e.r * 1.02)), c.ink, 700);
  ctx.restore();
}

// ---------- 迴圈 ----------
let last = performance.now();
function frame(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!platformVisible) { requestAnimationFrame(frame); return; }
  if (state === 'play') update(dt);
  else if (state === 'end') {
    particles.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }); particles = particles.filter(p => p.t < .6);
    shake = Math.max(0, shake - dt * 30);
  }
  draw(now);
  requestAnimationFrame(frame);
}

// ---------- 介面 ----------
function show(id) { document.querySelectorAll('.overlay').forEach(o => o.classList.toggle('show', o.id === id)); }
function openMenu() {
  if (state === 'pause') tellResume();
  state = 'menu';
  renderMenu();
  renderNote();
  show('ovMenu');
  updHud();
}
function renderMenu() {
  const box = document.getElementById('levels'); box.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.innerHTML = `${lv.target}<small>${bests[i] != null ? bests[i].toFixed(1) + 's' : Lx('第 {n} 關|Stage {n}', { n: i + 1 })}</small>`;
    b.disabled = i >= unlocked;
    if (bests[i] != null) b.classList.add('done');
    b.onclick = () => { if (ensureRound()) intro(i); };
    box.appendChild(b);
  });
}
function intro(i) {
  loadLevel(i); state = 'intro';
  renderIntro();
  show('ovIntro');
}
function renderIntro() {
  document.getElementById('introLv').textContent = Lx('第 {n} 關 · 從 {a} 到 {b}|Stage {n} · from {a} to {b}', { n: lvIndex + 1, a: L.start, b: L.target });
  document.getElementById('introName').textContent = Lx(L.name);
  document.getElementById('introTip').innerHTML = Lx(L.tip);
}
function begin() { show(null); state = 'play'; last = performance.now(); updHud(); }
document.getElementById('btnGo').onclick = begin;
document.getElementById('btnEndMenu').onclick = openMenu;
document.getElementById('btnMenu').onclick = openMenu;
document.getElementById('btnRestart').onclick = () => { if (state === 'play' || state === 'end') { loadLevel(lvIndex); begin(); } };

// ---------- 暫停：切走遊戲、背景分頁時自動暫停，回來要按「繼續」 ----------
function pauseGame() {
  if (state !== 'play') return;
  state = 'pause'; keys.clear(); pointer = null; pointerActive = false;
  show('ovPause');
  const h = host(); if (h && roundOn && h.pause) h.pause(window);
}
function tellResume() { const h = host(); if (h && roundOn && h.resume) h.resume(window); }
function resumeGame() {
  if (state !== 'pause') return;
  state = 'play'; show(null); last = performance.now(); tellResume();
}
document.getElementById('btnResume').onclick = resumeGame;
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function touch() { const h = host(); if (h && roundOn && h.touch) h.touch(window); }

// 父頁介面：右側按鈕開局、切換畫面、結束本局
window.startEatPlatformRound = () => { if (roundOn) return roundOn; if (ensureRound()) openMenu(); return roundOn; };
window.setEatPlatformActive = v => { platformVisible = !!v; last = performance.now(); if (!platformVisible) pauseGame(); else resize(); };
window.endEatPlatformRound = () => { roundOn = false; earned = 0; openMenu(); };
window.isEatPlatformRound = () => roundOn;

function relang() {
  applyStatic(); updHud(); renderNote(); renderMenu(); renderIntro(); renderEnd();
}
try { window.parent.addEventListener('arcade-languagechange', relang); } catch (e) {}
applyStatic();
loadLevel(0);
openMenu();
requestAnimationFrame(frame);
})();
</script>
