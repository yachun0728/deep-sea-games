<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dream Repair Shop</title>
<style>
:root{--bg:#f4f4f1;--fg:#1d1d1b;--mut:#66655f;--card:#fff;--line:#d9d8d2;--ok:#2f7d4f;--bad:#b3382c;--acc:#534ab7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#ecebe6;--mut:#9b9a92;--card:#1f1f1d;--line:#3a3a36;--ok:#6cc58f;--bad:#f08a7e;--acc:#a9a2f0}}
:root[data-theme="dark"]{--bg:#141413;--fg:#ecebe6;--mut:#9b9a92;--card:#1f1f1d;--line:#3a3a36;--ok:#6cc58f;--bad:#f08a7e;--acc:#a9a2f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;padding:16px;display:flex;justify-content:center}
main{width:100%;max-width:520px}
h1{font-size:22px;font-weight:500;margin:0 0 10px}
button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button:active{transform:scale(.98)}
#lg{display:flex;gap:8px;margin-bottom:14px}
#lg button{font-size:13px;padding:6px 12px}
#lg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.m{background:var(--card);border-radius:8px;padding:10px 12px}
.m span{display:block;font-size:12px;color:var(--mut)}
.m b{font-size:20px;font-weight:500}
.scene{margin-top:10px;background:var(--card);border-radius:12px;padding:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.u{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:var(--card)}
.u p{margin:0;font-size:14px}.u small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
#bar{height:10px;width:0;background:var(--acc)}
</style><style>
:root,:root[data-theme="dark"]{color-scheme:dark;--bg:#051620;--fg:#e4f2f3;--mut:#8db0b9;--card:#0c2230;--line:#214658;--ok:#62e6d2;--bad:#ff6f61;--acc:#62e6d2}
body{box-sizing:border-box;min-height:100vh;padding:20px 16px;font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button:focus-visible,canvas:focus-visible{outline:2px solid #62e6d2;outline-offset:3px}
</style></head><body><main>
<h1 data-k="title"></h1>
<div id="lg"></div>
<div class="stats">
<div class="m"><span data-k="stars"></span><b id="st">0</b></div>
<div class="m"><span data-k="rate"></span><b id="rt">0</b></div>
<div class="m"><span data-k="value"></span><b id="vl">1</b></div>
</div>
<div class="scene">
<div style="text-align:center;width:150px">
<svg id="dream" width="110" height="110" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="42" fill="none" stroke="#888780" stroke-width="7"/><path d="M40 25L58 52L48 66L68 88" fill="none" stroke="#d4483a" stroke-width="2.5"/></svg>
<div id="dname" style="font-size:13px;color:var(--mut)"></div>
<button id="tapb" style="margin-top:6px;width:100%"></button>
</div>
<div style="flex:1;min-width:200px">
<div style="font-size:14px;font-weight:500" id="cname"></div>
<div style="font-size:12px;color:var(--mut);margin:2px 0 8px" id="cstate"></div>
<div class="bar"><div id="bar"></div></div>
<div id="pop" style="height:20px;margin-top:6px;font-size:13px;color:var(--ok)"></div>
</div>
</div>
<div class="u"><div><p data-k="u1"></p><small data-k="u1d"></small></div><button id="b1"></button></div>
<div class="u"><div><p data-k="u2"></p><small data-k="u2d"></small></div><button id="b2"></button></div>
<div class="u"><div><p data-k="u3"></p><small data-k="u3d"></small></div><button id="b3"></button></div>
<p id="msg" style="min-height:40px;margin-top:12px;font-size:13px;line-height:1.5;color:var(--mut)"></p>
</main>
<script>
let gameActive=true;
addEventListener('message',e=>{if(e.source!==parent||!e.data||e.data.type!=='deep-sea-active')return;settleDream();gameActive=!!e.data.active;draw();});

const I={
vi:{doc:'Tiệm Sửa Giấc Mơ',title:'Tiệm Sửa Giấc Mơ',stars:'Ánh Sao',rate:'Thu nhập mỗi giây',value:'Mỗi giấc mơ',d1:'Mơ thường',d2:'Mơ bay (cấp 2)',tap:'Chạm để sửa',nocat:'Chưa có trợ lý',cat:'Mèo Ngủ',hint:'Thuê Mèo Ngủ để tiệm tự chạy',doze:'Đang ngủ gật…',fix:'Vươn vai, sửa mơ',pop:n=>'+'+n+' sao từ Mèo Ngủ',u1:'Thuê Mèo Ngủ',u1d:'Tự sửa 1 giấc mơ mỗi 2 giây, kể cả khi offline',u2:'Nâng tiệm lên cấp 2',u2d:'Mở mơ bay, mỗi giấc mơ có giá trị x5',u3:'Tua 5 phút offline (demo)',u3d:'Mèo làm việc khi bạn vắng mặt, hiệu suất 50%',price:n=>n+' sao',hired:'Đã thuê',up:'Đã nâng',skip:'Tua',
hasCat:'Bạn đã có Mèo Ngủ rồi.',need:(n,h)=>'Chưa đủ sao. Cần '+n+', bạn đang có '+h+'. Chạm thêm vài lần nhé.',catOk:'Mèo Ngủ đã vào tiệm. Từ giờ nó tự sửa mơ cho bạn.',hasShop:'Tiệm đã ở cấp 2.',shopOk:'Tiệm lên cấp 2. Mơ bay xuất hiện, mỗi giấc mơ giờ đáng giá 5 sao.',noCat:'Chưa có trợ lý nên không có gì kiếm được khi offline. Hãy thuê Mèo Ngủ trước.',back:g=>'Chào mừng quay lại. Mèo đã kiếm được '+g+' sao khi bạn vắng mặt.'},
en:{doc:'Dream Repair Shop',title:'Dream Repair Shop',stars:'Starlight',rate:'Income per second',value:'Per dream',d1:'Plain dream',d2:'Flying dream (level 2)',tap:'Tap to repair',nocat:'No assistant yet',cat:'Sleepy Cat',hint:'Hire Sleepy Cat so the shop runs itself',doze:'Dozing off…',fix:'Stretching, fixing a dream',pop:n=>'+'+n+' starlight from Sleepy Cat',u1:'Hire Sleepy Cat',u1d:'Repairs 1 dream every 2 seconds, even when you are offline',u2:'Upgrade shop to level 2',u2d:'Unlocks flying dreams, each worth 5x',u3:'Fast-forward 5 offline minutes (demo)',u3d:'The cat works while you are away, at 50% efficiency',price:n=>n+' starlight',hired:'Hired',up:'Upgraded',skip:'Skip',
hasCat:'You already have Sleepy Cat.',need:(n,h)=>'Not enough starlight. You need '+n+' and have '+h+'. Tap a few more times.',catOk:'Sleepy Cat has joined the shop. It now repairs dreams for you.',hasShop:'The shop is already level 2.',shopOk:'Shop upgraded to level 2. Flying dreams appear, each now worth 5 starlight.',noCat:'No assistant means nothing is earned offline. Hire Sleepy Cat first.',back:g=>'Welcome back. The cat earned '+g+' starlight while you were away.'},
zh:{doc:'修梦小铺',title:'修梦小铺',stars:'星光',rate:'每秒收入',value:'每个梦',d1:'普通梦',d2:'飞翔梦（2级）',tap:'点击修复',nocat:'还没有助手',cat:'瞌睡猫',hint:'雇佣瞌睡猫，让小铺自动运转',doze:'打着盹…',fix:'伸个懒腰，修梦中',pop:n=>'瞌睡猫带来 +'+n+' 星光',u1:'雇佣瞌睡猫',u1d:'每2秒自动修复1个梦，离线时也有效',u2:'小铺升到2级',u2d:'解锁飞翔梦，每个梦价值 ×5',u3:'快进5分钟离线（演示）',u3d:'你不在时猫继续工作，效率50%',price:n=>n+' 星光',hired:'已雇佣',up:'已升级',skip:'快进',
hasCat:'你已经有瞌睡猫了。',need:(n,h)=>'星光不足。需要 '+n+'，你现在有 '+h+'。再点几下吧。',catOk:'瞌睡猫入驻小铺，从现在起它会自动帮你修梦。',hasShop:'小铺已经是2级。',shopOk:'小铺升到2级，飞翔梦出现了，每个梦现在价值5星光。',noCat:'没有助手就没有离线收入，请先雇佣瞌睡猫。',back:g=>'欢迎回来。你不在时猫赚了 '+g+' 星光。'}};
let lang='';try{lang=localStorage.getItem('dream_lang')||''}catch(e){}
if(!I[lang]){const n=(navigator.language||'').toLowerCase();lang=n.startsWith('zh')?'zh':n.startsWith('vi')?'vi':'en'}
const T=(k,...a)=>{const x=I[lang][k];return typeof x==='function'?x(...a):x};
const $=id=>document.getElementById(id);
let stars=0,cat=false,lvl=1,prog=0,mk='',ma=[],mc='var(--mut)';
const val=()=>lvl===1?1:5,rate=()=>cat?val()/2:0;
function say(k,a,c){mk=k;ma=a||[];mc=c||'var(--mut)';draw()}
function draw(){
document.querySelectorAll('[data-k]').forEach(e=>e.textContent=T(e.dataset.k));
$('tapb').textContent=T('tap');
$('st').textContent=Math.floor(stars);$('rt').textContent=rate().toFixed(1);$('vl').textContent=val();
$('dream').firstElementChild.setAttribute('stroke',lvl===1?'#888780':'#7F77DD');
$('dname').textContent=T(lvl===1?'d1':'d2');
$('cname').textContent=T(cat?'cat':'nocat');
if(!cat)$('cstate').textContent=T('hint');
$('b1').textContent=cat?T('hired'):T('price',20);
$('b2').textContent=lvl===2?T('up'):T('price',60);
$('b3').textContent=T('skip');
const m=$('msg');m.textContent=mk?T(mk,...ma):'';m.style.color=mc;
document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title=T('doc');
document.querySelectorAll('#lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang))}
$('tapb').onclick=()=>{stars+=val();draw()};
$('b1').onclick=()=>{if(cat)return say('hasCat');if(stars<20)return say('need',[20,Math.floor(stars)],'var(--bad)');stars-=20;cat=true;prog=0;say('catOk',[],'var(--ok)')};
$('b2').onclick=()=>{if(lvl===2)return say('hasShop');if(stars<60)return say('need',[60,Math.floor(stars)],'var(--bad)');stars-=60;lvl=2;say('shopOk',[],'var(--ok)')};
$('b3').onclick=()=>{if(!cat)return say('noCat',[],'var(--bad)');const g=Math.round(rate()*300*.5);stars+=g;say('back',[g],'var(--ok)')};
[['vi','Tiếng Việt'],['en','English'],['zh','中文']].forEach(a=>{const b=document.createElement('button');b.textContent=a[1];b.dataset.l=a[0];b.onclick=()=>{lang=a[0];try{localStorage.setItem('dream_lang',lang)}catch(e){}draw()};$('lg').appendChild(b)});
// Settle elapsed wall time before changing activity, assistant, or shop level.
const SAVE='deep_sea_dream_v1';
let lastSettlement=Date.now(),wasVisible=!document.hidden;
function settleDream(now=Date.now()){
 const elapsed=Math.max(0,now-lastSettlement);lastSettlement=now;
 if(!cat)return;
 if(!gameActive||!wasVisible){stars+=elapsed/1000*rate()*.5;return;}
 prog+=elapsed;
 const completed=Math.floor(prog/2000);prog%=2000;
 if(completed){stars+=completed*val();$('pop').textContent=T('pop',completed*val());setTimeout(()=>{$('pop').textContent=''},800);}
}
function saveDream(){
 settleDream();
 try{localStorage.setItem(SAVE,JSON.stringify({stars,cat,lvl,prog,at:lastSettlement}))}catch(e){}
}
function restoreDream(){
 try{
  const d=JSON.parse(localStorage.getItem(SAVE));if(!d)return;
  stars=Number.isFinite(d.stars)?Math.max(0,d.stars):0;cat=d.cat===true;lvl=d.lvl===2?2:1;
  prog=Number.isFinite(d.prog)?Math.max(0,d.prog)%2000:0;
  if(cat&&Number.isFinite(d.at)){
   const gain=Math.max(0,lastSettlement-d.at)/1000*rate()*.5;stars+=gain;
   if(gain>=1)say('back',[Math.floor(gain)],'var(--ok)');
  }
 }catch(e){}
}
restoreDream();
// Persist restored rewards immediately so a quick reload cannot grant them twice.
saveDream();
setInterval(()=>{
 settleDream();
 if(!gameActive||document.hidden)return;
 const p=prog/20;$('bar').style.width=p+'%';
 if(cat)$('cstate').textContent=T(p<70?'doze':'fix');
 draw();
},100);
setInterval(saveDream,1000);
addEventListener('pagehide',saveDream);
addEventListener('pageshow',()=>{settleDream();draw()});
document.addEventListener('visibilitychange',()=>{
 settleDream();wasVisible=!document.hidden;saveDream();draw();
});
// Capture elapsed earnings at the old rate before a purchase changes it.
document.addEventListener('click',()=>settleDream(),true);
document.addEventListener('click',saveDream);

draw();
</script></body></html>
