<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>俄羅斯方塊 Block Drop</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Layout: hold / stats on the left, board in the middle, next / keys on the right.
     On a phone the board takes the left column and everything else stacks on the right. */
  :root {
    --bg: #0d1016;
    --panel: #141923;
    --board: #10141c;
    --line: #222a38;
    --fg: #e7eaf0;
    --muted: #8892a6;
    --accent: #7fb4ff;
    --accent-ink: #0b1220;
    --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-num: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; }
  h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: .06em; }
  .tag { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

  .game {
    display: grid;
    gap: 12px;
    justify-content: center;
    align-items: start;
    grid-template-columns: 148px auto 148px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "hold board next" "stats board keys";
  }
  .hold { grid-area: hold; }
  .next { grid-area: next; }
  .stats { grid-area: stats; }
  .keys { grid-area: keys; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-width: 0; }
  .panel h2 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
  canvas.mini { display: block; width: 100%; height: auto; }

  .boardwrap {
    grid-area: board;
    position: relative;
    justify-self: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--board);
    line-height: 0;
    touch-action: manipulation;
  }
  #board { display: block; height: min(74vh, 620px); width: auto; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 16px; text-align: center; line-height: 1.5;
    background: rgba(13, 16, 22, .82);
  }
  .overlay h2 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: .08em; }
  .overlay p { margin: 0; font-size: 13px; color: var(--muted); }
  .overlay .big { font-family: var(--font-num); font-size: 28px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
  .primary {
    margin-top: 6px; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 6px; padding: 10px 24px;
    font: 700 15px var(--font-ui); cursor: pointer;
  }
  .banner {
    position: absolute; left: 0; right: 0; top: 22%;
    text-align: center; font-size: 22px; font-weight: 900; letter-spacing: .1em;
    opacity: 0; pointer-events: none; line-height: 1.2;
  }
  .banner.show { animation: pop .9s ease-out; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.9); }
    15% { opacity: 1; transform: scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }

  .stats dl { margin: 0; display: grid; gap: 10px; }
  .stats dt { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
  .stats dd { margin: 2px 0 0; font-family: var(--font-num); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .keys ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 12px; color: var(--muted); }
  .keys li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  kbd {
    font: 700 11px var(--font-num); color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; white-space: nowrap;
  }

  .touch {
    display: none; grid-template-columns: repeat(3, 1fr); gap: 8px;
    width: 100%; max-width: 420px; margin: 0 auto;
  }
  .touch button {
    min-height: 52px; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    font: 700 16px var(--font-ui); cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .touch button:active { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hdr-actions { display: none; gap: 8px; align-items: center; }
  .hdr-actions button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; font: 700 12px var(--font-ui); cursor: pointer; touch-action: manipulation;
    user-select: none; -webkit-user-select: none; min-height: 34px;
  }
  .hdr-actions button:active { background: var(--line); }
  /* Touch UI: swipe / tap right on the board by default; the six buttons are an opt-in fallback. */
  @media (max-width: 639px), (pointer: coarse) {
    .hdr-actions { display: flex; }
    body:not(.btnmode) #board, body:not(.btnmode) .boardwrap { touch-action: none; }
    body.btnmode .touch { display: grid; }
    body:not(.btnmode) .hold { cursor: pointer; }
  }
  @media (max-width: 639px) {
    .game {
      grid-template-columns: minmax(0, 1fr) 100px;
      grid-template-rows: auto auto 1fr;
      grid-template-areas: "board hold" "board next" "board stats";
    }
    .keys { display: none; }
    .boardwrap { justify-self: stretch; }
    #board { width: 100%; height: auto; }
    .stats dd { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) { .banner.show { animation: none; opacity: 1; } }
</style>

<main class="app">
  <header>
    <h1 data-i="title">俄羅斯方塊</h1>
    <span class="tag" data-i="tag">SRS 旋轉 · 7-bag 隨機 · 牆踢</span>
    <div class="hdr-actions" id="hdrActions">
      <button type="button" id="pauseBtn" data-i="k_pause">暫停</button>
      <button type="button" id="modeBtn">改用按鈕</button>
    </div>
  </header>

  <section class="game">
    <div class="panel hold">
      <h2 data-i="hold">暫存</h2>
      <canvas id="hold" class="mini" width="96" height="62"></canvas>
    </div>

    <div class="boardwrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="banner" id="banner"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">準備好了嗎</h2>
        <div class="big" id="ovScore" hidden></div>
        <p id="ovText">按 Enter 或點下方按鈕開始</p>
        <button class="primary" id="ovBtn" type="button">開始遊戲</button>
      </div>
    </div>

    <div class="panel next">
      <h2 data-i="next">下一個</h2>
      <canvas id="next" class="mini" width="96" height="186"></canvas>
    </div>

    <div class="panel stats">
      <dl>
        <div><dt data-i="score">分數</dt><dd id="score">0</dd></div>
        <div><dt data-i="level">等級</dt><dd id="level">1</dd></div>
        <div><dt data-i="lines">消除行數</dt><dd id="lines">0</dd></div>
        <div><dt data-i="best">最高分</dt><dd id="best">0</dd></div>
      </dl>
    </div>

    <div class="panel keys">
      <h2 data-i="keys">按鍵</h2>
      <ul>
        <li><span data-i="k_move">移動</span> <span><kbd>←</kbd> <kbd>→</kbd></span></li>
        <li><span data-i="k_rot">旋轉</span> <span><kbd>↑</kbd> <kbd>X</kbd></span></li>
        <li><span data-i="k_ccw">逆轉</span> <kbd>Z</kbd></li>
        <li><span data-i="k_soft">軟降</span> <kbd>↓</kbd></li>
        <li><span data-i="k_hard">硬降</span> <kbd data-i="k_space">空白鍵</kbd></li>
        <li><span data-i="k_hold">暫存</span> <kbd>C</kbd></li>
        <li><span data-i="k_pause">暫停</span> <kbd>P</kbd></li>
      </ul>
    </div>
  </section>

  <div class="touch" aria-label="觸控按鈕" id="touchbar">
    <button type="button" data-act="hold" data-i="hold">暫存</button>
    <button type="button" data-act="cw" data-i="k_rot">旋轉</button>
    <button type="button" data-act="hard" data-i="k_hard">硬降</button>
    <button type="button" data-act="left">←</button>
    <button type="button" data-act="down">↓</button>
    <button type="button" data-act="right">→</button>
  </div>
</main>

<script>
function runBlockDrop(rules) {
  const {COLS, ROWS, CLEAR_MS, SHAPES, emptyBoard} = rules;
  const CELL = 30, MINI = 20;
  const COLORS = { I: '#4fc3d9', O: '#f2c94c', T: '#b77fd3', S: '#6fcf97', Z: '#eb6b6b', J: '#5b9bf0', L: '#f2994a' };
  const BANNERS = [['', ''], ['單行消除', 'Single'], ['雙行消除', 'Double'], ['三行消除', 'Triple'], ['四行消除！', 'Quad!']];
  const $ = id => document.getElementById(id);

  // ---------- Deep Sea Arcade: language + platform bridge ----------
  // The parent page (deepSeaTetris) owns free entry, GA4 round tracking and pause/resume bookkeeping.
  // Opened on its own, this file still plays as a plain falling-block game.
  function lang() { try { const i = window.parent !== window && window.parent.deepSeaI18n; return i && i.getLanguage() === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; } }
  const T = (zh, en) => (lang() === 'en' ? en : zh);
  function host() { try { return window.parent !== window ? window.parent.deepSeaTetris || null : null; } catch (e) { return null; } }
  let platformVisible = true, roundOn = false, ctlReady = false;
  const L = {
    title: ['俄羅斯方塊', 'Block Drop'], tag: ['SRS 旋轉 · 7-bag 隨機 · 牆踢', 'SRS rotation · 7-bag · wall kicks'],
    hold: ['暫存', 'Hold'], next: ['下一個', 'Next'], keys: ['按鍵', 'Controls'],
    score: ['分數', 'Score'], level: ['等級', 'Level'], lines: ['消除行數', 'Lines'], best: ['最高分', 'Best'],
    k_move: ['移動', 'Move'], k_rot: ['旋轉', 'Rotate'], k_ccw: ['逆轉', 'Rotate back'], k_soft: ['軟降', 'Soft drop'],
    k_hard: ['硬降', 'Hard drop'], k_space: ['空白鍵', 'Space'], k_hold: ['暫存', 'Hold'], k_pause: ['暫停', 'Pause']
  };
  function applyLang() {
    const en = lang() === 'en';
    document.documentElement.lang = en ? 'en' : 'zh-Hant';
    document.title = en ? 'Block Drop' : '俄羅斯方塊';
    document.querySelectorAll('[data-i]').forEach(el => { const v = L[el.dataset.i]; if (v) el.textContent = v[en ? 1 : 0]; });
    const tb = $('touchbar'); if (tb) tb.setAttribute('aria-label', en ? 'Touch controls' : '觸控按鈕');
    if (ctlReady) setCtl(ctl, false);
    renderOverlay();
  }
  const css = getComputedStyle(document.documentElement);
  const C = { board: css.getPropertyValue('--board').trim() || '#10141c', line: css.getPropertyValue('--line').trim() || '#222a38', fg: css.getPropertyValue('--fg').trim() || '#e7eaf0' };

  function setup(canvas, w, h) {
    canvas.width = w * 2; canvas.height = h * 2;
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    return ctx;
  }
  const bx = setup($('board'), COLS * CELL, ROWS * CELL);
  const hx = setup($('hold'), 96, 62);
  const nx = setup($('next'), 96, 186);

  let best = 0;
  let state = 'ready', starting = false;
  function makeModel(random) {
    return rules.createModel(random, {
      onStats: updateStats,
      onPreview: drawPreview,
      onClear: count => showBanner(T(BANNERS[count][0], BANNERS[count][1])),
    });
  }
  let model = makeModel(Math.random);
  try { best = parseInt(localStorage.getItem('tetris-best') || '0', 10) || 0; } catch (e) {}

  // A fixed half-built stack so the first screen shows a board that looks in use.
  const demo = (() => {
    const b = emptyBoard(), types = Object.keys(COLORS);
    let s = 7;
    const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let y = ROWS - 6; y < ROWS; y++) {
      const gap = Math.floor(rnd() * COLS), gap2 = Math.floor(rnd() * COLS);
      for (let x = 0; x < COLS; x++) {
        if (x === gap || (x === gap2 && y < ROWS - 2)) continue;
        b[y][x] = types[Math.floor(rnd() * types.length)];
      }
    }
    return b;
  })();

  function start() {
    if (starting || state === 'play' || state === 'paused' || !platformVisible) return false;
    const h = host();
    const open = random => {
      starting = false;
      if (!platformVisible || h && !h.start(window)) return;
      roundOn = !!h;
      model = makeModel(random || Math.random);
      state = 'play';
      $('overlay').hidden = true;
      last = performance.now();
      model.start();
    };
    if (h && h.prepare) {
      starting = true;
      if (!h.prepare(window, open, () => { starting = false; })) { starting = false; return false; }
    } else open(null);
    return true;
  }
  let ovKind = 'ready';
  function renderOverlay() {
    const {score, lines, level} = model;
    const t = $('ovTitle'), p = $('ovText'), s = $('ovScore'), b = $('ovBtn');
    s.hidden = true;
    if (ovKind === 'ready') {
      t.textContent = T('準備好了嗎', 'Ready?');
      p.textContent = touchUI() && ctl === 'gesture'
        ? T('在棋盤上：左右滑動移動 · 點一下旋轉 · 快速下滑落底 · 快速上滑暫存', 'On the board: drag to move · tap to rotate · flick down to drop · flick up to hold')
        : T('按 Enter 或點下方按鈕開始', 'Press Enter or click the button to start');
      b.textContent = T('開始遊戲', 'Start');
    } else if (ovKind === 'paused') {
      t.textContent = T('已暫停', 'Paused');
      p.textContent = T('按 P 或點下方按鈕繼續', 'Press P or click the button to resume');
      b.textContent = T('繼續', 'Resume');
    } else {
      t.textContent = T('遊戲結束', 'Game over');
      s.hidden = false; s.textContent = score.toLocaleString('en-US');
      const rec = score >= best && score > 0;
      p.textContent = T('消除 ' + lines + ' 行 · 等級 ' + level + (rec ? ' · 新紀錄' : ''),
        lines + (lines === 1 ? ' line' : ' lines') + ' · Level ' + level + (rec ? ' · New best' : ''));
      b.textContent = T('再來一局', 'Play again');
    }
  }
  function showOverlay(kind) {
    ovKind = kind;
    renderOverlay();
    $('overlay').hidden = false;
  }
  function endGame(endedOnInput) {
    state = 'over';
    const {score, lines, level} = model;
    if (score > best) {
      best = score;
      try { localStorage.setItem('tetris-best', String(best)); } catch (e) {}
    }
    updateStats();
    showOverlay('over');
    const h = host();
    if (h && roundOn) { roundOn = false; h.finish(window, { score, lines, level, endedOnInput }); }
  }
  function pause() {
    if (state !== 'play') return;
    releaseAll();
    state = 'paused';
    showOverlay('paused');
    const h = host(); if (h && roundOn && h.pause) h.pause(window);
  }
  function resume() {
    if (state !== 'paused') return;
    state = 'play';
    last = performance.now();
    $('overlay').hidden = true;
    const h = host(); if (h && roundOn && h.resume) h.resume(window);
  }

  function input(code) {
    if (code < 0 || !model.input(code)) return;
    const h = host();
    if (h && roundOn && h.record) h.record(window, code);
    if (model.dead) endGame(true);
  }
  function press(action) {
    const h = host(); if (h && roundOn && h.touch) h.touch(window);
    if (state === 'paused') { if (action === 'pause') resume(); return; }
    if (state !== 'play') return;
    if (action === 'pause') pause();
    else input(rules.pressCode(action));
  }
  function release(action) {
    if (state === 'play') input(rules.releaseCode(action));
  }
  function releaseAll() { release('left'); release('right'); release('down'); }

  const KEYS = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', ArrowUp: 'cw',
    KeyX: 'cw', KeyZ: 'ccw', Space: 'hard', KeyC: 'hold', ShiftLeft: 'hold', ShiftRight: 'hold',
    KeyP: 'pause', Escape: 'pause'
  };
  document.addEventListener('keydown', e => {
    if (e.code === 'Enter') {
      e.preventDefault();
      if (state === 'ready' || state === 'over') start(); else if (state === 'paused') resume();
      return;
    }
    const a = KEYS[e.code];
    if (!a) return;
    e.preventDefault();
    if (e.repeat) return;
    press(a);
  });
  document.addEventListener('keyup', e => { const a = KEYS[e.code]; if (a) release(a); });
  window.addEventListener('blur', () => { releaseAll(); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  document.querySelectorAll('.touch button').forEach(btn => {
    const a = btn.dataset.act;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); press(a); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, () => release(a)));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });
  $('ovBtn').addEventListener('click', () => {
    if (state === 'paused') resume(); else start();
  });

  // ---------- touch: gestures on the board (default) or the six buttons ----------
  function touchUI() { try { return !!(window.matchMedia && window.matchMedia('(max-width: 639px), (pointer: coarse)').matches); } catch (e) { return false; } }
  let ctl = 'gesture';
  try { const v = localStorage.getItem('tetris-ctl'); if (v === 'buttons' || v === 'gesture') ctl = v; } catch (e) {}
  function setCtl(v, save) {
    ctl = v;
    if (save) { try { localStorage.setItem('tetris-ctl', v); } catch (e) {} }
    document.body.classList.toggle('btnmode', v === 'buttons');
    $('modeBtn').textContent = v === 'buttons' ? T('改用手勢', 'Use gestures') : T('改用按鈕', 'Use buttons');
    if (state === 'ready') renderOverlay();
  }
  $('modeBtn').addEventListener('click', () => { releaseAll(); setCtl(ctl === 'gesture' ? 'buttons' : 'gesture', true); });
  $('pauseBtn').addEventListener('click', () => { if (state === 'play') pause(); });

  const G = { id: null, x: 0, y: 0, ax: 0, ay: 0, t: 0, moved: false };
  const gestureOn = () => ctl === 'gesture' && state === 'play' && !!model.cur && !model.clearRows;
  let softOn = false;
  const softSet = on => { if (on === softOn) return; softOn = on; if (on) press('down'); else release('down'); };
  const step1 = a => { press(a); release(a); };
  const cellPx = () => { const r = $('board').getBoundingClientRect(); return (r && r.width ? r.width : COLS * CELL) / COLS; };
  const board$ = $('board');
  board$.addEventListener('pointerdown', e => {
    if (!gestureOn() || G.id !== null) return;
    e.preventDefault();
    G.id = e.pointerId; G.x = G.ax = e.clientX; G.y = G.ay = e.clientY; G.t = performance.now(); G.moved = false;
    try { board$.setPointerCapture(e.pointerId); } catch (err) {}
    const h = host(); if (h && roundOn && h.touch) h.touch(window);
  });
  board$.addEventListener('pointermove', e => {
    if (e.pointerId !== G.id) return;
    if (!gestureOn()) { G.id = null; softSet(false); return; }
    e.preventDefault();
    const c = cellPx(), step = c * 0.85;
    if (Math.hypot(e.clientX - G.x, e.clientY - G.y) > 12) G.moved = true;
    while (e.clientX - G.ax >= step) { G.ax += step; step1('right'); }
    while (G.ax - e.clientX >= step) { G.ax -= step; step1('left'); }
    // holding the finger lower than where it started = soft drop (the model speeds up while 'down' is held)
    const dy = e.clientY - G.y, dx = e.clientX - G.x;
    softSet(dy > step * 1.2 && dy > Math.abs(dx));
  });
  const endGesture = e => {
    if (e.pointerId !== G.id) return;
    const dt = performance.now() - G.t, dx = e.clientX - G.x, dy = e.clientY - G.y, c = cellPx();
    const moved = G.moved; G.id = null; softSet(false);
    if (e.type === 'pointercancel' || !gestureOn()) return;
    if (!moved && dt < 350) press('cw');
    else if (dy < -c * 2.2 && Math.abs(dy) > Math.abs(dx) * 1.5 && dt < 450) press('hold');
    else if (dy > c * 2.5 && dy > Math.abs(dx) * 1.5 && dt < 260) press('hard');
  };
  board$.addEventListener('pointerup', endGesture);
  board$.addEventListener('pointercancel', endGesture);
  board$.addEventListener('contextmenu', e => e.preventDefault());
  $('hold').addEventListener('pointerdown', e => { if (ctl === 'gesture' && touchUI() && state === 'play') { e.preventDefault(); press('hold'); } });

  // ---------- drawing ----------
  function cell(ctx, x, y, s, color, alpha) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x + .5, y + .5, s - 1, s - 1);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(x + .5, y + .5, s - 1, 3);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(x + .5, y + s - 3.5, s - 1, 3);
    ctx.globalAlpha = 1;
  }
  function drawMini(ctx, type, x0, y0, w, h, alpha) {
    const m = SHAPES[type];
    let r0 = 9, r1 = -1, c0 = 9, c1 = -1;
    m.forEach((row, r) => row.forEach((v, c) => {
      if (v) { r0 = Math.min(r0, r); r1 = Math.max(r1, r); c0 = Math.min(c0, c); c1 = Math.max(c1, c); }
    }));
    const ox = x0 + (w - (c1 - c0 + 1) * MINI) / 2, oy = y0 + (h - (r1 - r0 + 1) * MINI) / 2;
    m.forEach((row, r) => row.forEach((v, c) => {
      if (v) cell(ctx, ox + (c - c0) * MINI, oy + (r - r0) * MINI, MINI, COLORS[type], alpha);
    }));
  }
  function drawPreview() {
    const {holdType, canHold, queue} = model;
    hx.clearRect(0, 0, 96, 62);
    if (holdType) drawMini(hx, holdType, 0, 0, 96, 62, canHold ? 1 : .35);
    nx.clearRect(0, 0, 96, 186);
    for (let i = 0; i < 3 && i < queue.length; i++) drawMini(nx, queue[i], 0, i * 62, 96, 62, 1);
  }

  function render() {
    const {board, cur, clearRows, clearT, collide} = model;
    const W = COLS * CELL, H = ROWS * CELL;
    bx.fillStyle = C.board;
    bx.fillRect(0, 0, W, H);
    bx.strokeStyle = C.line;
    bx.lineWidth = 1;
    bx.beginPath();
    for (let x = 1; x < COLS; x++) { bx.moveTo(x * CELL + .5, 0); bx.lineTo(x * CELL + .5, H); }
    for (let y = 1; y < ROWS; y++) { bx.moveTo(0, y * CELL + .5); bx.lineTo(W, y * CELL + .5); }
    bx.stroke();

    const b = state === 'ready' ? demo : board;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (b[y][x]) cell(bx, x * CELL, y * CELL, CELL, COLORS[b[y][x]]);
    }

    if (cur && state !== 'ready') {
      let gy = cur.y;
      while (!collide(cur.m, cur.x, gy + 1)) gy++;
      if (gy > cur.y) {
        bx.strokeStyle = COLORS[cur.type];
        bx.globalAlpha = .55;
        bx.lineWidth = 2;
        for (let r = 0; r < cur.m.length; r++) for (let c = 0; c < cur.m.length; c++) {
          if (cur.m[r][c] && gy + r >= 0) bx.strokeRect((cur.x + c) * CELL + 3, (gy + r) * CELL + 3, CELL - 6, CELL - 6);
        }
        bx.globalAlpha = 1;
      }
      for (let r = 0; r < cur.m.length; r++) for (let c = 0; c < cur.m.length; c++) {
        if (cur.m[r][c] && cur.y + r >= 0) cell(bx, (cur.x + c) * CELL, (cur.y + r) * CELL, CELL, COLORS[cur.type]);
      }
    }

    if (clearRows) {
      const a = Math.min(1, clearT / CLEAR_MS);
      bx.fillStyle = 'rgba(255,255,255,' + (0.9 - 0.6 * a).toFixed(2) + ')';
      clearRows.forEach(y => bx.fillRect(0, y * CELL, W, CELL));
    }
  }

  function updateStats() {
    const {score, level, lines} = model;
    $('score').textContent = score.toLocaleString('en-US');
    $('level').textContent = level;
    $('lines').textContent = lines;
    $('best').textContent = Math.max(best, score).toLocaleString('en-US');
  }
  function showBanner(text) {
    const el = $('banner');
    el.textContent = text;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }

  if (window.__TETRIS_TEST__) window.__tetris = () => ({ x: model.cur && model.cur.x, y: model.cur && model.cur.y, rot: model.cur && model.cur.rot, type: model.cur && model.cur.type, hold: model.holdType, score: model.score, ctl });
  window.startTetrisPlatformRound = start;
  window.setTetrisPlatformActive = v => { platformVisible = !!v; last = performance.now(); if (!platformVisible) pause(); };
  try { window.parent.addEventListener('arcade-languagechange', applyLang); } catch (e) {}

  // ---------- boot ----------
  ctlReady = true;
  applyLang();
  model.fillQueue();
  drawPreview();
  updateStats();
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(100, Math.max(0, t - last));
    last = t;
    if (!platformVisible) { requestAnimationFrame(frame); return; }
    if (state === 'play') {
      const advance = ms => {
        model.advance(ms);
        if (model.dead) endGame(false);
      };
      const h = host();
      if (h && roundOn && h.advance) h.advance(window, dt, () => state === 'play', advance);
      else advance(dt);
    }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
(() => {
  let rules;
  try { rules = window.parent !== window && window.parent.deepSeaTetris?.rules; } catch (_) {}
  if (rules) { runBlockDrop(rules); return; }
  const script = document.createElement('script');
  script.src = '../../shared/block-drop-rules.js';
  script.onload = () => runBlockDrop(blockDropRules);
  document.head.appendChild(script);
})();
</script>
