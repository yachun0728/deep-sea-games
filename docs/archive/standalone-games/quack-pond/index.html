<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quack Pond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1f3b4d; --paper:#fffaf0; --duck:#ffd93b; --orange:#ff9f1c; --bad:#e5484d;
    --water:#8fd3e8; --water2:#cdeef7; --wood1:#d9a066; --wood2:#a9703a; --leaf:#6dbf73;
    --font:"Chiron GoRound TC","Fredoka","Hiragino Maru Gothic ProN","jf-openhuninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--navy);font-weight:600}
  body{
    background:
      radial-gradient(circle at 12% 18%, #ffffff55 0 38px, transparent 39px),
      radial-gradient(circle at 12% 18%, transparent 0 52px, #ffffff44 53px 55px, transparent 56px),
      radial-gradient(circle at 88% 70%, #ffffff55 0 50px, transparent 51px),
      radial-gradient(circle at 88% 70%, transparent 0 68px, #ffffff44 69px 71px, transparent 72px),
      radial-gradient(circle at 30% 92%, #ffffff44 0 30px, transparent 31px),
      linear-gradient(180deg,var(--water2),var(--water));
    background-attachment:fixed;
  }
  #app{max-width:560px;margin:0 auto;padding:14px 12px 28px;display:flex;flex-direction:column;align-items:center;gap:12px}

  /* —— 通用元件 —— */
  .card{background:var(--paper);border:3px solid var(--navy);border-radius:22px;box-shadow:0 6px 0 var(--navy)}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--navy);border-radius:999px;
    padding:3px 14px;font-size:15px;font-weight:800;box-shadow:0 3px 0 var(--navy);font-variant-numeric:tabular-nums}
  .pill.tag1{background:#c9f0c4}.pill.tag2{background:#ffe9a3}.pill.tag3{background:#ffc4b8}
  .btn{font:inherit;font-weight:800;font-size:15px;color:var(--navy);background:var(--paper);border:3px solid var(--navy);
    border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 var(--navy);cursor:pointer;transition:transform .06s,box-shadow .06s;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--navy)}
  .btn.yellow{background:var(--duck)} .btn.orange{background:var(--orange);color:#fff;text-shadow:0 2px 0 #0003}
  .btn.blue{background:#a9e0f2} .btn.off{opacity:.45;pointer-events:none}
  .btn svg{width:18px;height:18px}

  /* —— 標題列 —— */
  header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo svg{width:44px;height:44px;filter:drop-shadow(0 3px 0 #1f3b4d55)}
  h1{font-size:26px;margin:0;font-weight:800;letter-spacing:1px;line-height:1}
  h1 small{display:block;font-family:"Fredoka",var(--font);font-size:12px;font-weight:700;opacity:.6;letter-spacing:2px;margin-top:3px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

  .hud{width:100%;display:flex;align-items:center;justify-content:space-between}
  .hearts{display:flex;gap:4px}
  .heart{width:34px;height:34px;filter:drop-shadow(0 3px 0 #1f3b4d66)}
  .heart.full use{fill:var(--bad)} .heart.empty use{fill:#d9d2c3}
  .heart.lose{animation:lose .5s}
  @keyframes lose{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-12deg)}100%{transform:scale(1)}}
  .rule{font-size:13.5px;line-height:1.55;text-align:center;padding:8px 14px;width:100%}

  /* —— 棋盤 —— */
  .frame{width:min(94vw,520px);padding:11px;border:3px solid var(--navy);border-radius:26px;box-shadow:0 7px 0 var(--navy);
    background:repeating-linear-gradient(90deg,var(--wood1) 0 22px,#cf9559 22px 24px);position:relative}
  .frame::before,.frame::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--wood2);border:2px solid var(--navy)}
  .frame::before{left:7px;top:7px}.frame::after{right:7px;top:7px}
  #board{width:100%;aspect-ratio:1;display:grid;border:3px solid var(--navy);border-radius:12px;overflow:hidden;background:#fff;touch-action:manipulation}
  #board.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:filter .1s}
  .cell:active{filter:brightness(.9)}
  .cell svg{width:80%;height:80%;pointer-events:none}
  .cell svg.xm{width:46%;height:46%;opacity:.75}
  .cell.auto svg.xm{opacity:.22}
  .cell.wrong{background-image:repeating-linear-gradient(45deg,#e5484d44 0 6px,transparent 6px 12px)}
  .cell.wrong svg.xm{opacity:1}
  .pop{animation:pop .22s ease-out}
  @keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.18)}100%{transform:scale(1)}}

  .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .footer-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2px}

  /* —— 彈窗 —— */
  .overlay{position:fixed;inset:0;background:#10283666;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
  .overlay.show{display:flex}
  .modal{max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:22px 20px 20px;text-align:center;animation:pop .28s}
  .modal h2{margin:4px 0 8px;font-size:24px;font-weight:800}
  .modal p{margin:8px 0;line-height:1.65;font-size:15px}
  .modal .big{width:96px;height:96px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
  .stars svg{width:42px;height:42px;filter:drop-shadow(0 3px 0 #1f3b4d66)}
  .stars .on use{fill:var(--duck);stroke:var(--navy);stroke-width:5} .stars .off use{fill:#e3dccb;stroke:#b9b09b;stroke-width:5}

  /* —— 選關 —— */
  .lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
  .lvhead{grid-column:1/-1;text-align:left;font-weight:800;font-size:14px;margin-top:8px;padding-left:2px}
  .lvbtn{font:inherit;font-weight:800;font-size:15px;aspect-ratio:1;border:3px solid var(--navy);border-radius:14px;background:#fff;color:var(--navy);
    box-shadow:0 3px 0 var(--navy);cursor:pointer;position:relative;padding:0}
  .lvbtn:active{transform:translateY(3px);box-shadow:none}
  .lvbtn.done{background:#c9f0c4} .lvbtn.cur{background:var(--duck)}
  .lvbtn.lock{background:#d9d2c3;color:#8e8671;box-shadow:none;cursor:not-allowed}
  .lvbtn i{position:absolute;bottom:1px;left:0;right:0;font-style:normal;font-size:9px;letter-spacing:-1px;color:#d28b00}

  /* —— 教學 —— */
  .mini{display:inline-grid;border:3px solid var(--navy);border-radius:8px;overflow:hidden;background:#fff}
  .mini .mc{width:34px;height:34px;display:flex;align-items:center;justify-content:center;position:relative}
  .mini .mc svg{width:78%;height:78%}
  .mini .mc svg.xm{width:46%;height:46%;opacity:.8}
  .mini .mc.hl::after{content:"";position:absolute;inset:2px;border:3px dashed var(--bad);border-radius:6px}
  .mini .mc.badc{background-image:repeating-linear-gradient(45deg,#e5484d55 0 5px,transparent 5px 10px)}
  .minis{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .minis figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;max-width:130px;line-height:1.4}
  .minis figure.good figcaption{color:#1d7a35} .minis figure.bad figcaption{color:var(--bad)}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:12px}
  .dots b{width:11px;height:11px;border-radius:50%;background:#d9d2c3;border:2px solid var(--navy)}
  .dots b.on{background:var(--duck)}
  .tut-body{text-align:left}
  .tut-body h3{font-size:19px;margin:2px 0 6px;text-align:center}
  .tut-body ol,.tut-body ul{padding-left:22px;margin:8px 0;line-height:1.7;font-size:15px}
  .tut-body .center{text-align:center}
  .kbd{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;width:26px;height:26px;border:2px solid var(--navy);border-radius:7px;background:#fff;margin:0 2px}
  .kbd svg{width:16px;height:16px}
  .note{background:#fff3c4;border:2px dashed var(--navy);border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.55;margin-top:10px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="duck" viewBox="0 0 100 100">
      <ellipse cx="50" cy="89" rx="30" ry="5" fill="#0000001f"/>
      <path d="M18 62c0-16 12-24 26-24 6 0 10 2 14 6 4-8 8-10 8-10l-2 14c6 4 12 10 12 14 0 12-12 22-30 22S18 74 18 62z" fill="#ffd93b" stroke="#1f3b4d" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="62" cy="30" r="18" fill="#ffd93b" stroke="#1f3b4d" stroke-width="4"/>
      <path d="M76 30c8-1 14 2 14 5s-6 5-14 5z" fill="#ff8a1f" stroke="#1f3b4d" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="64" cy="26" r="3.4" fill="#1f3b4d"/><circle cx="65.2" cy="24.8" r="1.1" fill="#fff"/>
      <path d="M30 62c6 8 20 8 26-2" fill="none" stroke="#1f3b4d" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 32 32"><path d="M16 28S3 19.5 3 11.2C3 7 6.2 4.5 9.6 4.5c2.6 0 4.8 1.5 6.4 3.9 1.6-2.4 3.8-3.9 6.4-3.9C25.8 4.5 29 7 29 11.2 29 19.5 16 28 16 28z" stroke="#1f3b4d" stroke-width="2.6" stroke-linejoin="round"/></symbol>
    <symbol id="xmark" viewBox="0 0 20 20"><path d="M4 4L16 16M16 4L4 16" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></symbol>
    <symbol id="star" viewBox="0 0 50 50"><path d="M25 4l6.2 13.2 14.3 1.8-10.5 9.9 2.7 14.2L25 35.9 12.3 43.1 15 28.9 4.5 19l14.3-1.8z" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 100 100"><use href="#duck"/></svg>
      <h1><span id="ttl"></span><small id="sub"></small></h1>
    </div>
    <div class="stats"><span class="pill" id="time">0:00</span></div>
  </header>

  <div class="hud">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill" id="lv">第 1 關</span>
      <span class="pill" id="tag">輕鬆</span>
    </div>
    <div class="hearts" id="hearts"></div>
  </div>

  <div class="frame"><div id="board"></div></div>

  <div class="bar">
    <button class="btn" id="undo"></button>
    <button class="btn yellow" id="hint"></button>
    <button class="btn" id="reset"></button>
  </div>
  <div class="footer-bar">
    <button class="btn blue" id="tutBtn"></button>
    <button class="btn blue" id="menuBtn"></button>
    <button class="btn" id="mute">🔊</button>
    <button class="btn" id="langBtn">🌐</button>
  </div>
</div>

<!-- 過關 -->
<div class="overlay" id="win"><div class="card modal">
  <svg class="big" viewBox="0 0 100 100"><use href="#duck"/></svg>
  <h2 id="winTitle"></h2>
  <div class="stars" id="winStars"></div>
  <p id="winInfo"></p>
  <div class="row"><button class="btn" id="winMenu"></button><button class="btn orange" id="next"></button></div>
</div></div>

<!-- 失敗 -->
<div class="overlay" id="over"><div class="card modal">
  <svg class="big" viewBox="0 0 100 100" style="opacity:.55;filter:grayscale(.6)"><use href="#duck"/></svg>
  <h2 id="overTitle"></h2>
  <p id="overText"></p>
  <div class="row"><button class="btn" id="overMenu"></button><button class="btn orange" id="retry"></button></div>
</div></div>

<!-- 選關 -->
<div class="overlay" id="menu"><div class="card modal">
  <h2 id="menuTitle"></h2>
  <p id="menuSub" style="font-size:13px;opacity:.75;margin:0"></p>
  <div class="lvgrid" id="lvgrid"></div>
  <div class="row"><button class="btn" id="menuClose"></button></div>
</div></div>

<!-- 教學 -->
<div class="overlay" id="tut"><div class="card modal">
  <div class="tut-body" id="tutBody"></div>
  <div class="dots" id="tutDots"></div>
  <div class="row">
    <button class="btn" id="tutPrev"></button>
    <button class="btn orange" id="tutNext"></button>
  </div>
</div></div>

  try{const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type='square';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(90,t+.25);
    g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.3);}catch(e){}
}

// ---------- 共用：格子樣式 ----------
const LINE='3px solid #1f3b4d',THIN='1px solid #ffffff99';
function cellStyle(reg,N,r,c){
  const g=reg[r][c];
  const bd=(dr,dc)=>{const a=r+dr,b=c+dc;return(a<0||b<0||a>=N||b>=N)?'0':(reg[a][b]!==g?LINE:THIN)};
  return 'background-color:'+PALETTE[g%PALETTE.length]+';border-top:'+bd(-1,0)+';border-bottom:'+bd(1,0)+';border-left:'+bd(0,-1)+';border-right:'+bd(0,1);
}
const DUCK='<svg viewBox="0 0 100 100"><use href="#duck"/></svg>';
const XM='<svg class="xm" viewBox="0 0 20 20" style="color:#1f3b4d"><use href="#xmark"/></svg>';
const XM_RED='<svg class="xm" viewBox="0 0 20 20" style="color:#e5484d"><use href="#xmark"/></svg>';

// ---------- 開始關卡 ----------
function startLevel(lv){
  level=Math.min(Math.max(1,lv),TOTAL);
  L=parseLevel(level);
  marks=Array.from({length:L.N},()=>new Array(L.N).fill(0));
  wrong=new Set();hearts=3;hints=3;hist=[];state='play';
  closeAll();
  save('qp_level',level);
  applyLang();$('hint').classList.remove('off');
  t0=Date.now();clearInterval(timerId);
  timerId=setInterval(()=>{if(state==='play')$('time').textContent=fmt(Date.now()-t0)},500);
  $('time').textContent='0:00';
  renderHearts();render();
}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function renderHearts(lostIdx=-1){
  let h='';
  for(let i=0;i<3;i++)h+='<svg class="heart '+(i<hearts?'full':'empty')+(i===lostIdx?' lose':'')+'" viewBox="0 0 32 32"><use href="#heart"/></svg>';
  $('hearts').innerHTML=h;
}

function render(popCell){
  const N=L.N,B=$('board');
  B.style.gridTemplateColumns='repeat('+N+',1fr)';
  B.style.gridTemplateRows='repeat('+N+',1fr)';
  let html='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const m=marks[r][c];
    const cls='cell'+(m===3?' auto':'')+(m===4?' wrong':'');
    let inner='';
    if(m===1||m===3)inner=XM;else if(m===4)inner=XM_RED;else if(m===2)inner=DUCK;
    html+='<div class="'+cls+'" data-r="'+r+'" data-c="'+c+'" style="'+cellStyle(L.reg,N,r,c)+'">'+inner+'</div>';
  }
  B.innerHTML=html;
  if(popCell){
    const el=B.querySelector('.cell[data-r="'+popCell[0]+'"][data-c="'+popCell[1]+'"] svg');
    if(el)el.classList.add('pop');
  }
}

function autoX(r,c){
  const N=L.N,g=L.reg[r][c];
  for(let a=0;a<N;a++)for(let b=0;b<N;b++){
    if(marks[a][b]!==0&&marks[a][b]!==1)continue;
    if(a===r||b===c||L.reg[a][b]===g||(Math.abs(a-r)<=1&&Math.abs(b-c)<=1))marks[a][b]=3;
  }
}
function snap(){hist.push(marks.map(r=>r.slice()));if(hist.length>200)hist.shift()}
function duckCount(){let n=0;for(const row of marks)for(const v of row)if(v===2)n++;return n}

function placeDuck(r,c){
  snap();marks[r][c]=2;autoX(r,c);
  quack(1);render([r,c]);
  if(duckCount()===L.N)win();
}

function loseHeart(r,c){
  marks[r][c]=4;wrong.add(r+','+c);
  hearts--;buzz();
  render();renderHearts(hearts);
  const B=$('board');B.classList.remove('shake');void B.offsetWidth;B.classList.add('shake');
  if(hearts<=0){state='over';setTimeout(()=>show('over'),500)}
}

$('board').addEventListener('click',e=>{
  const el=e.target.closest('.cell');if(!el||state!=='play')return;
  const r=+el.dataset.r,c=+el.dataset.c,v=marks[r][c];
  if(v===0){snap();marks[r][c]=1;tick();render()}
  else if(v===1){
    if(L.sol[r]===c)placeDuck(r,c);else loseHeart(r,c);
  }
});

$('undo').onclick=()=>{
  if(state!=='play'||!hist.length)return;
  marks=hist.pop();
  for(const k of wrong){const[r,c]=k.split(',').map(Number);marks[r][c]=4}
  render();
};
$('reset').onclick=()=>{
  if(state!=='play')return;
  marks=Array.from({length:L.N},()=>new Array(L.N).fill(0));
  for(const k of wrong){const[r,c]=k.split(',').map(Number);marks[r][c]=4}
  hist=[];render();
};
$('hint').onclick=()=>{
  if(state!=='play'||hints<=0)return;
  const miss=[];
  for(let r=0;r<L.N;r++)if(marks[r][L.sol[r]]!==2)miss.push(r);
  if(!miss.length)return;
  const r=miss[Math.floor(Math.random()*miss.length)];
  hints--;$('hintN').textContent=hints;if(hints<=0)$('hint').classList.add('off');
  placeDuck(r,L.sol[r]);
};
$('langBtn').onclick=()=>{lang=lang==='en'?'zh':'en';save('qp_lang',lang);applyLang()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';save('qp_muted',muted)};

// ---------- 彈窗 ----------
function show(id){$(id).classList.add('show')}
function closeAll(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'))}

function win(){
  state='won';
  const ms=Date.now()-t0,stars=hearts;
  const old=progress.stars[level]||0;
  if(stars>old)progress.stars[level]=stars;
  progress.max=Math.max(progress.max,Math.min(level+1,TOTAL));
  save('qp_progress',progress);
  let s='';for(let i=0;i<3;i++)s+='<svg class="'+(i<stars?'on':'off')+'" viewBox="0 0 50 50"><use href="#star"/></svg>';
  $('winStars').innerHTML=s;
  $('winInfo').textContent=t('time')(fmt(ms))+(level>=TOTAL?t('allClear'):'');
  $('next').style.display=level>=TOTAL?'none':'';
  quack(3);
  setTimeout(()=>show('win'),400);
}
$('next').onclick=()=>startLevel(level+1);
$('winMenu').onclick=()=>{closeAll();openMenu()};
$('retry').onclick=()=>startLevel(level);
$('overMenu').onclick=()=>{closeAll();openMenu()};

// ---------- 選關 ----------
function openMenu(keep){
  let html='',lastN=0;
  for(let i=1;i<=TOTAL;i++){
    const n=+LEVELS[i-1].split('|')[0];
    if(n!==lastN){html+='<div class="lvhead">'+t('pond')(n)+'</div>';lastN=n}
    const locked=i>progress.max,st=progress.stars[i]||0;
    const cls='lvbtn'+(locked?' lock':'')+(st?' done':'')+(i===level?' cur':'');
    html+='<button class="'+cls+'" data-lv="'+i+'">'+(locked?'🔒':i)+(st?'<i>'+'★'.repeat(st)+'</i>':'')+'</button>';
  }
  $('lvgrid').innerHTML=html;
  show('menu');
  if(!keep){const cur=$('lvgrid').querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'});}
}
$('lvgrid').addEventListener('click',e=>{
  const b=e.target.closest('.lvbtn');if(!b||b.classList.contains('lock'))return;
  startLevel(+b.dataset.lv);
});
$('menuBtn').onclick=openMenu;
$('menuClose').onclick=closeAll;

// ---------- 教學 ----------
const REG4=[[0,0,1,1],[0,0,1,1],[2,3,3,1],[2,2,3,3]];   // 示範盤面（解：(0,1)(1,3)(2,0)(3,2)）
const REG_T1=[[0,0,0,1],[0,2,2,1],[3,3,2,1],[3,3,3,1]];
const REG_T2=[[0,0,0,0],[1,1,2,2],[3,3,2,2],[3,3,2,2]];

// marks 字串：'.' 空 'x' ✕ 'd' 鴨 'D' 錯誤的鴨(紅底)；hl：要圈起來的格子
function mini(reg,rows,hl=[]){
  const N=reg.length;let h='<div class="mini" style="grid-template-columns:repeat('+N+',auto)">';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const ch=rows[r][c],isH=hl.some(p=>p[0]===r&&p[1]===c);
    h+='<div class="mc'+(isH?' hl':'')+(ch==='D'?' badc':'')+'" style="'+cellStyle(reg,N,r,c)+'">'+
      (ch==='x'?XM:(ch==='d'||ch==='D')?DUCK:'')+'</div>';
  }
  return h+'</div>';
}
function fig(board,cap,cls=''){return '<figure class="'+cls+'">'+board+'<figcaption>'+cap+'</figcaption></figure>'}
function autoRows(reg,r0,c0){
  const N=reg.length,rows=[];
  for(let r=0;r<N;r++){let s='';for(let c=0;c<N;c++){
    if(r===r0&&c===c0)s+='d';
    else s+=(r===r0||c===c0||reg[r][c]===reg[r0][c0]||(Math.abs(r-r0)<=1&&Math.abs(c-c0)<=1))?'x':'.';
  }rows.push(s)}
  return rows;
}

let tutPage=0;
