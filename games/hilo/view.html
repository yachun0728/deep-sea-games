  <section class="view" id="view-hilo" hidden>
    <div class="console">
      <div class="dice-stage" id="hl-stage">
        <div class="hl-table"><div class="card idle" id="hl-card"></div></div>
        <div class="dc-read"><div class="sub-line" id="hl-sub">{{t:hilo.view.01}}</div></div>
        <div class="hl-trail" id="hl-trail" aria-label="{{t:hilo.view.16}}"></div>
      </div>
      <div class="side">
        <section class="panel" aria-label="{{t:hilo.view.17}}">
          <div class="field">
            <label for="hl-amount">{{t:hilo.view.02}}</label>
            <div class="input-row">
              <input id="hl-amount" type="number" inputmode="numeric" min="10" step="10" value="100">
              <button class="chip hchip" type="button" data-hchip="half">½</button>
              <button class="chip hchip" type="button" data-hchip="double">2×</button>
              <button class="chip hchip" type="button" data-hchip="max">{{t:hilo.view.03}}</button>
            </div>
          </div>
          <div class="hl-guess">
            <button class="chip guess hi" type="button" id="hl-hi" disabled>{{t:hilo.view.04}}<small>—</small></button>
            <button class="chip guess lo" type="button" id="hl-lo" disabled>{{t:hilo.view.05}}<small>—</small></button>
          </div>
          <button class="chip skip" type="button" id="hl-skip" disabled>{{t:hilo.view.06}}</button>
          <dl class="stats">
            <div><dt>{{t:hilo.view.07}}</dt><dd id="hl-mult">—</dd></div>
            <div><dt>{{t:hilo.view.08}}</dt><dd id="hl-win">—</dd></div>
            <div><dt>{{t:hilo.view.09}}</dt><dd id="hl-picks">—</dd></div>
          </dl>
          <button class="go" id="hl-go" type="button" data-mode="bet">{{t:hilo.view.10}}</button>
          <p class="msg" id="hl-msg" aria-live="polite">{{t:hilo.view.11}}</p>
        </section>
      </div>
    </div>
    <details class="rules">
      <summary>{{t:hilo.view.12}}</summary>
      <p>{{t:hilo.view.13}}</p>
      <p>{{t:hilo.view.14}}</p>
      <p>{{t:hilo.view.15}}</p>
    </details>
  </section>
