<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b0a">
<title>泡麵煎餅翻面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#f5ead6}
body{position:fixed;inset:0}
#app{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:#0d0b0a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}

/* 文字風格：跟 landing 標題一樣，奶油白／金黃字＋醬汁色描邊 */
:root{--cream:#fbfaf3;--gold:#f8c23c;--sauce:#a8301a;--sauce-dk:#5a1a0c;--crust:#6e3f16;--crust-dk:#3a1d08}
.ol-sauce{text-shadow:0 2px 0 var(--sauce),2px 0 0 var(--sauce),-2px 0 0 var(--sauce),0 -2px 0 var(--sauce),2px 2px 0 var(--sauce),-2px 2px 0 var(--sauce),2px -2px 0 var(--sauce),-2px -2px 0 var(--sauce),0 5px 0 var(--sauce-dk)}
.ol-crust{text-shadow:0 2px 0 var(--crust),2px 0 0 var(--crust),-2px 0 0 var(--crust),0 -2px 0 var(--crust),2px 2px 0 var(--crust),-2px 2px 0 var(--crust),2px -2px 0 var(--crust),-2px -2px 0 var(--crust),0 5px 0 var(--crust-dk)}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 14px 0 14px;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
#hud-order{font-weight:900;font-size:18px;color:var(--cream);letter-spacing:1px}
#hud-lives{display:inline-flex;align-items:center;gap:1px;padding:2px 10px;margin-top:2px;background:rgba(40,18,6,.72);border:2px solid var(--crust);border-radius:999px}
#hud-lives:empty{display:none}
#hud-streak{color:var(--gold);font-weight:900;font-size:15px}
/* 音效按鈕：手繪風（奶油色底、墨線描邊、醬汁紅喇叭） */
#mute{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:40;width:48px;height:48px;padding:0;border:none;background:none;cursor:pointer}
#mute svg{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 0 #2a160a)}
#mute:active{transform:translateY(2px)}
#mute .waves{transition:opacity .15s}#mute .slash{opacity:0}
#mute.muted .waves{opacity:0}#mute.muted .slash{opacity:1}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100% - 150px);z-index:5;pointer-events:none;
  font-size:13px;font-weight:700;line-height:1.45;text-align:center;background:rgba(40,18,6,.82);border:2px solid var(--crust);border-radius:12px;padding:6px 12px;color:#f1e3c6}
#hint b{color:var(--gold)}
#hint:empty{display:none}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));text-align:center;
  background:linear-gradient(180deg,rgba(10,10,30,.78),rgba(14,8,4,.86));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:20;gap:14px}
.screen.show{display:flex}
.screen h2{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:1px;line-height:1.3}
.screen p{font-size:16px;line-height:1.6;color:#f1e3c6;font-weight:600}
.screen .small{font-size:13px;color:#cdbb98;font-weight:400}
.btn{appearance:none;border:none;border-radius:14px;padding:14px 22px;min-width:220px;font-size:18px;font-weight:900;cursor:pointer;
  background:#f2a52b;color:#2b1500;box-shadow:0 4px 0 #8a520c;font-family:inherit;letter-spacing:1px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a520c}
.btn.sec{background:var(--cream);color:var(--sauce);box-shadow:0 4px 0 #b9a77e}
.btn.sec:active{box-shadow:0 1px 0 #b9a77e}
.btn.ghost{background:transparent;color:#d9c7a6;box-shadow:none;font-size:15px;font-weight:600;text-decoration:underline;padding:6px}
.btn[disabled]{opacity:.4}
.btn.dim{opacity:.55}
.art-icon{width:96px;height:96px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}.art-icon:empty{display:none}
.pack-out{width:120px;height:auto;transform:rotate(-16deg);filter:saturate(.55) brightness(.75) drop-shadow(0 4px 0 rgba(0,0,0,.45))}
/* 載入畫面：一顆煎餅＋loading... */
#loading{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse 60% 40% at 50% 48%,rgba(255,130,40,.22),rgba(255,130,40,0) 70%),#0d0b0a;transition:opacity .4s}
#loading.done{opacity:0;pointer-events:none}
#loading img{width:min(56vw,220px);height:auto;animation:ldFlip 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.6))}
#loading p{font-size:22px;font-weight:900;color:var(--cream);letter-spacing:2px}
#loading p span{display:inline-block;animation:ldDot 1.2s infinite}
#loading p span:nth-child(2){animation-delay:.15s}#loading p span:nth-child(3){animation-delay:.3s}
@keyframes ldFlip{0%,100%{transform:perspective(500px) translateY(0) rotateX(0)}35%{transform:perspective(500px) translateY(-34px) rotateX(180deg)}60%{transform:perspective(500px) translateY(0) rotateX(360deg)}}
@keyframes ldDot{0%,100%{opacity:.25}50%{opacity:1}}.art-icon svg{width:100%;height:100%;display:block}
.pack{display:inline-block;width:30px;height:32px;margin:0 1px;vertical-align:middle;background:url("assets/noodle_pack.webp") center/contain no-repeat;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.pack.empty{opacity:.28;filter:grayscale(1)}
#calib-count{font-size:72px;font-weight:900;color:var(--gold);min-height:84px}
#s-title{gap:8px;justify-content:space-between;pointer-events:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:
  linear-gradient(180deg,rgba(8,10,30,.55) 0%,rgba(8,10,30,0) 26%,rgba(0,0,0,0) 72%,rgba(10,6,2,.82) 88%,rgba(10,6,2,.92) 100%)}
#s-title button{pointer-events:auto}
.t-top,.t-bot{display:flex;flex-direction:column;align-items:center;gap:6px}
.t-top{margin-top:calc(26px + env(safe-area-inset-top))}
.t-bot .small{color:#f1e3c6;text-shadow:0 1px 3px #000}
#t-logo{display:flex;flex-direction:column;align-items:center;line-height:1.05;transform:rotate(-3deg)}
#t-logo .l1{font-size:42px;font-weight:900;color:#fbfaf3;letter-spacing:3px;
  text-shadow:0 3px 0 #a8301a,3px 0 0 #a8301a,-3px 0 0 #a8301a,0 -3px 0 #a8301a,3px 3px 0 #a8301a,-3px 3px 0 #a8301a,0 8px 0 #5a1a0c}
#t-logo .l2{font-size:48px;font-weight:900;color:#f8c23c;letter-spacing:10px;margin-top:4px;transform:rotate(4deg);
  text-shadow:0 3px 0 #6e3f16,3px 0 0 #6e3f16,-3px 0 0 #6e3f16,0 -3px 0 #6e3f16,3px 3px 0 #6e3f16,-3px 3px 0 #6e3f16,0 8px 0 #3a1d08}
#t-sub{font-size:15px;color:#f1e3c6;margin-top:4px;text-shadow:0 1px 4px #000,0 0 10px #000}
/* 點數 */
.wallet-pill{pointer-events:none;font-size:14px;font-weight:700;color:#f1e3c6;background:rgba(40,18,6,.82);border:2px solid var(--crust);
  border-radius:999px;padding:5px 14px;line-height:1.4;text-align:center}
.wallet-pill b{color:var(--gold);font-size:17px;font-weight:900}
.wallet-pill .w-sub{font-size:11px;font-weight:400;color:#cdbb98}
.wallet-pill:empty{display:none}
.btn-sub{font-size:12px;font-weight:600;opacity:.85;letter-spacing:0}
#t-warn{font-size:12px;color:#bfae90!important}

#rotate{position:absolute;inset:0;z-index:60;background:#0d0b0aF2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:18px}
#rotate.show{display:flex}
#countdown{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;font-size:96px;font-weight:800;color:#ffd166;text-shadow:0 4px 0 #000;pointer-events:none}
#countdown.show{display:flex}

#toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:70;background:#000000d8;color:#fff;padding:12px 18px;border-radius:12px;
  font-size:15px;line-height:1.5;max-width:86%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

#s-ad{background:#8a8a8a;color:#222;-webkit-backdrop-filter:none;backdrop-filter:none}
#s-ad p{color:#222}
#ad-count{font-size:80px;font-weight:900;color:#333}

#s-result{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;gap:10px}
#rcv{width:100%;max-width:340px;height:200px;border-radius:14px;flex-shrink:0}
#r-rank{color:var(--cream);font-size:24px;font-weight:900}
#r-notes{font-size:14px;color:#f3b08a;line-height:1.6}
#r-stats{font-size:14px;color:#cbb994}
#s-result .btn{min-width:240px;padding:12px 20px;font-size:17px}

#debug{position:absolute;left:4px;top:110px;z-index:50;font:11px/1.35 ui-monospace,Menlo,monospace;background:#000000b0;color:#7fff9f;
  padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:auto}
#debug button{font:11px ui-monospace,monospace;margin-top:4px;padding:3px 6px;border-radius:4px;border:none;background:#2c6;color:#012}
</style>
</head>

<script>
'use strict';
/* =========================================================
   可調參數
   ========================================================= */
const CONFIG = {
  // 關卡
  level1Target: 3,            // 第 1 晚要煎幾片
  startLives: 3,
  maxLives: 5,
  perfectStreakReward: 3,

  // 熟度（秒）

  goldenUntil: 2.0,           // 1.2 ~ 2.0 秒：金黃
  burntAt: 2.8,               // 2.0 ~ 2.8 秒：有點焦；2.8 秒：黑炭

  // 黏鍋
  stickFillSeconds: 1.5,      // 不動多久會黏住

  // 晃
  maxTiltDeg: 30,
  tiltForce: 1.0,
  panAccel: 6,                // 傾斜到 maxTiltDeg 時的加速度（鍋子半徑/秒²）
  friction: 0.92,             // 每 1/60 秒保留的速度比例
  pauseTiltAroundShake: 0.3,  // 搖動前後暫停晃的物理（秒）

  // 搖
  shakeMinAccel: 12,          // 最低門檻（m/s²），低於這個不算搖
  weakRatio: 0.5,             // 低於標準力道的幾倍算太輕
  strongRatio: 1.8,           // 高於標準力道的幾倍算太大力
  shakeCooldown: 0.6,

  // 觸控備案
  touchJoystickPx: 90,        // 手指拖多遠 = 傾斜到 maxTiltDeg
  touchStandardSpeed: 1.5,    // 「標準」上滑速度（px/ms）
  touchMinFlickSpeed: 0.5,    // 低於這個上滑速度不算搖
  touchMinFlickDist: 30,      // 最少要往上滑多少 px

  // 媽媽開門
  level1MomEvent: true,
  momTriggerAt: 0.6,          // 第 3 片第一面煎到幾秒時觸發
  momGrace: 0.9,              // 出現大字後，給玩家反應的時間（秒）
  momStillSeconds: 1.5,
  momTiltTolerance: 4,        // 傾斜變化超過幾度算「動了」
  momAccelTolerance: 2.5,     // 加速度變化超過多少算「動了」

  // 其他
  sensorTimeout: 1.5,         // 幾秒收不到感應數據就顯示提示
  fakeAdSeconds: 5,

  // 點數（跟 deep-sea-games 大廳共用同一個餘額）
  entryFee: 0,               // 每局開火扣幾點（跟大廳免費遊玩一致）；設 0 = 不收
  buyNoodlesCost: 0,         // 用幾點換泡麵
  buyNoodlesAmount: 5,        // 換幾包
  adFreeMinutes: 30,          // 看完廣告後，幾分鐘內免費數（開局免費、泡麵免費補）
  freeRefillLives: 3,         // 免費時間內，泡麵用完可以免費補幾包
};
const TRACK_ENDPOINT = '';
const GAME_ID = 'noodle_pancake';
const EVENTS_KEY = 'noodle_pancake_events';
const CALIB_KEY = 'noodle_pancake_calib';
const DEBUG = new URLSearchParams(location.search).get('debug') === '1';

/* =========================================================
   小工具
   ========================================================= */
const $ = (id) => document.getElementById(id);
const now = () => performance.now() / 1000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function mixColor(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return [0, 1, 2].map(i => Math.round(lerp(A[i], B[i], clamp(t, 0, 1)))); }
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade = (c, k) => c.map(v => clamp(Math.round(v * k), 0, 255));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const UA = navigator.userAgent || '';
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);
const IS_MOBILE = IS_IOS || IS_ANDROID;
const IN_APP = /Line\/|FBAN|FBAV|FB_IAB|Instagram|Slack|MicroMessenger|KAKAOTALK|Twitter|; wv\)/i.test(UA);
const DEVICE = IS_IOS ? 'iOS' : IS_ANDROID ? 'Android' : 'other';

function toast(msg, sec = 2.4) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('show'), sec * 1000);
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
/* 平台橋接：嵌在 deep-sea-games 裡時，免費／追蹤交給大廳（window.parent.deepSeaPancake） */
function pancakeHost() { try { return window.parent !== window ? window.parent.deepSeaPancake || null : null; } catch (_) { return null; } }
const HOST = pancakeHost();
function cleanUrl() {
  if (HOST) { try { const l = window.parent.location; return l.origin + l.pathname + '#pancake'; } catch (_) {} }
  return location.origin + location.pathname;
}

/* =========================================================
   數據紀錄
   ========================================================= */
let inputMode = IS_MOBILE ? 'motion' : 'touch';
let isReturning = false;
const playerId = (() => {
  let id = lsGet('mini_player_id');
  isReturning = !!id;
  if (!id) { id = 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet('mini_player_id', id); }
  return id;
})();
function track(eventName, data = {}) {
  const rec = { ts: new Date().toISOString(), player_id: playerId, game_id: GAME_ID, input_mode: inputMode, event: eventName, data };
  console.log('[track]', eventName, data);
  try {
    const arr = JSON.parse(lsGet(EVENTS_KEY) || '[]');
    arr.push(rec); if (arr.length > 3000) arr.splice(0, arr.length - 3000);
    lsSet(EVENTS_KEY, JSON.stringify(arr));
  } catch (e) {}
  if (TRACK_ENDPOINT) {
    try {
      fetch(TRACK_ENDPOINT, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ player_id: playerId, game_id: GAME_ID, input_mode: inputMode, event: eventName, data })
      }).catch(() => {});
    } catch (e) {}
  }
}
/* =========================================================
   點數錢包：跟 deep-sea-games 共用 localStorage（同一個 github.io 網域才會共用）
   ========================================================= */
const Wallet = {
  STORE: 'crush-depth-balance', REGEN_KEY: 'deep-sea-regen-at', FREE_KEY: 'deep-sea-free-until',
  START: 500, REGEN_CAP: 100, REGEN_MS: 60000,
  bal: 500, regenAt: Date.now(), last: 500,
  load() {
    const v = parseInt(lsGet(this.STORE), 10); this.bal = isFinite(v) && v >= 0 ? v : this.START;
    const t = Number(lsGet(this.REGEN_KEY)); if (isFinite(t) && t > 0) this.regenAt = t;
    this.last = this.bal; this.tick(Date.now());
  },
  save() {
    if (this.last >= this.REGEN_CAP && this.bal < this.REGEN_CAP) this.regenAt = Date.now();
    this.last = this.bal;
    lsSet(this.STORE, String(this.bal)); lsSet(this.REGEN_KEY, String(this.regenAt));
  },
  // 低於 100 點時每分鐘回 1 點（跟大廳同一套規則，關掉頁面也會算）
  tick(now) {
    // 別的分頁可能改過餘額，先同步
    const v = parseInt(lsGet(this.STORE), 10); if (isFinite(v) && v >= 0 && v !== this.bal) { this.bal = v; this.last = v; }
    if (this.bal >= this.REGEN_CAP) { this.regenAt = now; return false; }
    if (now < this.regenAt) this.regenAt = now;
    const mins = Math.floor((now - this.regenAt) / this.REGEN_MS);
    if (mins < 1) return false;
    this.bal += Math.min(mins, this.REGEN_CAP - this.bal);
    this.regenAt = this.bal >= this.REGEN_CAP ? now : this.regenAt + mins * this.REGEN_MS;
    this.save(); return true;
  },
  spend(n) { if (this.bal < n) return false; this.bal -= n; this.save(); return true; },
  freeUntil() { const t = Number(lsGet(this.FREE_KEY)); return isFinite(t) ? t : 0; },
  freeLeftMs() { return Math.max(0, this.freeUntil() - Date.now()); },
  isFree() { return this.freeLeftMs() > 0; },
  grantFree(min) { lsSet(this.FREE_KEY, String(Date.now() + min * 60000)); },
  canStart() { return this.isFree() || this.bal >= CONFIG.entryFee; },
};
if (HOST) {
  // 嵌在大廳裡：餘額以大廳的 S.balance 為準，回點也由大廳負責
  Wallet.load = function () { this.bal = HOST.balance(); this.last = this.bal; };
  Wallet.tick = function () { this.bal = HOST.balance(); return false; };
  Wallet.save = function () {};
  Wallet.spend = function (n) { const ok = HOST.spend(window, n); this.bal = HOST.balance(); return ok; };
}
function fmtMs(ms) { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function walletText() { return '免費遊玩 · 泡麵補給免費'; }
function renderWallet() {
  const html = walletText();
  for (const id of ['t-wallet', 'revive-wallet', 'r-wallet', 'low-wallet']) { const el = $(id); if (el && el.innerHTML !== html) el.innerHTML = html; }
  if (appState === 'revive' && G) renderReviveButtons();
}

function eventCount() { try { return JSON.parse(lsGet(EVENTS_KEY) || '[]').length; } catch (e) { return 0; } }

/* =========================================================
   音效（Web Audio）
   ========================================================= */
const Snd = {
  ctx: null, master: null, muted: false, sizzleGain: null, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.55; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2; this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // 持續的滋滋聲
      const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
      const bp = this.ctx.createBiquadFilter(); bp.type = 'highpass'; bp.frequency.value = 2500;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
      this.sizzleGain = this.ctx.createGain(); this.sizzleGain.gain.value = 0;
      src.connect(bp); bp.connect(lp); lp.connect(this.sizzleGain); this.sizzleGain.connect(this.master); src.start();
      // iOS 解鎖
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(); g.gain.value = 0; o.connect(g); g.connect(this.master); o.start(); o.stop(this.ctx.currentTime + 0.05);
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ctx.currentTime, 0.02); },
  sizzle(level) {
    if (!this.ctx || !this.sizzleGain) return;
    // 隨機抖動，像油在跳
    const v = level > 0 ? level * (0.75 + Math.random() * 0.5) : 0;
    this.sizzleGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
  },
  tone(f, dur, o = {}) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    const v = o.vol == null ? 0.25 : o.vol, a = o.attack || 0.005;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = osc;
    if (o.lp) { const f1 = this.ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.frequency.value = o.lp; osc.connect(f1); node = f1; }
    node.connect(g); g.connect(this.master); osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noise(dur, o = {}) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t0); f.Q.value = o.q || 1;
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    const g = this.ctx.createGain(); const v = o.vol == null ? 0.4 : o.vol;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  click() { this.tone(900, 0.05, { type: 'square', vol: 0.08 }); },
  pour() { this.noise(0.35, { type: 'lowpass', freq: 900, f2: 300, vol: 0.5 }); this.tone(220, 0.2, { f2: 110, vol: 0.2 }); },
  golden() { this.tone(1320, 0.12, { vol: 0.08 }); },
  flip() { this.noise(0.28, { freq: 500, f2: 2500, q: 2, vol: 0.45 }); this.tone(420, 0.15, { f2: 840, type: 'triangle', vol: 0.15 }); this.noise(0.12, { type: 'lowpass', freq: 600, vol: 0.4, delay: 0.42 }); },
  hop() { this.tone(300, 0.12, { f2: 420, type: 'triangle', vol: 0.2 }); this.tone(380, 0.1, { f2: 260, type: 'triangle', vol: 0.15, delay: 0.12 }); },
  stuck() { this.tone(140, 0.12, { type: 'square', vol: 0.12, lp: 600 }); this.tone(120, 0.15, { type: 'square', vol: 0.12, lp: 600, delay: 0.13 }); },
  perfect() { [660, 880, 1100, 1320].forEach((f, i) => this.tone(f, 0.25, { vol: 0.16, delay: i * 0.08 })); this.tone(1760, 0.5, { vol: 0.08, delay: 0.32 }); },
  normal() { this.tone(523, 0.15, { vol: 0.15 }); this.tone(659, 0.25, { vol: 0.15, delay: 0.12 }); },
  raw() { this.tone(330, 0.3, { f2: 200, type: 'triangle', vol: 0.2 }); this.noise(0.2, { type: 'lowpass', freq: 400, vol: 0.25, delay: 0.25 }); },
  thud() { this.tone(90, 0.25, { f2: 45, vol: 0.5 }); this.noise(0.18, { type: 'lowpass', freq: 500, vol: 0.5 }); },
  meow(delay = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 3;
    o.frequency.setValueAtTime(520, t0); o.frequency.linearRampToValueAtTime(860, t0 + 0.18); o.frequency.linearRampToValueAtTime(480, t0 + 0.55);
    f.frequency.setValueAtTime(900, t0); f.frequency.linearRampToValueAtTime(2200, t0 + 0.2); f.frequency.linearRampToValueAtTime(800, t0 + 0.55);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    o.connect(f); f.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + 0.65);
  },
  whooshUp() { this.noise(0.5, { freq: 300, f2: 4000, q: 3, vol: 0.5 }); this.tone(200, 0.5, { f2: 1200, type: 'triangle', vol: 0.12 }); },
  splat(delay = 0) { this.noise(0.35, { type: 'lowpass', freq: 1800, f2: 200, vol: 0.9, delay }); this.tone(160, 0.2, { f2: 60, vol: 0.5, delay }); },
  alarm() { for (let i = 0; i < 6; i++) this.tone(3100, 0.08, { type: 'square', vol: 0.12, delay: i * 0.17 }); },
  door() { this.tone(110, 0.7, { f2: 190, type: 'sawtooth', vol: 0.12, lp: 700, attack: 0.1 }); this.tone(1200, 0.04, { type: 'square', vol: 0.15, delay: 0.75 }); this.noise(0.05, { freq: 3000, vol: 0.3, delay: 0.75 }); },
  caught() { this.tone(98, 0.35, { type: 'square', vol: 0.2, lp: 900 }); this.tone(73, 0.6, { type: 'square', vol: 0.2, lp: 900, delay: 0.35 }); },
  phew() { this.tone(520, 0.3, { f2: 330, vol: 0.12 }); this.tone(1200, 0.04, { type: 'square', vol: 0.12, delay: 0.5 }); },
  life() { [784, 988, 1175].forEach((f, i) => this.tone(f, 0.18, { vol: 0.15, type: 'triangle', delay: i * 0.1 })); },
  clear() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.22, { vol: 0.16, type: 'triangle', delay: i * 0.12 })); },
  sad() { [392, 349, 311, 262].forEach((f, i) => this.tone(f, 0.35, { vol: 0.15, type: 'triangle', delay: i * 0.25 })); },
};

/* =========================================================
   輸入：感應器 / 觸控 / 鍵盤
   ========================================================= */
const Input = {
  beta: null, gamma: null, base: { b: 0, g: 0 },
  accelMag: 0, grav: null, sensorSeen: false,
  tiltPauseUntil: 0, cooldownUntil: 0, peak: null, lastPeak: 0,
  touchDown: false, touchStart: null, touchPos: null, samples: [],
  keys: {}, keyTouched: false,
  shakeHandler: null,
  force: 20, // 校準的標準力道
};

function emitShake(ratio, raw) {
  const t = now();
  Input.lastPeak = raw;
  Input.tiltPauseUntil = Math.max(Input.tiltPauseUntil, t + CONFIG.pauseTiltAroundShake);
  if (Input.shakeHandler) Input.shakeHandler(ratio, raw);
}

window.addEventListener('deviceorientation', (e) => {
  if (e.beta == null && e.gamma == null) return;
  Input.beta = e.beta || 0; Input.gamma = e.gamma || 0; Input.sensorSeen = true;
}, true);

window.addEventListener('devicemotion', (e) => {
  let lin = null;
  const a = e.acceleration, ag = e.accelerationIncludingGravity;
  if (a && a.x != null) lin = [a.x || 0, a.y || 0, a.z || 0];
  else if (ag && ag.x != null) {
    const v = [ag.x || 0, ag.y || 0, ag.z || 0];
    if (!Input.grav) Input.grav = v.slice();
    for (let i = 0; i < 3; i++) Input.grav[i] = lerp(Input.grav[i], v[i], 0.1);
    lin = v.map((x, i) => x - Input.grav[i]);
  }
  if (!lin) return;
  Input.sensorSeen = true;
  if (inputMode !== 'motion') return;
  const mag = Math.hypot(lin[0], lin[1], lin[2]);
  Input.accelMag = mag;
  const t = now();
  // 「搖動前」暫停晃的物理：加速度一開始變大就先停
  if (mag > CONFIG.shakeMinAccel * 0.6) Input.tiltPauseUntil = Math.max(Input.tiltPauseUntil, t + CONFIG.pauseTiltAroundShake);
  if (t < Input.cooldownUntil) return;
  if (!Input.peak) {
    if (mag >= CONFIG.shakeMinAccel) Input.peak = { start: t, max: mag };
  } else {
    Input.peak.max = Math.max(Input.peak.max, mag);
    if (t - Input.peak.start > 0.12) resolvePeak();
  }
}, true);

function resolvePeak() {
  const p = Input.peak; if (!p) return;
  Input.peak = null; Input.cooldownUntil = p.start + CONFIG.shakeCooldown;
  emitShake(p.max / Input.force, p.max);
}

function getTilt() {
  let x = 0, y = 0;
  if (inputMode === 'motion' && Input.beta != null) {
    x = Input.gamma - Input.base.g; y = Input.beta - Input.base.b;
  } else if (inputMode === 'touch' && Input.touchDown && Input.touchStart && Input.touchPos) {
    x = (Input.touchPos.x - Input.touchStart.x) / CONFIG.touchJoystickPx * CONFIG.maxTiltDeg;
    y = (Input.touchPos.y - Input.touchStart.y) / CONFIG.touchJoystickPx * CONFIG.maxTiltDeg;
  }
  const k = Input.keys;
  if (k.ArrowLeft || k.ArrowRight || k.ArrowUp || k.ArrowDown) {
    const kt = CONFIG.maxTiltDeg * 0.6;
    x = (k.ArrowRight ? kt : 0) - (k.ArrowLeft ? kt : 0);
    y = (k.ArrowDown ? kt : 0) - (k.ArrowUp ? kt : 0);
  }
  const m = Math.hypot(x, y);
  if (m > CONFIG.maxTiltDeg) { x *= CONFIG.maxTiltDeg / m; y *= CONFIG.maxTiltDeg / m; }
  return { x, y };
}

const cv = $('cv');
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  Snd.init();
  if (inputMode !== 'touch') return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  Input.touchDown = true;
  Input.touchStart = { x: e.clientX, y: e.clientY };
  Input.touchPos = { x: e.clientX, y: e.clientY };
  Input.samples = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
});
cv.addEventListener('pointermove', (e) => {
  if (!Input.touchDown) return;
  const t = performance.now();
  Input.touchPos = { x: e.clientX, y: e.clientY };
  Input.samples.push({ x: e.clientX, y: e.clientY, t });
  while (Input.samples.length > 2 && t - Input.samples[0].t > 250) Input.samples.shift();
});
function pointerEnd(e) {
  if (!Input.touchDown) return;
  const t = performance.now();
  Input.samples.push({ x: e.clientX, y: e.clientY, t });
  Input.touchDown = false; Input.touchPos = null;
  // 找最近 100ms 的上滑速度
  const last = Input.samples[Input.samples.length - 1];
  let s0 = Input.samples[0];
  for (const s of Input.samples) { if (t - s.t <= 110) { s0 = s; break; } }
  const dt = Math.max(16, last.t - s0.t);
  const up = s0.y - last.y;
  const speed = up / dt;
  if (up >= CONFIG.touchMinFlickDist && speed >= CONFIG.touchMinFlickSpeed && now() >= Input.cooldownUntil) {
    Input.cooldownUntil = now() + CONFIG.shakeCooldown;
    emitShake(speed / CONFIG.touchStandardSpeed, speed);
  }
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);

window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.key.startsWith('Arrow')) { Input.keys[e.key] = true; Input.keyTouched = true; }
  if (e.key === ' ' && !e.repeat) {
    Input.keyTouched = true;
    if (now() >= Input.cooldownUntil) { Input.cooldownUntil = now() + CONFIG.shakeCooldown; emitShake(1.0, 1.0); }
  }
});
window.addEventListener('keyup', (e) => { if (e.key.startsWith('Arrow')) Input.keys[e.key] = false; });

/* =========================================================
   遊戲狀態
   ========================================================= */
let appState = 'title'; // title / perm / calib / play / revive / ad / result
let G = null;           // 一局的資料
let pauseReason = null, resumeCountdown = 0;
let fx = { particles: [], texts: [], flash: null, camShake: 0, fallingNoodles: [] };

function doneState(t) {
  if (t < CONFIG.rawUntil) return 'raw';
  if (t < CONFIG.goldenUntil) return 'golden';
  if (t < CONFIG.burntAt) return 'burnt_bit';
  return 'charcoal';
}
const STATE_LABEL = { raw: '生的', golden: '金黃', burnt_bit: '有點焦', charcoal: '黑炭' };

function bodyColor(t) {
  if (t < CONFIG.rawUntil) return mixColor('#f3e4b0', '#efd790', t / CONFIG.rawUntil);
  if (t < CONFIG.goldenUntil) return mixColor('#f8c23c', '#e9a222', (t - CONFIG.rawUntil) / (CONFIG.goldenUntil - CONFIG.rawUntil));
  if (t < CONFIG.burntAt) return mixColor('#a3612a', '#4a2a12', (t - CONFIG.goldenUntil) / (CONFIG.burntAt - CONFIG.goldenUntil));
  return [24, 18, 16];
}
function haloColor(t) {
  if (t < CONFIG.rawUntil) return mixColor('#ffffff', '#fff3cf', t / CONFIG.rawUntil);
  if (t < CONFIG.goldenUntil) return mixColor('#ffc21a', '#f5a000', (t - CONFIG.rawUntil) / (CONFIG.goldenUntil - CONFIG.rawUntil));
  if (t < CONFIG.burntAt) return mixColor('#9a5418', '#3a1d08', (t - CONFIG.goldenUntil) / (CONFIG.burntAt - CONFIG.goldenUntil));
  return [10, 8, 8];
}

function genNoodles(rand = Math.random) {
  const arr = [];
  for (let i = 0; i < 10; i++) {
    const pts = []; const a = rand() * Math.PI * 2, rr = Math.sqrt(rand()) * 0.7;
    let x = Math.cos(a) * rr, y = Math.sin(a) * rr, dir = rand() * Math.PI * 2;
    const n = 10 + (rand() * 10 | 0);
    for (let k = 0; k < n; k++) {
      dir += (rand() - 0.5) * 1.4;
      x += Math.cos(dir) * 0.07; y += Math.sin(dir) * 0.07;
      const d = Math.hypot(x, y); if (d > 0.86) { x *= 0.86 / d; y *= 0.86 / d; dir += Math.PI * 0.7; }
      pts.push([x, y]);
    }
    arr.push(pts);
  }
  return arr;
}

function newGame() {
  G = {
    lives: CONFIG.startLives, served: 0, perfectCount: 0, streak: 0,
    plate: [], rawPlate: 0, fails: { floor: 0, ceiling: 0, burnt: 0, mom: 0 },
    splats: [], momDone: false, adUsed: 0, playTime: 0, attempt: 0, pc: null,
    passed: false, ended: false,
  };

}

function newPancake() {
  G.attempt++;
  G.pc = {
    x: 0, y: 0, vx: 0, vy: 0, sides: [0, 0], down: 0, side: 0,
    stick: 0, stuck: false, phase: 'pour', t: 0, hop: 0, wiggle: 0,

// 開局前檢查點數；不夠就顯示點數不足畫面
function tryStart(next) {
  Wallet.tick(Date.now());

}
function startGame() {

    Wallet.tick(); paid = free ? 0 : CONFIG.entryFee;

  newGame();

  if (daily.date !== today) daily = { date: today, count: 0 };

function updateHud() {
  if (!G) return;
  $('hud-order').textContent = `第 1 晚：自己餓了　煎好 ${G.served} / ${CONFIG.level1Target}`;
  $('hud-lives').innerHTML = G.lives > 0 ? '<i class="pack"></i>'.repeat(G.lives) : '<i class="pack empty"></i>';
  $('hud-streak').textContent = G.streak >= 1 ? `連續完美 ×${G.streak}` : '';
}

function setHint() {
  const h = $('hint');
  if (appState !== 'play' || !G || !G.pc) { h.textContent = ''; return; }
  const pc = G.pc;
  let ctrl;
  if (inputMode === 'motion') ctrl = '晃手機＝滑動｜往上甩＝翻面';
  else if (IS_MOBILE) ctrl = '按住拖曳＝晃｜快速上滑放開＝翻面';
  else ctrl = '拖曳 / 方向鍵＝晃｜快速上滑 / 空白鍵＝翻面';
  let tip = '';
  if (pc.phase === 'mom') tip = inputMode === 'touch' ? '手指離開，不要動！' : '拿穩，不要動！';
  else if (pc.stuck) tip = '黏住了！一直晃到鬆開';
  else if (G.served === 0 && G.attempt <= 2) tip = pc.side === 0 ? '外圈變金黃就翻面' : '這面也金黃就再搖一下起鍋';
  h.innerHTML = (tip ? `<b style="color:#ffd166">${tip}</b><br>` : '') + ctrl;
}

/* ---------- 搖一下 ---------- */
function onGameShake(ratio) {
  if (appState !== 'play' || pauseReason || resumeCountdown > 0 || !G || !G.pc) return;
  const pc = G.pc;
  if (pc.phase === 'mom') { if (pc.mom.stage === 'hold') momCaught(); return; }
  if (pc.phase !== 'cook') return;
  const seg = ratio < CONFIG.weakRatio ? 'weak' : ratio > CONFIG.strongRatio ? 'strong' : 'ok';
  const st = doneState(pc.sides[pc.down]);
  track('flip', { pancake: G.served + 1, attempt: G.attempt, side: pc.side + 1, doneness: st, power: seg, stuck: pc.stuck, ratio: +ratio.toFixed(2) });
  // 搖動前 0.3 秒的晃動不算（倒回去）
  rewind(pc);
  if (pc.stuck) {
    pc.wiggle = 0.4; Snd.stuck();
    floatText('黏住了！翻不起來', L.cx + pc.x * L.R, L.cy + pc.y * L.R - L.pr - 10, '#ff7a5c', 22);
    return;
  }
  if (seg === 'weak') {
    pc.hop = 0.35; Snd.hop();
    floatText('太輕了！', L.cx + pc.x * L.R, L.cy + pc.y * L.R - L.pr - 10, '#fbfaf3', 22);
    return;
  }
  if (seg === 'strong') { fail('ceiling'); return; }
  if (pc.side === 0) startFlip(); else startServe();
}

function rewind(pc) {
  const target = now() - CONFIG.pauseTiltAroundShake;
  for (let i = pc.hist.length - 1; i >= 0; i--) {
    const h = pc.hist[i];
    if (h.t <= target) { pc.x = h.x; pc.y = h.y; pc.vx = h.vx; pc.vy = h.vy; break; }
  }
  pc.hist = [];
}

function startFlip() {
  const pc = G.pc;
  pc.sideStates[0] = doneState(pc.sides[0]);
  pc.phase = 'flip'; pc.t = 0; pc.flipped = false;
  Snd.flip(); vibrate(30); Snd.sizzle(0);
  const lab = { golden: '金黃！', raw: '還有點生…', burnt_bit: '有點焦' }[pc.sideStates[0]];
  floatText(lab, L.cx + pc.x * L.R, L.cy + pc.y * L.R - L.pr - 14, pc.sideStates[0] === 'golden' ? '#ffd34d' : '#fbfaf3', 24);
}

function startServe() {
  const pc = G.pc;
  pc.sideStates[1] = doneState(pc.sides[1]);
  pc.phase = 'serve'; pc.t = 0;
  pc.from = { x: L.cx + pc.x * L.R, y: L.cy + pc.y * L.R };
  Snd.flip(); vibrate(30); Snd.sizzle(0);
}

function finishServe() {
  const pc = G.pc;
  const s = pc.sideStates;
  let result;
  if (s.includes('raw')) result = 'raw';
  else if (s[0] === 'golden' && s[1] === 'golden') result = 'perfect';
  else result = 'normal';
  pc.result = result; pc.phase = 'served'; pc.t = 0;
  const tx = L.cx, ty = L.cy - L.R * 0.15;
  if (result === 'perfect') {
    G.served++; G.perfectCount++; G.streak++; G.plate.push('perfect');
    Snd.perfect(); vibrate([20, 40, 20]);
    floatText('完美！', tx, ty, '#ffd34d', 56, 1.4);
    fx.flash = { color: [255, 210, 80], t: 0, life: 0.5, a: 0.45 };
    sparkle(L.plate.x, L.plate.y, 26);
    if (G.streak > 0 && G.streak % CONFIG.perfectStreakReward === 0 && G.lives < CONFIG.maxLives) {
      G.lives++; Snd.life();
      toast(`連續 ${CONFIG.perfectStreakReward} 片完美！送你 1 包泡麵`);
    }
  } else if (result === 'normal') {
    G.served++; G.streak = 0; G.plate.push('normal');
    Snd.normal();
    floatText('普通煎餅', tx, ty, '#fbfaf3', 34, 1.2);
    floatText(s.map(x => STATE_LABEL[x]).join(' / '), tx, ty + 40, '#d9c39a', 18, 1.2);
  } else {
    G.rawPlate++; G.streak = 0;
    Snd.raw();
    floatText('半生不熟…軟軟的', tx, ty, '#f0e6c0', 32, 1.3);
    floatText('這片不算（不扣命）', tx, ty + 40, '#d9c39a', 18, 1.3);
  }
  track('pancake_done', { pancake: result === 'raw' ? G.served + 1 : G.served, result });
  if (HOST && result !== 'raw') HOST.progress(window, G.served);
  updateHud();
}

/* ---------- 失敗 ---------- */
function fail(kind) {
  const pc = G.pc;
  pc.phase = 'fail'; pc.failKind = kind; pc.t = 0;
  pc.failFrom = { x: L.cx + pc.x * L.R, y: L.cy + pc.y * L.R };
  G.fails[kind]++; G.lives--; G.streak = 0;
  Snd.sizzle(0);
  track('fail', { pancake: G.served + 1, kind });
  if (kind === 'floor') {
    const d = Math.hypot(pc.x, pc.y) || 1;
    pc.outDir = { x: pc.x / d, y: pc.y / d };
    Snd.thud(); Snd.meow(0.8);
    pc.failDur = 2.3;
  } else if (kind === 'ceiling') {
    const rand = Math.random;
    pc.splat = { u: 0.08 + rand() * 0.84, v: rand(), rot: rand() * Math.PI * 2, seed: (rand() * 1e9) | 0, noodles: genNoodles() };
    Snd.whooshUp(); Snd.splat(0.5); vibrate(60);
    pc.failDur = 2.0;
  } else if (kind === 'burnt') {
    pc.sides[pc.down] = CONFIG.burntAt; pc.sides[1 - pc.down] = Math.max(pc.sides[1 - pc.down], CONFIG.burntAt);
    Snd.alarm(); vibrate([100, 60, 100, 60, 100]);
    pc.failDur = 2.0;
  } else if (kind === 'mom') {
    Snd.caught(); vibrate(200);
    pc.failDur = 2.0;
  }
  updateHud();
}

function afterFail() {
  if (G.lives <= 0) {
    track('out_of_noodles', { pancakes: G.served });
    showRevive();
  } else newPancake();
}

/* ---------- 媽媽開門 ---------- */
function startMom() {
  const pc = G.pc;
  G.momDone = true;
  pc.phase = 'mom';
  pc.mom = { stage: 'appear', t: 0, still: 0, base: null, light: 0 };
  Snd.sizzle(0); Snd.door();
}
function momCaught() {
  const pc = G.pc;
  track('mom_event', { result: 'caught' });
  pc.mom.stage = 'caught';
  fail('mom');
}
function updateMom(dt) {
  const pc = G.pc, m = pc.mom;
  m.t += dt;
  m.light = Math.min(1, m.light + dt * 4);
  if (m.stage === 'appear') {
    if (m.t >= CONFIG.momGrace) {
      if (inputMode === 'touch' && Input.touchDown) { momCaught(); return; }
      m.stage = 'hold'; m.t = 0; m.still = 0;
      m.base = { b: Input.beta || 0, g: Input.gamma || 0 };
      Input.keyTouched = false;
    }
  } else if (m.stage === 'hold') {
    let moved = Input.keyTouched || Object.values(Input.keys).some(Boolean);
    if (inputMode === 'touch') moved = moved || Input.touchDown;
    else {
      const dTilt = Math.hypot((Input.beta || 0) - m.base.b, (Input.gamma || 0) - m.base.g);
      m.dTilt = dTilt;
      if (dTilt > CONFIG.momTiltTolerance || Input.accelMag > CONFIG.momAccelTolerance) moved = true;
    }
    if (moved) { momCaught(); return; }
    m.still += dt;
    if (m.still >= CONFIG.momStillSeconds) {
      m.stage = 'pass'; m.t = 0;
      track('mom_event', { result: 'pass' });
      Snd.phew();
    }
  } else if (m.stage === 'pass') {
    m.light = Math.max(0, 1 - Math.max(0, m.t - 0.9) * 3);
    if (m.t >= 1.6) { pc.phase = 'cook'; pc.hist = []; pc.stick = Math.min(pc.stick, 0.3); }
  }
}

/* ---------- 每一幀 ---------- */
function updatePhysics(pc, dt) {
  const t = now();
  let tl = { x: 0, y: 0 };
  if (t >= Input.tiltPauseUntil) tl = getTilt();
  const effort = Math.hypot(tl.x, tl.y) / CONFIG.maxTiltDeg;
  const ax = tl.x / CONFIG.maxTiltDeg * CONFIG.tiltForce * CONFIG.panAccel;
  const ay = tl.y / CONFIG.maxTiltDeg * CONFIG.tiltForce * CONFIG.panAccel;
  if (pc.stuck) {
    pc.vx = 0; pc.vy = 0;
    if (effort > 0.2) pc.stick -= dt / CONFIG.unstickSeconds * Math.min(1.5, effort * 2);
    pc.jitter = effort > 0.2 ? effort : 0;
    if (pc.stick <= 0.35) { pc.stuck = false; floatText('鬆開了！', L.cx + pc.x * L.R, L.cy + pc.y * L.R - L.pr - 10, '#9fff9f', 20); }
  } else {
    pc.vx += ax * dt; pc.vy += ay * dt;
    const f = Math.pow(CONFIG.friction, dt * 60);
    pc.vx *= f; pc.vy *= f;
    pc.x += pc.vx * dt; pc.y += pc.vy * dt;
    const sp = Math.hypot(pc.vx, pc.vy);
    pc.speed = sp;
    if (sp < CONFIG.stickMoveThreshold) pc.stick += dt / CONFIG.stickFillSeconds;
    else pc.stick -= dt / 0.6;
    pc.stick = clamp(pc.stick, 0, 1);
    if (pc.stick >= 1) {
      pc.stuck = true; Snd.stuck();
      floatText('黏住了！', L.cx + pc.x * L.R, L.cy + pc.y * L.R - L.pr - 10, '#ff7a5c', 26);
    }
    pc.hist.push({ t, x: pc.x, y: pc.y, vx: pc.vx, vy: pc.vy });
    while (pc.hist.length && t - pc.hist[0].t > 0.6) pc.hist.shift();
    if (Math.hypot(pc.x, pc.y) > 1.0) fail('floor');
  }
}

function updateGame(dt) {
  const pc = G.pc; if (!pc) return;
  G.playTime += dt;
  pc.t += dt;
  pc.hop = Math.max(0, pc.hop - dt);
  pc.wiggle = Math.max(0, pc.wiggle - dt);
  switch (pc.phase) {
    case 'pour':
      if (pc.t >= 0.3) { pc.phase = 'cook'; pc.t = 0; }
      break;
    case 'cook': {
      updatePhysics(pc, dt);
      if (pc.phase !== 'cook') break;
      pc.sides[pc.down] += dt;
      const dT = pc.sides[pc.down];
      if (!pc.goldenCued && dT >= CONFIG.rawUntil) { pc.goldenCued = true; Snd.golden(); }
      if (CONFIG.level1MomEvent && !G.momDone && G.served === 2 && pc.side === 0 && dT >= CONFIG.momTriggerAt) { startMom(); break; }
      if (dT >= CONFIG.burntAt) { fail('burnt'); break; }
      if (dT >= CONFIG.goldenUntil) {
        const k = (dT - CONFIG.goldenUntil) / (CONFIG.burntAt - CONFIG.goldenUntil);
        if (Math.random() < dt * (8 + 40 * k)) spawnSmoke(L.cx + pc.x * L.R, L.cy + pc.y * L.R, k > 0.5 ? 0.6 : 0.85, 1 + k);
      }
      Snd.sizzle(0.05 + 0.08 * Math.min(1, dT / CONFIG.burntAt));
      break;
    }
    case 'flip':
      if (!pc.flipped && pc.t >= 0.25) { pc.flipped = true; pc.down = 1; }
      if (pc.t >= 0.5) { pc.phase = 'cook'; pc.side = 1; pc.t = 0; pc.stick = 0; pc.stuck = false; pc.vx = pc.vy = 0; pc.hist = []; pc.goldenCued = false; }
      break;
    case 'serve':
      if (pc.t >= 0.55) finishServe();
      break;
    case 'served':
      if (pc.t >= 1.3) {
        if (G.served >= CONFIG.level1Target) levelClear();
        else newPancake();
      }
      break;
    case 'fail':
      updateFailFx(pc, dt);
      if (pc.t >= pc.failDur) afterFail();
      break;
    case 'mom':
      updateMom(dt);
      break;
  }
}

function updateFailFx(pc, dt) {
  if (pc.failKind === 'burnt') {
    if (Math.random() < dt * 60) spawnSmoke(pc.failFrom.x, pc.failFrom.y, 0.25, 2.2);
  }
  if (pc.failKind === 'ceiling' && !pc.splatted && pc.t >= 0.5) {
    pc.splatted = true;
    G.splats.push(pc.splat);
    fx.flash = { color: [255, 255, 255], t: 0, life: 0.25, a: 0.7 };
    fx.camShake = 0.35;
    const sp = splatPos(pc.splat);
    for (let i = 0; i < 7; i++) fx.fallingNoodles.push({ x: sp.x + (Math.random() - 0.5) * L.pr * 1.4, y: sp.y + Math.random() * 10, vy: 40 + Math.random() * 80, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 6, life: 1.6, t: 0, len: 14 + Math.random() * 16 });
  }
  if (pc.failKind === 'floor' && !pc.thudded && pc.t >= 0.45) { pc.thudded = true; fx.camShake = 0.15; }
}

function levelClear() {
  G.passed = true; G.ended = true;
  Snd.clear();
  const totalFails = Object.values(G.fails).reduce((a, b) => a + b, 0);
  track('level_clear', { perfect: G.perfectCount, fails: totalFails, play_seconds: Math.round(G.playTime) });
  showResult();
}

/* ---------- 特效 ---------- */
function floatText(text, x, y, color = '#fbfaf3', size = 22, life = 1.0) {
  fx.texts.push({ text, x, y, color, size, life, t: 0 });
}
function spawnSmoke(x, y, gray = 0.8, big = 1) {
  const c = Math.round(255 * gray);
  fx.particles.push({ kind: 'smoke', x: x + (Math.random() - 0.5) * L.pr, y: y + (Math.random() - 0.5) * L.pr, vx: (Math.random() - 0.5) * 20, vy: -20 - Math.random() * 30, r: (8 + Math.random() * 10) * big, life: 1.2 + Math.random() * 0.8, t: 0, c: [c, c, c] });
}
function sparkle(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
    fx.particles.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 2 + Math.random() * 3, life: 0.6 + Math.random() * 0.5, t: 0, c: [255, 215, 90] });
  }
}
function updateFx(dt) {
  for (const p of fx.particles) {
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'smoke') { p.r += dt * 14; p.vx *= 0.98; }
    else { p.vx *= 0.92; p.vy *= 0.92; }
  }
  fx.particles = fx.particles.filter(p => p.t < p.life);
  for (const s of fx.texts) s.t += dt;
  fx.texts = fx.texts.filter(s => s.t < s.life);
  for (const n of fx.fallingNoodles) { n.t += dt; n.vy += 260 * dt; n.y += n.vy * dt; n.rot += n.vr * dt; }
  fx.fallingNoodles = fx.fallingNoodles.filter(n => n.t < n.life);
  if (fx.flash) { fx.flash.t += dt; if (fx.flash.t > fx.flash.life) fx.flash = null; }
  fx.camShake = Math.max(0, fx.camShake - dt);
}

function splatPos(s) {
  return { x: 34 + s.u * (W - 68), y: L.splatTop + s.v * (L.splatBot - L.splatTop) };

function drawNoodles(c, x, y, r, noodles, color, lw) {
  c.strokeStyle = color; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
  for (const pts of noodles) {
    c.beginPath();
    c.moveTo(x + pts[0][0] * r, y + pts[0][1] * r);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      c.quadraticCurveTo(x + pts[i][0] * r, y + pts[i][1] * r, x + mx * r, y + my * r);
    }
    c.stroke();
  }
}

/* ---------- 黑貓（跟背景圖裡的貓一樣：黑毛、黃眼睛） ---------- */
function drawCat(c, x, y, s, t, mode = 'run', flip = false) {
  c.save(); c.translate(x, y); if (flip) c.scale(-1, 1);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const ink = '#0b0810', fur = '#24202c', rim = '#5d4f6e';
  const outline = () => { c.lineWidth = Math.max(2, s * 0.05); c.strokeStyle = ink; c.stroke(); };
  if (mode === 'run') {
    const g = Math.sin(t * 28);
    // 腳
    c.strokeStyle = ink; c.lineWidth = s * 0.13;
    [[-0.3, g], [-0.12, -g], [0.25, -g], [0.42, g]].forEach(([lx, ph]) => {
      c.beginPath(); c.moveTo(lx * s, 0.1 * s); c.lineTo((lx + ph * 0.14) * s, 0.42 * s); c.stroke();
    });
    c.strokeStyle = fur; c.lineWidth = s * 0.08;
    [[-0.3, g], [-0.12, -g], [0.25, -g], [0.42, g]].forEach(([lx, ph]) => {
      c.beginPath(); c.moveTo(lx * s, 0.1 * s); c.lineTo((lx + ph * 0.14) * s, 0.42 * s); c.stroke();
    });
    // 尾巴
    c.beginPath(); c.moveTo(0.48 * s, -0.05 * s);
    c.bezierCurveTo(0.8 * s, -0.1 * s, 0.75 * s, (-0.5 + g * 0.08) * s, 0.95 * s, (-0.55 + g * 0.1) * s);
    c.strokeStyle = ink; c.lineWidth = s * 0.12; c.stroke(); c.strokeStyle = fur; c.lineWidth = s * 0.07; c.stroke();
    // 身體
    c.beginPath(); c.ellipse(0.08 * s, -0.02 * s, 0.5 * s, 0.24 * s, 0.06 * g * 0.3, 0, Math.PI * 2);
    c.fillStyle = fur; c.fill(); outline();
    c.beginPath(); c.ellipse(0.05 * s, -0.16 * s, 0.32 * s, 0.06 * s, 0, Math.PI, Math.PI * 2); c.strokeStyle = rim; c.lineWidth = s * 0.03; c.stroke();
    // 頭
    const hx = -0.48 * s, hy = -0.2 * s, hr = 0.24 * s;
    c.beginPath(); c.moveTo(hx - hr * 0.8, hy - hr * 0.4); c.lineTo(hx - hr * 0.7, hy - hr * 1.35); c.lineTo(hx - hr * 0.15, hy - hr * 0.85);
    c.lineTo(hx + hr * 0.25, hy - hr * 1.35); c.lineTo(hx + hr * 0.75, hy - hr * 0.5);
    c.arc(hx, hy, hr, -0.6, Math.PI * 0.95 + Math.PI, false); c.closePath();
    c.fillStyle = fur; c.fill(); outline();
    c.beginPath(); c.arc(hx, hy, hr, 0, Math.PI * 2); c.fillStyle = fur; c.fill(); outline();
    // 眼睛
    [[-0.6, -0.24], [-0.4, -0.24]].forEach(([ex, ey]) => {
      c.beginPath(); c.ellipse(ex * s, ey * s, s * 0.055, s * 0.065, 0, 0, Math.PI * 2); c.fillStyle = '#ffd23a'; c.fill();
      c.lineWidth = s * 0.02; c.strokeStyle = ink; c.stroke();
      c.beginPath(); c.ellipse(ex * s - s * 0.01, ey * s, s * 0.015, s * 0.05, 0, 0, Math.PI * 2); c.fillStyle = ink; c.fill();
    });
    c.beginPath(); c.moveTo(-0.52 * s, -0.12 * s); c.lineTo(-0.48 * s, -0.09 * s); c.lineTo(-0.44 * s, -0.12 * s); c.fillStyle = '#e88aa0'; c.fill();
  } else {
    // 坐著、吃很飽、肚子圓圓
    const b = Math.sin(t * 2) * 0.01;
    c.beginPath(); c.moveTo(0.3 * s, 0.35 * s); c.bezierCurveTo(0.75 * s, 0.4 * s, 0.75 * s, -0.05 * s, 0.55 * s, -0.15 * s);
    c.strokeStyle = ink; c.lineWidth = s * 0.13; c.stroke(); c.strokeStyle = fur; c.lineWidth = s * 0.08; c.stroke();
    c.beginPath(); c.ellipse(0, 0.12 * s, 0.4 * s, (0.33 + b) * s, 0, 0, Math.PI * 2); c.fillStyle = fur; c.fill(); outline();
    c.beginPath(); c.ellipse(0, 0.2 * s, 0.22 * s, 0.17 * s, 0, 0, Math.PI * 2); c.fillStyle = '#3a3344'; c.fill();
    const hx = 0, hy = -0.32 * s, hr = 0.25 * s;
    c.beginPath(); c.moveTo(hx - hr * 0.85, hy - hr * 0.3); c.lineTo(hx - hr * 0.75, hy - hr * 1.3); c.lineTo(hx - hr * 0.2, hy - hr * 0.85);
    c.lineTo(hx + hr * 0.2, hy - hr * 0.85); c.lineTo(hx + hr * 0.75, hy - hr * 1.3); c.lineTo(hx + hr * 0.85, hy - hr * 0.3); c.closePath();
    c.fillStyle = fur; c.fill(); outline();
    c.beginPath(); c.arc(hx, hy, hr, 0, Math.PI * 2); c.fillStyle = fur; c.fill(); outline();
    // 滿足的瞇眼
    c.strokeStyle = '#ffd23a'; c.lineWidth = s * 0.035;
    [-0.1, 0.1].forEach(ex => { c.beginPath(); c.arc(ex * s, hy + 0.01 * s, 0.05 * s, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); });
    c.beginPath(); c.moveTo(-0.03 * s, hy + 0.08 * s); c.lineTo(0, hy + 0.11 * s); c.lineTo(0.03 * s, hy + 0.08 * s); c.fillStyle = '#e88aa0'; c.fill();
  }
  c.restore();
}

/* ---------- 煙霧警報器 ---------- */
function drawAlarm(c, x, y, r, t) {
  const on = Math.floor(t * 6) % 2 === 0;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  if (on) {
    const g = c.createRadialGradient(x, y + r * 0.2, 0, x, y + r * 0.2, r * 2.6);
    g.addColorStop(0, 'rgba(255,60,40,0.55)'); g.addColorStop(1, 'rgba(255,60,40,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y + r * 0.2, r * 2.6, 0, Math.PI * 2); c.fill();
  }
  c.beginPath(); c.ellipse(x, y, r, r * 0.55, 0, 0, Math.PI * 2); c.fillStyle = '#fbf3dc'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#2a160a'; c.stroke();
  c.beginPath(); c.ellipse(x, y - r * 0.08, r * 0.62, r * 0.3, 0, 0, Math.PI * 2); c.strokeStyle = '#b9a77e'; c.lineWidth = 2; c.stroke();
  c.beginPath(); c.arc(x + r * 0.45, y + r * 0.12, r * 0.13, 0, Math.PI * 2); c.fillStyle = on ? '#ff3b2a' : '#7a2412'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#2a160a'; c.stroke();
  c.strokeStyle = on ? '#ff6b5a' : 'rgba(255,107,90,0.4)'; c.lineWidth = 3;
  [1, 1.45].forEach(k => {
    c.beginPath(); c.arc(x - r * 1.05, y, r * 0.35 * k, Math.PI * 0.65, Math.PI * 1.35); c.stroke();
    c.beginPath(); c.arc(x + r * 1.05, y, r * 0.35 * k, -Math.PI * 0.35, Math.PI * 0.35); c.stroke();
  });
  c.restore();
}

/* ---------- 媽媽開門：門框＋門縫的光＋媽媽的剪影 ---------- */
function drawDoorMom(c, x, y, h, t, stage, light) {
  const w = h * 0.55, open = stage === 'pass' ? Math.max(0, 1 - light) * 0 + light : 1;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  // 門框
  c.fillStyle = '#5a3416'; c.strokeStyle = '#2a160a'; c.lineWidth = 3;
  c.beginPath(); c.rect(x - w / 2 - 8, y - h / 2 - 8, w + 16, h + 8); c.fill(); c.stroke();
  // 門後的光
  const g = c.createLinearGradient(x, y - h / 2, x, y + h / 2);
  g.addColorStop(0, '#fff7d6'); g.addColorStop(1, '#ffd98a');
  c.fillStyle = g; c.beginPath(); c.rect(x - w / 2, y - h / 2, w, h); c.fill(); c.stroke();
  // 媽媽剪影
  const shake = stage === 'caught' ? Math.sin(t * 30) * 2 : 0;
  const mx = x + shake, sc = stage === 'caught' ? 1.08 : 1;
  c.fillStyle = '#3b2a3c';
  c.beginPath(); c.arc(mx, y - h * 0.22 * sc, h * 0.12 * sc, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(mx + h * 0.02, y - h * 0.36 * sc, h * 0.065, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(mx - h * 0.2 * sc, y + h / 2); c.quadraticCurveTo(mx - h * 0.2, y - h * 0.08, mx, y - h * 0.1); c.quadraticCurveTo(mx + h * 0.2, y - h * 0.08, mx + h * 0.2 * sc, y + h / 2); c.closePath(); c.fill();
  if (stage === 'caught') {
    // 生氣的符號
    c.strokeStyle = '#c93a1e'; c.lineWidth = 4;
    const ax = mx + h * 0.2, ay = y - h * 0.4;
    c.beginPath(); c.moveTo(ax - 6, ay - 2); c.lineTo(ax - 1, ay - 1); c.lineTo(ax - 2, ay - 6); c.moveTo(ax + 6, ay - 2); c.lineTo(ax + 1, ay - 1); c.lineTo(ax + 2, ay - 6);
    c.moveTo(ax - 6, ay + 6); c.lineTo(ax - 1, ay + 5); c.lineTo(ax - 2, ay + 10); c.moveTo(ax + 6, ay + 6); c.lineTo(ax + 1, ay + 5); c.lineTo(ax + 2, ay + 10); c.stroke();
  }
  // 門板（打開的角度）
  const doorW = w * (1 - 0.85 * (stage === 'pass' ? light : 1));
  c.fillStyle = '#8a5428'; c.strokeStyle = '#2a160a'; c.lineWidth = 3;
  c.beginPath(); c.rect(x - w / 2, y - h / 2, Math.max(4, doorW), h); c.fill(); c.stroke();
  c.beginPath(); c.arc(x - w / 2 + Math.max(4, doorW) - 7, y + h * 0.05, 3, 0, Math.PI * 2); c.fillStyle = '#f8c23c'; c.fill();
  c.restore();
}

/* ---------- 遊戲用煎餅：把斜角的煎餅圖「拉正」成俯視圓形 ---------- */
// 煎餅圖（裁切後 1213×947）頂面橢圓的位置
const PC_TOP_ELLIPSE = { cx: 606, cy: 428, rx: 604, ry: 424 };
let pcTopCanvas = null, pcTint = null;
function buildPcTop() {
  const im = IMG.pc; if (!imgReady(im)) return null;
  const E = PC_TOP_ELLIPSE, S = 512, k = S / (E.rx * 2);
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = S;
  const c = cv2.getContext('2d');
  c.beginPath(); c.arc(S / 2, S / 2, S / 2 - 1, 0, Math.PI * 2); c.clip();
  // 水平照原比例、垂直拉長 rx/ry 倍，頂面就變成圓的
  c.drawImage(im, (-E.cx + E.rx) * k, (-E.cy + E.ry) * k * (E.rx / E.ry), im.naturalWidth * k, im.naturalHeight * k * (E.rx / E.ry));
  // 餅緣描邊
  c.lineWidth = 6; c.strokeStyle = 'rgba(90,45,12,0.9)'; c.beginPath(); c.arc(S / 2, S / 2, S / 2 - 3, 0, Math.PI * 2); c.stroke();
  pcTint = document.createElement('canvas'); pcTint.width = pcTint.height = S;
  return cv2;
}
// 朝上那面的熟度 → 疊在圖上的顏色
function upTint(t) {
  if (t < CONFIG.rawUntil) return [250, 240, 205, 0.62 - 0.25 * (t / CONFIG.rawUntil)];
  if (t < CONFIG.goldenUntil) return null;
  if (t < CONFIG.burntAt) return [95, 45, 10, 0.25 + 0.4 * (t - CONFIG.goldenUntil) / (CONFIG.burntAt - CONFIG.goldenUntil)];
  return [20, 14, 12, 0.92];
}

function drawPancake(c, x, y, r, upT, downT, noodles, o = {}) {
  if (!pcTopCanvas) pcTopCanvas = buildPcTop();
  if (pcTopCanvas) return drawPancakeImg(c, x, y, r, upT, downT, o);
  drawPancakeOld(c, x, y, r, upT, downT, noodles, o);
}
function drawPancakeImg(c, x, y, r, upT, downT, o) {
  c.save();
  c.translate(x, y);
  if (o.rot) c.rotate(o.rot);
  if (o.sx != null) c.scale(o.sx, o.sy == null ? 1 : o.sy);
  c.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (!o.noHalo) {
    const hc = haloColor(downT);
    const g = c.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 1.36);
    g.addColorStop(0, rgba(hc, 1)); g.addColorStop(0.45, rgba(hc, 0.75)); g.addColorStop(1, rgba(hc, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 1.36, 0, Math.PI * 2); c.fill();
  }
  const tint = upTint(o.black ? 99 : upT);
  let src = pcTopCanvas;
  if (tint) {
    const tc = pcTint.getContext('2d');
    tc.globalCompositeOperation = 'copy'; tc.drawImage(pcTopCanvas, 0, 0);
    tc.globalCompositeOperation = 'source-atop'; tc.fillStyle = rgba(tint, tint[3]); tc.fillRect(0, 0, pcTint.width, pcTint.height);
    tc.globalCompositeOperation = 'source-over';
    src = pcTint;
  }
  c.drawImage(src, -r, -r, r * 2, r * 2);
  c.restore();
}

function drawPancakeOld(c, x, y, r, upT, downT, noodles, o = {}) {
  c.save();
  c.translate(x, y);
  if (o.rot) c.rotate(o.rot);
  if (o.sx != null) c.scale(o.sx, o.sy == null ? 1 : o.sy);
  c.globalAlpha = o.alpha == null ? 1 : o.alpha;
  // 外圍光暈 = 朝下那面
  if (!o.noHalo) {
    const hc = haloColor(downT);
    const g = c.createRadialGradient(0, 0, r * 0.88, 0, 0, r * 1.32);
    g.addColorStop(0, rgba(hc, 1)); g.addColorStop(0.45, rgba(hc, 0.75)); g.addColorStop(1, rgba(hc, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 1.32, 0, Math.PI * 2); c.fill();
  }
  // 本體 = 朝上那面
  const bc = o.black ? [22, 18, 16] : bodyColor(upT);
  c.fillStyle = rgba(bc); c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  c.strokeStyle = rgba(shade(bc, 0.78)); c.lineWidth = Math.max(1.5, r * 0.05); c.stroke();
  drawNoodles(c, 0, 0, r, noodles, rgba(shade(bc, o.black ? 1.8 : 0.8)), Math.max(1.2, r * 0.05));
  drawNoodles(c, -r * 0.02, -r * 0.03, r, noodles.slice(0, 5), rgba(shade(bc, 1.12), 0.55), Math.max(0.8, r * 0.022));
  c.restore();
}

function drawKitchen(t) {
  const c = ctx;
  c.fillStyle = '#0d0b0a'; c.fillRect(0, 0, W, H);
  // 地板磁磚（很暗）
  c.strokeStyle = 'rgba(255,255,255,0.025)'; c.lineWidth = 1;
  for (let x = 0; x < W; x += 48) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = 0; y < H; y += 48) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  // 爐火的光
  const flick = 0.9 + Math.sin(t * 13) * 0.04 + Math.sin(t * 7.3) * 0.04;
  const g = c.createRadialGradient(L.cx, L.cy, L.R * 0.6, L.cx, L.cy, L.R * 2.4);
  g.addColorStop(0, `rgba(255,140,50,${0.28 * flick})`); g.addColorStop(0.5, `rgba(255,90,20,${0.08 * flick})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // 爐架
  c.strokeStyle = '#26221f'; c.lineWidth = 6;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    c.beginPath(); c.moveTo(L.cx + Math.cos(a) * L.R * 0.95, L.cy + Math.sin(a) * L.R * 0.95); c.lineTo(L.cx + Math.cos(a) * L.R * 1.35, L.cy + Math.sin(a) * L.R * 1.35); c.stroke();
  }
  // 藍色火焰
  for (let i = 0; i < 22; i++) {
    const a = i / 22 * Math.PI * 2 + t * 0.2;
    const fl = 0.7 + Math.sin(t * 20 + i * 2.1) * 0.3;
    const r0 = L.R * 1.07, r1 = L.R * (1.15 + 0.06 * fl);
    c.fillStyle = `rgba(80,140,255,${0.55 * fl})`;
    c.beginPath();
    c.moveTo(L.cx + Math.cos(a - 0.06) * r0, L.cy + Math.sin(a - 0.06) * r0);
    c.lineTo(L.cx + Math.cos(a) * r1, L.cy + Math.sin(a) * r1);
    c.lineTo(L.cx + Math.cos(a + 0.06) * r0, L.cy + Math.sin(a + 0.06) * r0);
    c.fill();
  }
}

function drawPan(warn) {
  const c = ctx, { cx, cy, R } = L;
  // 把手（往左下）
  const ha = Math.PI * 0.68;
  c.lineCap = 'round';
  c.strokeStyle = '#151517'; c.lineWidth = R * 0.2;
  c.beginPath(); c.moveTo(cx + Math.cos(ha) * R, cy + Math.sin(ha) * R); c.lineTo(cx + Math.cos(ha) * R * 1.75, cy + Math.sin(ha) * R * 1.75); c.stroke();
  c.strokeStyle = '#2b2b30'; c.lineWidth = R * 0.12;
  c.beginPath(); c.moveTo(cx + Math.cos(ha) * R * 1.15, cy + Math.sin(ha) * R * 1.15); c.lineTo(cx + Math.cos(ha) * R * 1.72, cy + Math.sin(ha) * R * 1.72); c.stroke();
  // 鍋緣
  c.fillStyle = '#3d3d44'; c.beginPath(); c.arc(cx, cy, R * 1.07, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#5a5a63'; c.lineWidth = 2; c.stroke();
  // 鍋面
  const g = c.createRadialGradient(cx - R * 0.2, cy - R * 0.25, R * 0.1, cx, cy, R);
  g.addColorStop(0, '#3a3a41'); g.addColorStop(1, '#19191c');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
  // 油光
  c.fillStyle = 'rgba(255,220,150,0.05)';
  c.beginPath(); c.ellipse(cx - R * 0.3, cy - R * 0.35, R * 0.35, R * 0.18, -0.6, 0, Math.PI * 2); c.fill();
  if (warn > 0) {
    c.strokeStyle = `rgba(255,60,40,${warn * (0.5 + 0.5 * Math.sin(now() * 18))})`;
    c.lineWidth = 6; c.beginPath(); c.arc(cx, cy, R * 1.03, 0, Math.PI * 2); c.stroke();
  }
}

function drawPlate(c, px, py, pr, plate, rawCount, t) {
  c.save();
  c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(px + 3, py + 5, pr, pr * 0.92, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#e9e4da'; c.beginPath(); c.arc(px, py, pr, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#d6cfc2'; c.beginPath(); c.arc(px, py, pr * 0.72, 0, Math.PI * 2); c.fill();
  // 軟掉的生煎餅掛在盤子邊
  for (let i = 0; i < rawCount; i++) {
    const a = -Math.PI * 0.15 + i * 0.7;
    c.save(); c.translate(px + Math.cos(a) * pr * 0.95, py + Math.sin(a) * pr * 0.95); c.rotate(a + Math.PI / 2);
    c.fillStyle = '#eadfae'; c.beginPath(); c.ellipse(0, 0, pr * 0.42, pr * 0.2, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#eadfae'; c.beginPath(); c.ellipse(pr * 0.05, pr * 0.18, pr * 0.15, pr * 0.22, 0.3, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  plate.forEach((kind, i) => {
    const yy = py - i * 5;
    const pt = kind === 'perfect' ? 1.6 : 2.3;
    if (kind === 'perfect') {
      const gl = 0.5 + 0.5 * Math.sin(t * 5 + i);
      const g = c.createRadialGradient(px, yy, pr * 0.4, px, yy, pr * 0.95);
      g.addColorStop(0, `rgba(255,215,80,${0.35 + 0.3 * gl})`); g.addColorStop(1, 'rgba(255,215,80,0)');
      c.fillStyle = g; c.beginPath(); c.arc(px, yy, pr * 0.95, 0, Math.PI * 2); c.fill();
    }
    drawPancake(c, px, yy, pr * 0.62, pt, pt, PLATE_NOODLES, { noHalo: true });
  });
  c.restore();
}
const PLATE_NOODLES = genNoodles(mulberry32(7));

/* ---------- 插畫風泡麵煎餅（參考圖：酥脆餅皮＋高麗菜＋麵條＋醬汁＋美乃滋＋蔥花） ----------
   c: context, (x,y): 頂面中心, r: 半徑
   o.sy: 透視壓扁（1 = 正上方俯視）, o.thick: 厚度（相對 r）, o.seed: 亂數種子 */
function drawOkonomiyaki(c, x, y, r, o = {}) {
  const sy = o.sy == null ? 1 : o.sy, thick = (o.thick || 0) * r, seed = o.seed || 3;
  const rand = mulberry32(seed);
  const TAU = Math.PI * 2;
  const ph = [0, 0, 0, 0, 0].map(() => rand() * TAU);
  // 波浪狀的餅緣
  const edgeR = (a, k = 1) => 1 + k * (0.022 * Math.sin(a * 5 + ph[0]) + 0.014 * Math.sin(a * 12 + ph[1]) + 0.007 * Math.sin(a * 27 + ph[2]));
  const cabR = (a) => 0.85 + 0.025 * Math.sin(a * 8 + ph[3]) + 0.018 * Math.sin(a * 19 + ph[4]) + 0.008 * Math.sin(a * 41);
  const P = (u, v, dy = 0) => [x + u * r, y + v * r * sy + dy];
  const lw = (k) => Math.max(0.6, r * k);
  function shape(fn, n = 120, dy = 0) {
    c.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = i / n * TAU, e = fn(a), p = P(Math.cos(a) * e, Math.sin(a) * e, dy);
      i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]);
    }
    c.closePath();
  }
  function line(pts, w, col, du = 0, dv = 0) {
    if (pts.length < 2) return;
    c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    pts.forEach((p, i) => { const q = P(p[0] + du, p[1] + dv); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); });
    c.stroke();
  }
  function dot(u, v, rad, col) { const q = P(u, v); c.fillStyle = col; c.beginPath(); c.ellipse(q[0], q[1], rad, rad * Math.max(0.6, sy), 0, 0, TAU); c.fill(); }
  const pick = (arr) => { let t = rand(), acc = 0; for (const [p, v] of arr) { acc += p; if (t <= acc) return v; } return arr[arr.length - 1][1]; };

  c.save();
  // ---------- 影子 ----------
  c.fillStyle = 'rgba(0,0,0,0.4)';
  c.beginPath(); c.ellipse(x + r * 0.03, y + thick + r * 0.06 * sy, r * 1.05, r * 1.02 * sy, 0, 0, TAU); c.fill();

  // ---------- 側面：蛋麵糊＋麵條一層層 ----------
  if (thick > 0) {
    const sidePath = () => {
      c.beginPath();
      const n = 90;
      for (let i = 0; i <= n; i++) { const a = i / n * Math.PI, e = edgeR(a), p = P(Math.cos(a) * e, Math.sin(a) * e); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
      for (let i = n; i >= 0; i--) { const a = i / n * Math.PI, e = edgeR(a) * 0.985, p = P(Math.cos(a) * e, Math.sin(a) * e, thick); c.lineTo(p[0], p[1]); }
      c.closePath();
    };
    sidePath();
    const sg = c.createLinearGradient(0, y, 0, y + r * sy + thick);
    sg.addColorStop(0, '#f2d27e'); sg.addColorStop(0.55, '#e6b45c'); sg.addColorStop(0.85, '#c88434'); sg.addColorStop(1, '#8e5018');
    c.fillStyle = sg; c.fill();
    c.save(); sidePath(); c.clip();
    // 焦色斑
    for (let i = 0; i < 70; i++) {
      const a = rand() * Math.PI, e = edgeR(a), h = thick * (0.2 + rand() * 0.8), q = P(Math.cos(a) * e, Math.sin(a) * e, h);
      c.fillStyle = `rgba(140,72,20,${0.15 + rand() * 0.3})`;
      c.beginPath(); c.ellipse(q[0], q[1], r * (0.02 + rand() * 0.05), thick * (0.08 + rand() * 0.15), 0, 0, TAU); c.fill();
    }
    // 一條條麵
    for (let j = 0; j < 7; j++) {
      const base = thick * (0.12 + j * 0.13), pts = [];
      const a0 = rand() * 0.3, a1 = Math.PI - rand() * 0.3, f = 10 + rand() * 10, amp = thick * (0.04 + rand() * 0.05), p0 = rand() * TAU;
      for (let a = a0; a <= a1; a += 0.03) {
        const e = edgeR(a); const q = P(Math.cos(a) * e, Math.sin(a) * e, base + Math.sin(a * f + p0) * amp);
        pts.push(q);
      }
      const draw = (w, col) => { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.stroke(); };
      draw(lw(0.026), 'rgba(150,90,30,0.55)');
      draw(lw(0.014), j % 2 ? '#fbe7ad' : '#f5d98e');
    }
    c.restore();
    sidePath(); c.strokeStyle = '#6a3a12'; c.lineWidth = lw(0.01); c.stroke();
  }

  // ---------- 頂面：酥脆餅皮 ----------
  const g = c.createRadialGradient(x, y, r * 0.3, x, y, r * 1.02);
  g.addColorStop(0, '#e9a640'); g.addColorStop(0.8, '#dc8f2c'); g.addColorStop(1, '#b0631c');
  c.fillStyle = g; shape(edgeR); c.fill();
  // 斑點
  for (let i = 0; i < 260; i++) {
    const a = rand() * TAU, rr = 0.76 + rand() * 0.22;
    dot(Math.cos(a) * rr, Math.sin(a) * rr, r * (0.004 + rand() * 0.012), pick([[0.7, 'rgba(120,52,10,0.55)'], [0.3, 'rgba(255,214,120,0.6)']]));
  }
  // 餅緣的麵條
  for (let i = 0; i < 18; i++) {
    const a0 = rand() * TAU, len = 0.25 + rand() * 0.5, rr = 0.83 + rand() * 0.12, pts = [], f = 8 + rand() * 8;
    for (let a = a0; a <= a0 + len; a += 0.03) { const rad = rr + Math.sin(a * f) * 0.015; pts.push([Math.cos(a) * rad, Math.sin(a) * rad]); }
    line(pts, lw(0.03), 'rgba(140,80,25,0.7)');
    line(pts, lw(0.016), pick([[0.6, '#f7d88a'], [0.4, '#eec06a']]));
  }
  shape(edgeR); c.strokeStyle = '#6a3a12'; c.lineWidth = lw(0.012); c.stroke();

  // ---------- 高麗菜絲 ----------
  c.fillStyle = 'rgba(40,70,10,0.35)'; shape(a => cabR(a) + 0.02, 160, r * 0.02); c.fill();
  c.fillStyle = '#74c236'; shape(cabR, 160); c.fill();
  c.save(); shape(cabR, 160); c.clip();
  for (let i = 0; i < 520; i++) {
    const a = rand() * TAU, rr = Math.sqrt(rand()) * 0.86;
    const u = Math.cos(a) * rr, v = Math.sin(a) * rr;
    const dir = a + Math.PI / 2 + (rand() - 0.5) * 1.1, l = 0.04 + rand() * 0.09, bend = (rand() - 0.5) * 0.05;
    const nx = -Math.sin(dir), ny = Math.cos(dir);
    const pts = [[u - Math.cos(dir) * l, v - Math.sin(dir) * l], [u + nx * bend, v + ny * bend], [u + Math.cos(dir) * l, v + Math.sin(dir) * l]];
    line(pts, lw(0.006 + rand() * 0.01), pick([[0.3, '#3f8f18'], [0.2, '#62b02a'], [0.25, '#a8e264'], [0.25, '#e4f8bf']]));
  }
  c.restore();
  shape(cabR, 160); c.strokeStyle = '#3f861c'; c.lineWidth = lw(0.008); c.stroke();

  // ---------- 中間煎得焦香、麵條排成一條條 ----------
  const pa = -0.5, ca = Math.cos(pa), sa = Math.sin(pa);
  const rot = (s, t) => [ca * s - sa * t, sa * s + ca * t];
  const patchPath = () => {
    c.beginPath();
    for (let i = 0; i <= 80; i++) {
      const a = i / 80 * TAU, k = 1 + 0.08 * Math.sin(a * 7 + ph[1]) + 0.05 * Math.sin(a * 13);
      const p = rot(Math.cos(a) * 0.56 * k, Math.sin(a) * 0.36 * k), q = P(p[0], p[1]);
      i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]);
    }
    c.closePath();
  };
  patchPath(); c.fillStyle = '#b87436'; c.fill();
  c.save(); patchPath(); c.clip();
  for (let k = -9; k <= 9; k++) {
    const pts = [];
    for (let s = -0.7; s <= 0.7; s += 0.03) pts.push(rot(s, k * 0.042 + Math.sin(s * 9 + k) * 0.008));
    line(pts, lw(0.03), 'rgba(110,55,15,0.6)');
    line(pts, lw(0.016), pick([[0.6, '#f0cf87'], [0.4, '#e2b468']]));
  }
  for (let i = 0; i < 60; i++) { const p = rot((rand() - 0.5) * 1.1, (rand() - 0.5) * 0.7); dot(p[0], p[1], r * (0.004 + rand() * 0.01), 'rgba(80,35,8,0.7)'); }
  c.restore();
  // 邊界再補幾根高麗菜蓋過去
  for (let i = 0; i < 70; i++) {
    const a = rand() * TAU, k = 0.95 + rand() * 0.15, p = rot(Math.cos(a) * 0.56 * k, Math.sin(a) * 0.36 * k), dir = rand() * Math.PI, l = 0.04 + rand() * 0.05;
    line([[p[0] - Math.cos(dir) * l, p[1] - Math.sin(dir) * l], [p[0] + Math.cos(dir) * l, p[1] + Math.sin(dir) * l]], lw(0.01), pick([[0.4, '#5aa82a'], [0.3, '#9fd666'], [0.3, '#e2f5bf']]));
  }

  // ---------- 醬汁與美乃滋 ----------
  function drizzle(d, R, amp, phase, angle) {
    const ux = Math.cos(angle), uy = Math.sin(angle), nx = -uy, ny = ux;
    const Lh = Math.sqrt(Math.max(0, R * R - d * d)) * (0.85 + rand() * 0.12);
