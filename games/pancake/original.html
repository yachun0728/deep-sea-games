const SCREENS = ['s-title', 's-perm', 's-calib', 's-revive', 's-low', 's-ad', 's-result'];
function showScreen(id) { for (const s of SCREENS) $(s).classList.toggle('show', s === id); }

// 開火
$('btn-fire').addEventListener('click', () => {
  Snd.init(); Snd.click();
  Wallet.tick(Date.now());
  if (!Wallet.canStart()) { track('low_points', { balance: Wallet.bal }); showLow(null); return; }
  const DM = window.DeviceMotionEvent, DO = window.DeviceOrientationEvent;
  if (DM && typeof DM.requestPermission === 'function') {
    // iPhone：一定要在點擊事件裡同步呼叫
    let pMotion;
    try { pMotion = DM.requestPermission(); } catch (e) { pMotion = Promise.reject(e); }
    let pOrient = Promise.resolve('granted');
    if (DO && typeof DO.requestPermission === 'function') { try { pOrient = DO.requestPermission(); } catch (e) { pOrient = Promise.resolve('denied'); } }
    Promise.all([pMotion.catch(() => 'denied'), pOrient.catch(() => 'denied')]).then(([rm, ro]) => {
      if (rm === 'granted' || ro === 'granted') { track('permission_result', { result: 'granted' }); sensorCheck(); }
      else { track('permission_result', { result: 'denied' }); showDenied(); }
    });
  } else {
    track('permission_result', { result: 'not_needed' });
    sensorCheck();
  }
});

function permScreen(emoji, msg, sub, copy, touch) {
  appState = 'perm'; showScreen('s-perm');
  $('perm-emoji').textContent = emoji; $('perm-msg').textContent = msg; $('perm-sub').textContent = sub || '';
  $('btn-copyurl').classList.toggle('hidden', !copy); $('btn-touch').classList.toggle('hidden', !touch);
}
function showDenied() { permScreen('🙆', '沒關係，可以用手指玩', '按住拖曳＝晃，快速上滑放開＝翻面', false, true); }

function sensorCheck() {
  permScreen('📱', '感應器檢查中…', '', false, false);
  const t0 = now();
  const iv = setInterval(() => {
    if (Input.sensorSeen) {
      clearInterval(iv); track('sensor_check', { received: true });
      inputMode = 'motion'; startCalib();
    } else if (now() - t0 > CONFIG.sensorTimeout) {
      clearInterval(iv); track('sensor_check', { received: false });
      if (IS_MOBILE) permScreen('🤷', '這裡讀不到動作感應，請用 Safari / Chrome 開啟', IN_APP ? '（看起來你是從 App 裡打開的）' : '', true, true);
      else permScreen('💻', '這裡讀不到動作感應，請用 Safari / Chrome 開啟', '在電腦上可以用滑鼠拖曳或方向鍵＋空白鍵玩', true, true);
    }
  }, 100);
}

$('btn-copyurl').addEventListener('click', async () => { Snd.click(); const ok = await copyText(cleanUrl()); toast(ok ? '已複製網址，貼到 Safari / Chrome 開啟' : cleanUrl()); });
$('btn-touch').addEventListener('click', () => { Snd.init(); Snd.click(); inputMode = 'touch'; startGame(); });
$('btn-calib-touch').addEventListener('click', () => { Snd.click(); inputMode = 'touch'; calib = null; startGame(); });

// 校準
let calib = null;
function savedCalib() { try { const c = JSON.parse(lsGet(CALIB_KEY) || 'null'); return c && c.force ? c : null; } catch (e) { return null; } }
function startCalib() {
  appState = 'calib'; showScreen('s-calib');
  calib = { step: 1, t: 0, samples: [] };
  Input.shakeHandler = null;
  $('calib-emoji').textContent = '🍳';
  $('calib-msg').textContent = '把手機拿平，像拿著平底鍋';
  $('btn-calib-touch').classList.add('hidden');
  $('btn-skip-calib').classList.toggle('hidden', !savedCalib());
}
$('btn-skip-calib').addEventListener('click', () => {
  Snd.click(); const c = savedCalib(); if (!c) return;
  Input.base = { b: c.b, g: c.g }; Input.force = c.force; calib = null; startGame();
});
function updateCalib(dt) {
  if (!calib) return;
  calib.t += dt;
  if (calib.step === 1) {
    $('calib-count').textContent = Math.max(1, Math.ceil(2 - calib.t));
    if (calib.t > 1.2 && Input.beta != null) calib.samples.push([Input.beta, Input.gamma]);
    if (calib.t >= 2) {
      if (calib.samples.length) {
        const n = calib.samples.length;
        Input.base = { b: calib.samples.reduce((a, s) => a + s[0], 0) / n, g: calib.samples.reduce((a, s) => a + s[1], 0) / n };
      } else Input.base = { b: Input.beta || 0, g: Input.gamma || 0 };
      Snd.click();
      calib.step = 2; calib.t = 0;
      $('calib-emoji').textContent = '💪';
      $('calib-msg').textContent = '用力往上搖一下試試看！';
      $('calib-count').textContent = '⬆️';
      Input.cooldownUntil = 0; Input.peak = null;
      Input.shakeHandler = (ratio, raw) => {
        if (!calib || calib.step !== 2) return;
        const force = Math.max(raw, CONFIG.shakeMinAccel * 1.25);
        Input.force = force;
        lsSet(CALIB_KEY, JSON.stringify({ b: Input.base.b, g: Input.base.g, force }));
        track('calibration_done', { force: +force.toFixed(2), raw: +raw.toFixed(2) });
        Snd.perfect(); vibrate(40);
        calib.step = 3; calib.t = 0;
        $('calib-emoji').textContent = '👌';
        $('calib-msg').textContent = 'OK，開始煎！';
        $('calib-count').textContent = '';
        $('btn-calib-touch').classList.add('hidden');
        Input.shakeHandler = null;
      };
    }
  } else if (calib.step === 2) {
    if (calib.t > 6) $('btn-calib-touch').classList.remove('hidden');
  } else if (calib.step === 3) {
    if (calib.t >= 1.2) { calib = null; startGame(); }
  }
}

// 續命
function showRevive() {
  appState = 'revive'; showScreen('s-revive'); Snd.sizzle(0);
  if (HOST) HOST.pause(window);
  $('revive-sub').textContent = `已經煎好 ${G.served} / ${CONFIG.level1Target} 片`;
  $('buy-note').textContent = '';
  renderReviveButtons(); renderWallet();
  setHint();
}
function renderReviveButtons() {
  const free = Wallet.isFree();
  $('btn-free').classList.toggle('hidden', !free);
  $('btn-ad').classList.toggle('hidden', free);
  const b = $('btn-buy');
  b.innerHTML = `💰 用 ${CONFIG.buyNoodlesCost} 點換 ${CONFIG.buyNoodlesAmount} 包泡麵`;
  b.classList.toggle('dim', Wallet.bal < CONFIG.buyNoodlesCost);
}
function resumeWithLives(n, msg) {
  G.lives = clamp(n, 1, CONFIG.maxLives); Snd.life();
  if (HOST) HOST.resume(window);
  appState = 'play'; showScreen(null);
  toast(msg);
  newPancake();
}
// 看廣告 → 30 分鐘不扣點（開局免費、泡麵用完免費補）
let adCtx = null;
function startAd(from) {
  track('fake_ad_click', { pancakes: G ? G.served : 0, from, balance: Wallet.bal });
  adCtx = { from, t: CONFIG.fakeAdSeconds };
  appState = 'ad'; showScreen('s-ad'); $('ad-count').textContent = CONFIG.fakeAdSeconds;
}
$('btn-ad').addEventListener('click', () => { Snd.click(); if (G) G.adUsed++; startAd('revive'); });
$('btn-free').addEventListener('click', () => {
  Snd.click(); if (!Wallet.isFree()) { renderReviveButtons(); return; }
  track('free_refill', { pancakes: G.served, left_sec: Math.round(Wallet.freeLeftMs() / 1000) });
  resumeWithLives(CONFIG.freeRefillLives, `免費補 ${CONFIG.freeRefillLives} 包 🍜 繼續煎！`);
});
$('btn-buy').addEventListener('click', () => {
  Snd.click(); Wallet.tick(Date.now());
  if (!Wallet.spend(CONFIG.buyNoodlesCost)) {
    track('points_buy_fail', { pancakes: G.served, balance: Wallet.bal });
    $('buy-note').textContent = `點數不夠（需要 ${CONFIG.buyNoodlesCost} 點），可以先看廣告 📺`;
    Snd.stuck(); return;
  }
  track('points_buy', { pancakes: G.served, cost: CONFIG.buyNoodlesCost, noodles: CONFIG.buyNoodlesAmount, balance: Wallet.bal });
  renderWallet();
  resumeWithLives(CONFIG.buyNoodlesAmount, `-${CONFIG.buyNoodlesCost} 點，泡麵 +${CONFIG.buyNoodlesAmount} 包 🍜`);
});
$('btn-sleep').addEventListener('click', () => { Snd.click(); G.ended = true; showResult(); });
function updateAd(dt) {
  adCtx.t -= dt;
  $('ad-count').textContent = Math.max(0, Math.ceil(adCtx.t));
  if (adCtx.t <= 0) {
    Wallet.grantFree(CONFIG.adFreeMinutes);
    track('fake_ad_complete', { pancakes: G ? G.served : 0, from: adCtx.from, free_minutes: CONFIG.adFreeMinutes });
    const from = adCtx.from; adCtx = null;
    if (from === 'revive') resumeWithLives(CONFIG.freeRefillLives, `接下來 ${CONFIG.adFreeMinutes} 分鐘不扣點，泡麵補滿 🍜`);
    else { toast(`接下來 ${CONFIG.adFreeMinutes} 分鐘不扣點 🎟️`); const n = lowNext; lowNext = null; if (n) n(); else { appState = 'title'; showScreen('s-title'); } }
  }
}
// 點數不足
let lowNext = null;
function showLow(next) {
  lowNext = next; appState = 'low'; showScreen('s-low');
  $('hud').classList.add('hidden'); renderWallet();
}
$('btn-low-ad').addEventListener('click', () => { Snd.click(); startAd('low_points'); });
$('btn-low-back').addEventListener('click', () => { Snd.click(); lowNext = null; G = null; appState = 'title'; showScreen('s-title'); });

// 結算
function rankOf() {
  if (G.passed && G.plate.length >= CONFIG.level1Target && G.plate.every(k => k === 'perfect')) return '宵夜之神';
  if (G.passed) return '宿舍廚神';
  if (G.served >= 1) return '宵夜新手';
  return '連泡麵都會煮壞';
}
function showResult() {
  appState = 'result'; Snd.sizzle(0);
  if (!G.passed) Snd.sad();
  $('hud').classList.add('hidden'); setHint();
  showScreen('s-result');
  $('r-title').textContent = G.passed ? '第 1 晚完成！今晚吃飽了 🍜' : '第 1 晚失敗……今晚餓肚子 😢';
  const rank = rankOf(); G.rank = rank;
  $('r-rank').textContent = rank;
  const notes = [];
  if (G.fails.ceiling >= 2) notes.push('房東明天會來找你');
  if (G.fails.floor >= 2) notes.push('貓今天吃得比你好');
  if (G.fails.mom >= 1) notes.push('明天早餐桌上會很尷尬');
  $('r-notes').innerHTML = notes.map(n => '・' + n).join('<br>');
  $('r-stats').textContent = `煎好 ${G.served} 片（完美 ${G.perfectCount}）・天花板 ${G.fails.ceiling}・貓 ${G.fails.floor}・黑炭 ${G.fails.burnt}・被抓 ${G.fails.mom}`;
  track('game_over', { passed: G.passed, pancakes: G.served, fails: { ...G.fails }, play_seconds: Math.round(G.playTime) });
  if (HOST && !G.hostFinished) { G.hostFinished = true; HOST.finish(window, { served: G.served, perfect: G.perfectCount, passed: G.passed }); }
  setupResultCanvas();
}
let rctx = null, RW = 340, RH = 200;
function setupResultCanvas() {
  const rc = $('rcv'); const r = rc.getBoundingClientRect();
  RW = r.width || 320; RH = r.height || 200;
  rc.width = Math.round(RW * DPR); rc.height = Math.round(RH * DPR);
  rctx = rc.getContext('2d');
}
function drawResult(t) {
  if (!rctx) return;
  const c = rctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 牆
  c.fillStyle = '#2b2420'; c.fillRect(0, 0, RW, RH);
  // 天花板
  c.fillStyle = '#3b332c'; c.fillRect(0, 0, RW, 46);
  c.fillStyle = '#4a4038'; c.fillRect(0, 44, RW, 3);
  const nC = G.fails.ceiling;
  for (let i = 0; i < nC; i++) {
    const s = G.splats[i] || { seed: i + 1, rot: i, noodles: PLATE_NOODLES };
    const x = nC === 1 ? RW / 2 : 30 + i * ((RW - 60) / Math.max(1, nC - 1));
    drawSplat(c, s, x, 22, 16, 0.85);
  }
  // 桌子
  c.fillStyle = '#5a3d26'; c.fillRect(0, RH - 60, RW, 60);
  c.fillStyle = '#6e4b2f'; c.fillRect(0, RH - 60, RW, 6);
  // 盤子
  drawPlate(c, RW / 2, RH - 62, 40, G.plate, G.rawPlate, t);
  // 垃圾桶 + 黑炭
  const bx = 42, by = RH - 30;
  for (let i = 0; i < G.fails.burnt; i++) {
    c.fillStyle = '#141010'; c.beginPath(); c.arc(bx - 10 + (i % 3) * 10, by - 38 - Math.floor(i / 3) * 8, 8, 0, Math.PI * 2); c.fill();
  }
  c.fillStyle = '#6b6f75'; c.beginPath(); c.moveTo(bx - 22, by - 36); c.lineTo(bx + 22, by - 36); c.lineTo(bx + 17, by + 10); c.lineTo(bx - 17, by + 10); c.closePath(); c.fill();
  c.strokeStyle = '#555a60'; c.lineWidth = 2; for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(bx + i * 9, by - 30); c.lineTo(bx + i * 7, by + 6); c.stroke(); }
  if (G.fails.burnt) label(c, '⚫×' + G.fails.burnt, bx, by - 64, '#fbfaf3', 13);
  // 吃很飽的貓
  if (G.fails.floor > 0) {
    c.font = '46px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('🐈', RW - 46, RH - 40 + Math.sin(t * 2) * 1.5);
    label(c, '飽～ ×' + G.fails.floor, RW - 46, RH - 82, '#fbfaf3', 14);
  }
  if (nC) label(c, '天花板 ×' + nC, RW - 50, 58, '#efcf7a', 12);
}
$('btn-retry').addEventListener('click', () => { Snd.click(); track('retry_click', { prev_passed: G.passed }); tryStart(startGame); });
$('btn-share').addEventListener('click', async () => {
  Snd.click();
  const text = `我半夜煎了 ${G.served} 片泡麵煎餅 🍜，天花板糊了 ${G.fails.ceiling} 片，貓吃掉 ${G.fails.floor} 片\n稱號：「${G.rank}」\n你翻得贏我嗎？ ${cleanUrl()}`;
  if (navigator.share) {
    track('share_click', { pancakes: G.served, method: 'native' });
    try { await navigator.share({ text }); } catch (e) {}
  } else {
    track('share_click', { pancakes: G.served, method: 'clipboard' });
    const ok = await copyText(text);
    toast(ok ? '已複製，貼給同事吧！' : '複製失敗，請手動截圖分享 🙏');
  }
});
$('btn-next').addEventListener('click', () => {
  Snd.click();
  track('next_level_interest_click', { passed: G.passed });
  lsSet('noodle_pancake_next_clicks', String((+lsGet('noodle_pancake_next_clicks') || 0) + 1));
  toast('第 2 晚還在準備中，我們會加油的 💪', 3);
});

// 靜音
$('mute').addEventListener('click', (e) => {
  e.stopPropagation(); Snd.init(); Snd.setMuted(!Snd.muted); $('mute').textContent = Snd.muted ? '🔇' : '🔊';
});

// 切到背景
// 平台切換到別的遊戲／回大廳時暫停；回來時倒數 1 秒繼續
window.setPancakePlatformActive = function (active) {
  if (!active) {
    if (appState === 'play' || appState === 'calib') pauseReason = pauseReason || 'platform';
    Snd.sizzle(0); if (Snd.ctx && Snd.ctx.state === 'running') Snd.ctx.suspend();
  } else {
    if (pauseReason === 'platform') { pauseReason = null; resumeCountdown = 1; }
    if (Snd.ctx && !Snd.muted && Snd.ctx.state === 'suspended') Snd.ctx.resume().catch(() => {});
    resize(); heroCtx = null;
  }
};
// 大廳的「結束本局」按鈕
window.finishPancakePlatformRound = function () {
  if (!G || G.hostFinished || !['play', 'revive', 'ad'].includes(appState)) return;
  G.ended = true; adCtx = null; showResult();
};
// iframe 裡的操作不會冒泡到大廳，主動通知有效遊玩時間
if (HOST) {
  let lastTouch = 0;
  const touch = () => { const t = Date.now(); if (t - lastTouch > 3000) { lastTouch = t; try { HOST.touch(window); } catch (_) {} } };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, touch, { capture: true, passive: true }));
  window.addEventListener('devicemotion', () => { if (appState === 'play') touch(); }, { passive: true });
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (appState === 'play') pauseReason = pauseReason || 'hidden'; Snd.sizzle(0); }
  else if (pauseReason === 'hidden') { pauseReason = null; resumeCountdown = 1; }
});

/* =========================================================
   Debug
   ========================================================= */
if (DEBUG) {
  $('debug').classList.remove('hidden');
  $('btn-export').addEventListener('click', () => {
    const data = lsGet(EVENTS_KEY) || '[]';
    const blob = new Blob([JSON.stringify(JSON.parse(data), null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'noodle_pancake_events.json';
    document.body.appendChild(a); a.click(); a.remove();
    copyText(data).then(ok => ok && toast('已下載，也複製到剪貼簿了'));
  });
}
let dbgT = 0;
function updateDebug(dt) {
  if (!DEBUG) return;
  dbgT += dt; if (dbgT < 0.1) return; dbgT = 0;
  const tl = getTilt(), pc = G && G.pc;
  const lines = [
    `mode   ${inputMode}  state ${appState}${pauseReason ? ' (' + pauseReason + ')' : ''}`,
    `beta   ${Input.beta == null ? '-' : Input.beta.toFixed(1)}  gamma ${Input.gamma == null ? '-' : Input.gamma.toFixed(1)}`,
    `tilt   x ${tl.x.toFixed(1)}  y ${tl.y.toFixed(1)}  ${now() < Input.tiltPauseUntil ? '[PAUSED]' : ''}`,
    `accel  ${Input.accelMag.toFixed(2)}  peak ${(+Input.lastPeak || 0).toFixed(2)}  std ${Input.force.toFixed(1)}`,
  ];
  if (pc) {
    lines.push(`phase  ${pc.phase}  side ${pc.side + 1}`);
    lines.push(`stick  ${pc.stick.toFixed(2)}${pc.stuck ? ' STUCK' : ''}  spd ${(pc.speed || 0).toFixed(2)}`);
    lines.push(`done   A ${pc.sides[0].toFixed(2)}  B ${pc.sides[1].toFixed(2)}  (down ${pc.down ? 'B' : 'A'})`);
    if (pc.mom && pc.mom.dTilt != null) lines.push(`momΔ   ${pc.mom.dTilt.toFixed(1)}°`);
  }
  lines.push(`events ${eventCount()}`);
  $('debug-text').textContent = lines.join('\n');
}

/* =========================================================
   主迴圈
   ========================================================= */
let lastT = now(), hintT = 0;
function loop() {
  const t = now();
  const dt = Math.min(0.05, t - lastT); lastT = t;
  // 搖動峰值逾時（沒有新事件時）
  if (Input.peak && t - Input.peak.start > 0.12) resolvePeak();

  const landscape = IS_MOBILE && window.innerWidth > window.innerHeight;
  const rotatable = appState === 'play' || appState === 'calib';
  if (landscape && rotatable) {
    if (pauseReason !== 'rotate') { pauseReason = 'rotate'; track('orientation_pause'); Snd.sizzle(0); }
    $('rotate').classList.add('show');
  } else if (pauseReason === 'rotate') {
    pauseReason = null; $('rotate').classList.remove('show'); resumeCountdown = 1; resize();
  }

  if (!pauseReason) {
    if (resumeCountdown > 0) {
      resumeCountdown -= dt;
      $('countdown').textContent = '1'; $('countdown').classList.toggle('show', resumeCountdown > 0);
    } else {
      if (appState === 'play' && G) updateGame(dt);
      else if (appState === 'calib') updateCalib(dt);
      else if (appState === 'ad') updateAd(dt);
      updateFx(dt);
    }
  }
  // 點數：每秒回點／更新顯示
  loop.wT = (loop.wT || 0) + dt;
  if (loop.wT > 0.5) { loop.wT = 0; Wallet.tick(Date.now()); renderWallet(); }
  // 靜音按鈕只在首頁出現
  const showMute = appState === 'title';
  if (loop.mute !== showMute) { loop.mute = showMute; $('mute').classList.toggle('hidden', !showMute); }
  render();
  if (appState === 'result') drawResult(t);
  hintT += dt; if (hintT > 0.15) { hintT = 0; setHint(); }
  updateDebug(dt);
  requestAnimationFrame(loop);
}

// 開啟紀錄
(function pageOpen() {
  const last = +lsGet('noodle_pancake_last_open') || 0;
  const nowMs = Date.now();
  track('page_open', {
    returning: isReturning,
    hours_since_last: last ? +((nowMs - last) / 3600000).toFixed(2) : null,
    device: DEVICE, in_app_browser: IN_APP,
  });
  lsSet('noodle_pancake_last_open', String(nowMs));
})();
Wallet.load(); renderWallet();
requestAnimationFrame(loop);
</script>
