<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>捷運搶位</title>
<style>
  :root{
    --bg:#000; --card:#0c0c0e; --card2:#131316; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --text:#f5f5f4; --mute:rgba(255,255,255,.52); --mute2:rgba(255,255,255,.36);
    --amber:#f5c26b; --blue:#4f8cff; --red:#ff6b6b; --green:#6ee7a8;
    --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,.9,.3,1.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .lbl{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:500}
  #app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}

  /* ---------- 車窗舞台 ---------- */
  .stage{position:relative;height:clamp(190px,27dvh,250px);flex:none;background:#06080b;overflow:hidden;transform-origin:50% 55%;transition:background-color 1.2s var(--ease)}
  .stage.platform{background:#26303c}
  .stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 40%,#000 100%);pointer-events:none;z-index:2}
  #cv{position:absolute;inset:0;width:100%;height:100%}
  .stage.push{animation:camPush .9s var(--ease)}
  @keyframes camPush{35%{transform:scale(1.05)}100%{transform:scale(1)}}
  .hud{position:absolute;inset:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(14px + env(safe-area-inset-top)) 18px 0;pointer-events:none}
  .hud .lbl{color:rgba(255,255,255,.62)}
  #station{font-size:44px;font-weight:750;letter-spacing:-.04em;line-height:1.05;margin-top:4px;white-space:nowrap}
  #station.swap{animation:swap .6s var(--ease)}
  @keyframes swap{from{opacity:0;transform:translateX(24px)}}
  .chips{display:flex;gap:6px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}
  .chip.xfer{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.3);color:#ffb3b3}
  .hud-r{text-align:right}
  #scoreBox{display:inline-flex;margin-top:4px}
  #scoreBox .roll{font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--amber)}
  #legs{margin-top:6px;font-size:15px;letter-spacing:1px}
  #legs .off{opacity:.18;filter:grayscale(1)}

  .roll{display:inline-flex;font-variant-numeric:tabular-nums}
  .dg{display:inline-block;height:1em;line-height:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
  .dg .st{display:flex;flex-direction:column;transition:transform .7s var(--ease)}
  .dg .st span{display:block;height:1em}

  /* ---------- 進站條 ---------- */
  .meter{padding:4px 18px 0;flex:none;position:relative;z-index:3}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .track{position:relative;height:6px;border-radius:4px;background:#1a1a1d;margin:8px 0}
  #prog{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:linear-gradient(90deg,#c9963f,var(--amber));box-shadow:0 0 12px rgba(245,194,107,.35)}
  #rivalTick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);border-radius:1px;opacity:0;transition:opacity .3s}
  #rivalTick.on{opacity:1}
  .log{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-height:18px}
  .log.in{animation:logIn .45s var(--ease)}
  .log.warn{color:var(--red)}
  .log.good{color:var(--green)}
  @keyframes logIn{from{opacity:0;transform:translateY(6px)}}
  #combo{font-size:12px;font-weight:700;color:var(--amber)}
  #pauseBtn{width:30px;height:30px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--mute)}

  /* ---------- 座位 ---------- */
  .seats{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:6px 10px}
  /* 長條椅：三個座位共用一個不鏽鋼底座與兩側扶手 */
  .bench{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 14px 14px}
  .bench::before,.bench::after{content:"";position:absolute;bottom:4px;width:10px;height:78px;border-radius:5px;background:linear-gradient(90deg,#8c939c,#d9dee4 45%,#7d848d);box-shadow:0 4px 10px rgba(0,0,0,.5);z-index:3}
  .bench::before{left:2px}.bench::after{right:2px}
  .base{position:absolute;left:8px;right:8px;bottom:0;height:12px;border-radius:0 0 8px 8px;background:linear-gradient(#b8bfc7,#6f767f);box-shadow:0 8px 18px rgba(0,0,0,.6)}
  .wall{position:absolute;left:0;right:0;top:44px;bottom:6px;border-radius:14px;background:linear-gradient(#141a22,#0b0e13);border:1px solid var(--line)}

  .seat{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:2px;animation:enter .5s var(--ease) backwards;transition:transform .15s}
  .seat:active{transform:scale(.97)}
  @keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}}

  /* 對話泡泡：從頭上冒出來 */
  .bubble{position:relative;z-index:4;width:100%;height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.28;font-weight:600;padding:5px 6px;border-radius:12px;background:#1b1d21;border:1px solid var(--line2);color:rgba(255,255,255,.9);margin-bottom:7px}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#1b1d21;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:translateX(-50%) rotate(45deg)}
  .bubble.pop{animation:pop .5s var(--ease)}
  @keyframes pop{0%{transform:scale(.86);background:#2a2416;border-color:rgba(245,194,107,.45)}100%{transform:scale(1)}}

  /* 座椅本體：椅背＋乘客＋椅墊 */
  .chair{position:relative;width:100%;height:112px;--s1:#4a8cff;--s2:#2457c9;--s3:#1a3f94}
  .seat.prio .chair{--s1:#5a63b8;--s2:#323a86;--s3:#232a63}
  .back{position:absolute;left:9%;right:9%;top:0;bottom:16px;border-radius:22px 22px 8px 8px;
    background:radial-gradient(70% 55% at 50% 38%,rgba(0,0,0,.22),transparent 70%),linear-gradient(180deg,var(--s1),var(--s2) 70%,var(--s3));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -6px 10px rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.35);transition:filter .3s}
  .back::after{content:"";position:absolute;left:18%;right:18%;top:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
  .prioLbl{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.55)}
  .ava{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:46px;line-height:1;z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));transition:transform .7s var(--ease),opacity .6s}
  .cushion{position:absolute;left:2%;right:2%;bottom:0;height:22px;border-radius:9px 9px 12px 12px;z-index:3;
    background:linear-gradient(180deg,var(--s1),var(--s2) 60%,var(--s3));box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 5px 8px rgba(0,0,0,.45)}

  .hist{font-size:12px;min-height:16px;opacity:.55;letter-spacing:2px;margin-top:6px}
  /* 站在座位前的人 */
  .tag{position:absolute;left:50%;bottom:-6px;z-index:5;transform:translateX(-50%) scale(.6);opacity:0;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;transition:transform .45s var(--spring),opacity .3s}
  .seat.mine .tag{background:var(--amber);color:#000;opacity:1;transform:translateX(-50%) scale(1);box-shadow:0 0 0 3px rgba(245,194,107,.25)}
  .seat.mine .cushion{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 2px var(--amber),0 6px 16px rgba(245,194,107,.35)}
  .seat.rival .tag{background:var(--red);color:#000;opacity:1;transform:translateX(-50%) scale(1)}
  .seat.rival .cushion{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 2px var(--red)}
  .seat.rival .back{filter:brightness(.8)}
  /* 下車：人起身離開，露出空位 */
  .seat.leaving .ava{transform:translate(-50%,-46px) scale(.85);opacity:0}
  .seat.leaving .bubble{color:var(--green);border-color:rgba(110,231,168,.35)}
  .seat.leaving .back{filter:brightness(1.15) saturate(1.1)}
  .seat.leaving .cushion{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 2px var(--green),0 6px 18px rgba(110,231,168,.35)}
  .seat.win .ava{opacity:1;transform:translateX(-50%) scale(1);animation:sitDown .6s var(--spring)}
  @keyframes sitDown{from{transform:translate(-50%,-40px) scale(.8);opacity:0}}
  .seat.shake{animation:shake .32s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---------- 站立區 ---------- */
  footer{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 18px calc(14px + env(safe-area-inset-bottom));min-height:64px}
  .stand{display:flex;align-items:center;gap:10px}
  .token{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--card2);border:1px solid var(--line2);transition:opacity .3s,transform .3s var(--spring)}
  .token.away{opacity:.15;transform:scale(.8)}
  #meToken{border-color:rgba(245,194,107,.5)}
  #auntToken{border-color:rgba(255,107,107,.45)}
  #auntToken.hidden{display:none}
  .standtxt{font-size:12.5px;color:var(--mute);line-height:1.4}
  .standtxt b{color:var(--text);font-weight:600}

  .fly{position:fixed;left:0;top:0;z-index:60;pointer-events:none;font-weight:750;font-size:22px;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;will-change:transform}

  /* ---------- 抽屜 ---------- */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#0e0e10;border-top:1px solid var(--line2);border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .55s var(--spring);max-height:88%;overflow:auto}
  .sheet.open{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 16px}
  .sheet h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px}
  .sheet p{font-size:14px;color:var(--mute);line-height:1.55;margin-bottom:14px}
  .big{font-size:64px;font-weight:750;letter-spacing:-.05em;line-height:1;margin:6px 0 8px;color:var(--amber)}
  .clue{border:1px solid var(--line);border-radius:16px;margin:4px 0 14px;overflow:hidden}
  .clue div{padding:11px 14px;font-size:13px;line-height:1.55;color:rgba(255,255,255,.82);border-bottom:1px solid var(--line)}
  .clue div:last-child{border-bottom:0}
  .clue .lbl{display:block;margin-bottom:3px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:18px;background:var(--text);color:#000;font-size:16px;font-weight:700;margin-top:6px}
  .btn:active{transform:scale(.98)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;margin:14px 0;overflow:hidden}
  .stats div{padding:12px 10px;border-right:1px solid var(--line)}
  .stats div:last-child{border-right:0}
  .stats b{display:block;font-size:18px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
  .titlechip{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:650;padding:7px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);margin-bottom:12px}
  .newbest{color:var(--amber);font-size:13px;font-weight:600;margin-left:8px}

  /* ---------- 開場 ---------- */
  .intro{position:absolute;inset:0;z-index:30;background:radial-gradient(120% 70% at 50% 0%,#2a2416 0%,#0d0c0a 45%,#000 80%);display:flex;flex-direction:column;justify-content:flex-end;padding:28px 24px calc(24px + env(safe-area-inset-bottom));transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .intro.hide{opacity:0;transform:scale(1.04);pointer-events:none}
  .intro .title{font-size:64px;font-weight:800;letter-spacing:-.06em;line-height:.95;margin:10px 0 14px}
  .intro .title span{color:var(--amber)}
  .intro .lead{font-size:15px;color:var(--mute);line-height:1.6;margin-bottom:22px}
  .intro ol{list-style:none;border-top:1px solid var(--line);margin-bottom:24px}
  .intro li{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82)}
  .intro li i{font-style:normal;color:var(--mute2);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
  .intro .hero{position:absolute;top:13%;left:0;right:0;text-align:center;font-size:80px;letter-spacing:-6px;animation:sway 3.2s ease-in-out infinite}
  @keyframes sway{50%{transform:translateY(-8px)}}
  .bestline{font-size:12px;color:var(--mute2);text-align:center;margin-top:12px}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* ---------- v4：連貫車廂、人設、體力 ---------- */
  .chip.zone{background:rgba(245,194,107,.14);border-color:rgba(245,194,107,.3);color:#f7d9a0}
  .stage{height:clamp(170px,25dvh,240px)}
  #stamBox{display:flex;align-items:baseline;gap:5px}
  #stamBox .roll{font-size:20px;font-weight:700;letter-spacing:-.02em}
  #stamBox .of{font-size:12px;color:var(--mute2)}
  .track.stam{height:8px;margin:6px 0 9px}
  #stamFill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:4px;background:linear-gradient(90deg,#3fbf80,var(--green));box-shadow:0 0 12px rgba(110,231,168,.3);transition:width .7s var(--ease),background .4s}
  #stamFill.mid{background:linear-gradient(90deg,#c9963f,var(--amber));box-shadow:0 0 12px rgba(245,194,107,.35)}
  #stamFill.low{background:linear-gradient(90deg,#e04848,var(--red));box-shadow:0 0 12px rgba(255,107,107,.4)}
  .approach{display:flex;align-items:center;gap:10px}
  .approach .track{flex:1;height:4px;margin:0 0 8px}
  .approach .lbl{margin-bottom:8px;font-size:10px}
  .chair{height:clamp(84px,13dvh,112px)}
  .prop{position:absolute;right:-12px;bottom:8px;font-size:19px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .seat.me .cushion{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 2px var(--amber),0 6px 16px rgba(245,194,107,.35)}
  .seat.me .bubble{color:var(--amber);border-color:rgba(245,194,107,.35)}
  .seat.me.leaving .ava,.seat.win .ava{animation:none}
  footer{min-height:54px}
  .sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn small{font-weight:500;opacity:.6;margin-left:6px;font-size:12px}
  .stats.four{grid-template-columns:repeat(4,1fr)}

  /* ---------- v5：階數顯示 ---------- */
  #mult{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--amber);font-variant-numeric:tabular-nums;margin-top:2px;display:inline-block}
  #mult.under{color:rgba(255,255,255,.85)}
  #claim{margin-top:2px;font-size:12px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
  footer{gap:8px}
  .stand.hidden,.seatBtns.hidden{display:none}
  .seatBtns{flex:1;display:grid;grid-template-columns:1fr;gap:8px}
  .fbtn{height:50px;border-radius:16px;background:var(--card2);border:1px solid var(--line2);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
  .fbtn b{font-size:11px;font-weight:600;opacity:.65;font-variant-numeric:tabular-nums}
  .fbtn.gold{background:var(--amber);color:#000;border-color:transparent}
  .fbtn.armed{border-color:var(--green);color:var(--green)}
  .fbtn:active{transform:scale(.97)}
  .rivals{display:flex;gap:6px;margin-left:auto}
  .token.rv{border-color:rgba(255,107,107,.45)}
  .token.rv.hidden{display:none}
  .intro{overflow-y:auto}
  .intro .hero{top:7%;font-size:64px}
  .intro .title{font-size:52px}
  .intro .lead{margin-bottom:14px}
  .intro ol{margin-bottom:14px}
  .betbox{border:1px solid var(--line2);border-radius:18px;padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,.03)}
  .betrow1{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .betrow1 b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--amber)}
  #resetBal{font-size:11px;color:var(--mute);margin-left:10px;text-decoration:underline}
  .betrow2{display:grid;grid-template-columns:48px 1fr 48px 60px;gap:6px}
  .betrow2 button{height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
  .betrow2 input{height:44px;border-radius:12px;background:#000;border:1px solid var(--line2);color:var(--text);font:inherit;font-size:20px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;width:100%;min-width:0;-moz-appearance:textfield}
  .betrow2 input::-webkit-outer-spin-button,.betrow2 input::-webkit-inner-spin-button{-webkit-appearance:none}
  .ladder{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .ladder span{flex:1;min-width:30px;text-align:center;font-size:10.5px;font-variant-numeric:tabular-nums;padding:5px 0;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--mute)}
  .ladder span.pos{color:var(--amber);border-color:rgba(245,194,107,.3)}
  .btn:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div>
        <div class="lbl">下一站</div>
        <div id="station">—</div>
        <div class="chips"><span class="chip" id="nth"></span><span class="chip zone" id="zone"></span></div>
      </div>
      <div class="hud-r">
        <div class="lbl">已搶座位</div>
        <div id="mult">0</div>
        <div id="claim"></div>
      </div>
    </div>
  </section>

  <section class="meter">
    <div class="mrow"><span class="lbl">體力</span><span id="stamBox"><span class="roll" id="stam"></span><span class="of">/ 100</span></span></div>
    <div class="track stam"><div id="stamFill"></div></div>
    <div class="approach"><span class="lbl">進站</span><div class="track"><div id="prog"></div><div id="rivalTick"></div></div></div>
    <div class="mrow"><span class="log" id="log"></span><button id="pauseBtn" aria-label="暫停">❚❚</button></div>
  </section>

  <section class="seats" id="seats"></section>

  <footer>
    <div class="stand" id="standBox"><div class="token" id="meToken">🧍</div><div class="standtxt" id="standTxt"></div></div>
    <div class="seatBtns hidden" id="seatBtns"><button class="fbtn" id="standBtn"></button></div>
    <div class="rivals"><div class="token rv hidden" id="rv0">👵</div><div class="token rv hidden" id="rv1">🧔‍♂️</div></div>
  </footer>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

  <div class="intro" id="intro">
    <div class="hero">🚇</div>
    <div class="lbl">通勤小遊戲</div>
    <div class="title">捷運<br><span>搶位</span></div>

      <li><i>01</i><span>看小動作和隨身物品猜誰要下車，點一下站到他面前</span></li>
      <li><i>02</i><span>坐著時可以休息，準備好再<b style="color:var(--amber)">起身搶下一階</b>。沒搶到會白站、扣體力</span></li>
      <li><i>03</i><span>階數越高，進站越快、線索越不可靠、對手也越多。共 8 階</span></li>

</div>

<script>
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const FAST = /fast/.test(location.hash);   // 測試用：略過動畫
const wait = ms => FAST ? Promise.resolve() : new Promise(res => setTimeout(res, ms));

/* ================= 資料 ================= */
const TRIP = 21, TOP = 8;
// 對手：from = 第幾階開始出現，noise = 判斷多不準，tr = 大約在進站的哪個時間點出手
const RIVALS = [
  { em:'👵', name:'阿姨', from:2, noise:1.5, tr:[.55, .9] },
  { em:'🧔‍♂️', name:'大叔', from:5, noise:3.2, tr:[.3, .6] }
];
const STATIONS = ['南港展覽館','南港','昆陽','後山埤','永春','市政府','國父紀念館','忠孝敦化','忠孝復興','忠孝新生','善導寺','台北車站','西門','龍山寺','江子翠','新埔','板橋','府中','亞東醫院','海山','土城','永寧','頂埔'];
// 人設：隨身物品暗示會在哪一類車站下車（遊戲設定，不是真實統計）
const PERSONA = {
  office:  { label:'上班族',   prop:'💼', zone:'辦公區',     ava:['👨‍💼','👩‍💼'],           st:['市政府','忠孝敦化','南港','板橋','善導寺'] },
  student: { label:'學生',     prop:'📚', zone:'學區',       ava:['🧑‍🎓','👩‍🎓','👨‍🎓'],      st:['忠孝新生','昆陽','海山','國父紀念館'] },
  tourist: { label:'旅客',     prop:'🧳', zone:'轉運・觀光', ava:['🧑','👩','🧔','👱‍♀️'],     st:['台北車站','西門','龍山寺','南港展覽館'] },
  shopper: { label:'逛街的人', prop:'🛍️', zone:'商圈',       ava:['👩‍🦰','👱‍♀️','👩'],        st:['忠孝復興','府中','新埔'] },
  elder:   { label:'長輩',     prop:'🥬', zone:'市場・醫院', ava:['👨‍🦳','👩‍🦳'],           st:['龍山寺','亞東醫院','後山埤','江子翠'] },
  worker:  { label:'師傅',     prop:'🧰', zone:'工業區',     ava:['👨‍🔧','👩‍🔧'],           st:['土城','頂埔','永寧','永春'] },
  normal:  { label:'乘客',     prop:'',   zone:'',           ava:['🧑‍🦱','👨‍🦱','👨','🧑‍💻','👩‍🦱'], st:[] }
};
const TYPES = Object.keys(PERSONA).filter(k => k !== 'normal');
const CUES = {
  strong: [['🎒','背起背包',3],['🧥','拉上外套拉鍊',3],['🎧','拔下耳機收好',3],['📱','把手機收進口袋',3],['📕','闔上書收進包包',3],['☂️','握緊雨傘',3]],
  weak:   [['👀','抬頭看站名',1],['🗺️','在看手機地圖',1],['⌚','看了看手錶',1],['🚪','瞄了車門一眼',1]],
  stay:   [['😴','睡著了',-2],['📖','翻開一本書',-2],['🎮','打開手遊',-2],['🎧','戴上耳機',-2],['📱','專心滑手機',-2],['😪','閉目養神',-2],['📺','開始追劇',-2]],
  neutral:[['🤧','打了個噴嚏',0],['🙆','伸了個懶腰',0],['😐','在發呆',0],['💁','撥了撥頭髮',0],['🙄','調整坐姿',0]],
  fake:   [['🎒','摸了摸背包…又放下',2],['☂️','拿起雨傘…又靠回去',2],['🧥','拉上拉鍊…繼續坐',2]],
  idle:   [['🙂','坐著',0],['😐','發呆中',0],['👜','抱著包包',0],['📱','滑手機',0]],
  final:  ['🚶','站起來走向車門',5]
};
const LOSE_LINES = ['他只是調整一下而已，根本沒要下車。','你在他面前站了一整站。','他還要坐很久…'];

let st = null, r = null, els = [], paused = false, lastTs = 0;
function loadBest() { try { return +localStorage.getItem('mrtBestTier') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('mrtBestTier', v); } catch (e) {} }
// 點數由 Deep Sea Arcade 父頁的共用錢包處理（deepSeaMrt 橋接）；此頁不保存點數
function mrtHost() { try { return window.parent !== window ? window.parent.deepSeaMrt || null : null; } catch (e) { return null; } }
const hostOf = () => st && st.hosted ? mrtHost() : null;
let mrtActive = true;
const inLine = i => i >= 0 && i < STATIONS.length;
const isPax = o => o && o !== 'me';

/* ================= 乘客 ================= */
function aheadOf(at, n) { const a = []; for (let k = 1; k <= n; k++) { const i = at + k * st.dir; if (!inLine(i)) break; a.push(i); } return a; }
function newPax(at, type) {
  const ahead = aheadOf(at, 7);
  if (!type) {
    if (Math.random() < .28) type = 'normal';
    else {
      // 接下來幾站有對應車站的人設比較常上車
      const near = ahead.slice(0, 5).map(i => STATIONS[i]);
      const bag = [];
      TYPES.forEach(t => { const w = PERSONA[t].st.some(s => near.includes(s)) ? 3 : 1; for (let k = 0; k < w; k++) bag.push(t); });
      type = pick(bag);
    }
  }
  const P = PERSONA[type];
  const p = { type, ava: pick(P.ava), prop: P.prop, hist: [], cues: [], ev: 0, events: [], idx: 0, byP: false };
  const pref = ahead.filter(i => P.st.includes(STATIONS[i]));
  if (pref.length && Math.random() < .78) { p.dest = pref[0]; p.byP = true; }
  else p.dest = ahead.length ? ahead[Math.min(ahead.length - 1, ri(0, 4))] : at;
  return p;
}

function genEvents(leaver, T, D, soon) {
  // T = 目前階數。階數越高：要下車的人越可能毫無預兆，沒要下車的人也越常做出一樣的動作
  const ev = [];
  const add = (f, c) => ev.push({ t: f * D, c });
  if (leaver) {
    const clear = Math.random() < 0.86 - 0.07 * T;
    if (clear) {
      const ss = shuffle([...CUES.strong]);
      const ns = Math.random() < Math.max(0.1, 0.6 - 0.07 * T) ? 2 : 1;
      const early = Math.min(0.6, 0.2 + 0.05 * T);
      for (let k = 0; k < ns; k++) add(rand(early, 0.84), ss[k]);
    }
    const nw = clear ? ri(0, 1) : (Math.random() < .6 ? 1 : 0);
    for (let k = 0; k < nw; k++) add(rand(0.1, 0.8), pick(CUES.weak));
  } else if (Math.random() < 0.05 + 0.05 * T + (soon ? 0.1 + 0.03 * T : 0)) {
    // 提早收東西，或只是整理一下：動作跟真的要下車一模一樣
    add(rand(0.3, 0.84), pick(CUES.strong));
  } else {
    const pool = shuffle([...CUES.stay]);
    if (Math.random() < Math.max(.25, .7 - .07 * T)) add(rand(0.15, 0.9), Math.random() < 0.65 ? pool[0] : pick(CUES.neutral));
    if (soon ? Math.random() < .5 : Math.random() < 0.1 + 0.04 * T) add(rand(0.1, 0.8), pick(CUES.weak));
    if (T >= 2 && Math.random() < 0.1 + 0.03 * T) add(rand(0.3, 0.75), pick(CUES.fake));
  }
  return ev.sort((a, b) => a.t - b.t);
}
/* ================= 共用動態 ================= */
function setRoll(el, v) {
  const s = String(Math.max(0, Math.round(v)));
  let cols = [...el.children];
  while (cols.length < s.length) {
    const d = document.createElement('span'); d.className = 'dg';
    d.innerHTML = '<span class="st">' + '0123456789'.split('').map(n => `<span>${n}</span>`).join('') + '</span>';
    el.prepend(d); cols.unshift(d); void d.offsetHeight;
  }
  while (cols.length > s.length) cols.shift().remove();
  s.split('').forEach((ch, i) => { cols[i].firstChild.style.transform = `translateY(${-ch}em)`; });
}
const centerOf = el => { const b = el.getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2 }; };
function pulse(el) { el.animate([{ transform:'scale(1)' }, { transform:'scale(1.14)' }, { transform:'scale(1)' }], { duration: 340, easing:'cubic-bezier(.2,.8,.2,1)' }); }
function fly(html, from, toEl, opts = {}) {
  if (FAST) return Promise.resolve();
  return new Promise(res => {
    const n = document.createElement('div');
    n.className = 'fly'; n.innerHTML = html;
    if (opts.color) n.style.color = opts.color;
    if (opts.size) n.style.fontSize = opts.size + 'px';
    document.body.appendChild(n);
    const to = centerOf(toEl);
    const mx = (from.x + to.x) / 2, my = Math.min(from.y, to.y) - (opts.arc ?? 50);
    const T = (x, y, s) => `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s})`;
    const a = n.animate([
      { transform: T(from.x, from.y, .7), opacity: 0 },
      { transform: T(from.x, from.y - 20, 1.1), opacity: 1, offset: .22 },
      { transform: T(mx, my, 1), opacity: 1, offset: .6 },
      { transform: T(to.x, to.y, opts.endScale ?? .6), opacity: .25 }
    ], { duration: opts.dur || 700, easing: 'cubic-bezier(.45,0,.2,1)' });
    a.onfinish = () => { n.remove(); if (!opts.noPulse) pulse(toEl); res(); };
  });
}
function log(t, cls) { const l = $('#log'); l.textContent = t; l.className = 'log' + (cls ? ' ' + cls : ''); void l.offsetWidth; l.classList.add('in'); }
function cam(cls) { const s = $('#stage'); s.classList.remove(cls); void s.offsetWidth; s.classList.add(cls); }

/* ================= 車窗 ================= */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, speed = 0, targetSpeed = 0, off = 0, platformT = 0;
function resize() { const b = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); W = b.width; H = b.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function drawScene(dt) {
  speed += (targetSpeed - speed) * Math.min(1, dt * 3);
  off += speed * dt;
  ctx.clearRect(0, 0, W, H);
  const gap = 170, len = 8 + speed * 0.09;
  ctx.globalAlpha = 1 - platformT;
  for (let x = -(off % gap); x < W + gap; x += gap) {
    const g = ctx.createLinearGradient(x, 0, x + len, 0);
    g.addColorStop(0, 'rgba(255,214,140,0)'); g.addColorStop(.5, 'rgba(255,214,140,.85)'); g.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = g; ctx.fillRect(x, H * .28, len, 3);
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(x + 40, H * .6, len * .6, 2);
  }
  if (platformT > 0) {
    ctx.globalAlpha = platformT;
    const pg = 140;
    for (let x = -(off % pg); x < W + pg; x += pg) {
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x, 0, 26, H);
      ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(x + 26, 0, 3, H);
    }
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(0, H * .78, W, 2);
  }
  ctx.globalAlpha = 1;
}

/* ================= 畫面 ================= */
function buildSeats() {
  const box = $('#seats'); box.innerHTML = ''; els = [];
  const benches = [0, 1].map(() => { const b = document.createElement('div'); b.className = 'bench'; b.innerHTML = '<div class="base"></div>'; box.appendChild(b); return b; });
  for (let i = 0; i < 6; i++) {
    const el = document.createElement('button');
    el.className = 'seat' + (i === st.prio ? ' prio' : '');
    el.style.animationDelay = i * 0.05 + 's';
    el.innerHTML = `<div class="bubble"></div>
      <div class="chair"><div class="back">${i === st.prio ? '<span class="prioLbl">博愛座</span>' : ''}</div><div class="ava"></div><div class="cushion"></div><span class="tag"></span></div>
      <div class="hist"></div>`;
    el.addEventListener('pointerdown', () => tapSeat(i));
    benches[i < 3 ? 0 : 1].appendChild(el);
    els.push(el);
  }
}
function paintSeat(i, bubble) {
  const el = els[i], o = st.seats[i];
  if (!o) return;
  el.querySelector('.ava').innerHTML = o === 'me' ? '😌' : o.ava + (o.prop ? `<span class="prop">${o.prop}</span>` : '');
  el.classList.toggle('me', o === 'me');
  el.querySelector('.hist').textContent = o === 'me' ? '' : o.hist.slice(-5).join('');
  if (bubble) el.querySelector('.bubble').textContent = bubble;
}
function renderStam() {
  const v = Math.max(0, st.stam);
  setRoll($('#stam'), v);
  const f = $('#stamFill');
  f.style.width = v + '%';
  f.className = v > 50 ? '' : v > 25 ? 'mid' : 'low';
}
const drain = () => 25 + 3 * st.tier;   // 階數越高，白站一站扣越多
function renderHud() {
  const m = st.tier, el = $('#mult'), txt = String(m);
  if (el.textContent !== txt) { el.textContent = txt; pulse(el); }
  $('#claim').textContent = `第 ${st.tier} / ${TOP} 階`;
  if (!st.result && hostOf()) hostOf().live(window, m, st.tier);
}
function renderStand() {
  const seated = st.seat >= 0;
  $('#standBox').classList.toggle('hidden', seated);
  $('#seatBtns').classList.toggle('hidden', !seated);
  $('#meToken').classList.remove('away');
  $('#standTxt').innerHTML = st.tier ? `<b>站著搶第 ${st.tier + 1} 階</b> 沒搶到 −${drain()} 體力，歸零全賠` : `<b>你站著</b> 沒搶到每站 −${drain()} 體力`;
  if (seated) {
    $('#standBtn').innerHTML = st.standNext ? '下一站起身 ✓<b>再按取消</b>' : `起身再搶<b>下一階（第 ${Math.min(TOP, st.tier + 1)} 階）</b>`;
    $('#standBtn').classList.toggle('armed', st.standNext);
  }
  st.rivals.forEach((R, k) => { const t = $('#rv' + k); t.classList.toggle('hidden', !R.on); t.classList.remove('away'); });
}
/* ================= 流程 ================= */
function newGame(bet, hosted) {
  const dir = Math.random() < .5 ? 1 : -1;
  const start = dir > 0 ? 0 : STATIONS.length - 1;
  st = { bet, hosted: !!hosted, dir, at: start, round: 0, tier: 0, stam: 100, yields: 0, seat: -1, standNext: false,
         prio: Math.random() < .5 ? 0 : 5, seats: [], rivals: RIVALS.map(R => ({ ...R, on: false, sitting: false, back: 0, seat: -1, t: 0 })), result: null };
  st.seats = [0,1,2,3,4,5].map(() => newPax(start));
  buildSeats();
  renderStam(); renderHud();
  closeSheet();
  nextRound();
}
function nextRound() {
  st.round++; st.at += st.dir;
  const name = STATIONS[st.at], T = st.tier;
  const L = T;
  const D = Math.max(3.8, 8 - T * 0.5);           // 階數越高，進站越快
  const pax = st.seats.filter(isPax);
  let leavers = pax.filter(p => p.dest === st.at);
  if (st.seat < 0 && !leavers.length) {
    const c = [...pax].sort((a, b) => (a.byP - b.byP) || (Math.abs(a.dest - st.at) - Math.abs(b.dest - st.at)))[0];
    c.dest = st.at; c.byP = false;
  }
  // 階數越高，同一站下車的人越少
  leavers = pax.filter(p => p.dest === st.at);
  const maxLeave = T >= 4 ? 1 : T >= 2 ? 2 : 3;
  if (leavers.length > maxLeave && inLine(st.at + st.dir)) shuffle(leavers).slice(0, leavers.length - maxLeave).forEach(p => { p.dest = st.at + st.dir; p.byP = false; });

  r = { name, L, D, t: -1.0, speed: st.seat >= 0 ? 2.4 : 1, phase: 'approach', playerSeat: -1, bonus: 0 };
  let fresh = null;
  st.rivals.forEach(R => {
    if (!R.on && !R.sitting && T >= R.from && st.round >= R.back) { R.on = true; fresh = R; }
    R.seat = -1;
    R.t = R.on ? D * rand(Math.max(.2, R.tr[0] - T * 0.012), Math.max(.35, R.tr[1] - T * 0.02)) : 0;
  });
  pax.forEach(p => { p.cues = []; p.ev *= 0.3; p.idx = 0; p.events = genEvents(p.dest === st.at, T, D, p.dest === st.at + st.dir); });
  if (hostOf()) hostOf().progress(window, st.round, st.tier);

  const s = $('#station'); s.textContent = name; s.classList.remove('swap'); void s.offsetWidth; s.classList.add('swap');
  $('#nth').textContent = st.round === TRIP ? `末班車最後一站` : `${st.round} / ${TRIP} 站`;
  const zones = TYPES.filter(t => PERSONA[t].st.includes(name)).map(t => `${PERSONA[t].prop} ${PERSONA[t].zone}`);
  $('#zone').textContent = zones.join('　'); $('#zone').style.display = zones.length ? '' : 'none';
  $('#prog').style.width = '0%';
  const ts = st.rivals.filter(R => R.on).map(R => R.t);
  $('#rivalTick').classList.toggle('on', ts.length > 0);
  $('#rivalTick').style.left = ts.length ? (Math.min(...ts) / D * 100) + '%' : '0';
  $('#stage').classList.remove('platform');
  platformT = 0; targetSpeed = 900;
  st.seats.forEach((o, i) => {
    const el = els[i];
    el.classList.remove('mine', 'rival', 'leaving', 'win');
    el.querySelector('.tag').textContent = '';
    const idle = pick(CUES.idle);
    paintSeat(i, o === 'me' ? '😌 坐著休息' : `${idle[0]} ${idle[1]}`);
  });
  renderStand(); renderHud();
  log(st.seat >= 0 ? (st.standNext ? '下一站起身再搶，先看好目標' : '坐著回體力。要下車領獎，還是起身再搶？')
    : fresh ? `${fresh.name}上車了，${fresh.noise > 2 ? '他動作很快' : '她也在看線索'}`
    : st.round === 1 ? '觀察線索，點一下站到他面前'
    : zones.length ? `${name}：留意帶著 ${zones.map(z => z.split(' ')[0]).join(' ')} 的人` : '誰要在這站下車？', fresh ? 'warn' : '');
}
function applyCue(p, i, c) {
  p.ev += c[2]; p.cues.push(c); p.hist.push(c[0]);
  const el = els[i], b = el.querySelector('.bubble');
  b.textContent = `${c[0]} ${c[1]}`;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  el.querySelector('.hist').textContent = p.hist.slice(-5).join('');
}

function tapSeat(i) {
  if (paused || !r || r.phase !== 'approach' || r.t < 0 || st.seat >= 0 || r.playerSeat >= 0 || !isPax(st.seats[i])) return;
  const el = els[i];
  const blocker = st.rivals.find(R => R.on && R.seat === i);
  if (blocker) {
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    log(`${blocker.name}已經站在那了，換一個`, 'warn'); buzz(40);
    return;
  }
  r.playerSeat = i;
  r.bonus = Math.max(0, 1 - r.t / r.D);
  r.speed = 3;
  buzz(15);
  const me = $('#meToken');
  me.classList.add('away');
  $('#standTxt').innerHTML = '<b>站定位</b> 祈禱他下車';
  fly('🧍', centerOf(me), el.querySelector('.tag'), { size: 26, arc: 30, dur: 520, endScale: .7, noPulse: true }).then(() => {
    el.classList.add('mine'); el.querySelector('.tag').textContent = '你';
  });
  log(r.bonus > .5 ? '很果斷！列車加速進站…' : '站定位了，列車進站中…');
}
function rivalMove(k) {
  const R = st.rivals[k];
  const taken = st.rivals.filter(o => o !== R && o.on).map(o => o.seat);
  let best = -1, bs = -Infinity;
  st.seats.forEach((p, i) => {
    if (!isPax(p) || i === r.playerSeat || taken.includes(i)) return;
    const s = p.ev + rand(-R.noise, R.noise);
    if (s > bs) { bs = s; best = i; }
  });
  if (best < 0) { R.seat = -2; return; }
  R.seat = best;
  const el = els[best], tok = $('#rv' + k);
  tok.classList.add('away');
  buzz([15, 40, 15]);
  fly(R.em, centerOf(tok), el.querySelector('.tag'), { size: 26, arc: 30, dur: 480, endScale: .7, noPulse: true }).then(() => {
    el.classList.add('rival'); el.querySelector('.tag').textContent = R.name;
  });
  if (st.seat < 0 && r.playerSeat < 0) log(`${R.name}卡位了！快決定！`, 'warn');
}
function update() {
  if (r.t < 0) return;
  const f = Math.min(1, r.t / r.D);
  $('#prog').style.width = f * 100 + '%';
  targetSpeed = 900 * Math.pow(1 - f, 0.8) * (r.speed > 1 ? 1.4 : 1);
  platformT = Math.max(0, (f - 0.78) / 0.22);
  st.seats.forEach((p, i) => {
    if (!isPax(p)) return;
    while (p.idx < p.events.length && p.events[p.idx].t <= r.t) applyCue(p, i, p.events[p.idx++].c);
  });
  st.rivals.forEach((R, k) => { if (R.on && R.seat === -1 && r.t >= R.t) rivalMove(k); });
  if (r.t >= r.D) arrive();
}
function sheetChoice(html) {
  return new Promise(res => {
    openSheet(html);
    $('#sheetBody').querySelectorAll('[data-v]').forEach(b => b.onclick = () => { closeSheet(); setTimeout(() => res(b.dataset.v), FAST ? 0 : 280); });
  });
}
const cueTxt = cs => cs.map(c => c[0] + ' ' + c[1]).join(' → ');

async function arrive() {
  r.phase = 'arrive';
  targetSpeed = 0; platformT = 1;
  $('#prog').style.width = '100%';
  $('#stage').classList.add('platform');
  cam('push');
  log(`${r.name} 到了，車門開啟`);
  const leaveIdx = st.seats.map((o, i) => isPax(o) && o.dest === st.at ? i : -1).filter(i => i >= 0);
  leaveIdx.forEach((i, k) => setTimeout(() => { els[i].classList.add('leaving'); els[i].querySelector('.bubble').textContent = '🚶 下車了'; }, FAST ? 0 : 250 + k * 90));
  await wait(1300);
  if (st.result) return;                       // 進站途中已經下車領獎

  const wasSeated = st.seat >= 0, ps = r.playerSeat;
  const gone = leaveIdx.map(i => st.seats[i]);
  const minePax = ps >= 0 ? st.seats[ps] : null;
  leaveIdx.forEach(i => { const p = st.seats[i]; if (p.rival != null) { const R = st.rivals[p.rival]; R.sitting = false; R.back = st.round + 2; } st.seats[i] = null; });

  if (wasSeated) {
    st.stam = Math.min(100, st.stam + 6); renderStam();
    if (st.standNext) {
      const i = st.seat;
      st.seats[i] = null; st.seat = -1; st.standNext = false;
      els[i].classList.remove('me'); els[i].classList.add('leaving');
      log('你站起來了，位子馬上被坐走');
    }
  } else if (ps >= 0 && leaveIdx.includes(ps)) {
    st.tier++;
    st.seats[ps] = 'me'; st.seat = ps;
    const el = els[ps], quick = r.bonus > .5;
    if (quick) { st.stam = Math.min(100, st.stam + 8); renderStam(); }
    el.classList.remove('mine', 'leaving'); el.querySelector('.tag').textContent = '';
    paintSeat(ps, '😌 你坐下了');
    buzz([30, 50, 30]);
    log(`坐到了！升到第 ${st.tier} 階${quick ? '，判斷得早，體力 +8' : ''}`, 'good');
    await fly(`第 ${st.tier} 階`, centerOf(el), $('#mult'), { color: 'var(--amber)', dur: 760 });
    renderHud(); renderStand();
    await wait(350);
    if (st.tier >= TOP) return gameOver('top');
  } else {
    const d = drain();
    st.stam -= d;
    buzz(120); renderStam(); pulse($('#stamBox'));
    log(`白站了… 體力 −${d}`, 'warn');
    const rv = st.rivals.find(R => R.on && R.seat >= 0 && leaveIdx.includes(R.seat));
    const why = ps < 0 ? (rv && gone.length === 1 ? `猶豫太久，位子被${rv.name}坐走了。` : '你猶豫太久，車門就開了。') : pick(LOSE_LINES);
    const real = gone.find(p => p.cues.some(c => c[2] > 0 && c !== CUES.final)) || gone[0];
    const realCues = real ? real.cues.filter(c => c[2] > 0 && c !== CUES.final) : [];
    const P = real ? PERSONA[real.type] : null;
    const dead = st.stam <= 0;
    await wait(500);
    await sheetChoice(`<div class="lbl" style="color:var(--red)">白站了 · 體力 −${d}</div>
      <h2>${why}</h2>
      <div class="clue">
        ${minePax ? `<div><span class="lbl">你選的人 ${minePax.ava}${minePax.prop}</span>${cueTxt(minePax.cues) || '沒什麼動作'}</div>` : ''}
        ${real ? `<div><span class="lbl">真正下車的人 ${real.ava}${real.prop}</span>${cueTxt(realCues) || '幾乎沒有動作，很難猜'}</div>` : ''}
        ${real && real.byP ? `<div><span class="lbl">下次留意</span>${P.prop} ${P.label}常在「${P.zone}」下車，${r.name}就是。</div>` : ''}
      </div>
      <button class="btn" data-v="next">${dead ? '腿軟了，看成績' : `繼續，體力剩 ${st.stam}`}</button>`);
    if (dead) return gameOver('bust');
  }

  // 對手搶到位子就坐下，之後幾站不會再搶
  st.rivals.forEach((R, k) => {
    if (!R.on || R.seat < 0 || st.seats[R.seat] !== null || !leaveIdx.includes(R.seat)) return;
    const i = R.seat;
    let dest = st.at + st.dir * ri(2, 4); while (!inLine(dest)) dest -= st.dir;
    st.seats[i] = { type: 'normal', ava: R.em, prop: '', hist: [], cues: [], ev: 0, events: [], idx: 0, byP: false, dest, rival: k };
    R.on = false; R.sitting = true;
    els[i].classList.remove('rival', 'leaving'); els[i].querySelector('.tag').textContent = '';
    paintSeat(i, `${R.em} ${R.name}坐下了`);
  });
  let k = 0;
  st.seats.forEach((o, i) => {
    if (o !== null) return;
    st.seats[i] = newPax(st.at);
    setTimeout(() => { paintSeat(i, '🚪 剛上車'); els[i].classList.remove('leaving'); }, FAST ? 0 : 120 * k++);
  });
  renderStand();
  await wait(k ? 500 + 120 * k : 250);

  if (st.round >= TRIP) return gameOver('end');

  // 坐著的時候，可能有需要座位的人上車
  if (wasSeated && st.seat >= 0 && Math.random() < (st.seat === st.prio ? .65 : .3)) {
    const who = pick([['👵🏻', '一位老奶奶'], ['👴', '一位老爺爺'], ['🤰', '一位孕婦'], ['🧑‍🦯', '一位視障朋友']]);
    const v = await sheetChoice(`<div class="lbl" style="color:var(--amber)">${st.seat === st.prio ? '你坐的是博愛座' : '有人上車了'}</div>
      <h2>${who[1]}站到你面前</h2>
      <p>讓座：體力 +20，但要站起來重新搶。裝睡：保住位子，被發現會降一階。</p>
      <div class="row2">
        <button class="btn" data-v="yield">讓座<small>體力 +20</small></button>
        <button class="btn ghost" data-v="sleep">裝睡<small>四成被發現</small></button>
      </div>`);
    if (st.result) return;
    if (v === 'yield') {
      const i = st.seat, el = els[i];
      st.yields++; st.stam = Math.min(100, st.stam + 20); renderStam();
      el.classList.add('leaving');
      await wait(450);
      const np = newPax(st.at, who[0] === '🤰' || who[0] === '🧑‍🦯' ? 'normal' : 'elder'); np.ava = who[0]; np.prop = '';
      if (np.dest === st.at + st.dir && inLine(np.dest + st.dir)) np.dest += st.dir;
      st.seats[i] = np; st.seat = -1; st.standNext = false;
      paintSeat(i, '🙏 謝謝你'); el.classList.remove('leaving');
      log('你讓座了，心情很好，體力 +20', 'good'); buzz([20, 30, 20]);
      await wait(600);
    } else if (Math.random() < .4) {
      if (st.tier > 1) st.tier--;
      renderHud(); buzz(100);
      log('裝睡被旁邊的人白眼，降一階', 'warn');
      await wait(900);
    } else { log('你閉上眼睛…沒人發現'); await wait(700); }
  }
  nextRound();
}
function gameOver(kind) {
  if (st.result) return;
  r.phase = 'over';
  const m = st.tier;                           // 成績 = 搶到的最高階數，只作紀錄，不換算點數

  const isBest = m > loadBest();
  if (isBest) saveBest(m);
  st.result = { kind, m };
  const host = hostOf();
  const paid = host ? host.finish(window, { kind, tier: st.tier, round: st.round }) : null;
  renderStand();
  const H = { top: [`搶滿 ${TOP} 階！`, 'var(--gold)'], end: ['末班車到站', 'var(--green)'], bust: [`腿軟了，倒在 ${r.name}`, 'var(--red)'] }[kind];
  const msg = kind === 'bust' ? `體力歸零，這一趟搶到 ${st.tier} 次座位。`
    : `搶到 ${st.tier} 次座位。`;
  openSheet(`<div class="lbl" style="color:${H[1]}">${H[0]}</div>
    <div class="big" style="color:${m > 0 ? 'var(--amber)' : 'var(--text)'}">${m} 階</div>
    <p style="margin-bottom:0">${msg}${isBest && m > 0 ? '<span class="newbest">最佳紀錄</span>' : ''}</p>
    <div class="stats four">
      <div><span class="lbl">搭了</span><b>${st.round} 站</b></div>
      <div><span class="lbl">階數</span><b>${st.tier}</b></div>
      <div><span class="lbl">讓座</span><b>${st.yields} 次</b></div>
      <div><span class="lbl">體力</span><b>${Math.max(0, st.stam)}</b></div>
    </div>
    <button class="btn" id="againBtn">再搭一次</button>`);


  $('#againBtn').onclick = () => { closeSheet(); showIntro(); };
}
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); }
function closeSheet() { $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); }
const sheetOpen = () => $('#sheet').classList.contains('open');

function setPaused(v) {
  if (v && (!r || r.phase !== 'approach' || sheetOpen())) return;
  paused = v;
  if (v) {
    if (hostOf()) hostOf().pause(window);
    openSheet(`<div class="lbl">暫停</div><h2>到站了？</h2><p>下次打開，從這一站繼續。</p><button class="btn" id="resumeBtn">繼續</button>`);
    $('#resumeBtn').onclick = () => { closeSheet(); if (hostOf()) hostOf().resume(window); setTimeout(() => { paused = false; }, 300); };
  }
}
// 平台橋接：離開這款遊戲（隱藏 iframe）時比照背景分頁暫停
window.setMrtPlatformActive = v => { mrtActive = !!v; lastTs = 0; if (mrtActive) resize(); else if (!paused) setPaused(true); };
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => { const h = mrtHost(); if (h) h.touch(window); }, { capture: true, passive: true }));
$('#pauseBtn').onclick = () => { if (!paused) setPaused(true); };
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused) setPaused(true); });

function loop(ts) {
  const dt = Math.min(0.05, (ts - (lastTs || ts)) / 1000);
  lastTs = ts;
  if (!mrtActive) { requestAnimationFrame(loop); return; }
  if (!paused && r && r.phase === 'approach' && !sheetOpen()) { r.t += dt * r.speed * (FAST ? 30 : 1); update(); }
  if (!paused) drawScene(dt);
  requestAnimationFrame(loop);
}

/* ================= 開場 ================= */
// 這個 demo 不處理點數。平台串接時只扣固定入場點數；階數只作成績，不換算點數。
function showIntro() {
  $('#introBest').textContent = loadBest() ? `最佳 ${loadBest()} 階` : '';
  $('#intro').classList.remove('hide');
}
// 開場按鈕與平台右側「扣點上車」共用同一個開局流程，由父頁決定是否扣點
function beginRound() {
  const host = mrtHost();
  let bet = 1;                                  // 單獨開啟時維持原本不扣點的示範模式
  if (host) {
    bet = host.start(window);
    if (!bet) { $('#introBest').textContent = '沒有扣點：餘額不足 10 點，請看右側說明'; return false; }
  }
  paused = false; $('#intro').classList.add('hide'); newGame(bet, !!host);
  return true;
}
$('#startBtn').onclick = beginRound;
window.startMrtPlatformRound = beginRound;
$('#standBtn').onclick = () => { if (st && st.seat >= 0 && r.phase === 'approach') { st.standNext = !st.standNext; buzz(12); renderStand(); log(st.standNext ? '下一站起身再搶，先看好目標' : '繼續坐著休息'); } };
window.addEventListener('resize', resize);
$('#mult').textContent = '0';
setRoll($('#stam'), 100);
targetSpeed = 600;
showIntro();
resize(); requestAnimationFrame(loop);
</script>
