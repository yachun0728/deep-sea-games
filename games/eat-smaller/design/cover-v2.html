<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>@font-face{font-family:"LXGW WenKai TC";font-weight:700;src:url(lxgw.woff2) format("woff2")}</style>
<style>html,body{margin:0;background:#f6eedb}canvas{display:block}</style></head>
<body><canvas id="cv" width="1056" height="1000"></canvas>
<script>
const W = 1056, H = 1000, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const FONT = '"LXGW WenKai TC"', INK = '#2b2b2b';
function rng(seed) { let s = (Math.imul(seed | 0, 2654435761) >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function wobblyCircle(x, y, r, R, over) {
  const n = Math.max(12, Math.round(r / 2)), a0 = R() * 6.2832, amp = Math.min(4, r * .05), extra = over ? .12 + R() * .1 : 0;
  ctx.beginPath();
  for (let i = 0; i <= n * (1 + extra); i++) { const a = a0 + i / n * 6.2832, rr = r + (R() - .5) * 2 * amp; const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
}
function sketchCircle(x, y, r, seed, o) {
  const R = rng(seed); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.fill) { ctx.fillStyle = o.fill; wobblyCircle(x, y, r * .98, R, false); ctx.closePath(); ctx.fill(); }
  if (o.stroke) { ctx.strokeStyle = o.stroke; if (o.dash) ctx.setLineDash(o.dash); ctx.lineWidth = o.lw; wobblyCircle(x, y, r, R, true); ctx.stroke();
    if (o.passes !== 1) { ctx.lineWidth = o.lw * .5; wobblyCircle(x, y, r + 1.5, R, true); ctx.stroke(); } ctx.setLineDash([]); }
}
function sketchLine(x1, y1, x2, y2, R, j) { const mx = (x1 + x2) / 2 + (R() - .5) * j * 2, my = (y1 + y2) / 2 + (R() - .5) * j * 2; ctx.moveTo(x1 + (R() - .5) * j, y1 + (R() - .5) * j); ctx.quadraticCurveTo(mx, my, x2 + (R() - .5) * j, y2 + (R() - .5) * j); }
function sketchRect(x, y, w, h, seed, o) {
  const R = rng(seed), j = o.j || 3, e = 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.fill) { ctx.fillStyle = o.fill; ctx.beginPath(); ctx.moveTo(x + R() * j, y + R() * j); ctx.lineTo(x + w - R() * j, y + R() * j); ctx.lineTo(x + w - R() * j, y + h - R() * j); ctx.lineTo(x + R() * j, y + h - R() * j); ctx.closePath(); ctx.fill(); }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw; ctx.beginPath(); sketchLine(x - e, y, x + w + e * .4, y, R, j); sketchLine(x + w, y - e * .4, x + w, y + h + e, R, j); sketchLine(x + w + e * .4, y + h, x - e, y + h, R, j); sketchLine(x, y + h + e * .4, x, y - e, R, j); ctx.stroke(); }
}
function sketchPoly(pts, seed, o) {
  const R = rng(seed), j = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = o.fill; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw; ctx.beginPath();
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; sketchLine(a[0], a[1], b[0] + (b[0] - a[0]) * .08, b[1] + (b[1] - a[1]) * .08, R, j); } ctx.stroke();
}
function hatch(x, y, w, h, seed, color, gap, lw) {
  const R = rng(seed); ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
  for (let k = -h; k < w + h; k += gap) { ctx.moveTo(x + k + (R() - .5) * 3, y + h + 2); ctx.lineTo(x + k + h + (R() - .5) * 3, y - 2); } ctx.stroke(); ctx.restore();
}
function text(t, x, y, size, color, opts = {}) {
  ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (opts.outline) { ctx.lineJoin = 'round'; ctx.lineWidth = opts.outline; ctx.strokeStyle = opts.outlineColor || '#fbf6ea'; ctx.strokeText(t, x, y); }
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * .07); ctx.strokeStyle = color; ctx.strokeText(t, x, y);
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function eyes(x, y, r, lx, ly, scared) {
  const er = r * .2, gap = r * .36, px = lx * er * .45, py = ly * er * .45;
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(3, r * .035);
    ctx.beginPath(); ctx.ellipse(ex, y, er * (scared ? 1.15 : 1), er * (scared ? 1.32 : 1.12), 0, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex + px, y + py, er * (scared ? .4 : .52), 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + px - er * .15, y + py - er * .18, er * .13, 0, 6.2832); ctx.fill();
  }
}
function blob(x, y, r, seed, fill, ink, shadow) {
  sketchCircle(x + r * .05, y + r * .07, r, seed + 9, { fill: shadow || 'rgba(43,43,43,.16)' });
  sketchCircle(x, y, r, seed, { fill, stroke: ink, lw: Math.max(4, r * .045) });
}

function draw() {
  // 紙張背景：暖色漸層加上筆記本橫線，飽和一點，跟深色網站分得開
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#fff3d6'); g.addColorStop(1, '#f9dcae');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(560, 430, 60, 560, 430, 560); glow.addColorStop(0, 'rgba(143,211,232,.55)'); glow.addColorStop(1, 'rgba(143,211,232,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(63,151,196,.28)'; ctx.lineWidth = 3; ctx.beginPath(); for (let y = 70; y < H; y += 62) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
  ctx.strokeStyle = 'rgba(200,64,47,.35)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(130, 0); ctx.lineTo(130, H); ctx.stroke();

  // 追人的大紅數字（尖角、眼睛、驚嘆號），在主角左後方
  const hx = 250, hy = 470, hr = 118;
  { const R = rng(31); ctx.strokeStyle = '#c8402f'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.beginPath(); const n = 14; ctx.fillStyle = '#f6a596';
    for (let k = 0; k <= n * 2; k++) { const a = -.3 + k / (n * 2) * 6.2832, rr = k % 2 ? hr - 4 : hr + 26 + (R() - .5) * 8; k ? ctx.lineTo(hx + Math.cos(a) * rr, hy + Math.sin(a) * rr) : ctx.moveTo(hx + Math.cos(a) * rr, hy + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
  blob(hx, hy, hr, 41, '#f6a596', '#c8402f');
  ctx.save(); ctx.beginPath(); ctx.arc(hx, hy, hr - 8, 0, 6.2832); ctx.clip(); hatch(hx - hr, hy - hr, hr * 2, hr * 2, 7, 'rgba(200,64,47,.3)', 14, 2.6); ctx.restore();
  eyes(hx, hy - hr * .34, hr, .95, -.1, false);
  // 生氣的眉毛
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(hx - hr * .6, hy - hr * .7); ctx.lineTo(hx - hr * .14, hy - hr * .52); ctx.moveTo(hx + hr * .6, hy - hr * .7); ctx.lineTo(hx + hr * .14, hy - hr * .52); ctx.stroke();
  text('40', hx, hy + hr * .32, 92, '#c8402f');
  text('!', hx + 20, hy - hr - 62, 96, '#c8402f', { outline: 12 });

  // 移動的速度線
  ctx.strokeStyle = 'rgba(43,43,43,.45)'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
  for (const [y, l] of [[420, 60], [480, 80], [540, 55]]) { ctx.moveTo(105, y); ctx.quadraticCurveTo(105 - l / 2, y - 6, 105 - l, y); } ctx.stroke();

  // 剛好能吃的綠色小數字：橘色虛線光圈
  const sx = 850, sy = 380, sr = 66;
  ctx.save(); ctx.globalAlpha = .95; sketchCircle(sx, sy, sr + 22, 5, { stroke: '#d9801a', lw: 6, dash: [16, 14], passes: 1 }); ctx.restore();
  blob(sx, sy, sr, 13, '#b5e39a', '#3f7a31');
  text('3', sx, sy + 4, 76, '#3f7a31');
  // 其他綠色小數字與運算符
  blob(905, 610, 44, 17, '#b5e39a', '#3f7a31'); text('1', 905, 613, 52, '#3f7a31');
  blob(760, 210, 38, 19, '#b5e39a', '#3f7a31'); text('2', 760, 213, 46, '#3f7a31');
  ctx.save(); ctx.translate(650, 135); ctx.rotate(-.18); const d = 50;
  sketchPoly([[0, -d], [d, 0], [0, d], [-d, 0]], 23, { fill: '#f6c47a', stroke: INK, lw: 4.5 }); text('÷2', 0, 3, 40, INK); ctx.restore();

  // 主角：藍色數字，眼睛看向綠色 3，緊張得冒汗
  const px = 560, py = 440, pr = 205;
  blob(px, py, pr, 3, '#8fd3e8', INK, 'rgba(43,43,43,.22)');
  // 臉頰
  ctx.fillStyle = 'rgba(240,120,130,.55)'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(px + s * pr * .62, py - pr * .02, 28, 17, 0, 0, 6.2832); ctx.fill(); }
  eyes(px, py - pr * .36, pr, .85, -.25, true);
  text('37', px, py + pr * .36, 170, INK);
  // 汗滴
  { const dx = px - pr * .82, dy = py - pr * .7, s = 2.6; ctx.fillStyle = '#8fd3e8'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(dx, dy - 7 * s); ctx.quadraticCurveTo(dx + 6 * s, dy + 1 * s, dx, dy + 5 * s); ctx.quadraticCurveTo(dx - 6 * s, dy + 1 * s, dx, dy - 7 * s); ctx.fill(); ctx.stroke(); }
  // 目標提示 +3 = 40
  text('+3', 770, 515, 64, '#3f7a31', { outline: 12 });

  // 標題卡：膠帶貼在筆記本上
  const tw = 860, th = 196, tx = (W - tw) / 2, ty = 712;
  ctx.save(); ctx.translate(W / 2, ty + th / 2); ctx.rotate(-.025); ctx.translate(-W / 2, -(ty + th / 2));
  sketchRect(tx + 12, ty + 14, tw, th, 52, { fill: 'rgba(43,43,43,.85)', j: 2 });
  sketchRect(tx, ty, tw, th, 51, { fill: '#fbf6ea', stroke: INK, lw: 6, j: 3 });
  ctx.fillStyle = 'rgba(246,196,122,.85)'; ctx.save(); ctx.translate(W / 2, ty + 4); ctx.rotate(-.05); ctx.fillRect(-90, -24, 180, 48); ctx.restore();
  let fs = 150; ctx.font = `700 ${fs}px ${FONT}`; const full = ctx.measureText('Number Gulp').width; if (full > tw - 90) { fs = Math.floor(fs * (tw - 90) / full); ctx.font = `700 ${fs}px ${FONT}`; } ctx.textBaseline = 'middle';
  const a = 'Number ', b = 'Gulp', aw = ctx.measureText(a).width, bw = ctx.measureText(b).width, cx = W / 2 - (aw + bw) / 2;
  ctx.textAlign = 'left'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.round(fs * .085);
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.strokeText(a, cx, ty + th / 2 + 6); ctx.fillText(a, cx, ty + th / 2 + 6);
  ctx.fillStyle = '#d9801a'; ctx.strokeStyle = '#d9801a'; ctx.strokeText(b, cx + aw, ty + th / 2 + 6); ctx.fillText(b, cx + aw, ty + th / 2 + 6);
  ctx.restore();
  document.title = 'ready';
}
new FontFace('LXGW WenKai TC', 'url(lxgw.woff2)', { weight: '700' }).load().then(f => { document.fonts.add(f); draw(); }, e => { document.title = 'font-failed'; });
</script></body></html>
