<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>蝦拳（骨架）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1d2a;color:#e8f4f8;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:#10303f;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#safe{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#tag{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:5;font-size:11px;padding:3px 8px;
  border-radius:99px;background:#f7e33b;color:#1d1b1a;font-weight:800;letter-spacing:1px}
#hud{position:absolute;top:calc(6px + env(safe-area-inset-top));right:10px;z-index:5;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;background:rgba(11,29,42,.92)}
.screen.hide{display:none}
.screen h1{font-size:32px;letter-spacing:2px}
.screen p{font-size:15px;line-height:1.6;opacity:.85}
.how{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;text-align:left;font-size:15px;max-width:320px}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:36px;padding:0 8px;border-radius:10px;
  background:#1d4a5e;border:2px solid #5fc6d8;font-weight:800}
.key.red{border-color:#ff6b5a;background:#4a2028}
.kb{font-size:12px;opacity:.6}
.stars{font-size:34px;letter-spacing:4px;color:#f7e33b}
.stats{font-size:15px;line-height:1.8;opacity:.9}
button{font:inherit;font-weight:800;font-size:18px;padding:12px 36px;min-height:48px;border:0;border-radius:12px;background:#f7e33b;color:#1d1b1a;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="safe"></div>
  <div id="tag">PROTOTYPE · 未上架</div>
  <div id="hud">0.0s</div>
  <canvas id="cv"></canvas>
  <div id="start" class="screen">
    <h1>蝦拳</h1>
    <p>守住洞穴，打倒來搶地盤的螃蟹！</p>
    <div class="how">
      <span class="key red">紅區</span><span>螃蟹要打的位置，<b>閃到沒紅的那一邊</b></span>
      <span class="key">◀ ▶</span><span>點畫面左／右側閃避</span>
      <span class="key">拳</span><span>閃過後螃蟹暈眩，<b>趁機連打</b></span>
      <span class="key">按住</span><span>蓄力重拳，可打斷螃蟹出招</span>
    </div>
    <p class="kb">鍵盤：A／← 左閃、D／→ 右閃、J／空白鍵 出拳（按住蓄力）</p>
    <button id="go" type="button">開打</button>
  </div>
  <div id="pause" class="screen hide">
    <h1>暫停</h1>
    <button id="resume" type="button">繼續</button>
  </div>
  <div id="end" class="screen hide">
    <h1 id="endTitle">K.O.!</h1>
    <div class="stars" id="stars"></div>
    <div class="stats" id="result"></div>
    <button id="again" type="button">再打一場</button>
  </div>
</div>
<script>
/* 蝦拳骨架：讀招 → 閃避 → 破綻反擊。
   不讀寫平台點數、不送 GA4、不存 localStorage；上架時才依 games/ 流程接入。 */
(function(){
  'use strict';
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var hud=document.getElementById('hud');
  var W=0,H=0,dpr=1,running=false,last=0,S=null;
  var L={}; // layout

  /* ---------- 調整參數 ---------- */
  var ENEMY_HP=200, PLAYER_HP=100;
  var DODGE_TIME=0.42, DODGE_CD=0.12, PERFECT=0.2;
  var PUNCH_REC=0.18, CHARGE_REC=0.32, CHARGE_NEED=0.4, BUFFER=0.15;
  var DMG_OPEN=5, DMG_OPEN_CHARGE=20, DMG_WIND=3, DMG_WIND_CHARGE=10;
  var ST_PUNCH=12, ST_CHARGE=25, ST_REGEN=40;

  function readSafe(){
    var cs=getComputedStyle(document.getElementById('safe'));
    return {top:parseFloat(cs.paddingTop)||0,bottom:parseFloat(cs.paddingBottom)||0};
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var sf=readSafe();
    L.top=sf.top;
    L.ctrlH=Math.max(110,Math.min(170,H*0.19));
    L.ctrlTop=H-L.ctrlH-sf.bottom-8;
    L.pbarY=L.ctrlTop-44;
    L.ebarY=sf.top+58;
    L.arenaTop=L.ebarY+34;
    L.arenaBot=L.pbarY-8;
    var ah=L.arenaBot-L.arenaTop;
    L.u=Math.min(W/10,ah/9.5);
    L.crabY=L.arenaTop+ah*0.3;
    L.playerY=L.arenaTop+ah*0.8;
    L.lane=W*0.28;
    if(!running)draw();
  }
  window.addEventListener('resize',resize);

  /* ---------- 音效 ---------- */
  var AC=null;
  function initAudio(){
    if(AC)return;
    try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}
  }
  function tone(f,d,type,vol,to){
    if(!AC)return;
    var n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,n);
    if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);
    g.gain.setValueAtTime(vol||0.12,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);
    o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+0.02);
  }
  function noise(d,vol,freq){
    if(!AC)return;
    var n=AC.currentTime,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);
    for(var i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);
    var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=b;f.type='lowpass';f.frequency.value=freq||1200;g.gain.value=vol||0.3;
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(n);
  }
  var SFX={
    hit:function(c){c=c||0;noise(0.1,0.5,1300+c*160);tone(180+c*24,0.13,'square',0.13,55);tone(2400+c*80,0.03,'triangle',0.06);},
    heavy:function(){noise(0.25,0.5,600);tone(120,0.25,'sawtooth',0.14,40);},
    block:function(){tone(700,0.05,'square',0.06,500);},
    whoosh:function(){noise(0.18,0.18,2500);},
    perfect:function(){tone(880,0.08,'triangle',0.12);setTimeout(function(){tone(1320,0.12,'triangle',0.12);},70);},
    hurt:function(){noise(0.2,0.4,500);tone(220,0.25,'sawtooth',0.12,80);},
    warn:function(){tone(520,0.06,'triangle',0.06);},
    ko:function(){tone(523,0.15,'square',0.1);setTimeout(function(){tone(659,0.15,'square',0.1);},150);setTimeout(function(){tone(784,0.3,'square',0.1);},300);},
    lose:function(){tone(300,0.5,'sawtooth',0.1,90);}
  };

  /* ---------- 狀態 ---------- */
  function reset(){
    S={t:0,phase:'intro',phaseT:1.5,
      p:{hp:PLAYER_HP,st:100,dodgeDir:0,dodgeT:0,dodgeAge:0,dodgeCD:0,punchT:0,punchSide:1,lastCharged:false,
         charging:false,chargeT:0,buffer:null,hurtT:0},
      e:{hp:ENEMY_HP,state:'idle',timer:1.0,atk:null,wind:0,windT:0,feint:false,feintDone:false,
         flash:0,openT:0,openMax:1,strikeT:0,next:null,count:0,openCount:0,angry:false,interrupted:false},
      fx:[],shake:0,hitstop:0,zoom:1,hits:0,perfects:0,dodges:0,combo:0,maxCombo:0};
    hud.textContent='0.0s';
  }
  function phase2(){return S.e.hp<=ENEMY_HP*0.5;}

  function addText(txt,x,y,color,size,life){
    S.fx.push({k:'t',txt:txt,x:x,y:y,c:color||'#fff',s:size||22,t:0,life:life||0.8});
  }
  function burst(x,y,color,n,sp){
    for(var i=0;i<(n||10);i++){
      var a=Math.random()*Math.PI*2,v=(sp||180)*(0.4+Math.random());
      S.fx.push({k:'p',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:color,r:2+Math.random()*4,t:0,life:0.35+Math.random()*0.3});
    }
  }
  function playerX(){
    var p=S.p,f=0;
    if(p.dodgeT>0){
      var el=DODGE_TIME-p.dodgeT;
      f=el<0.07?el/0.07:(p.dodgeT<0.09?p.dodgeT/0.09:1);
    }
    return W/2+p.dodgeDir*L.lane*f;
  }

  /* ---------- 輸入 ---------- */
  function dodge(dir){
    var p=S.p;
    if(S.phase!=='fight'||p.dodgeT>0||p.dodgeCD>0||p.punchT>0)return;
    p.dodgeDir=dir;p.dodgeT=DODGE_TIME;p.dodgeAge=0;
    SFX.whoosh();
  }
  function chargeStart(){
    if(S.phase!=='fight')return;
    S.p.charging=true;S.p.chargeT=0;
  }
  function chargeRelease(){
    var p=S.p;
    if(!p.charging)return;
    var charged=p.chargeT>=CHARGE_NEED;
    p.charging=false;p.chargeT=0;
    if(S.phase!=='fight')return;
    if(!tryPunch(charged))p.buffer={charged:charged,t:BUFFER};
  }
  function tryPunch(charged){
    var p=S.p,e=S.e;
    if(p.dodgeT>0||p.punchT>0)return false;
    if(charged&&p.st<ST_CHARGE)charged=false;
    if(p.st<ST_PUNCH){addText('喘…',playerX(),L.playerY-L.u*2.2,'#9fc3cf',18);return true;}
    p.st-=charged?ST_CHARGE:ST_PUNCH;
    p.punchT=charged?CHARGE_REC:PUNCH_REC;p.punchSide=-p.punchSide;p.lastCharged=charged;
    var hx=W/2+p.punchSide*L.u*0.8,hy=L.crabY+L.u*0.6;
    if(e.state==='open'){
      var d=charged?DMG_OPEN_CHARGE:DMG_OPEN;
      S.combo++;if(S.combo>S.maxCombo)S.maxCombo=S.combo;
      hurtEnemy(d,hx,hy,charged,S.combo);
      if(S.combo>=3){
        S.fx=S.fx.filter(function(f){return !f.combo;});
        addText(S.combo+' 連擊',W/2,L.crabY-L.u*3.2,'#f7e33b',20,0.6);S.fx[S.fx.length-1].combo=true;
      }
    }else if(e.state==='windup'){
      if(charged){
        hurtEnemy(DMG_WIND_CHARGE,hx,hy,true);
        addText('打斷！',W/2,L.crabY-L.u*2.8,'#7df9ff',28,1);
        e.state='open';e.openT=e.openMax=0.8;e.interrupted=true;e.openCount++;
      }else{
        hurtEnemy(DMG_WIND,hx,hy,false);
      }
    }else{
      SFX.block();S.combo=0;
      addText('擋',hx,hy-L.u,'#9fc3cf',20,0.5);
      burst(hx,hy,'#9fc3cf',5,100);
    }
    return true;
  }
  function hurtEnemy(d,x,y,heavy,combo){
    var e=S.e,c=Math.min(combo||0,10);
    e.hp=Math.max(0,e.hp-d);e.flash=0.1;
    // 打擊感：被打退＋壓扁、停頓隨連擊加長、鏡頭微推
    e.knock=L.u*(heavy?0.9:0.35+c*0.04);e.knockX=(x-W/2)*0.12;e.squash=heavy?0.22:0.1+c*0.008;
    S.hitstop=heavy?0.14:(combo?0.06+c*0.007:0.04);
    S.shake=Math.max(S.shake,heavy?16:(combo?6+c*0.8:4));
    S.zoom=Math.max(S.zoom,heavy?1.07:(combo?1.025+c*0.003:1.01));
    if(heavy)SFX.heavy();else SFX.hit(c);
    addText('-'+d,x+(Math.random()-0.5)*L.u,y-L.u*0.5,heavy?'#ffb347':(c>=5?'#ff9f1a':'#ffe14d'),heavy?34:24+c*1.5);
    S.fx.push({k:'r',x:x,y:y,r0:L.u*0.3,r1:L.u*(heavy?3.2:1.5+c*0.08),c:heavy?'#ffd34d':'#ffc94d',t:0,life:heavy?0.3:0.18});
    var n=heavy?12:6+Math.floor(c/2),a0=Math.random()*Math.PI;
    for(var i=0;i<n;i++){var a=a0+i*Math.PI*2/n;
      S.fx.push({k:'l',x:x,y:y,a:a,len:L.u*(heavy?2.6:1.3+c*0.06)*(0.7+Math.random()*0.5),c:heavy?'#ffb347':'#ffd966',t:0,life:heavy?0.22:0.13});}
    burst(x,y,heavy?'#ffb347':'#fff4c2',heavy?18:9+c,heavy?280:200+c*10);
    if(!e.angry&&phase2()){e.angry=true;addText('螃蟹生氣了！',W/2,L.crabY+L.u*2.6,'#ff6b5a',24,1.4);}
    if(e.hp<=0){
      S.phase='ko';S.phaseT=1.6;S.hitstop=0.25;S.shake=18;SFX.ko();
      burst(W/2,L.crabY,'#ffb347',40,360);
    }
  }

  var keyMap={KeyA:-1,ArrowLeft:-1,KeyD:1,ArrowRight:1};
  window.addEventListener('keydown',function(ev){
    if(!S)return;
    if(keyMap[ev.code]!==undefined){ev.preventDefault();if(running&&!ev.repeat)dodge(keyMap[ev.code]);}
    else if(ev.code==='KeyJ'||ev.code==='Space'){
      ev.preventDefault();
      if(running&&!ev.repeat)chargeStart();
    }
  });
  window.addEventListener('keyup',function(ev){
    if(!S)return;
    if(ev.code==='KeyJ'||ev.code==='Space'){ev.preventDefault();if(running)chargeRelease();}
  });

  var punchPointer=null;
  cv.addEventListener('pointerdown',function(ev){
    if(!running||!S)return;
    ev.preventDefault();
    var r=cv.getBoundingClientRect(),x=ev.clientX-r.left;
    if(x<W/3)dodge(-1);
    else if(x>W*2/3)dodge(1);
    else{punchPointer=ev.pointerId;chargeStart();}
  });
  function pointerEnd(ev){
    if(ev.pointerId!==punchPointer)return;
    punchPointer=null;
    if(running&&S)chargeRelease();
  }
  window.addEventListener('pointerup',pointerEnd);
  window.addEventListener('pointercancel',pointerEnd);

  /* ---------- 螃蟹 AI ---------- */
  function startAttack(){
    var e=S.e,p2=phase2(),r=Math.random();
    e.count++;
    e.atk=r<0.4?'L':(r<0.8?'R':'C');
    e.wind=p2?0.58:0.82;
    e.windT=0;e.feintDone=false;
    e.feint=p2&&e.atk!=='C'&&Math.random()<0.35;
    e.state='windup';e.interrupted=false;
    SFX.warn();
  }
  function resolveStrike(){
    var e=S.e,p=S.p;
    var dir=p.dodgeT>0?p.dodgeDir:0;
    var ok=e.atk==='L'?dir===1:(e.atk==='R'?dir===-1:dir!==0);
    e.state='strike';e.strikeT=0.2;
    if(ok){
      var perfect=p.dodgeAge<=PERFECT;
      S.dodges++;
      if(perfect){S.perfects++;SFX.perfect();addText('完美閃避！',playerX(),L.playerY-L.u*2.6,'#7df9ff',26,1);}
      else addText('閃過！',playerX(),L.playerY-L.u*2.6,'#c8f7ff',22,0.8);
      e.next='open';e.openMax=perfect?1.3:0.95;
    }else{
      var dmg=phase2()?18:14;
      p.hp=Math.max(0,p.hp-dmg);p.hurtT=0.4;
      S.hits++;S.combo=0;S.shake=14;S.hitstop=0.09;SFX.hurt();
      addText('-'+dmg,playerX(),L.playerY-L.u*2,'#ff6b5a',30);
      burst(playerX(),L.playerY-L.u,'#ff6b5a',14,220);
      e.next='recover';
      if(p.hp<=0){S.phase='down';S.phaseT=1.4;SFX.lose();}
    }
  }

  /* ---------- 更新 ---------- */
  function update(dt){
    var p=S.p,e=S.e,i,f;
    for(i=S.fx.length-1;i>=0;i--){
      f=S.fx[i];f.t+=dt;
      if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.9;f.vy*=0.9;}
      else f.y-=40*dt;
      if(f.t>=f.life)S.fx.splice(i,1);
    }
    S.shake=Math.max(0,S.shake-60*dt);
    if(S.hitstop>0){S.hitstop-=dt;return;}
    if(e.flash>0)e.flash-=dt;
    if(e.knock)e.knock*=Math.pow(0.0005,dt);
    if(e.knockX)e.knockX*=Math.pow(0.0005,dt);
    if(e.squash)e.squash*=Math.pow(0.0003,dt);
    S.zoom=1+(S.zoom-1)*Math.pow(0.002,dt);
    if(p.hurtT>0)p.hurtT-=dt;

    if(S.phase==='intro'){S.phaseT-=dt;if(S.phaseT<=0)S.phase='fight';return;}
    if(S.phase==='ko'||S.phase==='down'){
      S.phaseT-=dt;
      if(S.phaseT<=0)finish(S.phase==='ko');
      return;
    }

    S.t+=dt;hud.textContent=S.t.toFixed(1)+'s';

    // 玩家
    if(p.dodgeT>0){p.dodgeT-=dt;p.dodgeAge+=dt;if(p.dodgeT<=0){p.dodgeT=0;p.dodgeDir=0;p.dodgeCD=DODGE_CD;}}
    else if(p.dodgeCD>0)p.dodgeCD-=dt;
    if(p.punchT>0)p.punchT-=dt;
    if(p.charging)p.chargeT+=dt;
    if(p.buffer){p.buffer.t-=dt;if(tryPunch(p.buffer.charged)||p.buffer.t<=0)p.buffer=null;}
    if(p.punchT<=0&&!p.charging)p.st=Math.min(100,p.st+ST_REGEN*dt);

    // 螃蟹
    if(e.state==='idle'){
      e.timer-=dt;if(e.timer<=0)startAttack();
    }else if(e.state==='windup'){
      e.windT+=dt;
      if(e.feint&&!e.feintDone&&e.windT>=e.wind*0.5){
        e.feintDone=true;e.atk=e.atk==='L'?'R':'L';e.wind+=0.28;
        addText('假動作！',W/2,L.crabY-L.u*2.8,'#ffb347',20,0.7);SFX.warn();
      }
      if(e.windT>=e.wind)resolveStrike();
    }else if(e.state==='strike'){
      e.strikeT-=dt;
      if(e.strikeT<=0){
        if(e.next==='open'){e.state='open';e.openT=e.openMax;e.openCount++;}
        else{e.state='recover';e.timer=0.5;}
      }
    }else if(e.state==='open'){
      e.openT-=dt;if(e.openT<=0){e.state='recover';e.timer=0.25;S.combo=0;}
    }else if(e.state==='recover'){
      e.timer-=dt;
      if(e.timer<=0){e.state='idle';e.timer=phase2()?0.35+Math.random()*0.5:0.55+Math.random()*0.7;}
    }
  }

  /* ---------- 繪圖 ---------- */
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function ease(x){return 1-Math.pow(1-x,3);}

  function drawBg(){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0e4660');g.addColorStop(0.55,'#10303f');g.addColorStop(1,'#0a1c26');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // 光束
    ctx.save();ctx.globalAlpha=0.06;ctx.fillStyle='#bdf3ff';
    for(var i=0;i<3;i++){ctx.beginPath();var x=W*(0.2+i*0.3);ctx.moveTo(x-20,0);ctx.lineTo(x+30,0);ctx.lineTo(x+90,H*0.7);ctx.lineTo(x+10,H*0.7);ctx.fill();}
    ctx.restore();
    // 沙地
    var sy=L.crabY+L.u*1.2;
    ctx.fillStyle='#2b4a4f';ctx.beginPath();ctx.moveTo(0,sy+L.u*0.6);
    ctx.quadraticCurveTo(W/2,sy-L.u*0.4,W,sy+L.u*0.6);ctx.lineTo(W,L.arenaBot+8);ctx.lineTo(0,L.arenaBot+8);ctx.fill();
    // 洞穴
    ctx.fillStyle='#08161d';ctx.beginPath();ctx.ellipse(W/2,L.playerY+L.u*0.9,L.u*2.4,L.u*0.7,0,0,Math.PI*2);ctx.fill();
    // 石頭
    ctx.fillStyle='#3d5f63';
    ctx.beginPath();ctx.ellipse(W*0.08,sy+L.u*0.9,L.u*1.2,L.u*0.8,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(W*0.94,sy+L.u*1.6,L.u*1,L.u*0.6,0,0,Math.PI*2);ctx.fill();
  }

  function dangerZones(){
    var e=S.e;
    if(e.state!=='windup')return;
    var k=e.windT/e.wind,lanes=e.atk==='L'?[-1,0]:(e.atk==='R'?[1,0]:[0]);
    var pulse=0.32+0.3*k+0.08*Math.sin(S.t*30);
    var top=L.crabY+L.u*1.6,bot=L.arenaBot,w=L.lane*0.92;
    ctx.save();
    for(var i=0;i<lanes.length;i++){
      var cx=W/2+lanes[i]*L.lane;
      var g=ctx.createLinearGradient(0,top,0,bot);
      g.addColorStop(0,'rgba(255,70,60,0)');
      g.addColorStop(0.2,'rgba(255,70,60,'+pulse.toFixed(3)+')');
      g.addColorStop(1,'rgba(255,70,60,'+(pulse*1.2).toFixed(3)+')');
      ctx.fillStyle=g;rr(cx-w/2,top,w,bot-top,14);ctx.fill();
      ctx.font='900 '+Math.round(L.u*0.9)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(255,220,90,'+(0.6+0.4*k).toFixed(2)+')';
      ctx.fillText('⚠',cx,top+(bot-top)*0.3);
    }
    ctx.restore();
  }

  function drawClaw(side,tx,ty,glow,open){
    var u=L.u,cx=W/2,bx=cx+side*u*2.2,by=L.crabY+u*0.2;
    ctx.strokeStyle='#b8402a';ctx.lineWidth=u*0.55;ctx.lineCap='round';
    var mx=(bx+tx)/2+side*u*0.9,my=(by+ty)/2+u*0.3;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(mx,my,tx,ty);ctx.stroke();
    ctx.save();ctx.translate(tx,ty);
    if(glow>0){ctx.shadowColor='#ffdf5a';ctx.shadowBlur=20*glow;}
    ctx.fillStyle=glow>0?'#ff7a4d':'#e2553a';
    ctx.beginPath();ctx.ellipse(0,0,u*1.05,u*0.8,side*0.3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    var gap=open?0.5:0.15;
    ctx.fillStyle='#c94a31';
    ctx.beginPath();ctx.ellipse(side*u*0.2,-u*0.85,u*0.4,u*0.75,side*gap,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-side*u*0.35,-u*0.7,u*0.3,u*0.6,-side*gap,0,Math.PI*2);ctx.fill();
    if(glow>0){ctx.strokeStyle='rgba(255,230,120,'+glow.toFixed(2)+')';ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(0,0,u*1.05,u*0.8,side*0.3,0,Math.PI*2);ctx.stroke();}
    ctx.restore();
  }

  function drawCrab(){
    var e=S.e,u=L.u,cx=W/2,cy=L.crabY,t=S.t;
    var bob=Math.sin(t*4)*u*0.08;
    var dizzy=e.state==='open';
    var inflate=e.state==='windup'&&e.atk==='C'?ease(e.windT/e.wind)*0.15:0;
    cy+=bob;
    // 腳
    ctx.strokeStyle='#a93a26';ctx.lineWidth=u*0.22;ctx.lineCap='round';
    for(var s=-1;s<=1;s+=2)for(var i=0;i<3;i++){
      var lx=cx+s*u*(1.4+i*0.45),ly=cy+u*0.6;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+s*u*0.9,ly+u*0.5+Math.sin(t*6+i)*u*0.08);ctx.lineTo(lx+s*u*1.1,ly+u*1.2);ctx.stroke();
    }
    // 鉗子位置
    var claws={'-1':{x:cx-u*3.3,y:cy+u*0.4,g:0,o:false},'1':{x:cx+u*3.3,y:cy+u*0.4,g:0,o:false}};
    if(e.state==='windup'&&e.atk!=='C'){
      var sd=e.atk==='L'?-1:1,k=ease(Math.min(1,e.windT/e.wind));
      var c=claws[sd];c.x=cx+sd*u*(3.3-0.3*k);c.y=cy+u*0.4-u*2.4*k+Math.sin(t*40)*u*0.05*k;c.g=k;c.o=true;
      if(e.feint&&!e.feintDone){var o=claws[-sd];o.y=cy+u*0.4-u*0.8*k;}
    }
    if(e.state==='strike'&&e.atk!=='C'){
      var sd2=e.atk==='L'?-1:1;
      claws[sd2].x=W/2+sd2*L.lane*0.55;claws[sd2].y=L.playerY-u*0.6;
    }
    if(dizzy){claws['-1'].y+=u*0.5;claws['1'].y+=u*0.5;}
    // 身體
    ctx.save();
    if(e.flash>0){ctx.fillStyle='#fff';}
    else if(dizzy)ctx.fillStyle='#d98a7a';
    else ctx.fillStyle=e.angry?'#f0402a':'#e2553a';
    ctx.beginPath();ctx.ellipse(cx,cy,u*(2.4+inflate*2),u*(1.5+inflate*2),0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.ellipse(cx-u*0.6,cy-u*0.6,u*1.1,u*0.45,-0.2,0,Math.PI*2);ctx.fill();
    // 眼柄
    ctx.strokeStyle='#b8402a';ctx.lineWidth=u*0.18;
    for(var s2=-1;s2<=1;s2+=2){
      var ex=cx+s2*u*0.75,ey=cy-u*2;
      ctx.beginPath();ctx.moveTo(cx+s2*u*0.5,cy-u*1.2);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,u*0.38,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';
      if(dizzy){ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();
        for(var a=0;a<10;a++){var rr2=u*0.03*a,an=a*1.2+t*10;ctx.lineTo(ex+Math.cos(an)*rr2,ey+Math.sin(an)*rr2);}ctx.stroke();
        ctx.strokeStyle='#b8402a';ctx.lineWidth=u*0.18;}
      else{ctx.beginPath();ctx.arc(ex,ey+u*0.08,u*0.18,0,Math.PI*2);ctx.fill();}
    }
    // 嘴
    var mouthGlow=e.state==='windup'&&e.atk==='C';
    ctx.fillStyle=mouthGlow?'#bff8ff':'#6b1d12';
    if(mouthGlow){ctx.shadowColor='#7df9ff';ctx.shadowBlur=18;}
    ctx.beginPath();ctx.ellipse(cx,cy+u*0.5,u*(mouthGlow?0.5:0.4),u*(mouthGlow?0.35:0.12),0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // 怒氣
    if(e.angry&&!dizzy){ctx.fillStyle='#ff3b2a';ctx.font='bold '+Math.round(u*0.8)+'px sans-serif';ctx.textAlign='center';ctx.fillText('💢',cx+u*1.9,cy-u*1.4);}
    drawClaw(-1,claws['-1'].x,claws['-1'].y,claws['-1'].g,claws['-1'].o);
    drawClaw(1,claws['1'].x,claws['1'].y,claws['1'].g,claws['1'].o);
    // 暈眩星星
    if(dizzy){
      ctx.fillStyle='#f7e33b';ctx.font='bold '+Math.round(u*0.7)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      for(var j=0;j<3;j++){var an2=t*5+j*2.09;ctx.fillText('★',cx+Math.cos(an2)*u*1.6,cy-u*2.6+Math.sin(an2)*u*0.4);}
      var lbl=e.interrupted?'打斷！破綻':'破綻！';
      ctx.font='900 '+Math.round(u*0.75)+'px sans-serif';ctx.fillStyle='#7df9ff';
      ctx.fillText(lbl,cx,cy+u*2.2);
      // 破綻時間條
      var bw=u*3,bk=Math.max(0,e.openT/e.openMax);
      ctx.fillStyle='rgba(0,0,0,.4)';rr(cx-bw/2,cy+u*2.8,bw,6,3);ctx.fill();
      ctx.fillStyle='#7df9ff';rr(cx-bw/2,cy+u*2.8,bw*bk,6,3);ctx.fill();
    }
    // 泡泡攻擊
    if(e.state==='strike'&&e.atk==='C'){
      var pk=1-e.strikeT/0.2,by=cy+u*0.5+(L.playerY-u-cy)*pk;
      ctx.strokeStyle='#bff8ff';ctx.lineWidth=3;ctx.fillStyle='rgba(191,248,255,.35)';
      ctx.beginPath();ctx.arc(cx,by,u*0.9,0,Math.PI*2);ctx.fill();ctx.stroke();
    }
  }

  function drawShrimp(){
    var p=S.p,u=L.u,x=playerX(),y=L.playerY,t=S.t;
    var lean=p.dodgeT>0?p.dodgeDir*0.25:0;
    var lg=0;
    if(p.punchT>0){var rc=p.lastCharged?CHARGE_REC:PUNCH_REC,pq=p.punchT/rc;lg=(pq>0.5?1:pq*2)*u*(p.lastCharged?0.7:0.35);}
    y-=lg;
    ctx.save();ctx.translate(x,y);ctx.rotate(lean);
    var hurt=p.hurtT>0&&Math.floor(p.hurtT*20)%2===0;
    // 尾扇
    ctx.fillStyle=hurt?'#ff6b5a':'#2f8fbf';
    for(var i=-2;i<=2;i++){ctx.beginPath();ctx.ellipse(i*u*0.35,u*1.55,u*0.22,u*0.55,i*0.35,0,Math.PI*2);ctx.fill();}
    // 身體節
    var cols=['#3fbf8f','#46c99a','#3fbf8f','#46c99a','#2fae80'];
    for(var j=4;j>=0;j--){
      ctx.fillStyle=hurt?'#ff8b7a':cols[j];
      var sy=u*1.1-j*u*0.5,sw=u*(0.75+j*0.06);
      ctx.beginPath();ctx.ellipse(0,sy,sw,u*0.36,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#f08a3c';ctx.fillRect(-sw*0.7,sy-u*0.05,sw*1.4,u*0.07);
    }
    // 頭
    ctx.fillStyle=hurt?'#ff8b7a':'#2a9d74';
    ctx.beginPath();ctx.ellipse(0,-u*1.4,u*0.8,u*0.55,0,0,Math.PI*2);ctx.fill();
    // 眼睛
    for(var s=-1;s<=1;s+=2){
      ctx.strokeStyle='#2a9d74';ctx.lineWidth=u*0.14;ctx.beginPath();ctx.moveTo(s*u*0.3,-u*1.7);ctx.lineTo(s*u*0.5,-u*2.2);ctx.stroke();
      var eg=ctx.createLinearGradient(s*u*0.5,-u*2.5,s*u*0.5,-u*1.9);
      eg.addColorStop(0,'#ff7ad9');eg.addColorStop(0.5,'#ffe066');eg.addColorStop(1,'#5ad1ff');
      ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(s*u*0.52,-u*2.25,u*0.24,u*0.3,0,0,Math.PI*2);ctx.fill();
    }
    // 捕肢（拳）
    for(var s2=-1;s2<=1;s2+=2){
      var px=s2*u*0.95,py=-u*1.2,hx=s2*u*1.1,hy=-u*2.0;
      if(p.charging&&p.chargeT>0.05){
        var ck=Math.min(1,p.chargeT/CHARGE_NEED);
        hy=-u*1.6+u*0.5*ck;hx=s2*u*(1.1+0.2*ck)+Math.sin(t*60)*u*0.05*ck;
      }
      if(p.punchT>0&&s2===p.punchSide){
        var rec=p.lastCharged?CHARGE_REC:PUNCH_REC,pk=p.punchT/rec,reach=pk>0.5?1:pk*2;
        hx=s2*u*0.4*reach+hx*(1-reach);
        hy=-u*2.0-(y-L.crabY-u*1.2)*reach;
      }
      ctx.strokeStyle='#e8743b';ctx.lineWidth=u*0.32;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(hx,hy);ctx.stroke();
      var full=p.charging&&p.chargeT>=CHARGE_NEED;
      if(full){ctx.shadowColor='#ffdf5a';ctx.shadowBlur=18;}
      ctx.fillStyle=full?'#ffd34d':'#ff9f43';
      ctx.beginPath();ctx.arc(hx,hy,u*(p.punchT>0&&s2===p.punchSide&&p.lastCharged?0.6:0.42),0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.restore();
  }

  function bar(x,y,w,h,k,col,bg){
    ctx.fillStyle=bg||'rgba(0,0,0,.45)';rr(x,y,w,h,h/2);ctx.fill();
    if(k>0){ctx.fillStyle=col;rr(x,y,Math.max(h,w*k),h,h/2);ctx.fill();}
  }

  function drawHud(){
    var e=S.e,p=S.p;
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
    ctx.fillStyle='#e8f4f8';ctx.font='800 14px sans-serif';
    ctx.fillText('🦀 螃蟹',16,L.ebarY-6);
    bar(16,L.ebarY,W-32,14,e.hp/ENEMY_HP,e.angry?'#ff3b2a':'#ff7a4d');
    ctx.fillText('🦐 你',16,L.pbarY-4);
    bar(70,L.pbarY-16,W-86,14,p.hp/PLAYER_HP,p.hp>30?'#46c99a':'#ff6b5a');
    ctx.font='700 11px sans-serif';ctx.fillStyle='#9fc3cf';ctx.fillText('體力',16,L.pbarY+16);
    bar(70,L.pbarY+6,W-86,8,p.st/100,p.st<ST_PUNCH?'#6b7f86':'#f7e33b');
  }

  function drawControls(){
    var p=S.p,e=S.e,gap=8,bw=(W-32-gap*2)/3,y=L.ctrlTop,h=L.ctrlH;
    var hintL=false,hintR=false,hintP=false;
    if(S.phase==='fight'){
      if(e.state==='windup'&&e.count<=4){hintL=e.atk!=='L';hintR=e.atk!=='R';}
      if(e.state==='open'&&e.openCount<=3)hintP=true;
    }
    var btns=[
      {x:16,label:'◀',sub:'閃',on:p.dodgeDir===-1&&p.dodgeT>0,hint:hintL},
      {x:16+bw+gap,label:'拳',sub:'按住蓄力',on:p.charging||p.punchT>0,hint:hintP,charge:p.charging?Math.min(1,p.chargeT/CHARGE_NEED):0},
      {x:16+(bw+gap)*2,label:'▶',sub:'閃',on:p.dodgeDir===1&&p.dodgeT>0,hint:hintR}
    ];
    for(var i=0;i<3;i++){
      var b=btns[i],pulse=b.hint?0.5+0.5*Math.sin(S.t*14):0;
      ctx.fillStyle=b.on?'#2c6f86':'#163b4b';rr(b.x,y,bw,h,18);ctx.fill();
      ctx.lineWidth=b.hint?4:2;
      ctx.strokeStyle=b.hint?'rgba(247,227,59,'+(0.5+0.5*pulse).toFixed(2)+')':'#2e6578';
      rr(b.x,y,bw,h,18);ctx.stroke();
      if(b.charge>0){ctx.fillStyle=b.charge>=1?'rgba(255,211,77,.5)':'rgba(255,211,77,.22)';rr(b.x,y+h*(1-b.charge),bw,h*b.charge,18);ctx.fill();}
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e8f4f8';
      ctx.font='900 '+Math.round(Math.min(40,h*0.32))+'px sans-serif';ctx.fillText(b.label,b.x+bw/2,y+h*0.42);
      ctx.font='700 13px sans-serif';ctx.fillStyle='#9fc3cf';ctx.fillText(b.sub,b.x+bw/2,y+h*0.75);
      if(b.hint&&i!==1){ctx.font='900 15px sans-serif';ctx.fillStyle='#f7e33b';ctx.fillText('往這閃！',b.x+bw/2,y-12);}
      if(b.hint&&i===1){ctx.font='900 15px sans-serif';ctx.fillStyle='#f7e33b';ctx.fillText('連打！',b.x+bw/2,y-12);}
    }
  }

  function drawFx(){
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(var i=0;i<S.fx.length;i++){
      var f=S.fx[i],a=1-f.t/f.life;
      ctx.globalAlpha=Math.max(0,a);
      if(f.k==='p'){ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();}
      else if(f.k==='r'){
        var rk=f.t/f.life;ctx.strokeStyle=f.c;ctx.lineWidth=Math.max(1,8*(1-rk));
        ctx.beginPath();ctx.arc(f.x,f.y,f.r0+(f.r1-f.r0)*ease(rk),0,Math.PI*2);ctx.stroke();
      }else if(f.k==='l'){
        var lk=ease(f.t/f.life),r0=f.len*0.3+f.len*0.5*lk,r1=f.len*(0.6+0.6*lk);
        ctx.strokeStyle=f.c;ctx.lineWidth=Math.max(1,5*(1-lk));ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(f.x+Math.cos(f.a)*r0,f.y+Math.sin(f.a)*r0);ctx.lineTo(f.x+Math.cos(f.a)*r1,f.y+Math.sin(f.a)*r1);ctx.stroke();
      }
      else{
        var sc=f.t<0.08?0.6+f.t*5:1;
        ctx.font='900 '+Math.round(f.s*sc)+'px sans-serif';
        ctx.lineWidth=5;ctx.strokeStyle='rgba(20,10,0,.8)';ctx.strokeText(f.txt,f.x,f.y);
        ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);
      }
    }
    ctx.globalAlpha=1;
  }

  function drawBanner(){
    var txt=null,col='#f7e33b';
    if(S.phase==='intro')txt=S.phaseT>0.6?'READY':'FIGHT!';
    else if(S.phase==='ko')txt='K.O.!';
    else if(S.phase==='down'){txt='DOWN…';col='#ff6b5a';}
    if(!txt)return;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='900 '+Math.round(L.u*1.6)+'px sans-serif';
    ctx.lineWidth=8;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(txt,W/2,(L.crabY+L.playerY)/2);
    ctx.fillStyle=col;ctx.fillText(txt,W/2,(L.crabY+L.playerY)/2);
  }

  function draw(){
    if(!S)reset();
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(S.shake>0)ctx.translate((Math.random()-0.5)*S.shake,(Math.random()-0.5)*S.shake);
    if(S.zoom>1.001){ctx.translate(W/2,L.crabY);ctx.scale(S.zoom,S.zoom);ctx.translate(-W/2,-L.crabY);}
    drawBg();dangerZones();
    var e=S.e,sq=e.squash||0;
    ctx.save();
    ctx.translate(W/2+(e.knockX||0),L.crabY-(e.knock||0));ctx.scale(1+sq,1-sq*0.8);ctx.translate(-W/2,-L.crabY);
    drawCrab();
    ctx.restore();
    drawShrimp();drawFx();
    ctx.restore();
    drawHud();drawControls();drawBanner();
  }

  /* ---------- 迴圈 ---------- */
  function loop(now){
    if(!running)return;
    var dt=Math.min((now-last)/1000,0.05);last=now;
    update(dt);
    if(running){draw();requestAnimationFrame(loop);}
  }
  function show(id,on){document.getElementById(id).classList[on?'remove':'add']('hide');}
  function start(){
    initAudio();if(AC&&AC.state==='suspended')AC.resume();
    reset();running=true;last=performance.now();
    show('start',false);show('end',false);show('pause',false);
    requestAnimationFrame(loop);
  }
  function finish(win){
    running=false;draw();
    var stars=win?(S.hits===0?3:(S.hits<=2?2:1)):0;
    document.getElementById('endTitle').textContent=win?'K.O.! 你贏了':'被打倒了…';
    document.getElementById('stars').textContent=win?('★★★'.slice(0,stars)+'☆☆☆'.slice(0,3-stars)):'';
    document.getElementById('result').innerHTML=
      (win?'時間 '+S.t.toFixed(1)+' 秒<br>':'螃蟹剩 '+Math.ceil(S.e.hp)+' / '+ENEMY_HP+' 血<br>')+
      '被打中 '+S.hits+' 次・閃過 '+S.dodges+' 次（完美 '+S.perfects+'）<br>最高連擊 '+S.maxCombo;
    show('end',true);
  }
  function pause(){
    if(!running)return;
    running=false;S.p.charging=false;punchPointer=null;
    show('pause',true);
  }
  function resume(){
    if(AC&&AC.state==='suspended')AC.resume();
    running=true;last=performance.now();show('pause',false);requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});
  window.addEventListener('blur',pause);
  document.getElementById('go').addEventListener('click',start);
  document.getElementById('again').addEventListener('click',start);
  document.getElementById('resume').addEventListener('click',resume);
  resize();
})();
</script>
