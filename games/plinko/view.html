  <section class="view" id="view-plinko" hidden>
    <div class="console">
      <div class="pk-wrap" id="pk-wrap"><canvas id="pk" aria-hidden="true"></canvas></div>
      <div class="side">
        <section class="panel" aria-label="{{t:plinko.view.17}}">
          <div class="field">
            <label for="pk-amount">{{t:plinko.view.01}}</label>
            <div class="input-row">
              <input id="pk-amount" type="number" inputmode="numeric" min="10" step="10" value="50">
              <button class="chip pchip" type="button" data-pchip="half">½</button>
              <button class="chip pchip" type="button" data-pchip="double">2×</button>
            </div>
          </div>
          <div class="field">
            <label id="pk-risk-label">{{t:plinko.view.02}}</label>
            <div class="seg-row" role="group" aria-labelledby="pk-risk-label">
              <button class="chip seg" type="button" data-risk="low">{{t:plinko.view.03}}</button>
              <button class="chip seg" type="button" data-risk="mid">{{t:plinko.view.04}}</button>
              <button class="chip seg" type="button" data-risk="high">{{t:plinko.view.05}}</button>
            </div>
          </div>
          <div class="field">
            <label id="pk-rows-label">{{t:plinko.view.06}}</label>
            <div class="seg-row" role="group" aria-labelledby="pk-rows-label">
              <button class="chip seg" type="button" data-rows="8">8</button>
              <button class="chip seg" type="button" data-rows="12">12</button>
              <button class="chip seg" type="button" data-rows="16">16</button>
            </div>
          </div>
          <dl class="stats">
            <div><dt>{{t:plinko.view.07}}</dt><dd id="pk-max">—</dd></div>
            <div><dt>{{t:plinko.view.08}}</dt><dd id="pk-mid">—</dd></div>
            <div><dt>{{t:plinko.view.09}}</dt><dd id="pk-rtp">—</dd></div>
            <div class="wide"><dt>{{t:plinko.view.10}}</dt><dd><div class="pills" id="pk-last"></div></dd></div>
          </dl>
          <button class="go" id="pk-go" type="button" data-mode="bet">{{t:plinko.view.11}}</button>
          <p class="msg" id="pk-msg" aria-live="polite">{{t:plinko.view.12}}</p>
        </section>
      </div>
    </div>
    <details class="rules">
      <summary>{{t:plinko.view.13}}</summary>
      <p>{{t:plinko.view.14}}</p>
      <p>{{t:plinko.view.15}}</p>
      <p>{{t:plinko.view.16}}</p>
    </details>
  </section>
