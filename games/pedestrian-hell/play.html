<!DOCTYPE html>

<title>Just Want Boba | TICATICA GAMES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1d2a;color:#e8f4f8;overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
#app{position:relative;max-width:min(480px,58vh);height:100%;margin:0 auto;background:#10303f}

#tag{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:5;font-size:11px;padding:3px 8px;

#hud{text-shadow:0 1px 4px #000;position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:5;font-size:18px;font-weight:800}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;background:rgba(11,29,42,.9)}
.screen.hide{display:none}
.screen h1{font-size:28px}
.screen p{font-size:15px;line-height:1.6;opacity:.85}
button{font:inherit;font-weight:800;font-size:18px;padding:12px 32px;border:0;border-radius:12px;background:#f7e33b;color:#1d1b1a}
#hud{background:rgba(20,16,12,.72);padding:4px 10px;border-radius:99px;font-size:15px}
#snd{position:absolute;z-index:11;top:calc(36px + env(safe-area-inset-top));left:8px;width:44px;height:44px;padding:0;font-size:20px;border-radius:99px;background:rgba(255,253,244,.92)}
button:disabled{opacity:.6}
#endHero{height:150px;width:auto}

.bar{position:absolute;z-index:11;top:calc(8px + env(safe-area-inset-top));left:8px;display:flex;gap:6px}
.bar button{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:14px;background:#fffdf4;color:#3a2c22;border:2px solid #3a2c22;box-shadow:0 2px 0 #3a2c22}
.bar button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bar button span{display:grid}.bar button [class$="-b"],.bar button.on [class$="-a"]{display:none}.bar button.on [class$="-b"]{display:grid}
.bar button:active{transform:translateY(2px);box-shadow:none}
#hud{top:calc(60px + env(safe-area-inset-top));left:8px;right:auto;pointer-events:none}
#snd{position:static}
.screen{background:rgba(11,29,42,.86);overflow:auto;justify-content:safe center;padding:112px 22px 24px}
.screen.solid{background:rgba(11,29,42,.78)}
#title{font-size:30px}#sub{font-size:19px;font-weight:800;opacity:1}#how{list-style:none;font-size:14px;line-height:1.7;opacity:.9}
#bestLine{font-size:13px;opacity:.8}#sub:empty,#desc:empty,#bestLine:empty{display:none}
#go{min-height:48px;flex:none}#endHero{height:140px;flex:none}#endHero[hidden],#how[hidden]{display:none}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#rank-dialog{margin:auto;max-width:min(90vw,380px);width:90vw;max-height:80vh;overflow:auto;border:0;border-radius:16px;padding:18px;background:#fff9e9;color:#2b2018}
#rank-dialog::backdrop{background:rgba(0,0,0,.6)}#rank-dialog ol{padding-left:24px;margin:10px 0;line-height:1.9}
#rank-close{font-size:15px;min-height:44px}

,"下班時間，大家都臨停":"Rush hour: everyone just stops","放學路上":"The way home from school","市場旁邊的老路":"The old road by the market","最遠的那一家":"The farthest shop","下一杯：{n}":"Next: {n}","今天要喝：{n}":"Today: {n}","沒有紅綠燈，看清楚再過":"No signal here. Look first!","借過！機車騎上來了":"Scooter on the walkway!","臨停一下就好！":"Just stopping for a sec!","臨停車":"Parking car","「臨停一下就好」，結果停到你身上。":"\"Just a quick stop,\" right on top of you.","過馬路看燈號，沒燈的路口等車過完再走":"Obey signals; at unmarked crossings, wait for a gap","珍珠奶茶":"Pearl milk tea","黑糖珍珠鮮奶":"Brown sugar boba milk","翡翠檸檬":"Jade lemon green tea","楊枝甘露":"Mango pomelo sago","芋頭鮮奶":"Taro fresh milk","抹茶拿鐵":"Matcha latte","泰式奶茶":"Thai milk tea","百香雙響炮":"Passion fruit double topping","冬瓜檸檬":"Winter melon lemon tea","西瓜汁":"Watermelon juice","超級地獄：{n}":"Super hell: {n}","佔用騎樓！借過一下":"Tables on the sidewalk. Excuse me!","塞死了，只能走外面":"Dead end. Go around outside!","按住畫面：一直往前走（點一下走一步）":"Hold: keep walking (tap for one step)","左右滑：閃開；往下滑：後退":"Swipe sideways to dodge, down to step back","方向鍵 / WASD 移動，按住往前可一直走":"Arrow keys / WASD; hold forward to keep walking","空白鍵暫停；滑鼠按住也能往前":"Space pauses; holding the mouse walks too"};
  /* 畫面文字一律以繁中為原文：英文查表，簡中交給平台轉換 */

    'x_scooter x_taxi x_truck x_bus shopfront sip eat_table eat_diner eat_stools eat_freezer eat_cart eat_boxes eat_menu eat_fan '+

    'anim_hero anim_auntie anim_uncle anim_dog anim_cat cat_sleep cat_lick cat_loaf cat_sit cat_flop cat_stretch').split(' ');

  }

  /* sprite-gen 產出的走路分格：每個角色一張圖，一列一個動作、每列 6 格。body 是站姿身高（原圖像素） */
  var ANIM={hero:{fw:190,fh:260,body:240},auntie:{fw:188,fh:250,body:247},uncle:{fw:188,fh:250,body:242},dog:{fw:292,fh:230,body:223},cat:{fw:282,fh:231,body:229}};
  var catBag=['cat_lick','cat_loaf','cat_sit','cat_flop','cat_stretch'],strollers=[];
  /* 主角小跑：圖的前三列是 往上（背面）／側面朝右／往下（正面）各 8 格的完整循環，第四列是三個方向的站姿。
     分格照固定速度播放，連續移動時不會從頭重來 */
  var JOG_TAIL=R_.JOG_TAIL;
  var clk=0,shake=0,fx=[],endAt=0,bubbles=[],banner=null;
  var calm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function frame(name,row,i,mid,bottom,bodyH,flip){
    var a=ANIM[name],im=IMG['anim_'+name];if(!im||!im.naturalWidth)return;
    var k=bodyH/a.body,w=a.fw*k,h=a.fh*k;
    ctx.save();ctx.translate(mid,bottom);if(flip)ctx.scale(-1,1);
    ctx.drawImage(im,i*a.fw,row*a.fh,a.fw,a.fh,-w/2,-h,w,h);ctx.restore();
  }
  function hash(a,b){var x=Math.sin(a*12.9898+b*78.233)*43758.5453;return x-Math.floor(x);}
  function puff(x,y,r,color){fx.push({x:x,y:y,r:r,color:color,age:0,life:.45});}     /* x 欄、y 列（世界座標） */
  /* 冒出往上飄的蒸氣／煙：不佔記憶體，直接用時間算 */
  function steam(x,y,seed,size,rgb){
    if(calm)return;
    for(var i=0;i<3;i++){
      var k=(clk*.55+i/3+seed)%1;
      ctx.fillStyle='rgba('+rgb+','+(.42*(1-k)).toFixed(3)+')';
      ctx.beginPath();ctx.arc(x+Math.sin(k*5+i*2+seed*9)*size*.7,y-k*size*5,size*(.55+k),0,7);ctx.fill();
    }
  }
  /* 以底部為支點做搖擺（草木、布）或起伏（人在吃飯、泡茶） */
  function moving(mid,bottom,skew,stretch,draw){
    if(calm){draw();return;}
    ctx.save();ctx.translate(mid,bottom);ctx.transform(1,0,skew,stretch,0,0);ctx.translate(-mid,-bottom);draw();ctx.restore();
  }
  var SWAY={pots:.035,moneytree:.03,bougain:.04,bluepot:.035,tyre:.03,tree:.04,bathtub:.015,quilt:.03,noparksign:.008};
  var BREATHE={cat_lick:.03,cat_loaf:.03,cat_sit:.018,cat_flop:.05,cat_stretch:.022,diners:.022,dinersv:.012,eat_diner:.022,uncle:.025,recycler:.018,shop:.014};
  var STEAM={stall_wide:[[-.35,.88],[-.08,.84]],stall_road:[[.02,1.55]],diners:[[0,.9]],eat_diner:[[-.12,.78]],eat_cart:[[.18,.86]],uncle:[[.2,.62]],shop:[[.55,1.15]]};

  /* ---------- 影子 ---------- */
  /* 每張圖算一次「腳底範圍」（最下面一小段有畫到的左右邊界），影子才會貼著實際接地的地方 */
  var FOOT={},SIL={};

  /* 俯視看得到整個車身的車輛：用車身剪影往右下偏一點當影子（光從左上來） */

  var DROP={v_delivery:1,v_auntie:1,v_taxi:1,v_truck:1,v_bus:1,v_garbage:1,carred:1,cargrey:1,car_suv:1,car_white:1,truck_parked:1};
  function softShadow(x,y,rx,ry,alpha){

  var roadTile=null;
  function noise(g,w,h,n,colors,max){
    for(var i=0;i<n;i++){g.fillStyle=colors[i%colors.length];var s=.6+Math.random()*max;g.fillRect(Math.random()*w,Math.random()*h,s,s);}

  /* ---------- 地面 ----------
     台灣的騎樓是一家店鋪一種地板：磨石子、小方磚、長磚、紅磚、亮面白磁磚、碎磁磚拼花。

  var FLOOR={},FLOORS=['terrazzo','square','longgrey','redbrick','gloss','crazy'],floorOf=[];

  /* 一塊塊磁磚：cols 塊寬、rows 塊高，brick 為每排錯開的比例 */
  function tiles(g,w,h,rnd,cols,rows,grout,colors,brick,shine){
    g.fillStyle=grout;g.fillRect(0,0,w,h);

    for(var y=0;y<rows;y++)for(var x=-1;x<=cols;x++){
      var px=x*tw+(y%2)*tw*brick;g.fillStyle=pickOf(colors,rnd());g.fillRect(px+.7,y*th+.7,tw-1.4,th-1.4);
      g.fillStyle='rgba(255,252,240,.28)';g.fillRect(px+.7,y*th+.7,tw-1.4,1);
      if(shine&&rnd()<.22){g.fillStyle='rgba(255,255,255,.42)';g.beginPath();g.moveTo(px+tw*.2,y*th+2);g.lineTo(px+tw*.5,y*th+2);g.lineTo(px+tw*.25,y*th+th-2);g.lineTo(px+2,y*th+th-2);g.fill();}
    }
  }
  var DRAWFLOOR={

  /* 每 3～5 步換一家店的地板；有高低差的關卡，換高度就換一家 */
  function layFloors(){

    for(var r=0;r<GOAL+24;r++){

      var h=i?i.h:0;

  function tone(freq,at,dur,type,vol,to){
    if(!ac||muted)return;
    var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;
    o.type=type;o.frequency.setValueAtTime(freq,s);if(to)o.frequency.exponentialRampToValueAtTime(to,s+dur);
    g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+dur+.02);
  }

  /* ---------- 畫面端的招牌與貓（不影響勝負，所以用一般亂數） ---------- */
  var bags={};

  function say(text,c,r,dur){bubbles.push({text:text,c:c,r:r,time:dur||1.8});}

  /* ---------- 左側牆面 ----------
     騎樓裡側是一樓的一扇扇門（鐵捲門、玻璃門、紅鐵門、開著的店面…），偶爾門上掛一塊招牌；
     沒有騎樓的路段（行人專用道、路口旁）換成圍牆和圍籬。路口那幾列是橫向馬路，什麼都不放 */
  var ASPECT={s_pharmacy:2.05,s_dumpling:2.18,s_keys:3,s_barber:1.53,s_herbtea:2.5,s_ribs:2.12,s_moto:2.33,s_buffet:2.18,
    s_breakfast:.32,s_hardware:.32,s_rice:.81,s_noodle:.35,s_ice:.32,s_boba:.38,s_cuts:.38,s_rent:.3};
  var WIDESIGN=['s_breakfast','s_hardware','s_noodle','s_ice','s_boba','s_cuts','s_rent'];
  var TALLSIGN=['s_pharmacy','s_dumpling','s_keys','s_barber','s_herbtea','s_ribs','s_moto','s_buffet'];
  var DOORS=['door_shutter','door_glass','door_red','door_steel','door_half','door_eatery','door_wood','door_noren'];
  var EATDOORS=['door_eatery','door_noren','door_eatery','door_glass'];
  var FENCES=['wall_school','wall_tin','wall_garden','wall_mosaic'];

  function rand(a,b){return a+Math.random()*(b-a);}
  function wallKind(r){
    var z=S.info&&S.info[r]?S.info[r].z:'arcade';
    return z==='cross'?'':z==='occupied'||z==='jammed'?'eat':z==='arcade'?'door':'fence';
  }
  /* y 是底部所在的列數，h 是佔幾列；招牌欄寬 ÷ 格寬固定為 0.22W ÷ 0.156W */
  function buildFacade(){
    wallUnits=[];wallSigns=[];
    var ratio=.2/(.8/(ARCADE+2*ROADW)),unit=ratio*1.02,r=-7,end=GOAL+22,count=0;
    while(r<end){
      var kind=wallKind(r),from=r;
      while(r<end&&wallKind(r)===kind)r++;
      if(!kind)continue;
      var n=Math.max(1,Math.round((r-from)/unit)),h=(r-from)/n;
      for(var k=0;k<n;k++){
        var list=kind==='eat'?EATDOORS:kind==='fence'?FENCES:DOORS;
        var o={img:draw1('w_'+kind,list),y:from+k*h,h:h,door:kind!=='fence'};wallUnits.push(o);
        if(o.door&&++count%3===0){                       /* 三扇門掛一塊招牌，牆面才不會亂 */
          if(count%2){var wide=draw1('sw',WIDESIGN),w=.92;wallSigns.push({img:wide,x:.04,w:w,y:o.y+o.h-w*ASPECT[wide]*ratio*.62,h:w*ASPECT[wide]*ratio});}
          else{var tall=draw1('st',TALLSIGN),tw=rand(.4,.46);wallSigns.push({img:tall,x:.56,w:tw,y:o.y+o.h*.35,h:tw*ASPECT[tall]*ratio});}
        }
      }
    }
    function far(a,b){return b.y-a.y;}            /* 遠的先畫，近的蓋住遠的 */
    wallUnits.sort(far);wallSigns.sort(far);
  }
  function drawFacade(){
    var fw=F+1;

    wallUnits.forEach(function(o){
      var bottom=sy(o.y)+C,h=o.h*C,im=IMG[o.img];
      if(bottom<0||bottom-h>H||!im||!im.naturalWidth)return;
      ctx.drawImage(im,0,bottom-h,fw,h+.6);
      ctx.fillStyle='rgba(50,36,24,.34)';ctx.fillRect(0,bottom-2,fw,2);              /* 兩戶之間的分隔 */
    });
    wallSigns.forEach(function(o){
      var bottom=sy(o.y)+C,w=o.w*F,h=o.h*C,im=IMG[o.img];
      if(bottom<0||bottom-h>H||!im||!im.naturalWidth)return;
      ctx.globalAlpha=.24;ctx.drawImage(silhouette(o.img),o.x*F+4,bottom-h+5,w,h);ctx.globalAlpha=1;

  /* 貓貓：有些橫停機車的坐墊上睡著一隻；另有幾隻在玩家靠近時悠哉橫越走道，只是路過，不擋路 */
  function placeCats(){
    var done=[];
    rows.forEach(function(row){row.forEach(function(it){
      if(!it||it.kind==='rev'||it.img.indexOf('scooterside')!==0||done.indexOf(it)>=0)return;
      done.push(it);if(Math.random()<.4)it.napper=true;
    });});
    strollers=[between(5,9),between(18,24),between(33,43)].filter(function(r){return !S.info||S.info[r].z==='arcade';}).map(function(r){return {r:r,x:-.9,go:false,sat:false,pause:0};});
  }
  function updateCats(dt){
    strollers.forEach(function(k){
      if(!k.go){if(P.r>=k.r-4){k.go=true;say('喵～',0,k.r,1.1);sndMeow();}return;}
      if(!k.sat&&k.x>=.9){k.sat=true;k.pause=.9;}          /* 走到一半停下來看你一眼 */
      if(k.pause>0){k.pause-=dt;return;}
      if(k.x<ARCADE-.2)k.x+=dt*.85;else k.gone=true;
    });
    strollers=strollers.filter(function(k){return !k.gone;});
  }
  function drawStroller(k){
    var mid=cx(k.x+.5),bottom=sy(k.r)+C*.8;

    if(k.pause<=0)softShadow(mid,bottom-1,C*.27,C*.07,.36);
    if(k.pause>0)sprite('cat_sit',mid,bottom,C*.7,C*.82);
    else frame('cat',0,Math.floor(clk*8)%6,mid,bottom,C*.68,false);
    ctx.globalAlpha=1;
  }

  /* 圖片底部對齊 bottom、水平置中，等比例縮進 maxW×maxH */
  function sprite(name,mid,bottom,maxW,maxH,noShadow){
    var flip=name.charAt(name.length-1)==='~',key=flip?name.slice(0,-1):name;
    var im=IMG[key];if(!im||!im.naturalWidth)return;

  function drawItem(it){
    var ox=0,oy=0;
    if(it.kind==='dog'&&it.slide>0){ox=it.ox*it.slide;oy=it.oy*it.slide;}
    if(it.kind==='rev')ox=(it.dx||0)*(it.dx||0);                     /* 起步快、停下時放慢 */
    if(it.kind==='pull')ox=(it.pull.slide||0)*.55;
    var mid=cx(it.c+ox+(it.off||0)+it.w/2),bottom=sy(it.r+oy)+C-3;
    var img=it.img,seed=hash(it.c+1,it.r+1);
    if(it.kind==='pull'){sprite(it.img,mid,bottom,R*.98,C*2.05);hazards(mid,bottom);return;}
    if(it.kind==='neighbor'){drawNeighbor(it,mid,bottom);return;}
    if(it.kind==='dog'){drawDog(it,mid,bottom);return;}
    var skew=SWAY[img]?Math.sin(clk*1.7+seed*20)*SWAY[img]:0;
    var tall=BREATHE[img]?1+Math.sin(clk*(img==='uncle'?1.6:3.1)+seed*20)*BREATHE[img]:1;
    if(it.kind==='rev'&&!calm&&(it.state==='warn'||it.dx>0)){            /* 發動中：車身抖動 */

      if(img==='cones')sprite(img,mid,bottom-C*.05,C*.6,C*.9);

      else if(it.kind==='parked'&&img.indexOf('scooter')!==0)sprite(img,mid,bottom,R*.98,C*2.05);
      else if(it.kind==='parked')sprite(img,mid,bottom-C*.05,R*.94,C*(it.h===2?1.95:1.15));
      else if(it.h===3)sprite(img,mid,bottom,C*1.04,C*2.98);
      else if(it.h===2)sprite(img,mid,bottom,C*.98,C*1.98);
      else if(it.w===2)sprite(img,mid,bottom,C*1.92,C*1.18);
      else if(img.indexOf('eat_')===0)sprite(img,mid,bottom,C*.99,C*1.16);
      else if(img.indexOf('cat_')===0)sprite(img,mid,bottom-C*.1,C*.86,C*.92);
      else if(img.indexOf('scooterside')===0)sprite(img,mid,bottom-C*.05,C*1.14,C*1.1);

    });

        moving(nx,ny,0,1+Math.sin(clk*2+seed*20)*.06,function(){sprite('cat_sleep',nx,ny,w*.46,h*.4,true);});
      }

  function drawDog(it,mid,bottom){
    if(it.slide>0){                                                  /* 小跑換位置 */
      softShadow(mid,bottom-C*.12,C*.4,C*.1,.38);
      frame('dog',0,Math.floor(clk*14)%6,mid,bottom-C*.1,C*.86,!!it.left);
    }else if(it.state==='wake'){                                     /* 彈起來吠 */

      moving(mid,bottom-C*.12,0,1+Math.sin(clk*2.2+it.r)*.045,function(){sprite('dog',mid,bottom-C*.12,C*.98,C*.8);});

  function drawNeighbor(v,mid,bottom){
    var arrive=Math.min(1,v.age/.55),leave=v.time<.4?1-Math.max(0,v.time)/.4:0;

  function heightRowAt(c,r){return c<ARCADE?heightRow(r):0;}
  function drawHero(){
    var px=cx(P.x+.5)+(bump>0?Math.sin(bump*90)*4:0),base=sy(P.y)+C*.9;
    var stair=P.k<1&&heightRowAt(P.c,P.r)!==heightRowAt(P.fc,P.fr)?Math.sin(P.k*Math.PI)*C*.3:0;

        sprite('hero_happy',px,base-Math.abs(Math.sin((over?endAt:clk)*9))*C*.22,C*1.2,C*1.6);

        sprite('hero_scared',px+jx,base-Math.sin(e*Math.PI)*C*.35,C*1.2,C*1.55);

    }
    softShadow(px+2,base-C*.03,C*.27,C*.085,.42);

    if(P.k<1||P.stop<JOG_TAIL){
      frame('hero',P.dir,Math.floor(P.phase)%8,px,base,C*1.52,P.dir===1&&P.flip);
    }else{
      var side=P.dir===1&&P.stop<.4;                                /* 橫移後稍停一下再轉回背面 */
      moving(px,base,0,1+Math.sin(clk*2.6)*.012,function(){frame('hero',3,side?1:0,px,base,C*1.52,side&&P.flip);});
    }
  }
  /* 圖示都自己畫，不用 emoji（各手機長得不一樣，也跟手繪畫風不合） */
  function ghost(x,y,r){
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle='#fffdf4';ctx.strokeStyle='#3a2c22';ctx.lineWidth=2;ctx.lineJoin='round';
    ctx.beginPath();ctx.arc(0,-r*.2,r*.62,Math.PI,0);ctx.lineTo(r*.62,r*.55);
    ctx.quadraticCurveTo(r*.42,r*.3,r*.2,r*.55);ctx.quadraticCurveTo(0,r*.82,-r*.2,r*.55);ctx.quadraticCurveTo(-r*.42,r*.3,-r*.62,r*.55);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#3a2c22';
    [-1,1].forEach(function(d){ctx.beginPath();ctx.ellipse(d*r*.22,-r*.3,r*.08,r*.13,0,0,7);ctx.fill();});
    ctx.beginPath();ctx.ellipse(0,r*.04,r*.1,r*.14,0,0,7);ctx.fill();ctx.restore();

  function warnSign(x,y,h){
    ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffd23d';ctx.strokeStyle='#1d1b1a';ctx.lineWidth=1.6;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(0,-h*.55);ctx.lineTo(h*.6,h*.45);ctx.lineTo(-h*.6,h*.45);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#1d1b1a';ctx.fillRect(-1.2,-h*.22,2.4,h*.38);ctx.fillRect(-1.2,h*.24,2.4,2.4);ctx.restore();
  }
  function warnCell(c,r){
    var x=cx(c)+3,y=sy(r)+3;
    ctx.fillStyle=Math.floor(t*7)%2===0?'rgba(225,45,35,.42)':'rgba(255,214,40,.3)';ctx.fillRect(x,y,C-6,C-6);
    ctx.strokeStyle='#d9261c';ctx.lineWidth=3;ctx.strokeRect(x,y,C-6,C-6);
  }
  function fitLabel(text,x,y,size,max,color){
    ctx.font=font(size);var w=ctx.measureText(text).width;label(text,x,y,w>max?size*max/w:size,color);
  }
  /* ---------- 騎樓的屋頂和柱子 ----------
     人在外面時屋頂是半透明的（看得到裡面塞了什麼）；走進騎樓屋頂就淡出，只留柱子和淡淡的屋簷線。
     只影響畫面。屋頂只蓋走道，不蓋車道；終點的飲料店前面不蓋，招牌才看得清楚 */
  var ROOF_UP=.92,ROOF_OUT=.6,roofAlpha=ROOF_OUT;
  function roofed(r){
    if(r<0||r>=GOAL-1)return false;
    var i=S.info&&S.info[r];return !!i&&(i.z==='arcade'||i.z==='occupied'||i.z==='jammed');
  }
  function insideArcade(){return P.x<ARCADE-.5&&roofed(Math.round(P.y));}
  function fadeRoof(dt){
    var target=insideArcade()?0:ROOF_OUT;
    roofAlpha=calm?target:roofAlpha+(target-roofAlpha)*Math.min(1,dt*9);
  }
  /* 柱子：每 4 步一根，每段騎樓的頭尾也各一根 */
  function shutRow(y){var q=rows[y];return !!q&&!!(q[0]&&q[1]&&q[2]);}
  function hasColumn(r){
    if(!roofed(r)||(S.info[r]&&S.info[r].gap))return false;
    for(var y=r-1;y<=r+2;y++)if(shutRow(y))return false;       /* 塞住的地方前後不立柱子，走得出去的縫才看得見 */
    return r%4===2||!roofed(r-1)||!roofed(r+1);
  }
  function drawColumn(r){
    var w=C*.27,h=C*ROOF_UP,x=cx(ARCADE)-w*.55,base=sy(r)+C-2,top=base-h,y,k;
    softShadow(x+w*.75,base,w*.85,C*.08,.34);
    ctx.fillStyle='#e4ded0';ctx.fillRect(x,top,w,h);
    ctx.fillStyle='rgba(70,52,38,.22)';ctx.fillRect(x+w*.68,top,w*.32,h);
    ctx.strokeStyle='rgba(110,96,80,.42)';ctx.lineWidth=1;ctx.beginPath();
    for(y=top+7;y<base-C*.34;y+=7){ctx.moveTo(x,y);ctx.lineTo(x+w,y);}
    ctx.moveTo(x+w*.5,top);ctx.lineTo(x+w*.5,base-C*.34);ctx.stroke();
    ctx.save();ctx.beginPath();ctx.rect(x,base-C*.36,w,C*.36);ctx.clip();
    ctx.fillStyle='#efc22f';ctx.fillRect(x,base-C*.36,w,C*.36);ctx.fillStyle='#2a2622';
    for(k=-2;k<6;k++){ctx.beginPath();y=base-C*.36+k*w*.62;ctx.moveTo(x,y);ctx.lineTo(x+w,y+w*.7);ctx.lineTo(x+w,y+w*.98);ctx.lineTo(x,y+w*.28);ctx.fill();}
    ctx.restore();
    ctx.fillStyle='#bdb5a4';ctx.fillRect(x-2,top-4,w+4,6);
    ctx.strokeStyle='#4a3d30';ctx.lineWidth=1.4;ctx.strokeRect(x,top,w,h);ctx.strokeRect(x-2,top-4,w+4,6);
  }
  /* 屋頂是從柱子頂端撐起來的一整片，所以畫在比地板高 ROOF_UP 格的位置 */
  function drawRoof(first,lastRow){
    var left=cx(0)-4,right=cx(ARCADE)+C*.13,w=right-left,lift=C*ROOF_UP,r=Math.max(first-2,0),solid=roofAlpha/ROOF_OUT;
    while(r<=lastRow){
      if(!roofed(r)){r++;continue;}
      var from=r;while(r<=lastRow+1&&roofed(r))r++;
      var top=sy(r-1)-lift,bottom=sy(from)+C-lift,k,y;
      if(bottom<-C||top>H+C)continue;
      if(roofAlpha>.02){
        ctx.save();ctx.globalAlpha=roofAlpha;
        ctx.fillStyle='#cbbfa8';ctx.fillRect(left,top,w,bottom-top);
        for(k=from;k<r;k++){
          y=sy(k)+C-lift;
          if(k%2===0){ctx.fillStyle='#a99c85';ctx.fillRect(left,y-C*.16,w,C*.16);ctx.fillStyle='#ded4c0';ctx.fillRect(left,y-C*.16,w,2);}   /* 橫樑 */
          else{ctx.strokeStyle='rgba(120,106,86,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();}
        }
        ctx.fillStyle='#b3a690';ctx.fillRect(right-C*.2,top,C*.2,bottom-top);                  /* 沿馬路的大樑 */
        ctx.restore();
      }
      /* 屋簷：朝南的立面和邊線。走進去之後只剩很淡的一圈 */
      ctx.save();
      ctx.globalAlpha=.16+.76*solid;
      ctx.fillStyle='#8f836f';ctx.fillRect(left,bottom,w,C*.07+C*.13*solid);
      ctx.fillStyle='#efe7d5';ctx.fillRect(left,bottom-3,w,3);
      ctx.fillRect(right-3,top,3,bottom-top);
      ctx.strokeStyle='#4a3d30';ctx.lineWidth=1.5;ctx.strokeRect(left,top,w,bottom-top);
      ctx.restore();
    }
  }

  /* ---------- 高低不平的騎樓 ---------- */
  function heightRow(r){var i=S.info&&S.info[r];return i?i.h:0;}
  /* 畫在地板上：遠端比較高時看得到台階的立面；近端比較高時是一條亮邊加影子 */
  function drawSteps(first,lastRow){
    var x=cx(0),w=C*ARCADE;
    for(var r=Math.max(first,0);r<=lastRow;r++){
      var h=heightRow(r);if(h){ctx.fillStyle='rgba(255,250,232,'+(h*.1)+')';ctx.fillRect(x,sy(r),w,C+.5);}
      var d=heightRow(r+1)-h;if(!d)continue;
      var y=sy(r),th=Math.round(C*.11*Math.abs(d))+2;
      if(d>0){
        ctx.fillStyle='#d8d0c0';ctx.fillRect(x,y-1,w,th);ctx.fillStyle='rgba(95,82,66,.55)';for(var j=0;j<w;j+=C*.22)ctx.fillRect(x+j,y-1,1.4,th);
        ctx.fillStyle='rgba(50,36,24,.28)';ctx.fillRect(x,y+th-1,w,3);
        ctx.fillStyle=d>1?'#e8bc2c':'#f4eee0';ctx.fillRect(x,y-3,w,3);
      }else{
        ctx.fillStyle='rgba(50,36,24,.34)';ctx.fillRect(x,y-th,w,th);
        ctx.fillStyle=d<-1?'#e8bc2c':'#f4eee0';ctx.fillRect(x,y,w,3);
      }
    }
    for(r=Math.max(first,0);r<=lastRow;r++){
      var hh=heightRow(r);if(hh){ctx.fillStyle='#8c7f70';ctx.fillRect(cx(ARCADE)-3-hh*2.5,sy(r),hh*2.5+1,C+.5);}
    }
  }
  /* ---------- 綠色標線人行道：走一走就沒了 ---------- */
  function zone(r){var i=S.info&&S.info[r];return i?i.z:'';}
  function walker(x,y,h,color,step){     /* 地上的行人標誌與小綠人共用的小人 */
    ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(2,h*.13);
    ctx.beginPath();ctx.arc(x+h*.04,y-h*.4,h*.12,0,7);ctx.fill();
    var sw=step===null?0:(step?.22:.08);
    ctx.beginPath();ctx.moveTo(x,y-h*.22);ctx.lineTo(x-h*.02,y+h*.08);
    ctx.moveTo(x-h*sw,y+h*.45);ctx.lineTo(x-h*.02,y+h*.08);ctx.lineTo(x+h*(step===null?.06:sw),y+h*.45);
    ctx.moveTo(x-h*(step===null?.1:.22),y+(step===null?h*.08:-h*.04));ctx.lineTo(x,y-h*.2);ctx.lineTo(x+h*(step===null?.1:.22),y+(step===null?h*.08:-h*.08));
    ctx.stroke();ctx.lineCap='butt';
  }
  function drawGreenway(first,lastRow){
    for(var r=Math.max(first,0);r<=lastRow;r++){
      var z=zone(r);if(z!=='green'&&z!=='greenend')continue;
      var x=cx(1),w=C*2,y=sy(r),end=z==='greenend';
      var top=end?y+C*.45:y,hh=sy(r)+C+.5-top;
      ctx.fillStyle='#2f8a63';ctx.fillRect(x+1,top,w-6,hh);
      ctx.fillStyle='#f4f0e4';ctx.fillRect(x+w-9,top,4,hh);ctx.fillRect(x+1,top,4,hh);
      ctx.fillStyle='#c4463c';ctx.fillRect(x+w-5,top,4,hh);
      if(end){ctx.fillStyle='#f4f0e4';ctx.fillRect(x+1,top,w-2,5);for(var i=0;i<8;i++)ctx.fillRect(x+3+i*C*.25,top-C*.2,C*.1,C*.16);}
      else if(r%3===0)walker(cx(r%2?1.45:2.45),y+C*.5,C*.62,'#f4f0e4',true);
    }
  }
  /* ---------- 路口 ---------- */
  function drawCrossingGround(x){
    var N=R_.CROSS_ROWS,top=sy(x.base+N-1),bottom=sy(x.base)+C,i;
    if(bottom<-C||top>H+C)return;

    ctx.fillStyle='#b9b2a2';ctx.fillRect(0,top-5,F,5);ctx.fillRect(0,bottom,F,5);
    var left=cx(0)+3,right=cx(ARCADE)-3,mid=sy(x.base+2)+C;
    ctx.fillStyle='#e8bc2c';[-4,2].forEach(function(o){ctx.fillRect(0,mid+o,left-10,3);ctx.fillRect(right+12,mid+o,W-right-12,3);});

  /* 台灣的行人號誌：上面站著的小紅人、下面走路的小綠人，加秒數倒數 */
  function drawAmber(x){
    var y=sy(x.base+R_.CROSS_ROWS)+C*.55,mx=cx(ARCADE)+2,on=calm||Math.floor(clk*2.4)%2===0;

  function hazards(mid,bottom){
    if(Math.floor(clk*4)%2)return;

      var x=mid+o[0]*R,y=bottom-o[1]*C;

  /* 靠邊中：先在外側車道追上來、警告格閃爍；停幾秒後切回車道開走 */
  function drawPulls(){
    var warn=R_.levelOf(S.cup).warn;
    (S.pulls||[]).forEach(function(q){
      var mid,bottom,k;
      if(q.state==='warn'){

  function warnLane(r){
    var x=cx(ARCADE)+8,y=sy(r)+3;
    ctx.fillStyle=Math.floor(t*7)%2===0?'rgba(225,45,35,.42)':'rgba(255,214,40,.3)';ctx.fillRect(x,y,R-14,C-6);
    ctx.strokeStyle='#d9261c';ctx.lineWidth=3;ctx.strokeRect(x,y,R-14,C-6);
  }
  function drawAcross(v){
    var bottom=sy(v.row)+C-2,left=F+v.x*C,w=v.len*C,mid=left+w/2;
    if(left+w<-C||left>W+C)return;
    var bounce=calm?0:Math.sin(clk*(v.len<2?34:19)+v.len*9);
    sprite(v.img+(v.dir>0?'~':''),mid,bottom+bounce,w,C*1.65);

  /* 橫向車快衝進畫面時，在畫面邊緣閃一下箭頭 */
  function edgeArrows(){
    (S.xcars||[]).forEach(function(v){
      var edge=v.dir>0?-F/C:(W-F)/C,away=v.dir>0?edge-(v.x+v.len):v.x-edge;
      if(away<0||away>v.v*.9||Math.floor(clk*9)%2)return;

  /* ---------- 第幾杯喝哪一款（順序由使用者指定）。第二欄是喝飲料動畫的圖；
     經典十款各有專屬圖，第 11 杯起從頭輪 ---------- */
  var DRINKS=[["珍珠奶茶","sip"],["黑糖珍珠鮮奶","brownsugar"],["翡翠檸檬","jadelemon"],["楊枝甘露","mango"],["芋頭鮮奶","taro"],["抹茶拿鐵","matcha"],["泰式奶茶","thai"],["百香雙響炮","passion"],["冬瓜檸檬","wintermelon"],["西瓜汁","watermelon"]];
  function drinkOf(cup){return DRINKS[(cup-1)%DRINKS.length];}
  /* 每一杯的圖用到才載入，開場不用等全部 */
  function sipImage(cup){
    var key=drinkOf(cup)[1],name=key==='sip'?'sip':'sip_'+key;
    if(!IMG[name]){var im=new Image();im.src='art/'+name+'.webp';IMG[name]=im;}
    return IMG[name].complete&&IMG[name].naturalWidth?IMG[name]:IMG.sip;
  }
  /* ---------- 過關：插吸管喝一口 ---------- */
  var SIP_AT=[0,.85,1.35,2.55],sipStage=-1;
  function sipStageOf(e){for(var i=SIP_AT.length-1;i>=0;i--)if(e>=SIP_AT[i])return i;return 0;}
  function drawSip(){
    var e=R_.REST-S.rest,i=sipStageOf(e),since=e-SIP_AT[i],im=sipImage(S.cups);
    var inA=Math.min(1,e/.2),pop=calm?1:1+Math.sin(Math.min(1,e/.35)*Math.PI)*.08;
    ctx.fillStyle='rgba(20,14,10,'+(.55*inA)+')';ctx.fillRect(0,0,W,H);
    var w=Math.min(W*.86,360),h=w*1.28,mx=W/2,my=H*.5;
    ctx.save();ctx.translate(mx,my);ctx.scale(pop*(.7+.3*inA),pop*(.7+.3*inA));ctx.globalAlpha=inA;
    box(-w/2,-h/2,w,h,22,'#fff3d6');
    ctx.save();ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-w/2,-h/2,w,h,22);else ctx.rect(-w/2,-h/2,w,h);ctx.clip();
    /* 背後轉動的光芒 */
    ctx.fillStyle='rgba(247,200,60,.28)';
    for(var k=0;k<12;k++){var a0=k*Math.PI/6+(calm?0:e*.25);ctx.beginPath();ctx.moveTo(0,h*.08);ctx.arc(0,h*.08,w,a0,a0+Math.PI/12);ctx.closePath();ctx.fill();}
    if(im&&im.naturalWidth){
      var fw=im.naturalWidth/4,fh=im.naturalHeight,dh=h*.76,dw=fw*dh/fh;
      var bob=0,jolt=0;
      if(!calm){
        if(i===0)bob=Math.sin(e*7)*3;
        if(i===1&&since<.18)jolt=Math.sin(since/.18*Math.PI)*10;
        if(i===2)bob=Math.sin(since*17)*2.5;
      }
      ctx.drawImage(im,i*fw,0,fw,fh,-dw/2,h/2-dh+bob+jolt,dw,dh+1);
    }
    ctx.restore();
    ctx.lineWidth=4;ctx.strokeStyle='#3a2c22';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-w/2,-h/2,w,h,22);else ctx.rect(-w/2,-h/2,w,h);ctx.stroke();
    fitLabel(tr('第 {n} 杯到手！',S.cups),0,-h/2+26,19,w*.86,'#8a6a4a');
    fitLabel(tr(drinkOf(S.cups)[0]),0,-h/2+56,28,w*.88,'#3a2c22');
    var word=['','啵！','啾～啾～','哈～好喝！'][i];
    if(word){
      var grow=calm?1:Math.min(1,.5+since*5),wx=i===1?w*.24:i===2?-w*.22:0,wy=i===3?-h*.27:-h*.23+(i===2&&!calm?Math.sin(since*9)*5:0);
      ctx.save();ctx.translate(wx,wy);ctx.rotate(i===1?.12:i===2?-.1:0);ctx.scale(grow,grow);
      ctx.font=font(30);ctx.lineWidth=7;ctx.lineJoin='round';ctx.strokeStyle='#fffdf4';ctx.textAlign='center';ctx.textBaseline='middle';
      var text=tr(word);ctx.strokeText(text,0,0);ctx.fillStyle=i===1?'#d9261c':'#8a4a1f';ctx.fillText(text,0,0);ctx.restore();
    }
    if(i===2&&!calm)for(var p=0;p<5;p++){               /* 往上飄的珍珠 */
      var q=(since*1.1+p/5)%1;ctx.fillStyle='rgba(58,34,20,'+(1-q).toFixed(2)+')';
      ctx.beginPath();ctx.arc(w*.28+Math.sin(q*6+p)*8,h*.22-q*h*.42,6+p%3,0,7);ctx.fill();
    }
    ctx.restore();
  }
  function sipSounds(){
    var i=S&&S.rest>0?sipStageOf(R_.REST-S.rest):-1;
    if(i===sipStage)return;sipStage=i;
    if(i===1)tone(900,0,.12,'sine',.14,160);
    else if(i===2)for(var k=0;k<7;k++)tone(240+k*28,k*.15,.12,'sawtooth',.035,520+k*34);
    else if(i===3){tone(660,0,.2,'triangle',.07,520);sndWin();}
  }
  var STORY={1:'我只是想買珍奶',2:'老街的騎樓高高低低',3:'飲料店在馬路對面',4:'走專用道也有機車',5:'下班時間，大家都臨停',6:'放學路上',7:'市場旁邊的老路',8:'最遠的那一家'};

  function draw(){
    if(!rows)return;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>0&&!calm)ctx.translate(Math.sin(clk*90)*shake*14,Math.cos(clk*71)*shake*9);
    var first=Math.max(Math.floor(cam)-1,-8),lastRow=Math.ceil(cam+viewRows())+2,r,c,y;
    var road=cx(ARCADE);
    for(r=first;r<=lastRow;r++){
      y=sy(r);
      if(roadTile){ctx.drawImage(roadTile,road,y,R+.5,C+.5);ctx.drawImage(roadTile,road+R,y,R+.5,C+.5);}
      ctx.fillStyle='rgba(244,240,228,.85)';ctx.fillRect(cx(4)-2,y+C*.18,4,C*.55);
      var m=((r%11)+11)%11;
      if(m===4){ctx.strokeStyle='#4b4a4c';ctx.lineWidth=2;ctx.fillStyle='#77716c';ctx.beginPath();ctx.arc(cx(4.5),y+C/2,C*.26,0,7);ctx.fill();ctx.stroke();}
      if(m===8){ctx.fillStyle='#47474a';ctx.fillRect(road+9,y+C*.25,C*.22,C*.4);ctx.fillStyle='#77767a';for(var g=0;g<4;g++)ctx.fillRect(road+10,y+C*.29+g*C*.09,C*.2,2);}
      ctx.fillStyle='#b9b2a2';ctx.fillRect(road-4,y,7,C+1);              /* 路緣 */
      ctx.fillStyle='rgba(95,112,66,.55)';ctx.fillRect(road-4,y+((r*37%50+50)%50)/50*C*.7,3,C*.18);
      ctx.fillStyle='#c4463c';ctx.fillRect(road+4,y,4,C+1);               /* 紅線 */
    }
    drawFloors(first,lastRow);
    drawSteps(first,lastRow);
    drawGreenway(first,lastRow);
    drawFacade();
    (S.crossings||[]).forEach(drawCrossingGround);
    var gy=sy(GOAL);
    ctx.fillStyle='rgba(255,224,50,.4)';ctx.fillRect(cx(0),gy,C*ARCADE,C);

    parked.forEach(function(q){                        /* 路邊機車停在白線停車格裡 */
      ctx.strokeStyle='rgba(244,240,228,.9)';ctx.lineWidth=3;
      for(var i=0;i<q.len;i++){
        var it=rows[q.r+i][ARCADE];
        if(it&&it.img.indexOf('scooter')===0)ctx.strokeRect(cx(ARCADE)+11,sy(q.r+i)+2,R-17,C-4);
      }
    });
    reversers.forEach(function(s){if(s.state==='warn')warnCell(s.c-1,s.r);});
    (S.pulls||[]).forEach(function(q){if(q.state==='warn'){warnLane(q.r);warnLane(q.r+1);}});
    (S.walkways||[]).forEach(function(w){
      if(w.warn>0)for(var k=Math.max(w.from+1,P.r-1);k<=Math.min(w.to-1,P.r+4);k++)warnCell(w.col,k);
    });
    (S.crossings||[]).forEach(function(x){if(x.turn)for(var c=0;c<ARCADE;c++)warnCell(c,x.base+x.turn.k);});
    pending.forEach(function(p){warnCell(p.c,p.r);});

    /* 由遠到近畫，近的蓋住遠的；主角插在自己那一列 */
    var heroRow=Math.round(P.y),heroDone=false,done=[];
    for(r=Math.min(lastRow,rows.length-1);r>=Math.max(first-1,0);r--){
      for(c=0;c<COLS;c++){
        var it=rows[r][c];
        if(it&&it.r===r&&it.c===c&&done.indexOf(it)<0){done.push(it);drawItem(it);}
      }
      if(r===GOAL+1){
        var shopY=sy(r)+C;
        if(S.cup%2===0)sprite('shopfront',cx(1.5),shopY,C*3.05,C*2.9);        /* 偶數杯是店面，單數杯是攤子 */
        else{
          moving(cx(1.5),shopY,0,1+Math.sin(clk*3.4)*.01,function(){sprite('shop',cx(1.5),shopY,C*2.7,C*2.7);});
          steam(cx(1.5)+C*.55,shopY-C*1.15,.2,C*.09,'250,248,240');
        }
        var name=tr('今天要喝：{n}',tr(drinkOf(S.cup)[0]));
        ctx.font=font(13);var tw=Math.min(ctx.measureText(name).width+20,C*3.4),ty=shopY-C*3.35;
        box(cx(1.5)-tw/2,ty-14,tw,28,10,'#3a2c22');fitLabel(name,cx(1.5),ty,13,tw-14,'#fff3d6');
      }
      if(hasColumn(r))drawColumn(r);
      for(var q=0;q<strollers.length;q++)if(strollers[q].go&&strollers[q].r===r)drawStroller(strollers[q]);
      if(r===heroRow){drawHero();heroDone=true;}
      for(var a=0;a<(S.xcars||[]).length;a++)if(S.xcars[a].row===r)drawAcross(S.xcars[a]);
    }
    if(!heroDone)drawHero();

    cars.forEach(function(v){
      var bottom=sy(v.y)+C-3,h=v.len*C;
      if(bottom<-C||bottom-h*1.3>H)return;
      var two=v.len<1,mx=cx(v.lane+.5);                       /* 車身固定走車道正中央，不左右擺 */
      var bounce=calm?0:Math.sin(clk*(two?34:19)+v.len*9)*(two?1.3:1);
      steam(mx+C*(two?.2:.3),bottom-h*.95,v.len,C*.07,'120,120,120');      /* 排氣在車尾（上方） */
      sprite(v.img,mx,bottom+bounce,v.walk!==undefined?C*.96:R*(two?.76:v.img==='v_bus'?1.04:1),h*1.12);
      if(v.img==='v_garbage'){
        ctx.fillStyle=Math.floor(clk*6)%2?'rgba(255,170,20,.9)':'rgba(255,170,20,.25)';
        ctx.beginPath();ctx.arc(mx,bottom+bounce-R*.82,C*.12,0,7);ctx.fill();
        label('♪',mx-C*.45,bottom-h*.7-(clk*26%22),C*.3,'#fff6c4');
      }
    });
    drawRoof(first,lastRow);
    drawPulls();
    (S.crossings||[]).forEach(drawSignal);
    edgeArrows();
    fx.forEach(function(f){
      var k=f.age/f.life;
      ctx.fillStyle='rgba('+f.color+','+(.5*(1-k)).toFixed(3)+')';
      for(var i=-1;i<=1;i+=2){ctx.beginPath();ctx.arc(cx(f.x)+i*C*(.12+k*.16),sy(f.y)+C*.9-k*C*.12,C*f.r*(.6+k),0,7);ctx.fill();}
    });
    /* 警告：車還在畫面外 */
    var edge=cam+viewRows()-.9,blink=Math.floor(t*8)%2===0,warned={};
    cars.forEach(function(v){
      if(v.stopped||v.y<=edge||v.y>Math.max(edge+v.v*1.6,cam+R_.VIEW_ROWS+v.v*1.1)||warned[v.lane])return;
      warned[v.lane]=1;
      var wx=cx(v.lane+.5),wy=58;
      box(wx-C*.54,wy,C*1.08,32,9,blink?'#e8372a':'#ffd23d');
      ctx.font=font(12.5);var name=tr(v.n),tw=Math.min(ctx.measureText(name).width,C*1.08-22);warnSign(wx-tw/2-5,wy+16,14);fitLabel(name,wx+8,wy+16,12.5,C*1.08-24,blink?'#fff':'#1d1b1a');
    });
    bubbles.forEach(function(b){
      ctx.font=font(13);
      var text=tr(b.text);
      var w=ctx.measureText(text).width+18,x=Math.max(6,Math.min(W-w-6,cx(b.c+.5)-w/2)),by=Math.max(100,sy(b.r)-C*.75);
      box(x,by,w,28,10,'#fffdf4');label(text,x+w/2,by+14,13,'#1d1b1a');
    });
    if(banner){
      box(W*.06,100,W*.88,banner.sub?66:42,12,'#f7e33b');
      fitLabel(tr(banner.text,banner.drink?tr(banner.drink):banner.n),W/2,121,19,W*.82,'#1d1b1a');
      if(banner.sub)fitLabel(banner.hell?tr('超級地獄：{n}',tr(banner.sub)):tr(banner.sub),W/2,148,14,W*.82,banner.hell?'#c4271c':'#5a4a22');
    }
    ctx.restore();
    if(S.rest>0&&!over)drawSip();
    if(over&&S.cause!=='closed')label(tr('嚇到！'),Math.min(cx(P.x+.5),W-C*.7),sy(P.y)-C*.8,C*.38,'#fff');
  }

  /* ---------- 與規則模組同步 ---------- */
  function sync(){
    rows=S.rows;P=S.P;cars=S.cars;cam=S.cam;t=S.t;parked=S.parked;reversers=S.reversers;pending=S.pending;bump=S.bump;over=S.dead;
  }
  function newStreet(){sync();layFloors();sipImage(S.cup);roofAlpha=insideArcade()?0:ROOF_OUT;fx=[];bubbles=[];banner=null;bags={};placeCats();buildFacade();}
  function updateHud(){
    $('hud').textContent=tr('第 {n} 杯',S.cups+(S.rest>0?0:1))+' · '+tr('還有 {n} 步',Math.max(0,GOAL-P.r));
  }
  function events(){
    var list=S.events.splice(0);
    list.forEach(function(e){
      if(e.type==='say')say(e.text,e.c,e.r,e.dur);
      else if(e.type==='land')puff(e.c+.5,e.r+.12,.1,'150,135,115');
      else if(e.type==='reverse')sndReverse();
      else if(e.type==='bark')sndBark();
      else if(e.type==='garbage'){banner={text:'垃圾車來了！',time:2.6};sndGarbage();}
      else if(e.type==='cup'){banner=null;bubbles=[];sipStage=-1;}
      else if(e.type==='walk')for(var w=0;w<3;w++)tone(1760,w*.14,.07,'sine',.05,2300);
      else if(e.type==='turn'){tone(420,0,.18,'square',.06);tone(420,.24,.3,'square',.06);}
      else if(e.type==='stair')tone(e.up?190:150,0,.09,'sine',.07,e.up?280:90);
      else if(e.type==='scooter'){tone(880,0,.1,'square',.045);tone(880,.15,.16,'square',.045);}
      else if(e.type==='pull'){tone(360,0,.32,'square',.055);}
      else if(e.type==='cupStart'){newStreet();sipImage(e.cup);banner={text:'下一杯：{n}',drink:drinkOf(e.cup)[0],sub:STORY[R_.themeOf(e.cup)],hell:R_.levelOf(e.cup).hell,time:2.8};}
    });
  }
  /* 規則往前一步（排行榜固定每步 10 毫秒） */
  function stepRules(sec){
    R_.advance(S,sec,rng);sync();
    var fresh=S.events.some(function(e){return e.type==='cupStart';});
    events();sipSounds();
    if(!fresh)updateCats(sec);
    reversers.forEach(function(s){if(s.dx>0&&Math.random()<sec*22)puff(s.c+.08+s.dx*s.dx,s.r+.3,.13,'95,95,95');});
    bubbles=bubbles.filter(function(b){b.time-=sec;return b.time>0;});
    if(banner&&(banner.time-=sec)<=0)banner=null;
    if(S.dead&&state==='running')finish();
  }
  function move(code){
    if(state!=='running'||starting)return;
    if(R_.input(S,code)){bridge.record(window,code);bridge.touch(window);}
    sync();events();updateHud();
  }

  /* ---------- 操作與流程 ---------- */
  /* 手指操作：按住就一直往前走，放開就停；按著的時候左右滑可以閃，閃完繼續走。點一下走一步，往下滑後退。
     鍵盤按住往前也一樣連續走。送進規則的仍是原本的四個方向，不影響排行榜重播 */
  var HOLD_MS=220,REARM_MS=110,downX=0,downY=0,down=false,downAt=0,used=false,armed=true,seenAt=0,sideAt=0,keyHeld=false;
  function release(){down=false;keyHeld=false;}
  function walkOn(now){
    var held=keyHeld||(down&&now-downAt>=HOLD_MS);
    if(!held||state!=='running'||starting||S.rest>0||P.k<1||now-sideAt<200)return;
    var next=rows[P.r+1];
    if(next&&next[P.c])return;                        /* 前面有東西就停下來等，不會一直撞 */
    used=true;move(0);
  }
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();if(cv.setPointerCapture&&e.pointerId!==undefined)try{cv.setPointerCapture(e.pointerId);}catch(err){}
    down=true;used=false;armed=true;downX=e.clientX;downY=e.clientY;downAt=seenAt=performance.now();
  });
  cv.addEventListener('pointermove',function(e){
    if(!down)return;
    var now=performance.now();
    if(!armed){                                       /* 一次滑動只算一次；手指停一下之後才能再滑 */
      if(now-seenAt>=REARM_MS)armed=true;
      else{downX=e.clientX;downY=e.clientY;seenAt=now;return;}
    }
    var dx=e.clientX-downX,dy=e.clientY-downY;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    armed=false;used=true;seenAt=now;
    var code=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy<0?0:1);
    downX=e.clientX;downY=e.clientY;
    sideAt=now;if(code===1)downAt=Infinity;           /* 往下滑是後退，這次按住就不再自動往前 */
    move(code);
  });
  cv.addEventListener('pointerup',function(){
    if(down&&!used&&performance.now()-downAt<HOLD_MS)move(0);   /* 點一下走一步 */
    down=false;
  });
  cv.addEventListener('pointercancel',function(){down=false;});
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});   /* 長按不要跳出系統選單 */
  var KEYS={ArrowUp:0,KeyW:0,ArrowDown:1,KeyS:1,ArrowLeft:2,KeyA:2,ArrowRight:3,KeyD:3},keyAt=0;
  window.addEventListener('keydown',function(e){
    if($('rank-dialog').open)return;
    if(e.code==='Space'&&(state==='running'||state==='paused')){e.preventDefault();if(!e.repeat)togglePause();return;}
    var k=KEYS[e.code];if(k===undefined||state!=='running')return;
    e.preventDefault();
    if(e.repeat){if(k===0&&performance.now()-keyAt>=HOLD_MS)keyHeld=true;return;}
    if(k===0)keyAt=performance.now();else sideAt=performance.now();
    move(k);
  });
  window.addEventListener('keyup',function(e){if(KEYS[e.code]===0)keyHeld=false;});
  window.addEventListener('blur',release);

  function animate(dt){
    clk+=dt;if(over)endAt+=dt;
    fadeRoof(dt);
    if(shake>0)shake=Math.max(0,shake-dt);
    fx=fx.filter(function(f){f.age+=dt;return f.age<f.life;});
  }
  function loop(now){
    frameId=requestAnimationFrame(loop);
    var dt=Math.max(0,Math.min((now-last)/1000,.05));last=now;
    if(!active||(state!=='running'&&state!=='over'))return;
    if(state==='running')walkOn(now);
    if(state==='running'){bridge.advance(window,dt*1000,function(){return state==='running'&&!S.dead;},stepRules);if(state==='running')updateHud();}
    if(state==='over'&&endAt>2.5)return;
    animate(dt);draw();
  }
  function start(){
    if(starting||!active||!loaded)return;
    release();
    audio();if(ac&&muted)ac.suspend();
    starting=true;labels();
    var accepted=bridge.prepare(window,function(random){
      starting=false;
      if(!active){labels();return;}
      rng=random;S=R_.create(rng);newStreet();endAt=0;shake=0;state='running';last=performance.now();updateHud();labels();draw();
    });
    if(!accepted){starting=false;labels();}
  }
  function finish(){
    state='over';endAt=0;over=true;
    if(S.cause==='closed')sndWin();else{sndHit();shake=.4;}
    if(S.cups>best){best=S.cups;try{localStorage.setItem('pedestrianHellBestCups',String(best));}catch(e){}}
    updateHud();draw();
    bridge.finish(window,S.cups);
    setTimeout(function(){if(state==='over')labels(true);},S.cause==='closed'?600:1100);
  }
  function togglePause(){
    if(state==='running'){state='paused';release();bridge.pause(window);if(ac)ac.suspend();}
    else if(state==='paused'&&active){state='running';last=performance.now();bridge.resume(window);if(ac&&!muted)ac.resume();}
    labels();
  }

  /* ---------- 文字 ---------- */
  function labels(showEnd){
    var panel=$('panel'),ended=state==='over'&&(showEnd||panel.dataset.end==='1');
    panel.dataset.end=ended?'1':'';
    panel.classList.toggle('hide',state==='running'||(state==='over'&&!ended));
    panel.classList.toggle('solid',state==='ready');
    $('title').textContent=state==='paused'?tr('暫停中'):ended?(S.cause==='closed'?tr('珍奶店打烊了'):tr('嚇到靈魂出竅！')):tr('行人地獄');
    $('sub').textContent=state==='ready'?tr('我只是想買珍奶'):'';
    $('desc').textContent=state==='ready'?tr('騎樓被機車和攤販塞滿，只好繞到馬路上。一杯接一杯，看你能喝到幾杯！'):
      ended?tr('喝到 {n} 杯珍奶。',S.cups)+' '+tr(quip()):'';
    $('how').hidden=state!=='ready';
    var touch=matchMedia('(pointer: coarse)').matches||parent.innerWidth<=880;
    var lines=touch?['按住畫面：一直往前走（點一下走一步）','左右滑：閃開；往下滑：後退']:['方向鍵 / WASD 移動，按住往前可一直走','空白鍵暫停；滑鼠按住也能往前'];
    lines=lines.concat(['上方出現紅黃警告，先別走那一道','小心倒車機車、睡覺黑狗，還有垃圾車','過馬路看燈號，沒燈的路口等車過完再走']);
    $('how').textContent='';lines.forEach(function(l){var li=document.createElement('li');li.textContent=tr(l);$('how').appendChild(li);});
    $('endHero').hidden=!ended;
    if(ended)$('endHero').src='art/'+(S.cause==='closed'?'hero_happy':'hero_scared')+'.webp';
    $('bestLine').textContent=best>0&&state!=='paused'?tr('最佳紀錄：{n} 杯',best):'';
    $('go').textContent=loadFailed?tr('載入失敗，請重新整理'):!loaded||starting?tr('載入中…'):state==='paused'?tr('繼續'):ended?tr('再玩一次'):tr('開始遊戲');
    $('go').disabled=!loaded||starting||loadFailed;
    $('pause').disabled=!(state==='running'||state==='paused');
    $('pause').classList.toggle('on',state==='paused');
    [['exit','返回遊戲大廳'],['pause',state==='paused'?'繼續':'暫停'],['snd','靜音切換'],['leaders','排行榜']].forEach(function(p){$(p[0]).setAttribute('aria-label',tr(p[1]));});
    $('rank-title').textContent=tr('排行榜');$('rank-close').textContent=tr('關閉');
    document.documentElement.lang=language;document.title=tr('行人地獄')+' | TICATICA GAMES';
    if(S&&P)updateHud();
  }
  var QUIPS=['明明是騎樓，為什麼要走馬路？','你只是想買一杯珍奶。','靈魂先到珍奶店了。','下次記得先看上面的警告。'],quipPick=0,quipFor=null;
  function quip(){
    if(S.cause==='closed')return '今天喝到這裡，明天再來！';
    if(S.cause==='reverse')return '「借過一下喔～啊你怎麼站這裡？」';
    if(S.by==='臨停車')return '「臨停一下就好」，結果停到你身上。';
    if(S.by==='轉彎車')return '行人優先？轉彎車說下次一定。';
    if(S.by==='垃圾車')return '追垃圾車的人，被垃圾車追到了。';
    if(quipFor!==S){quipFor=S;quipPick=Math.floor(Math.random()*QUIPS.length);}
    return QUIPS[quipPick];
  }

  /* ---------- 排行榜 ---------- */
  var rankRequest=0;
  function rankStatus(text){$('rank-message').dataset.text=text;$('rank-message').textContent=text?tr(text):'';}
  async function openLeaders(){
    if(state==='running')togglePause();
    var id=++rankRequest,list=$('rank-list');list.textContent='';rankStatus('讀取中…');$('rank-dialog').showModal();
    try{
      var data=await bridge.leaders(window);if(id!==rankRequest)return;
      if(!data)throw new Error('unavailable');
      (data.entries||[]).forEach(function(en){var li=document.createElement('li');li.textContent=(en.displayName||'Player')+' · '+tr('{n} 杯',en.score);list.appendChild(li);});
      rankStatus(list.children.length?'':'目前還沒有成績');
    }catch(e){if(id===rankRequest)rankStatus('排行榜讀取失敗，請稍後再試');}
  }

  var sndBtn=$('snd');
  sndBtn.addEventListener('click',function(){
    muted=!muted;sndBtn.classList.toggle('on',muted);sndBtn.setAttribute('aria-pressed',String(muted));
    if(ac){if(muted)ac.suspend();else if(state!=='paused')ac.resume();}
  });
  goBtn.addEventListener('click',function(){goBtn.blur();if(state==='paused')togglePause();else start();});
  $('pause').addEventListener('click',function(){$('pause').blur();togglePause();});
  $('exit').addEventListener('click',function(){if(state==='running')togglePause();bridge.exit(window);});
  $('leaders').addEventListener('click',openLeaders);
  $('rank-close').addEventListener('click',function(){rankRequest++;$('rank-dialog').close();});
  /* 切到背景或回大廳時自動暫停，回來按「繼續」 */
  document.addEventListener('visibilitychange',function(){last=performance.now();release();if(document.hidden&&state==='running')togglePause();});
  window.setPedActive=function(on){
    active=!!on;
    if(!active&&state==='running')togglePause();
    if(!active&&ac)ac.suspend();
    if(active){last=performance.now();resize();labels();if(state!=='running')draw();}
  };
  window.setPedLanguage=function(next){language=next;labels();if(state!=='running')draw();};
  window.pedScore=function(){return S?S.cups:0;};
  try{var saved=Number(localStorage.getItem('pedestrianHellBestCups'));best=Number.isFinite(saved)?Math.max(0,Math.floor(saved)):0;}catch(e){}
  resize();S=R_.create(Math.random);newStreet();labels();updateHud();draw();
  frameId=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
