<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cat Match</title><link rel="stylesheet" href="play.css"></head><body><main id="app">
<header><a href="../../index.html#lobby" id="exit" data-t="exit"></a><div class="brand"><small>TiCATiCA</small><strong>Cat Match</strong></div><button id="lang" aria-label="Language">EN</button><button id="pause" data-aria="settings">Ⅱ</button></header>
<div class="tag" data-t="tag"></div><div class="stats"><div class="level"><span data-t="journey"></span><b id="level">1</b></div><div class="progress"><label><span id="shape"></span><span data-t="relax"></span></label><progress id="progress" value="0" max="1"></progress><div id="score"></div></div></div>
<div class="mission"><div><small data-t="moves"></small><strong id="moves">24</strong></div><div class="target"><span class="mini" id="targetIcon"></span><div><small id="goalLabel"></small><strong id="remaining"></strong></div></div></div>
<div id="stage"><canvas id="board" data-aria="board"></canvas></div><div id="message" role="status" aria-live="polite"></div>
<footer><button id="hint"><b data-t="hint"></b><span id="hintCount"></span></button><button id="shuffle"><b data-t="shuffle"></b><span id="shuffleCount"></span></button><button id="retry"><b data-t="retry"></b><span data-t="retryNote"></span></button></footer>
<div class="overlay" id="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="audio-controls"><button id="musicToggle" type="button" aria-pressed="true"></button><button id="soundToggle" type="button" aria-pressed="true"></button></div><p id="rankStatus" role="status"></p><div class="rank-actions"><button id="rankRetry" hidden data-t="resubmit"></button><button id="rankOpen" data-t="leaderboard"></button></div><ol id="rankList" hidden></ol><button id="primary"></button><button id="secondary" class="secondary" data-t="continue"></button></div></div>
</main><script src="../../shared/cat-match-rules.cjs"></script><script src="i18n.js"></script><script src="audio.js"></script><script src="main.js"></script></body></html>
